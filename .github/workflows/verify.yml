name: Foundation checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Foundation (${{ matrix.scope }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            scope: Ubuntu 22.04 workflow; WebGL optional
            renderer-args: --allow-unavailable-webgl
            archive: tar.gz
          - os: ubuntu-24.04
            scope: Ubuntu 24.04 core and unsupported-startup error
            renderer-args: --expect-startup-failure
            archive: tar.gz
          - os: macos-latest
            scope: macOS workflow including WebGL
            renderer-args: ''
            archive: tar.gz
          - os: windows-latest
            scope: Windows workflow including WebGL
            renderer-args: ''
            archive: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.4'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - run: go version
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test -race -v ./...
      - if: runner.os == 'Windows'
        run: go test -v ./...
      - run: node --test
      - run: node docs/wiki/_build.mjs --check
      - run: npm ci --prefix renderer
      - run: node renderer/node_modules/electron/install.js
      - shell: bash
        run: go build -o fungi${{ runner.os == 'Windows' && '.exe' || '' }} .
      - name: Linux sandbox prerequisites (diagnostic only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cat /proc/sys/kernel/unprivileged_userns_clone
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          unshare --user --map-root-user true || true
      # Ubuntu 24.04 is not a supported UI environment. Its check verifies the
      # saved startup error and sandbox diagnostics, not successful rendering.
      - name: Exercise renderer (${{ matrix.scope }})
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a node scripts/renderer-smoke.mjs ./fungi ${{ matrix.renderer-args }}
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            node scripts/renderer-smoke.mjs ./fungi.exe
          else
            node scripts/renderer-smoke.mjs ./fungi
          fi
      - name: Renderer failure evidence
        if: failure()
        shell: bash
        run: |
          if [[ -d verification-output ]]; then
            find verification-output -type f \( -name result.json -o -name worker.log -o -name evidence.json \) -exec cat {} \;
          fi
      - name: Build two local release packages (no publication)
        run: |
          node scripts/package.mjs --release v0.1.0-ci.1
          node scripts/package.mjs --release v0.1.0-ci.2
      - name: Install, update and roll back a prebuilt package
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-24.04" ]]; then
            node scripts/install-smoke.mjs dist/release-v0.1.0-ci.1/*.${{ matrix.archive }} dist/release-v0.1.0-ci.2/*.${{ matrix.archive }} --core-only
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a node scripts/install-smoke.mjs dist/release-v0.1.0-ci.1/*.${{ matrix.archive }} dist/release-v0.1.0-ci.2/*.${{ matrix.archive }}
          else
            node scripts/install-smoke.mjs dist/release-v0.1.0-ci.1/*.${{ matrix.archive }} dist/release-v0.1.0-ci.2/*.${{ matrix.archive }}
          fi
      - name: Installer failure evidence
        if: failure()
        shell: bash
        run: |
          if [[ -d verification-output ]]; then
            find verification-output -path '*/install-smoke-*/evidence.json' -exec cat {} \;
          fi
