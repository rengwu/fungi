name: Foundation checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core and authoring (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.4'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - run: go version
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test -race -v ./...
      - if: runner.os == 'Windows'
        run: go test -v ./...
      - run: node --test
      - run: node docs/wiki/_build.mjs --check
      - run: npm ci --prefix renderer
      - run: node renderer/node_modules/electron/install.js
      - shell: bash
        run: go build -o fungi${{ runner.os == 'Windows' && '.exe' || '' }} .
      - name: Exercise actual renderer
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a node scripts/renderer-smoke.mjs ./fungi
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            node scripts/renderer-smoke.mjs ./fungi.exe
          else
            node scripts/renderer-smoke.mjs ./fungi
          fi
      - name: Renderer failure evidence
        if: failure()
        shell: bash
        run: find verification-output -type f \( -name result.json -o -name renderer.log -o -name evidence.json \) -exec cat {} \;
