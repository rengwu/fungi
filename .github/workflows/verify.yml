name: Foundation checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        type: string
        default: v0.1.0-ci.1

env:
  FUNGI_BUILD_VERSION: ${{ inputs.release_version || 'v0.1.0-ci.1' }}

permissions:
  contents: read

jobs:
  core:
    name: Fungi (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.4'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Linux build prerequisites (disposable runner)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test -race -v ./...
      - if: runner.os == 'Windows'
        run: go test -v ./...
      - run: node --test
      - run: node docs/wiki/_build.mjs --check
      - name: Window helper checks
        shell: bash
        run: |
          tags=production
          if [[ "$RUNNER_OS" == 'Linux' ]]; then tags=production,webkit2_41; fi
          if [[ "$RUNNER_OS" == 'Windows' ]]; then tags=production,wv2runtime.error; fi
          cd renderer
          go vet -tags "$tags" ./...
          go test -tags "$tags" ./...
      - name: Build two native packages (no publication)
        shell: bash
        run: |
          node scripts/package.mjs --release "$FUNGI_BUILD_VERSION"
          node scripts/package.mjs --release v0.1.0-ci.2
      - name: Exercise the packaged CLI and window
        shell: bash
        run: |
          target="$(go env GOOS)-$(go env GOARCH)"
          suffix=''
          if [[ "$RUNNER_OS" == 'Windows' ]]; then suffix=.exe; fi
          binary="dist/release-$FUNGI_BUILD_VERSION/fungi-$target/fungi$suffix"
          "$binary" doctor
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            xvfb-run -a node scripts/renderer-smoke.mjs "$binary" --allow-unavailable-webgl --allow-unavailable-local-media
          else
            node scripts/renderer-smoke.mjs "$binary"
          fi
      - name: Install, update and roll back with an active UI
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            xvfb-run -a node scripts/install-smoke.mjs dist/release-"$FUNGI_BUILD_VERSION"/*.tar.gz dist/release-v0.1.0-ci.2/*.tar.gz
          elif [[ "$RUNNER_OS" == 'Windows' ]]; then
            node scripts/install-smoke.mjs dist/release-"$FUNGI_BUILD_VERSION"/*.zip dist/release-v0.1.0-ci.2/*.zip
          else
            node scripts/install-smoke.mjs dist/release-"$FUNGI_BUILD_VERSION"/*.tar.gz dist/release-v0.1.0-ci.2/*.tar.gz
          fi
      - name: Missing Linux runtime and explicit setup (disposable container)
        if: runner.os == 'Linux'
        run: node scripts/runtime-setup-smoke.mjs dist/release-"$FUNGI_BUILD_VERSION"/*.tar.gz ${{ matrix.os }}
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fungi-${{ matrix.os }}
          path: |
            dist/**/BUILD.json
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.sha256
            verification-output/**/evidence.json
            verification-output/**/worker.log
            verification-output/runtime-setup-*/*.log
            verification-output/runtime-setup-*/*.json
          if-no-files-found: warn

  linux-compatibility:
    name: Ubuntu 22.04 archive on Ubuntu 24.04
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fungi-ubuntu-22.04
          path: baseline
      - name: Install runtime in disposable runner
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0
      - name: Exercise the unchanged older-baseline archive
        run: |
          mkdir baseline/package
          tar -xzf baseline/dist/release-"$FUNGI_BUILD_VERSION"/fungi-linux-amd64.tar.gz -C baseline/package
          baseline/package/fungi doctor
          xvfb-run -a node scripts/renderer-smoke.mjs baseline/package/fungi --allow-unavailable-webgl --allow-unavailable-local-media
          xvfb-run -a node scripts/install-smoke.mjs baseline/dist/release-"$FUNGI_BUILD_VERSION"/*.tar.gz baseline/dist/release-v0.1.0-ci.2/*.tar.gz
          node scripts/runtime-setup-smoke.mjs baseline/dist/release-"$FUNGI_BUILD_VERSION"/*.tar.gz ubuntu-24.04
      - name: Preserve compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fungi-linux-compatibility
          path: |
            verification-output/**/evidence.json
            verification-output/**/worker.log
            verification-output/runtime-setup-*/*.log
            verification-output/runtime-setup-*/*.json
          if-no-files-found: warn
