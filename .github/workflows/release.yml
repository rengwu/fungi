name: Publish alpha
on:
  push:
    tags: ['v*-alpha.*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing alpha to check (does not publish)
        required: true
        type: string
        default: v0.2.0-alpha.1
      platform:
        description: Hosted platform to check
        type: choice
        default: macos-latest
        options: [macos-latest, windows-latest, ubuntu-22.04, ubuntu-24.04]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Require an alpha version and reviewed notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$ ]]
          test -s "docs/releases/$VERSION.md"

  verify:
    needs: validate
    uses: ./.github/workflows/verify.yml
    with:
      release_version: ${{ github.ref_name }}

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: fungi-*
      - name: Select the verified packages and publish
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          for item in 'macos-latest darwin-arm64 tar.gz' 'windows-latest windows-amd64 zip' 'ubuntu-22.04 linux-amd64 tar.gz'; do
            read -r runner target extension <<< "$item"
            root="artifacts/fungi-$runner/dist/release-$VERSION"
            jq -e --arg version "$VERSION" --arg sha "$GITHUB_SHA" \
              '.version == $version and .sourceCommit == $sha and .sourceDirty == false' \
              "$root/fungi-$target/BUILD.json"
            cp "$root/fungi-$target.$extension" "$root/fungi-$target.$extension.sha256" assets/
          done
          cp scripts/install.sh scripts/install.ps1 assets/
          cd assets
          sha256sum -c ./*.sha256
          sha256sum install.sh > install.sh.sha256
          sha256sum install.ps1 > install.ps1.sha256
          gh release create "$VERSION" ./* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --prerelease --latest=false --title "Fungi $VERSION" \
            --notes-file "../docs/releases/$VERSION.md"

  public-download:
    name: Public download (${{ matrix.os }})
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.platform) || '["ubuntu-22.04","ubuntu-24.04","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Install anonymously, update from GitHub and exercise the engine
        shell: bash
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: node scripts/public-release-smoke.mjs "$VERSION"
      - name: Preserve public-download evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-download-${{ matrix.os }}
          path: |
            verification-output/**/evidence.json
            verification-output/**/worker.log
          if-no-files-found: warn
