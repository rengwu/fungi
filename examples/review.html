<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Timing review</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui;background:#18191c;color:#eee}
body{max-width:640px;margin:40px auto;padding:24px}h1{font-size:28px}
.stage{padding:32px;background:#252731;border-radius:14px;margin:24px 0;overflow:hidden}
.card{background:#b7a7f7;color:#252036;border-radius:12px;padding:24px;width:160px}
.play{animation:enter var(--duration,300ms) ease-out}
@keyframes enter{from{transform:translateX(300px);opacity:0}to{transform:none;opacity:1}}
label{display:block;margin:16px 0}input,textarea{display:block;width:100%;margin:8px 0}
textarea{min-height:90px;font:inherit}button{font:inherit;padding:10px 18px;margin:12px 8px 0 0}
#status{color:#c4b4ff;white-space:pre-wrap}
</style>
<h1>Timing review</h1><p>This is a plain HTML file. The preview runs locally while you adjust it.</p>
<div class="stage"><div class="card">Hello, Fungi</div></div>
<button id="play">Replay animation</button>
<label>Duration: <output id="durationLabel">300</output> ms<input id="duration" type="range" min="100" max="1000" step="10" value="300"></label>
<label>Notes<textarea id="notes"></textarea></label>
<label>Reference image<input id="image" type="file" accept="image/*"></label>
<button id="submit">Send response</button><button id="cancel">Cancel</button><p id="status"></p>
<script>
(async()=>{
const {input,draft,attachments,delivery}=await fungi.ready();
const duration=document.querySelector('#duration'),notes=document.querySelector('#notes'),status=document.querySelector('#status');
const initial=draft??input??{};
duration.value=initial.duration??300;notes.value=initial.notes??'';
let image=attachments.find(a=>a.key==='reference'),generation=0,busy=false;
if(delivery.mode==='manual'){const hint=document.createElement('p');hint.textContent='After sending, tell your agent “done”.';document.querySelector('h1').after(hint);}
function data(){return {duration:Number(duration.value),notes:notes.value,reference:image?{artifact:'reference'}:null};}
function files(){return image?[image]:[];}
function preview(){document.querySelector('#durationLabel').value=duration.value;document.documentElement.style.setProperty('--duration',duration.value+'ms');const c=document.querySelector('.card');c.classList.remove('play');void c.offsetWidth;c.classList.add('play');}
function save(){const n=++generation;status.textContent='Saving…';fungi.saveDraft(data(),files()).then(()=>{if(n===generation)status.textContent='Draft saved';},e=>{if(n===generation)status.textContent=e.message;});}
function setBusy(value){busy=value;for(const control of document.querySelectorAll('input,textarea,button'))control.disabled=value;}
duration.oninput=()=>{preview();save();};notes.oninput=save;document.querySelector('#play').onclick=preview;
document.querySelector('#image').onchange=e=>{const blob=e.target.files[0];image=blob?{key:'reference',name:blob.name,blob}:null;save();};
document.querySelector('#submit').onclick=async()=>{if(busy)return;setBusy(true);try{await fungi.submit(data(),files());}catch(e){status.textContent=e.message;setBusy(false);}};
document.querySelector('#cancel').onclick=async()=>{if(busy)return;setBusy(true);try{await fungi.cancel();}catch(e){status.textContent=e.message;setBusy(false);}};
preview();save();
})().catch(e=>document.querySelector('#status').textContent=e.message);
</script></html>
