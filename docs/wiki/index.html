rces.json","sha256":"857d1074c8d6836cc3c4c5eeb9e515b6146cb1c42a7e2056656981a9150138e6"}],"html":"\u003cp>This report preserves the initial run and its original scope. The \u003ca href=\"#/verification/runs/2026-10-20-no-setup\">no-setup follow-up\u003c/a> records the later user decision, successful Kimi authentication, native image journeys and manual-fallback verification.\u003c/p>\n\u003cp>The prototype implements the Go owner, Electron bridge, flat forms, HTML authoring, artifacts, recovery and delivery modes. \u003cstrong>The accepted six-harness AFK milestone is incomplete.\u003c/strong> The aggregate is Untested because required paths remain unavailable or unverified.\u003c/p>\n\u003ch2 id=\"scope-and-build\">Scope and build\u003c/h2>\n\u003cp>Selected features: \u003ca href=\"#/features/sessions\">FEAT-sessions\u003c/a>, \u003ca href=\"#/features/interfaces\">FEAT-interfaces\u003c/a>, \u003ca href=\"#/features/delivery\">FEAT-delivery\u003c/a>. The run emphasizes result correctness and return paths before UI breadth.\u003c/p>\n\u003cp>There is no Git revision. \u003ca href=\"evidence/2026-10-20-first-proof/manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 4558674f2e6db0efbb54b612ef45d67af8adeae7dc7a558794ea9e333343762a\">Source/build manifest\u003c/a> records exact content hashes and tested binary identities. The final harness batch used binary SHA-256 \u003ccode>b52f2fd7cb5e28f981d2653495b2998c0a7aa882dfda1a2e8889e051350512ec\u003c/code>. Subsequent edits added form-default validation and adjusted the reference paste/menu UI; they did not change the pipe transport. The final core suite was rerun. Separate native tests exercised the final package's paste target, cancellation and crash recovery.\u003c/p>\n\u003cp>Environment: macOS arm64; Go 1.26.4; Electron 44.9.0; Node 22.19.0 for development. See \u003ca href=\"#/verification/setup\">setup\u003c/a> for fixture isolation, account state and actual commands.\u003c/p>\n\u003ch2 id=\"results\">Results\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Expected and observed\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Evidence\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Core lifecycle and storage\u003c/td>\n\u003ctd>Real CLI/helper tests cover immutable results, repeated collection, concurrent sessions, image drafts, recovery, confinement, duplicate ownership and publication failure\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-first-proof/go-tests.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 825880be694bb00a2d145015a7779814e1d89aa490292471e05f53e3e1480653\">Go tests\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Lost waiting CLI\u003c/td>\n\u003ctd>Kill the launching waiter; detached owner still saves the later submitted result\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-first-proof/go-tests.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 825880be694bb00a2d145015a7779814e1d89aa490292471e05f53e3e1480653\">Go tests\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Helper exit and stdout drain\u003c/td>\n\u003ctd>Exit without result is failed; a fully emitted submitted result survives a later nonzero exit\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-first-proof/go-tests.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 825880be694bb00a2d145015a7779814e1d89aa490292471e05f53e3e1480653\">Go tests\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Uncertain notification\u003c/td>\n\u003ctd>Saved result survives; an ambiguous failed acknowledgement is recorded and not resent\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-first-proof/go-tests.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 825880be694bb00a2d145015a7779814e1d89aa490292471e05f53e3e1480653\">Go tests\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>JSON form with selected image\u003c/td>\n\u003ctd>Native file picker → saved image draft → close → new linked session → restored preview → submission; returned file hash matches fixture\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-first-proof/ui-results.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: fef0198e823840376507889b535b1340a40f85b8416a826b7f296a29319b832c\">Saved UI results\u003c/a>, \u003ca href=\"evidence/2026-10-20-first-proof/reference.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 1bd7e798fbfd3bd20de881435c7bfa7811db8466e73714a8ab7c1af6b7460e9a\">fixture image\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Custom HTML controls and storage retry\u003c/td>\n\u003ctd>Local slider/preview and notes work; non-writable session directory rejects submit without losing input; restoring access permits submission\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-first-proof/ui-results.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: fef0198e823840376507889b535b1340a40f85b8416a826b7f296a29319b832c\">Saved UI results\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Native image paste\u003c/td>\n\u003ctd>Plain text rejected; pixels copied from Preview produce preview, saved draft and submitted 401-byte PNG with matching stored hash\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-first-proof/ui-results.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: fef0198e823840376507889b535b1340a40f85b8416a826b7f296a29319b832c\">Saved UI results\u003c/a>, \u003ca href=\"evidence/2026-10-20-first-proof/pasted-image.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 83e160394a50c08746093b421e7bbf7865d6591aac9f9b2d1f0850bea504c2d9\">pasted image\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Native Cancel button\u003c/td>\n\u003ctd>Explicit Cancel closes the window and saves \u003ccode>cancelled\u003c/code> without answer data\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-first-proof/ui-results.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: fef0198e823840376507889b535b1340a40f85b8416a826b7f296a29319b832c\">Saved UI results\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Renderer crash and reopen\u003c/td>\n\u003ctd>Kill only the fixture's page renderer: \u003ccode>failed\u003c/code>/\u003ccode>renderer_crashed\u003c/code>; reopen restores acknowledged draft in a new linked window; closing it saves \u003ccode>closed\u003c/code>\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-first-proof/ui-results.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: fef0198e823840376507889b535b1340a40f85b8416a826b7f296a29319b832c\">Saved UI results\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Codex pending command\u003c/td>\n\u003ctd>Actual Fungi helper response returned in the same disposable conversation after a ten-second silent wait\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-first-proof/harness-probes.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e74063b94fc26ec72c7b75c6fce67d041778d0fc262c552e1cd0de920d319978\">Harness probes\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OpenCode pending command\u003c/td>\n\u003ctd>Canonical working directory; one Bash invocation; actual result consumed after a ten-second wait\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-first-proof/harness-probes.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e74063b94fc26ec72c7b75c6fce67d041778d0fc262c552e1cd0de920d319978\">Harness probes\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pi pending command\u003c/td>\n\u003ctd>One Bash call, timeout null; actual response consumed after 180 seconds\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-first-proof/harness-probes.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e74063b94fc26ec72c7b75c6fce67d041778d0fc262c552e1cd0de920d319978\">Harness probes\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Claude background completion\u003c/td>\n\u003ctd>Background launch → WAITING/end turn → completion event → one output-file read → actual result after 180 seconds\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-first-proof/harness-probes.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e74063b94fc26ec72c7b75c6fce67d041778d0fc262c552e1cd0de920d319978\">Harness probes\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Grok background completion\u003c/td>\n\u003ctd>Background launch → WAITING → completion → one completed-output retrieval → actual result after 180 seconds\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-first-proof/harness-probes.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e74063b94fc26ec72c7b75c6fce67d041778d0fc262c552e1cd0de920d319978\">Harness probes\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Codex exact-conversation callback consumption\u003c/td>\n\u003ctd>Native-helper notice queued during the active turn reached the originating conversation after that turn ended; one collect returned submitted data and its artifact\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-first-proof/codex-callback.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 9146ba86dcd81227a29a371d3fe37f0566f28fdbe66732f43e39eac8070c1161\">Callback observation\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Corrected self-contained Codex notice\u003c/td>\n\u003ctd>Native-form notice reached the originating conversation with full executable, arguments and state-directory environment; one collect using those values returned \u003ccode>closed\u003c/code>\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-first-proof/codex-callback-corrected.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 92c760a57f3898ff82236b6eb7c5e6dfa2566ca7de180d18cc5fa83a7b9eccf0\">Corrected callback observation\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kimi result delivery\u003c/td>\n\u003ctd>Installed CLI rejected the test before tool execution: selected provider has no credential\u003c/td>\n\u003ctd>Untested\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-first-proof/harness-probes.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e74063b94fc26ec72c7b75c6fce67d041778d0fc262c552e1cd0de920d319978\">Harness probes\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Arbitrary AFK duration and all-six native UI loop\u003c/td>\n\u003ctd>Three-minute synthetic waits do not establish unlimited waits, sleep/wake reliability, or a native human interaction in every harness\u003c/td>\n\u003ctd>Untested\u003c/td>\n\u003ctd>\u003ca href=\"#/features/delivery~coverage-and-limitations\">Delivery limitations\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Portable local launch\u003c/td>\n\u003ctd>Corrected directory's internal symlinks remain within the package; HTML UI launches with PATH restricted to \u003ccode>/usr/bin:/bin\u003c/code>, so no external Node/npm is used\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-first-proof/manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 4558674f2e6db0efbb54b612ef45d67af8adeae7dc7a558794ea9e333343762a\">Package metadata\u003c/a>, \u003ca href=\"evidence/2026-10-20-first-proof/ui-results.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: fef0198e823840376507889b535b1340a40f85b8416a826b7f296a29319b832c\">UI result\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Downloaded clean-machine release\u003c/td>\n\u003ctd>No notarized distribution, quarantine/Gatekeeper or fully disconnected clean-machine test\u003c/td>\n\u003ctd>Untested\u003c/td>\n\u003ctd>\u003ca href=\"#/verification/setup~observation-and-cleanup\">Setup limits\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The three-minute batches took approximately 190 seconds (Pi), 193 seconds (Claude) and 194 seconds (Grok), including model startup/final response time. Claude supplied a 600,000 ms tool timeout. That successful bounded test must not be described as an unlimited AFK guarantee. No repeated model status calls occurred during these waits; Claude and Grok each retrieved output once after completion.\u003c/p>\n\u003cp>The portable folder contains approximately 315 MiB before the final documentation refresh. One idle \u003ccode>ps\u003c/code> sample of the open demo found 5.8 MiB RSS for its Go owner and 262.6 MiB across four Electron processes, each showing 0% sampled CPU. This is one observation, not a peak-memory or cross-machine benchmark; the demo could also receive user edits. \u003ca href=\"evidence/2026-10-20-first-proof/resources.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 857d1074c8d6836cc3c4c5eeb9e515b6146cb1c42a7e2056656981a9150138e6\">Resource sample\u003c/a>\u003c/p>\n\u003ch2 id=\"earlier-failures-and-corrections\">Earlier failures and corrections\u003c/h2>\n\u003col>\n\u003cli>Pi's default \u003ccode>gpt-5.5\u003c/code> was rejected by the existing provider. A supported model was selected only for the test invocation.\u003c/li>\n\u003cli>Kimi failed for missing credentials. No attempt was made to obtain or change credentials.\u003c/li>\n\u003cli>Codex read-only mode could not create session storage. Workspace-write exposed the initial loopback-listener restriction. Removing HTTP in favor of pipes and OS file locks made the subsequent Codex probe pass.\u003c/li>\n\u003cli>OpenCode rejected a non-canonical \u003ccode>/var/...\u003c/code> working directory as external. Using the canonical \u003ccode>/private/var/...\u003c/code> path resolved the test's permission mismatch; permissions were not broadened.\u003c/li>\n\u003cli>Electron's first asset loader called a network loader that its own request filter blocked. A confined direct file handler corrected it; native forms and HTML then rendered.\u003c/li>\n\u003cli>The first package copy altered framework symlinks and failed to find ICU data. Preserving literal symlinks corrected the next build. The failed build is not a distributable.\u003c/li>\n\u003cli>Early image-paste attempts did not establish a working clipboard/focus fixture. An explicit editable target was added; a separate one-image form kept it visible and passed native paste, draft save and submission. Other demo windows received user edits, which were preserved. The default development reload menu was removed; explicit close/reopen is the supported restoration path. A final one-line adjustment clears a previous paste-error banner when a valid image is accepted; it does not change artifact transport.\u003c/li>\n\u003cli>The first Codex callback notice omitted a non-default state directory. That notice was subsequently consumed successfully using the launch context. New notices include the executable, argument array and state-directory environment; a subsequent native-form notice was consumed using those supplied values and returned the saved \u003ccode>closed\u003c/code> outcome.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"limits-and-next-decision\">Limits and next decision\u003c/h2>\n\u003cp>The core is usable for further authoring experiments, and the macOS folder is a development package. The milestone is not complete. Resolve whether optional harness integrations may be loaded when ordinary shell tools have bounded lifetimes, and have the user authenticate Kimi. Then finish exact-caller/idle-agent delivery, longer AFK tests and the combined UI journey in all six harnesses.\u003c/p>\n\u003cp>Testing was performed by the implementing agent; there was no independent reviewer. Wiki structure validation checks documentation integrity only.\u003c/p>\n","backlinks":["index","contract","planning","features/delivery","features/index","features/interfaces","features/sessions","research/delivery","verification/runs/2026-10-20-no-setup"]},{"id":"verification/runs/2026-10-20-no-setup","title":"No-setup compatibility verification","section":"Verification","order":0,"metadata":{"result":"Passed"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Last updated: 2026-10-20\u003c/span>","updated":"2026-10-20","summary":"","source":"---\ntitle: No-setup compatibility verification\nupdated: 2026-10-20\nresult: Passed\n---\n# No-setup compatibility verification\n\nThis follow-up applies the [accepted no-setup decision](../../planning.md#no-setup-delivery-decision-on-2026-10-20): use native harness capabilities, with explicit manual delivery on unsupported versions. The bounded macOS proof passed: native form/image responses returned automatically in the tested Codex, Claude, Grok, Kimi and Pi modes, and through the explicit manual fallback in OpenCode v1. The final portable Codex callback reached its originating conversation after the prior turn ended; one collection returned the submitted response and matching image.\n\n## Scope and build\n\nSelected features: [FEAT-sessions](../../features/sessions.md), [FEAT-interfaces](../../features/interfaces.md), [FEAT-delivery](../../features/delivery.md). The [earlier report](2026-10-20-first-proof.md) covers storage faults, cancellation, close, renderer crash, image paste and recovery. This run adds complete native form/image journeys through the installed harnesses, Kimi after authentication, and receipt-based manual collection.\n\nEnvironment: macOS arm64, Go 1.26.4, Electron 44.9.0, development Node 22.19.0. Kimi now reports 2.2.0; the earlier unauthenticated attempt used 2.0.1. No harness installation, configuration edit, plugin or upgrade was performed by this run. [Source/build manifest](../../evidence/2026-10-20-no-setup/manifest.json)\n\nThe only core changes were adding `collectEnv` to launch receipts and refining CLI discovery. A later shell invocation can now collect from a custom state directory using the receipt alone. The four-method page bridge and renderer did not change.\n\n## Observations\n\nNative tests used the connected desktop driver to enter a unique response, select the generated 180-byte PNG, observe its preview and “Draft saved,” then click Send response. Directly writing a result or invoking a page handler was not used. Returned artifact bytes were independently hashed. [Saved sessions and hashes](../../evidence/2026-10-20-no-setup/ui-results.json)\n\n| Scenario | Expected and observed | Result | Evidence |\n| --- | --- | --- | --- |\n| Kimi background wait after sign-in | One Bash with `run_in_background: true`, `disable_timeout: true`; WAITING/end turn; silent 180-second helper; automatic continuation and one completed-output read | Passed | [Harness probes](../../evidence/2026-10-20-no-setup/harness-probes.json) |\n| Pi native form/image | One Bash call with timeout omitted/null returned `PI-NATIVE-RESPONSE`, exact session and one image | Passed | [Harness probes](../../evidence/2026-10-20-no-setup/harness-probes.json) |\n| Grok native form/image | Background terminal launch, WAITING/end turn, then one completed-output retrieval; returned `GROK-NATIVE-RESPONSE` and one image | Passed | [Harness probes](../../evidence/2026-10-20-no-setup/harness-probes.json) |\n| Kimi native form/image | Background Bash with timeout disabled, WAITING/end turn, then one completed-output read; returned `KIMI-NATIVE-RESPONSE` and one image | Passed | [Harness probes](../../evidence/2026-10-20-no-setup/harness-probes.json) |\n| Claude native form/image | Headless background Bash with a 600,000 ms test timeout, end turn, explicit task-completion event, one output read; returned `CLAUDE-NATIVE-RESPONSE` and one image | Passed | [Harness probes](../../evidence/2026-10-20-no-setup/harness-probes.json) |\n| OpenCode v1 manual fallback | Launch returned manual receipt and ended; after UI submission the driver sent an explicit “done” to that exact harness session; one collect used receipt argv/environment and returned `OPENCODE-MANUAL-RESPONSE` with one image | Passed | [Harness probes](../../evidence/2026-10-20-no-setup/harness-probes.json) |\n| Portable Codex form/image persistence | Latest packaged executable and bundled Electron rendered the form; native submission saved `CODEX-PORTABLE-IMAGE-RESPONSE` and a matching image; queue accepted the notice | Passed | [Saved sessions](../../evidence/2026-10-20-no-setup/ui-results.json) |\n| Portable Codex image callback consumption | Exact originating conversation received the notice after the prior turn ended; one collect using the supplied argv/environment returned `CODEX-PORTABLE-IMAGE-RESPONSE` and the matching image, exit 0 | Passed | [Consumed image callback](../../evidence/2026-10-20-no-setup/codex-image-callback.json), [prior consumed callbacks](2026-10-20-first-proof.md#results) |\n| Self-contained manual receipt | Real CLI test launches with an isolated root, loses launcher, and collects using only the receipt's command/environment; correct saved response returned | Passed | [Core suite](../../evidence/2026-10-20-no-setup/go-tests.log) |\n| Core regression suite and static checks | Race-enabled suite, `go vet`, and Windows/Linux compilation pass | Passed | [Core suite](../../evidence/2026-10-20-no-setup/go-tests.log), [manifest](../../evidence/2026-10-20-no-setup/manifest.json) |\n\nKimi's three-minute helper probe took 193.08 seconds including model work. Native UI probe totals were Pi 48.50, Grok 88.21, Kimi 46.15 and Claude 54.53 seconds. OpenCode's corrected launch took 8.86 seconds; its explicitly resumed collection took 7.37 seconds. These totals include model startup and desktop interaction, not just idle time.\n\nNo model status checks occurred while awaiting the human-facing UI or the three-minute helper. Grok additionally read its bundled background-task instructions before launch. Claude and Grok expose completion information in their streams. Kimi's print stream does not expose a separate notification payload; it records the initial WAITING, a later unsolicited continuation, one completed-output read and the actual response. No second prompt was supplied to the Kimi process.\n\n## Failure and correction\n\nThe first OpenCode fixture was named `opencode.json`, a reserved harness configuration name. OpenCode added its `$schema` key; Fungi correctly rejected the resulting document as an invalid form. The model attempted that failed launch twice, and no Fungi session opened. Renaming the fixture to `opencode-form.json` resolved the collision. The failed probe is retained separately in evidence. No global configuration was changed.\n\nReviewing manual collection revealed that the launch receipt omitted the custom storage environment even though callbacks included it. `collectEnv` fixes that loss of context, and both the real CLI regression and OpenCode's later invocation exercised it.\n\n## Limits\n\nThis is a bounded macOS prototype proof, not an arbitrary-duration guarantee. OpenCode v1 manual completion is an accepted fallback and is not counted as automatic return. Claude's tested headless mode is bounded; its documented local interactive background behavior has no time limit, but a long interactive run was not exercised. See [delivery research](../../research/delivery.md#no-setup-follow-up).\n\nSleep/wake cycles, abrupt power loss, a downloaded clean-machine/Gatekeeper launch, public signing/notarization, and Windows/Linux runtime behavior were not exercised. Windows/Linux results are compilation only. There is no permanent service or automatic restart after all relevant processes exit; explicit recovery is the accepted contract.\n\nAll completed verification windows and their session owners exited. The earlier user-edited demo remains open with its draft preserved. Raw test streams remain under `verification-output/no-setup-verification/`; evidence omits reasoning payloads and account configuration. Testing was performed by the implementing agent, without independent review.\n","toc":[{"id":"scope-and-build","title":"Scope and build","depth":2},{"id":"observations","title":"Observations","depth":2},{"id":"failure-and-correction","title":"Failure and correction","depth":2},{"id":"limits","title":"Limits","depth":2}],"titleAnchor":"no-setup-compatibility-verification","links":["planning","features/sessions","features/interfaces","features/delivery","verification/runs/2026-10-20-first-proof","verification/runs/2026-10-20-first-proof","research/delivery"],"attachments":[{"path":"evidence/2026-10-20-no-setup/manifest.json","sha256":"3a0d284c20954839da8833f2a1c9723db483ccfb15b5be2e26030c266ac18695"},{"path":"evidence/2026-10-20-no-setup/ui-results.json","sha256":"a7425ab411073acc3cfff654e4b91aee398ac2d2b449c5c49b5b6ac58e3fc918"},{"path":"evidence/2026-10-20-no-setup/harness-probes.json","sha256":"1cb353158e825c2a400278dcdf99ee400f899cb2e3b8e2abaa0152d4dcd5a8a3"},{"path":"evidence/2026-10-20-no-setup/codex-image-callback.json","sha256":"5b6a2a1f679e7bec1ed332140b66bb7f62c9891bbbc624856780ac33c306fd2b"},{"path":"evidence/2026-10-20-no-setup/go-tests.log","sha256":"c0082d55c14ce27b9bde48bbfaae458fbbd04ca0a8fba5638b152942051ac348"}],"html":"\u003cp>This follow-up applies the \u003ca href=\"#/planning~no-setup-delivery-decision-on-2026-10-20\">accepted no-setup decision\u003c/a>: use native harness capabilities, with explicit manual delivery on unsupported versions. The bounded macOS proof passed: native form/image responses returned automatically in the tested Codex, Claude, Grok, Kimi and Pi modes, and through the explicit manual fallback in OpenCode v1. The final portable Codex callback reached its originating conversation after the prior turn ended; one collection returned the submitted response and matching image.\u003c/p>\n\u003ch2 id=\"scope-and-build\">Scope and build\u003c/h2>\n\u003cp>Selected features: \u003ca href=\"#/features/sessions\">FEAT-sessions\u003c/a>, \u003ca href=\"#/features/interfaces\">FEAT-interfaces\u003c/a>, \u003ca href=\"#/features/delivery\">FEAT-delivery\u003c/a>. The \u003ca href=\"#/verification/runs/2026-10-20-first-proof\">earlier report\u003c/a> covers storage faults, cancellation, close, renderer crash, image paste and recovery. This run adds complete native form/image journeys through the installed harnesses, Kimi after authentication, and receipt-based manual collection.\u003c/p>\n\u003cp>Environment: macOS arm64, Go 1.26.4, Electron 44.9.0, development Node 22.19.0. Kimi now reports 2.2.0; the earlier unauthenticated attempt used 2.0.1. No harness installation, configuration edit, plugin or upgrade was performed by this run. \u003ca href=\"evidence/2026-10-20-no-setup/manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 3a0d284c20954839da8833f2a1c9723db483ccfb15b5be2e26030c266ac18695\">Source/build manifest\u003c/a>\u003c/p>\n\u003cp>The only core changes were adding \u003ccode>collectEnv\u003c/code> to launch receipts and refining CLI discovery. A later shell invocation can now collect from a custom state directory using the receipt alone. The four-method page bridge and renderer did not change.\u003c/p>\n\u003ch2 id=\"observations\">Observations\u003c/h2>\n\u003cp>Native tests used the connected desktop driver to enter a unique response, select the generated 180-byte PNG, observe its preview and “Draft saved,” then click Send response. Directly writing a result or invoking a page handler was not used. Returned artifact bytes were independently hashed. \u003ca href=\"evidence/2026-10-20-no-setup/ui-results.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: a7425ab411073acc3cfff654e4b91aee398ac2d2b449c5c49b5b6ac58e3fc918\">Saved sessions and hashes\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Expected and observed\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Evidence\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Kimi background wait after sign-in\u003c/td>\n\u003ctd>One Bash with \u003ccode>run_in_background: true\u003c/code>, \u003ccode>disable_timeout: true\u003c/code>; WAITING/end turn; silent 180-second helper; automatic continuation and one completed-output read\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-no-setup/harness-probes.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 1cb353158e825c2a400278dcdf99ee400f899cb2e3b8e2abaa0152d4dcd5a8a3\">Harness probes\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pi native form/image\u003c/td>\n\u003ctd>One Bash call with timeout omitted/null returned \u003ccode>PI-NATIVE-RESPONSE\u003c/code>, exact session and one image\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-no-setup/harness-probes.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 1cb353158e825c2a400278dcdf99ee400f899cb2e3b8e2abaa0152d4dcd5a8a3\">Harness probes\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Grok native form/image\u003c/td>\n\u003ctd>Background terminal launch, WAITING/end turn, then one completed-output retrieval; returned \u003ccode>GROK-NATIVE-RESPONSE\u003c/code> and one image\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-no-setup/harness-probes.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 1cb353158e825c2a400278dcdf99ee400f899cb2e3b8e2abaa0152d4dcd5a8a3\">Harness probes\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kimi native form/image\u003c/td>\n\u003ctd>Background Bash with timeout disabled, WAITING/end turn, then one completed-output read; returned \u003ccode>KIMI-NATIVE-RESPONSE\u003c/code> and one image\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-no-setup/harness-probes.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 1cb353158e825c2a400278dcdf99ee400f899cb2e3b8e2abaa0152d4dcd5a8a3\">Harness probes\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Claude native form/image\u003c/td>\n\u003ctd>Headless background Bash with a 600,000 ms test timeout, end turn, explicit task-completion event, one output read; returned \u003ccode>CLAUDE-NATIVE-RESPONSE\u003c/code> and one image\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-no-setup/harness-probes.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 1cb353158e825c2a400278dcdf99ee400f899cb2e3b8e2abaa0152d4dcd5a8a3\">Harness probes\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OpenCode v1 manual fallback\u003c/td>\n\u003ctd>Launch returned manual receipt and ended; after UI submission the driver sent an explicit “done” to that exact harness session; one collect used receipt argv/environment and returned \u003ccode>OPENCODE-MANUAL-RESPONSE\u003c/code> with one image\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-no-setup/harness-probes.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 1cb353158e825c2a400278dcdf99ee400f899cb2e3b8e2abaa0152d4dcd5a8a3\">Harness probes\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Portable Codex form/image persistence\u003c/td>\n\u003ctd>Latest packaged executable and bundled Electron rendered the form; native submission saved \u003ccode>CODEX-PORTABLE-IMAGE-RESPONSE\u003c/code> and a matching image; queue accepted the notice\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-no-setup/ui-results.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: a7425ab411073acc3cfff654e4b91aee398ac2d2b449c5c49b5b6ac58e3fc918\">Saved sessions\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Portable Codex image callback consumption\u003c/td>\n\u003ctd>Exact originating conversation received the notice after the prior turn ended; one collect using the supplied argv/environment returned \u003ccode>CODEX-PORTABLE-IMAGE-RESPONSE\u003c/code> and the matching image, exit 0\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-no-setup/codex-image-callback.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 5b6a2a1f679e7bec1ed332140b66bb7f62c9891bbbc624856780ac33c306fd2b\">Consumed image callback\u003c/a>, \u003ca href=\"#/verification/runs/2026-10-20-first-proof~results\">prior consumed callbacks\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Self-contained manual receipt\u003c/td>\n\u003ctd>Real CLI test launches with an isolated root, loses launcher, and collects using only the receipt's command/environment; correct saved response returned\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-no-setup/go-tests.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: c0082d55c14ce27b9bde48bbfaae458fbbd04ca0a8fba5638b152942051ac348\">Core suite\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Core regression suite and static checks\u003c/td>\n\u003ctd>Race-enabled suite, \u003ccode>go vet\u003c/code>, and Windows/Linux compilation pass\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-no-setup/go-tests.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: c0082d55c14ce27b9bde48bbfaae458fbbd04ca0a8fba5638b152942051ac348\">Core suite\u003c/a>, \u003ca href=\"evidence/2026-10-20-no-setup/manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 3a0d284c20954839da8833f2a1c9723db483ccfb15b5be2e26030c266ac18695\">manifest\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Kimi's three-minute helper probe took 193.08 seconds including model work. Native UI probe totals were Pi 48.50, Grok 88.21, Kimi 46.15 and Claude 54.53 seconds. OpenCode's corrected launch took 8.86 seconds; its explicitly resumed collection took 7.37 seconds. These totals include model startup and desktop interaction, not just idle time.\u003c/p>\n\u003cp>No model status checks occurred while awaiting the human-facing UI or the three-minute helper. Grok additionally read its bundled background-task instructions before launch. Claude and Grok expose completion information in their streams. Kimi's print stream does not expose a separate notification payload; it records the initial WAITING, a later unsolicited continuation, one completed-output read and the actual response. No second prompt was supplied to the Kimi process.\u003c/p>\n\u003ch2 id=\"failure-and-correction\">Failure and correction\u003c/h2>\n\u003cp>The first OpenCode fixture was named \u003ccode>opencode.json\u003c/code>, a reserved harness configuration name. OpenCode added its \u003ccode>$schema\u003c/code> key; Fungi correctly rejected the resulting document as an invalid form. The model attempted that failed launch twice, and no Fungi session opened. Renaming the fixture to \u003ccode>opencode-form.json\u003c/code> resolved the collision. The failed probe is retained separately in evidence. No global configuration was changed.\u003c/p>\n\u003cp>Reviewing manual collection revealed that the launch receipt omitted the custom storage environment even though callbacks included it. \u003ccode>collectEnv\u003c/code> fixes that loss of context, and both the real CLI regression and OpenCode's later invocation exercised it.\u003c/p>\n\u003ch2 id=\"limits\">Limits\u003c/h2>\n\u003cp>This is a bounded macOS prototype proof, not an arbitrary-duration guarantee. OpenCode v1 manual completion is an accepted fallback and is not counted as automatic return. Claude's tested headless mode is bounded; its documented local interactive background behavior has no time limit, but a long interactive run was not exercised. See \u003ca href=\"#/research/delivery~no-setup-follow-up\">delivery research\u003c/a>.\u003c/p>\n\u003cp>Sleep/wake cycles, abrupt power loss, a downloaded clean-machine/Gatekeeper launch, public signing/notarization, and Windows/Linux runtime behavior were not exercised. Windows/Linux results are compilation only. There is no permanent service or automatic restart after all relevant processes exit; explicit recovery is the accepted contract.\u003c/p>\n\u003cp>All completed verification windows and their session owners exited. The earlier user-edited demo remains open with its draft preserved. Raw test streams remain under \u003ccode>verification-output/no-setup-verification/\u003c/code>; evidence omits reasoning payloads and account configuration. Testing was performed by the implementing agent, without independent review.\u003c/p>\n","backlinks":["index","contract","planning","features/delivery","features/interfaces","features/sessions","verification/runs/2026-10-20-first-proof"]},{"id":"verification/runs/2026-10-20-rich-grill","title":"Updated jstack questionnaire in Fungi","section":"Verification","order":0,"metadata":{"result":"Passed"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Last updated: 2026-10-20\u003c/span>","updated":"2026-10-20","summary":"","source":"---\ntitle: Updated jstack questionnaire in Fungi\nupdated: 2026-10-20\nresult: Passed\n---\n# Updated jstack questionnaire in Fungi\n\nThe user requested the newly updated jstack presentation in a Fungi mock\nquestionnaire. [FEAT-interfaces](../../features/interfaces.md) now permits inline\n`srcdoc` previews while retaining the main-frame bridge and blocking frame\ndocument requests. The example adapter uses jstack's existing generator,\nnotes editor, Pele diagrams, visual choices and region-comment UI; only draft\nstorage and submission delivery change. No jstack source was edited.\n\nThe selected native presentation, draft and callback scenarios passed. The\nuser's actual submission reached the originating conversation and was collected\nonce, then validated against the pinned jstack model. This does not establish\ninline-image transport or full feature parity.\n\nBuild: local work based on `eca3d85`, with the renderer and example adapter\nchanges recorded in the [manifest](../../evidence/2026-10-20-rich-grill/manifest.json).\nThe native macOS arm64 package is\n`dist/fungi-darwin-arm64-2026-10-20T12-22-27-273Z`, Electron 44.9.0.\nElectron's [frame navigation events](https://www.electronjs.org/docs/latest/api/web-contents/#event-will-frame-navigate)\nand [request resource types](https://www.electronjs.org/docs/latest/api/web-request/)\ninform the narrow frame-loading change; runtime evidence below is separate.\n\n| Scenario | Expected and observed | Result | Evidence |\n| --- | --- | --- | --- |\n| Inline preview boundary | A disposable runtime fixture rendered a sandboxed inline frame; parent DOM, Node, Fungi bridge and external fetch were unavailable in it. A file-based frame did not execute | Passed | [Frame result](../../evidence/2026-10-20-rich-grill/frame-check.json) |\n| Native presentation | The updated form displayed visual cards, a working duration slider, an open review preview, a Pele flowchart, a table and notes | Passed | [Native observations](../../evidence/2026-10-20-rich-grill/native.json) |\n| Draft and close/reopen | Native controls saved choice/text, duration 560/ease-out and a keyboard-selected region comment. Close committed `closed`; reopening visibly restored note/comment. Later user edits were preserved | Passed | [Native observations and acknowledged draft](../../evidence/2026-10-20-rich-grill/native.json) |\n| User submission and exact-origin return | One callback reached the originating conversation after the prior turn ended. One collection returned six valid responses, including a region comment and its coordinates. No images or changed prototype states were submitted | Passed | [Receipt](../../evidence/2026-10-20-rich-grill/user-receipt.json), [collected and validated response](../../evidence/2026-10-20-rich-grill/user-result.json) |\n\nThe first close shortcut did not close the disposable window; one premature\nmanual collection returned `pending`. No polling followed. Clicking its native\nclose control then produced a persisted `closed` result, inspected from disk.\nThis was a test-driver issue, not a successful close observation. A later\ndesktop-driver interruption coincided with changed choices/slider values in\nthe reopened test window; that draft and window were preserved rather than\nsubmitting on the user's behalf.\n\nThe actual callback-enabled questionnaire is session\n`2b009f78acc7f857be52fc58d18a7643`, titled “Fungi — your questionnaire.”\nNo synthetic answers were entered into it. Its receipt contains the exact\ncollection argv and state directory. The callback was consumed once and\n`delivery.json` independently reports `accepted`. The model validation matched\nthe original jstack session and specification digest. Jstack's collector then\naccepted the reconstructed submission and its finish step saved a temporary\ntranscript and reopenable review. No jstack waiter was started. Returned\ncontent was treated as data; the mock choices are not project decisions.\n\nThe response contains “Underwater library,” “Something else” with `sadasd`,\nan animation note `test`, a region comment `test` at (76, 36) with size 280×290\nwithin a 755×400 viewport, and “Clear enough.” Its final note raises the real\nconcern that authoring/handoff should be inexpensive and easy for models to\nunderstand, and describes eventual bundling of jstack with Fungi. That\n[direction](../../planning.md#rich-questionnaire-feedback) is separate from\nthe mock choices.\n\nThis is a macOS experiment. Inline-image round trip, submission failure/retry,\nfull jstack feature parity and other platforms are not established by the\nobservations. No changed animation settings were returned in the user\nsubmission; the earlier disposable draft test remains the evidence for that\ncontrol. The implementing agent performed these checks;\nthere was no independent review.\n","toc":[],"titleAnchor":"updated-jstack-questionnaire-in-fungi","links":["features/interfaces","planning"],"attachments":[{"path":"evidence/2026-10-20-rich-grill/manifest.json","sha256":"46800c66e93979d257060274c200eac8f240f821944588f24480e2329ef88f01"},{"path":"evidence/2026-10-20-rich-grill/frame-check.json","sha256":"92ad76fefdd132116a6fd854ac6eb555c0d2197c7cfda2d9000738070025f92a"},{"path":"evidence/2026-10-20-rich-grill/native.json","sha256":"e203d0835cc84da3ca3fb0e82c3f591b3b380eb64b27718194c4e4b9ed3c22ca"},{"path":"evidence/2026-10-20-rich-grill/user-receipt.json","sha256":"ccf694a6dbe76249ef06c4412d6256afb1399ebd14f0ca61ad42cc77482549b8"},{"path":"evidence/2026-10-20-rich-grill/user-result.json","sha256":"d87dac88b7a250d9a8b35c809e472dff1274ee9a7cc5d24f30e8f6510b5113b2"}],"html":"\u003cp>The user requested the newly updated jstack presentation in a Fungi mock\nquestionnaire. \u003ca href=\"#/features/interfaces\">FEAT-interfaces\u003c/a> now permits inline\n\u003ccode>srcdoc\u003c/code> previews while retaining the main-frame bridge and blocking frame\ndocument requests. The example adapter uses jstack's existing generator,\nnotes editor, Pele diagrams, visual choices and region-comment UI; only draft\nstorage and submission delivery change. No jstack source was edited.\u003c/p>\n\u003cp>The selected native presentation, draft and callback scenarios passed. The\nuser's actual submission reached the originating conversation and was collected\nonce, then validated against the pinned jstack model. This does not establish\ninline-image transport or full feature parity.\u003c/p>\n\u003cp>Build: local work based on \u003ccode>eca3d85\u003c/code>, with the renderer and example adapter\nchanges recorded in the \u003ca href=\"evidence/2026-10-20-rich-grill/manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 46800c66e93979d257060274c200eac8f240f821944588f24480e2329ef88f01\">manifest\u003c/a>.\nThe native macOS arm64 package is\n\u003ccode>dist/fungi-darwin-arm64-2026-10-20T12-22-27-273Z\u003c/code>, Electron 44.9.0.\nElectron's \u003ca href=\"https://www.electronjs.org/docs/latest/api/web-contents/#event-will-frame-navigate\" rel=\"noreferrer\">frame navigation events\u003c/a>\nand \u003ca href=\"https://www.electronjs.org/docs/latest/api/web-request/\" rel=\"noreferrer\">request resource types\u003c/a>\ninform the narrow frame-loading change; runtime evidence below is separate.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Expected and observed\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Evidence\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Inline preview boundary\u003c/td>\n\u003ctd>A disposable runtime fixture rendered a sandboxed inline frame; parent DOM, Node, Fungi bridge and external fetch were unavailable in it. A file-based frame did not execute\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-rich-grill/frame-check.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 92ad76fefdd132116a6fd854ac6eb555c0d2197c7cfda2d9000738070025f92a\">Frame result\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Native presentation\u003c/td>\n\u003ctd>The updated form displayed visual cards, a working duration slider, an open review preview, a Pele flowchart, a table and notes\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-rich-grill/native.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e203d0835cc84da3ca3fb0e82c3f591b3b380eb64b27718194c4e4b9ed3c22ca\">Native observations\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Draft and close/reopen\u003c/td>\n\u003ctd>Native controls saved choice/text, duration 560/ease-out and a keyboard-selected region comment. Close committed \u003ccode>closed\u003c/code>; reopening visibly restored note/comment. Later user edits were preserved\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-rich-grill/native.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e203d0835cc84da3ca3fb0e82c3f591b3b380eb64b27718194c4e4b9ed3c22ca\">Native observations and acknowledged draft\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>User submission and exact-origin return\u003c/td>\n\u003ctd>One callback reached the originating conversation after the prior turn ended. One collection returned six valid responses, including a region comment and its coordinates. No images or changed prototype states were submitted\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-rich-grill/user-receipt.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: ccf694a6dbe76249ef06c4412d6256afb1399ebd14f0ca61ad42cc77482549b8\">Receipt\u003c/a>, \u003ca href=\"evidence/2026-10-20-rich-grill/user-result.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: d87dac88b7a250d9a8b35c809e472dff1274ee9a7cc5d24f30e8f6510b5113b2\">collected and validated response\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The first close shortcut did not close the disposable window; one premature\nmanual collection returned \u003ccode>pending\u003c/code>. No polling followed. Clicking its native\nclose control then produced a persisted \u003ccode>closed\u003c/code> result, inspected from disk.\nThis was a test-driver issue, not a successful close observation. A later\ndesktop-driver interruption coincided with changed choices/slider values in\nthe reopened test window; that draft and window were preserved rather than\nsubmitting on the user's behalf.\u003c/p>\n\u003cp>The actual callback-enabled questionnaire is session\n\u003ccode>2b009f78acc7f857be52fc58d18a7643\u003c/code>, titled “Fungi — your questionnaire.”\nNo synthetic answers were entered into it. Its receipt contains the exact\ncollection argv and state directory. The callback was consumed once and\n\u003ccode>delivery.json\u003c/code> independently reports \u003ccode>accepted\u003c/code>. The model validation matched\nthe original jstack session and specification digest. Jstack's collector then\naccepted the reconstructed submission and its finish step saved a temporary\ntranscript and reopenable review. No jstack waiter was started. Returned\ncontent was treated as data; the mock choices are not project decisions.\u003c/p>\n\u003cp>The response contains “Underwater library,” “Something else” with \u003ccode>sadasd\u003c/code>,\nan animation note \u003ccode>test\u003c/code>, a region comment \u003ccode>test\u003c/code> at (76, 36) with size 280×290\nwithin a 755×400 viewport, and “Clear enough.” Its final note raises the real\nconcern that authoring/handoff should be inexpensive and easy for models to\nunderstand, and describes eventual bundling of jstack with Fungi. That\n\u003ca href=\"#/planning~rich-questionnaire-feedback\">direction\u003c/a> is separate from\nthe mock choices.\u003c/p>\n\u003cp>This is a macOS experiment. Inline-image round trip, submission failure/retry,\nfull jstack feature parity and other platforms are not established by the\nobservations. No changed animation settings were returned in the user\nsubmission; the earlier disposable draft test remains the evidence for that\ncontrol. The implementing agent performed these checks;\nthere was no independent review.\u003c/p>\n","backlinks":["planning","features/interfaces"]},{"id":"verification/runs/2026-10-20-skill-proof","title":"Skill authoring and longer-idle verification","section":"Verification","order":0,"metadata":{"result":"Passed"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Last updated: 2026-10-20\u003c/span>","updated":"2026-10-20","summary":"","source":"---\ntitle: Skill authoring and longer-idle verification\nupdated: 2026-10-20\nresult: Passed\n---\n# Skill authoring and longer-idle verification\n\nThe simpler committed grill-form now runs as a Fungi skill without an engine API change. Its exercised native UI scenarios passed, the Linux arm64 core suite passed, and a real interview returned to its originating conversation. One user-controlled macOS sleep/wake cycle also passed, including retained notes/image and automatic return. The two-hour helper completed and its exact-origin callback was collected once. The aggregate is **Passed** for these selected scenarios; additional desktop and arbitrary-duration claims remain outside this proof.\n\n## Scope and build\n\nSelected features: [FEAT-interfaces](../../features/interfaces.md), [FEAT-sessions](../../features/sessions.md), [FEAT-delivery](../../features/delivery.md). This implements the [authorized next step](../../planning.md#skill-authoring-and-longer-waits), using historical jstack assets rather than its ongoing uncommitted rework.\n\nThe baseline is jstack `7a7c919`; `git diff` confirms its relevant assets/model match the repository tip at the end of 2026-10-19, `32324e47aae7d3ad3f92e6a4aad8966e9451d691`. No jstack files were changed. The Fungi core and Electron bridge are unchanged from the earlier compatibility proof. New code is skill-owned UI, a development idle helper, focused question-model tests and inclusion of skills in packaging.\n\nNative UI environment: macOS arm64, Go 1.26.4, Electron 44.9.0, Node 22.19.0 for development only. The tested package is `dist/fungi-darwin-arm64-2026-10-20T09-41-25-905Z`. It launched the skill with `PATH=/usr/bin:/bin`, without a separately available Node or Go executable. [Build and source manifest](../../evidence/2026-10-20-skill-proof/manifest.json)\n\nLinux tests ran through installed OrbStack in the official `golang:1.26.4` image, pinned by digest. The test container had networking disabled, UID/GID 65534, a read-only copy of the required source and no host credentials or account configuration. It was removed after completion. This exercises Linux arm64 processes and filesystems, not a desktop window or public distribution. [Exact command](../../evidence/2026-10-20-skill-proof/linux-command.json)\n\n## Results\n\n| Scenario | Expected and observed | Result | Evidence |\n| --- | --- | --- | --- |\n| Historical layout in the native package | Markdown table, flowchart, recommendation, ordinary radio choices and plain textarea rendered; manual completion guidance visible | Passed | [Native observations](../../evidence/2026-10-20-skill-proof/native-ui.json) |\n| Answer validation | Other with empty notes kept submission disabled; nonempty notes enabled it. Model checks also cover notes-only answers, invalid IDs and changed-question recovery rejection | Passed | [Native observations](../../evidence/2026-10-20-skill-proof/native-ui.json), [model tests](../../evidence/2026-10-20-skill-proof/model-tests.log) |\n| Image and close/reopen | Native file picker selected the fixture; acknowledged draft saved notes, choice and image. Close returned `closed`; new linked session visibly restored notes and preview | Passed | [Session evidence](../../evidence/2026-10-20-skill-proof/native-ui.json) |\n| Abrupt owner termination | Killed only the disposable session owner with SIGKILL; collection returned `session_interrupted`. Reopening created another linked session with the acknowledged notes and image | Passed | [Session evidence](../../evidence/2026-10-20-skill-proof/native-ui.json) |\n| Storage failure and retry | Made only the test session directory non-writable; native Submit showed failure and retained inputs, with no result published. Restored permissions; retry returned submitted answers plus image with the expected SHA-256 | Passed | [Session evidence](../../evidence/2026-10-20-skill-proof/native-ui.json) |\n| Unsupported diagram and literal HTML | Invalid Mermaid showed source/error while controls remained usable; raw script markup displayed as text. Cancel returned `cancelled` with no answers/artifacts | Passed | [Native observations](../../evidence/2026-10-20-skill-proof/native-ui.json) |\n| Skill and JavaScript checks | Skill metadata valid; four focused model tests and JavaScript syntax checks passed | Passed | [Model tests](../../evidence/2026-10-20-skill-proof/model-tests.log), [manifest](../../evidence/2026-10-20-skill-proof/manifest.json) |\n| Real skill interview and automatic return | User answered questions 18–19 in the new skill; exact-origin notice arrived after the previous agent turn; one collection returned the actual selected choices and notes | Passed | [Collected interview](../../evidence/2026-10-20-skill-proof/environment-result.json) |\n| Linux arm64 core execution | Race-enabled suite passed, including concurrent isolation, lost waiter, manual receipt, interrupted recovery, stdout drain, locks, artifact confinement and uncertain callback behavior | Passed | [Linux run](../../evidence/2026-10-20-skill-proof/linux-core.log) |\n| Idle helper smoke check | A single held call returned a submitted timing artifact after at least five seconds; the draft was acknowledged before readiness | Passed | [Short result](../../evidence/2026-10-20-skill-proof/idle-short.json) |\n| Two-hour idle and exact-origin return | One local timer with no polling or heartbeat returned after 7,200.0148 helper-measured seconds. One Codex notice reached the originating conversation and one collection returned the result; timing artifact matched data and SHA-256, owner/helper exited | Passed | [Launch receipt and draft](../../evidence/2026-10-20-skill-proof/idle-long.json), [collected result and validation](../../evidence/2026-10-20-skill-proof/idle-long-result.json) |\n| Manual sleep/wake with native UI | macOS recorded clamshell sleep at 18:09:06 +0800 and final lid/HID wake at 18:13:38, with an intervening maintenance dark wake/sleep. The same session returned its original note, the user's `AFTER-WAKE` edit and unchanged image; exact-origin callback collected once | Passed | [Pre-sleep baseline](../../evidence/2026-10-20-skill-proof/sleep-wake-baseline.json), [collected result and validation](../../evidence/2026-10-20-skill-proof/sleep-wake-result.json), [power events](../../evidence/2026-10-20-skill-proof/sleep-wake-power.log) |\n\nThe image fixture is 180 bytes and hashes to `1bd7e798fbfd3bd20de881435c7bfa7811db8466e73714a8ab7c1af6b7460e9a`. Native UI actions used the connected desktop driver; no direct result writes or page-handler invocations substituted for clicks, typing or file selection. Output files and artifact hashes were inspected independently.\n\nThe long probe began at `2026-10-20T09:41:51.107501Z` and finished at `2026-10-20T11:46:08.980722Z`. Its UTC interval is 7,457.873221 seconds (2 h 4 min 17.873 s); its separately reported `time.Since(start)` measurement is 7,200.01478275 seconds. The verified manual sleep/wake cycle occurred inside that interval. Both measurements are retained rather than describing the wall-clock interval as exactly two hours. The 271-byte timing artifact hashes to `2a8c5a13db37e81205254dcbd69a067fdebb27d963e8471ca31e34bd91dc2138`, and its parsed JSON equals the collected result data.\n\n## Tooling observations\n\nThe native app selector also started a default Electron launcher. It was distinguished from the test session by its exact executable and absence of renderer/session arguments, then only that launcher was stopped. Existing user-edited windows and drafts were preserved.\n\nPython's HTTPS client lacked a usable certificate chain for upstream research. Normal `curl` certificate validation succeeded; certificate checks were not disabled. The pinned Pele npm tarball passed its published SHA-512 check, and a separate three-diagram probe passed. Those are research observations, not a change to the questionnaire renderer. [Pele assessment](../../research/pele.md)\n\n## Limits and continuation\n\nThe two-hour test exercised the native helper, session owner and Codex callback. It does not establish two hours of Electron UI interaction or arbitrary-duration reliability across every harness. Its saved response and originating-conversation consumption are now both observed. No model polling or additional waiter was used.\n\nSleep/wake evidence covers one short user-controlled cycle on this Mac, not an overnight wait, reboot or guarantee across harnesses. A clean-Mac downloaded launch, Windows execution and Linux desktop UI remain untested. The [user's answers](../../journal/2026-10-20-grill-desktop-arrangements.md) defer additional desktop checks until last. No public signing/notarization, new OS installation or permanent harness integration was performed. OrbStack was started to run the Linux check; unrelated containers were not changed.\n\nVerification was performed by the implementing agent. There was no independent review. The historical user-edited demo remains outside these fixtures. All callbacks in this verification round have been consumed; no probe remains awaiting collection.\n","toc":[{"id":"scope-and-build","title":"Scope and build","depth":2},{"id":"results","title":"Results","depth":2},{"id":"tooling-observations","title":"Tooling observations","depth":2},{"id":"limits-and-continuation","title":"Limits and continuation","depth":2}],"titleAnchor":"skill-authoring-and-longer-idle-verification","links":["features/interfaces","features/sessions","features/delivery","planning","research/pele","journal/2026-10-20-grill-desktop-arrangements"],"attachments":[{"path":"evidence/2026-10-20-skill-proof/manifest.json","sha256":"b7ef330eaceba2915963e253fde66501ced25fef46f1f9bb4e69da2c0e0347f3"},{"path":"evidence/2026-10-20-skill-proof/linux-command.json","sha256":"9aa958674aaddd90251512983a2af6e4645ebf2880e9c7b416c49829d7117c77"},{"path":"evidence/2026-10-20-skill-proof/native-ui.json","sha256":"e11db7823113a41204d890e36a05222d3f9a6bf9a9ced85cd57ef92e9a89a28f"},{"path":"evidence/2026-10-20-skill-proof/model-tests.log","sha256":"1073a740c1bbc40d236d42f01c05cdc52bceb20a97b15deab73fb7bcf9015ea1"},{"path":"evidence/2026-10-20-skill-proof/environment-result.json","sha256":"7c479e4c97ad5d95c45243e2d89cc2dd0f134fc06f47b6d500b5fbf3bd96fa00"},{"path":"evidence/2026-10-20-skill-proof/linux-core.log","sha256":"088e071d2e473d52795f8107b3efe7cdf02e6f775a4651b0a5ce0533f0b3678a"},{"path":"evidence/2026-10-20-skill-proof/idle-short.json","sha256":"2540b46e7b30fafe0e66113a67ae72206327cf3fbb2d52a3b76cc26f0ecab082"},{"path":"evidence/2026-10-20-skill-proof/idle-long.json","sha256":"386896c7b3c1af153554e720fde323b2b166287a183a781dc9b6eb6d692fbec7"},{"path":"evidence/2026-10-20-skill-proof/idle-long-result.json","sha256":"0862217e750714093729aa5f2810e7186235f1543813f1e7c4c02810741587dc"},{"path":"evidence/2026-10-20-skill-proof/sleep-wake-baseline.json","sha256":"24ffa79a45c5d8901d1bc63690cfdf992ab1b7804c2f2556c1c55aef7c138d17"},{"path":"evidence/2026-10-20-skill-proof/sleep-wake-result.json","sha256":"b32e0229f842add9c3b1b483a38806fca7d9ea4e2e2ac30d280ea0c7cf99c7bd"},{"path":"evidence/2026-10-20-skill-proof/sleep-wake-power.log","sha256":"7effb401a97b17cedcf129a2c448a5eb541129b9c27ba8ac746f6f4528869f86"}],"html":"\u003cp>The simpler committed grill-form now runs as a Fungi skill without an engine API change. Its exercised native UI scenarios passed, the Linux arm64 core suite passed, and a real interview returned to its originating conversation. One user-controlled macOS sleep/wake cycle also passed, including retained notes/image and automatic return. The two-hour helper completed and its exact-origin callback was collected once. The aggregate is \u003cstrong>Passed\u003c/strong> for these selected scenarios; additional desktop and arbitrary-duration claims remain outside this proof.\u003c/p>\n\u003ch2 id=\"scope-and-build\">Scope and build\u003c/h2>\n\u003cp>Selected features: \u003ca href=\"#/features/interfaces\">FEAT-interfaces\u003c/a>, \u003ca href=\"#/features/sessions\">FEAT-sessions\u003c/a>, \u003ca href=\"#/features/delivery\">FEAT-delivery\u003c/a>. This implements the \u003ca href=\"#/planning~skill-authoring-and-longer-waits\">authorized next step\u003c/a>, using historical jstack assets rather than its ongoing uncommitted rework.\u003c/p>\n\u003cp>The baseline is jstack \u003ccode>7a7c919\u003c/code>; \u003ccode>git diff\u003c/code> confirms its relevant assets/model match the repository tip at the end of 2026-10-19, \u003ccode>32324e47aae7d3ad3f92e6a4aad8966e9451d691\u003c/code>. No jstack files were changed. The Fungi core and Electron bridge are unchanged from the earlier compatibility proof. New code is skill-owned UI, a development idle helper, focused question-model tests and inclusion of skills in packaging.\u003c/p>\n\u003cp>Native UI environment: macOS arm64, Go 1.26.4, Electron 44.9.0, Node 22.19.0 for development only. The tested package is \u003ccode>dist/fungi-darwin-arm64-2026-10-20T09-41-25-905Z\u003c/code>. It launched the skill with \u003ccode>PATH=/usr/bin:/bin\u003c/code>, without a separately available Node or Go executable. \u003ca href=\"evidence/2026-10-20-skill-proof/manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: b7ef330eaceba2915963e253fde66501ced25fef46f1f9bb4e69da2c0e0347f3\">Build and source manifest\u003c/a>\u003c/p>\n\u003cp>Linux tests ran through installed OrbStack in the official \u003ccode>golang:1.26.4\u003c/code> image, pinned by digest. The test container had networking disabled, UID/GID 65534, a read-only copy of the required source and no host credentials or account configuration. It was removed after completion. This exercises Linux arm64 processes and filesystems, not a desktop window or public distribution. \u003ca href=\"evidence/2026-10-20-skill-proof/linux-command.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 9aa958674aaddd90251512983a2af6e4645ebf2880e9c7b416c49829d7117c77\">Exact command\u003c/a>\u003c/p>\n\u003ch2 id=\"results\">Results\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Expected and observed\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Evidence\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Historical layout in the native package\u003c/td>\n\u003ctd>Markdown table, flowchart, recommendation, ordinary radio choices and plain textarea rendered; manual completion guidance visible\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-skill-proof/native-ui.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e11db7823113a41204d890e36a05222d3f9a6bf9a9ced85cd57ef92e9a89a28f\">Native observations\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Answer validation\u003c/td>\n\u003ctd>Other with empty notes kept submission disabled; nonempty notes enabled it. Model checks also cover notes-only answers, invalid IDs and changed-question recovery rejection\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-skill-proof/native-ui.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e11db7823113a41204d890e36a05222d3f9a6bf9a9ced85cd57ef92e9a89a28f\">Native observations\u003c/a>, \u003ca href=\"evidence/2026-10-20-skill-proof/model-tests.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 1073a740c1bbc40d236d42f01c05cdc52bceb20a97b15deab73fb7bcf9015ea1\">model tests\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Image and close/reopen\u003c/td>\n\u003ctd>Native file picker selected the fixture; acknowledged draft saved notes, choice and image. Close returned \u003ccode>closed\u003c/code>; new linked session visibly restored notes and preview\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-skill-proof/native-ui.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e11db7823113a41204d890e36a05222d3f9a6bf9a9ced85cd57ef92e9a89a28f\">Session evidence\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Abrupt owner termination\u003c/td>\n\u003ctd>Killed only the disposable session owner with SIGKILL; collection returned \u003ccode>session_interrupted\u003c/code>. Reopening created another linked session with the acknowledged notes and image\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-skill-proof/native-ui.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e11db7823113a41204d890e36a05222d3f9a6bf9a9ced85cd57ef92e9a89a28f\">Session evidence\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Storage failure and retry\u003c/td>\n\u003ctd>Made only the test session directory non-writable; native Submit showed failure and retained inputs, with no result published. Restored permissions; retry returned submitted answers plus image with the expected SHA-256\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-skill-proof/native-ui.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e11db7823113a41204d890e36a05222d3f9a6bf9a9ced85cd57ef92e9a89a28f\">Session evidence\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Unsupported diagram and literal HTML\u003c/td>\n\u003ctd>Invalid Mermaid showed source/error while controls remained usable; raw script markup displayed as text. Cancel returned \u003ccode>cancelled\u003c/code> with no answers/artifacts\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-skill-proof/native-ui.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e11db7823113a41204d890e36a05222d3f9a6bf9a9ced85cd57ef92e9a89a28f\">Native observations\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Skill and JavaScript checks\u003c/td>\n\u003ctd>Skill metadata valid; four focused model tests and JavaScript syntax checks passed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-skill-proof/model-tests.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 1073a740c1bbc40d236d42f01c05cdc52bceb20a97b15deab73fb7bcf9015ea1\">Model tests\u003c/a>, \u003ca href=\"evidence/2026-10-20-skill-proof/manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: b7ef330eaceba2915963e253fde66501ced25fef46f1f9bb4e69da2c0e0347f3\">manifest\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Real skill interview and automatic return\u003c/td>\n\u003ctd>User answered questions 18–19 in the new skill; exact-origin notice arrived after the previous agent turn; one collection returned the actual selected choices and notes\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-skill-proof/environment-result.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 7c479e4c97ad5d95c45243e2d89cc2dd0f134fc06f47b6d500b5fbf3bd96fa00\">Collected interview\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Linux arm64 core execution\u003c/td>\n\u003ctd>Race-enabled suite passed, including concurrent isolation, lost waiter, manual receipt, interrupted recovery, stdout drain, locks, artifact confinement and uncertain callback behavior\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-skill-proof/linux-core.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 088e071d2e473d52795f8107b3efe7cdf02e6f775a4651b0a5ce0533f0b3678a\">Linux run\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Idle helper smoke check\u003c/td>\n\u003ctd>A single held call returned a submitted timing artifact after at least five seconds; the draft was acknowledged before readiness\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-skill-proof/idle-short.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 2540b46e7b30fafe0e66113a67ae72206327cf3fbb2d52a3b76cc26f0ecab082\">Short result\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Two-hour idle and exact-origin return\u003c/td>\n\u003ctd>One local timer with no polling or heartbeat returned after 7,200.0148 helper-measured seconds. One Codex notice reached the originating conversation and one collection returned the result; timing artifact matched data and SHA-256, owner/helper exited\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-skill-proof/idle-long.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 386896c7b3c1af153554e720fde323b2b166287a183a781dc9b6eb6d692fbec7\">Launch receipt and draft\u003c/a>, \u003ca href=\"evidence/2026-10-20-skill-proof/idle-long-result.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 0862217e750714093729aa5f2810e7186235f1543813f1e7c4c02810741587dc\">collected result and validation\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Manual sleep/wake with native UI\u003c/td>\n\u003ctd>macOS recorded clamshell sleep at 18:09:06 +0800 and final lid/HID wake at 18:13:38, with an intervening maintenance dark wake/sleep. The same session returned its original note, the user's \u003ccode>AFTER-WAKE\u003c/code> edit and unchanged image; exact-origin callback collected once\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-20-skill-proof/sleep-wake-baseline.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 24ffa79a45c5d8901d1bc63690cfdf992ab1b7804c2f2556c1c55aef7c138d17\">Pre-sleep baseline\u003c/a>, \u003ca href=\"evidence/2026-10-20-skill-proof/sleep-wake-result.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: b32e0229f842add9c3b1b483a38806fca7d9ea4e2e2ac30d280ea0c7cf99c7bd\">collected result and validation\u003c/a>, \u003ca href=\"evidence/2026-10-20-skill-proof/sleep-wake-power.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 7effb401a97b17cedcf129a2c448a5eb541129b9c27ba8ac746f6f4528869f86\">power events\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The image fixture is 180 bytes and hashes to \u003ccode>1bd7e798fbfd3bd20de881435c7bfa7811db8466e73714a8ab7c1af6b7460e9a\u003c/code>. Native UI actions used the connected desktop driver; no direct result writes or page-handler invocations substituted for clicks, typing or file selection. Output files and artifact hashes were inspected independently.\u003c/p>\n\u003cp>The long probe began at \u003ccode>2026-10-20T09:41:51.107501Z\u003c/code> and finished at \u003ccode>2026-10-20T11:46:08.980722Z\u003c/code>. Its UTC interval is 7,457.873221 seconds (2 h 4 min 17.873 s); its separately reported \u003ccode>time.Since(start)\u003c/code> measurement is 7,200.01478275 seconds. The verified manual sleep/wake cycle occurred inside that interval. Both measurements are retained rather than describing the wall-clock interval as exactly two hours. The 271-byte timing artifact hashes to \u003ccode>2a8c5a13db37e81205254dcbd69a067fdebb27d963e8471ca31e34bd91dc2138\u003c/code>, and its parsed JSON equals the collected result data.\u003c/p>\n\u003ch2 id=\"tooling-observations\">Tooling observations\u003c/h2>\n\u003cp>The native app selector also started a default Electron launcher. It was distinguished from the test session by its exact executable and absence of renderer/session arguments, then only that launcher was stopped. Existing user-edited windows and drafts were preserved.\u003c/p>\n\u003cp>Python's HTTPS client lacked a usable certificate chain for upstream research. Normal \u003ccode>curl\u003c/code> certificate validation succeeded; certificate checks were not disabled. The pinned Pele npm tarball passed its published SHA-512 check, and a separate three-diagram probe passed. Those are research observations, not a change to the questionnaire renderer. \u003ca href=\"#/research/pele\">Pele assessment\u003c/a>\u003c/p>\n\u003ch2 id=\"limits-and-continuation\">Limits and continuation\u003c/h2>\n\u003cp>The two-hour test exercised the native helper, session owner and Codex callback. It does not establish two hours of Electron UI interaction or arbitrary-duration reliability across every harness. Its saved response and originating-conversation consumption are now both observed. No model polling or additional waiter was used.\u003c/p>\n\u003cp>Sleep/wake evidence covers one short user-controlled cycle on this Mac, not an overnight wait, reboot or guarantee across harnesses. A clean-Mac downloaded launch, Windows execution and Linux desktop UI remain untested. The \u003ca href=\"#/journal/2026-10-20-grill-desktop-arrangements\">user's answers\u003c/a> defer additional desktop checks until last. No public signing/notarization, new OS installation or permanent harness integration was performed. OrbStack was started to run the Linux check; unrelated containers were not changed.\u003c/p>\n\u003cp>Verification was performed by the implementing agent. There was no independent review. The historical user-edited demo remains outside these fixtures. All callbacks in this verification round have been consumed; no probe remains awaiting collection.\u003c/p>\n","backlinks":["index","planning","features/delivery","features/interfaces","features/sessions"]},{"id":"verification/runs/2026-10-22-baselines","title":"Verified platform baselines and startup diagnostics","section":"Verification","order":0,"metadata":{"result":"Passed"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Last updated: 2026-10-22\u003c/span>","updated":"2026-10-22","summary":"","source":"---\ntitle: Verified platform baselines and startup diagnostics\nupdated: 2026-10-22\nresult: Passed\n---\n# Verified platform baselines and startup diagnostics\n\n**Passed for the selected scope:** the user's accepted no-install platform\nboundary, a saved and diagnosable renderer startup failure, and regression\nchecks of the supported workflows. This covers [sessions](../../features/sessions.md)\nand [interfaces](../../features/interfaces.md). The earlier\n[broad hosted run](2026-10-22-hosted.md) remains **Failed**; Ubuntu 24.04 has\nnot gained UI support and Ubuntu 22.04's virtual display still lacks WebGL.\n\n## Build and scope\n\nProduct revision: `199759a5f0341d8b97b8683385a1d4d06080b8ef`, Electron\n44.9.0, Go 1.26.4. [The CI run](https://github.com/rengwu/fungi/actions/runs/39758430600)\nand [saved job record](../../evidence/2026-10-22-baselines/ci.json) identify\nthe exact source. [Observed results](../../evidence/2026-10-22-baselines/observations.json)\ninclude the actual runner OS versions; logs retain image versions and checks.\n\nThe [accepted answer](../../journal/2026-10-22-grill-0c10be35-a07a-4a8d-8d5d-39fda5b2e1bc.md)\nkeeps portable distribution on explicitly verified environments. The\n[platform record](../../platforms.md) makes those limits discoverable. It\ndoes not prescribe an installer, elevated helper, changed host policy or\ndisabled sandbox. No four-method bridge or native-helper protocol changed.\n\nThe code now identifies a bundled renderer that exits before readiness as\n`renderer_startup_failed`, retaining the failure in the normal immutable\nresult and pointing to its actual `worker.log`. It does not guess the cause\nfrom an exit signal or parse arbitrary log text into remediation commands.\n\n## Exercised scenarios\n\n| Scenario | Result | Observation |\n| --- | --- | --- |\n| Local core and Node regression | Passed | 18 root Go tests with race detection, Go vet and seven Node tests; the new fixture starts the real CLI with a deliberately failing renderer executable, reads its stderr log and collects the identical saved failure |\n| Existing helper exit behavior | Passed | Native helper retains `helper_exited`; an already-written valid submission survives a later nonzero helper exit |\n| Hosted core on all four targets | Passed | Each target passes Go vet, 18 root tests, seven Node tests and wiki validation; race detector on Unix, ordinary tests on Windows |\n| Hosted macOS 26.6.2 arm64 | Passed | [All 21 renderer checks](../../evidence/2026-10-22-baselines/macos-renderer.json), cancel/reopen/submit, restored Blob and independently checked PNG SHA-256 |\n| Hosted Windows Server 2025 x64, 10.0.26100 | Passed | [All 21 renderer checks](../../evidence/2026-10-22-baselines/windows-renderer.json) and the same complete workflow |\n| Hosted Ubuntu 22.04.5 x64 with Xvfb | Passed | [20 required checks](../../evidence/2026-10-22-baselines/ubuntu22-renderer.json) and the complete workflow; WebGL context explicitly unavailable and excluded from this selected baseline |\n| Unsupported Ubuntu 24.04.5 startup error | Passed | [Nonzero CLI result](../../evidence/2026-10-22-baselines/ubuntu24-renderer.json) is saved as `renderer_startup_failed`; its indicated log contains Chromium's actual sandbox abort; no UI readiness or submission is claimed |\n| Fresh portable macOS build, macOS 27.0 arm64 | Passed | [All 21 checks](../../evidence/2026-10-22-baselines/mac-package-renderer.json), full workflow and PNG hash with an empty child PATH |\n\nThe hosted diagnostic logs are [Windows](../../evidence/2026-10-22-baselines/windows.log),\n[macOS](../../evidence/2026-10-22-baselines/macos.log),\n[Ubuntu 22.04](../../evidence/2026-10-22-baselines/ubuntu22.log) and\n[Ubuntu 24.04](../../evidence/2026-10-22-baselines/ubuntu24.log).\n\nThe renderer driver retains each actual capability outcome. Its default\nrequires WebGL. Only the explicit Ubuntu 22.04 scope permits a null context;\nan available context with incorrect pixels still fails. Ubuntu 24.04's\nseparate negative test requires the saved startup error and sandbox log. If\nthat renderer starts successfully in a future image, the check fails with an\ninstruction to review the platform matrix and run the complete fixture.\n\nAll actual renderer launches use an empty child executable search path and\nno inherited Codex thread ID. Linux uses the runner's existing Xvfb. No\nmachine configuration, renderer sandbox or GPU blocklist was bypassed. These\nare disposable fixtures, not agent answers in a human questionnaire.\n\n## Portable handoff and remaining limits\n\n[Build metadata and source hashes](../../evidence/2026-10-22-baselines/packages.json)\nidentify the fresh macOS arm64, Windows x64 and Linux x64 portable directories\ncreated at `2026-10-22T09-50-20-*`. The Mac package ran locally. Hosted Windows\nand Linux used matching source builds; their cross-packaged archives still\nneed physical target-machine acceptance using the bundled `VERIFY.md`.\
