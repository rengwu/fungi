ut } = await fungi.ready();\n  const form = document.querySelector('#review');\n  form.elements.duration.value = input.duration ?? 300;\n  form.onsubmit = async event =&gt; {\n    event.preventDefault();\n    await fungi.submit({\n      duration: Number(form.elements.duration.value),\n      notes: form.elements.notes.value\n    });\n  };\n&lt;/script&gt;\n\u003c/code>\u003c/pre>\n\u003cp>The renderer supplies the small bridge. An illustrative invocation is:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">fungi open ./review.html --input ./input.json\n\u003c/code>\u003c/pre>\n\u003cp>The agent should get either a supported automatic-delivery acknowledgement with an exact session identifier, a final result through a host-managed pending call, or a notice that the UI is open and the user should say “done” after submitting. It must not get a process ID accompanied by instructions to keep polling. The same exact-session collection path works for automatic notices and manual continuation.\u003c/p>\n\u003cp>A reference component library can shorten common forms later. The plain HTML path remains valid so novel interfaces never wait for fungi to invent another widget type.\u003c/p>\n\u003ch2 id=\"json-authoring-in-the-same-first-release\">JSON authoring in the same first release\u003c/h2>\n\u003cp>Support a small declarative form through the same renderer and result bridge. An illustrative file is:\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{\n  \"title\": \"Animation feedback\",\n  \"fields\": [\n    { \"type\": \"range\", \"name\": \"duration\", \"label\": \"Duration\", \"min\": 100, \"max\": 1000, \"value\": 300 },\n    { \"type\": \"text\", \"name\": \"notes\", \"label\": \"Notes\" }\n  ]\n}\n\u003c/code>\u003c/pre>\n\u003cp>The corresponding invocation could be \u003ccode>fungi open ./review.json\u003c/code>. The renderer turns this into components, collects named values, and submits the same JSON result a hand-authored page would submit. Common fields should not require JavaScript from the skill author. The accepted initial scope is flat built-in fields. Nested layouts and custom JSON component registration are deferred for the user's larger JSON-authoring discussion; do not design that framework into this milestone.\u003c/p>\n\u003cp>Equal first-release support means both paths are documented, usable, and exercised. It does not require a JSON representation for every possible JavaScript program. Custom components can own their local behavior; the engine should not gain an expression evaluator, workflow DSL, or separate catalog-specific lifecycle.\u003c/p>\n\u003ch2 id=\"a-small-bridge\">A small bridge\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Capability\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>ready()\u003c/code>\u003c/td>\n\u003ctd>Read launch input, restored draft if present, and available renderer capabilities\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>submit(data, attachments?)\u003c/code>\u003c/td>\n\u003ctd>Commit JSON and optional blobs; resolve only after fungi has saved them\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cancel()\u003c/code>\u003c/td>\n\u003ctd>Explicitly finish without submitted data\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>saveDraft(data)\u003c/code>\u003c/td>\n\u003ctd>Optional recovery support for custom interfaces\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Do not expose an arbitrary shell, filesystem, or harness API to page content. A canvas can submit a PNG blob and its editable scene JSON together; fungi supplies artifact references in the returned result. A slider can animate a local preview continuously while the model remains idle.\u003c/p>\n\u003cp>The native window's close action is handled by the renderer/engine, not by requiring every skill to implement fragile browser-unload behavior. Accepted behavior: report a distinct \u003ccode>closed\u003c/code> outcome, preserve the latest saved draft, and allow explicit reopen. Close must never imply submission. Draft preservation is limited to data already saved; custom pages opt into \u003ccode>saveDraft\u003c/code>.\u003c/p>\n\u003ch2 id=\"growing-an-interface\">Growing an interface\u003c/h2>\n\u003cp>A reusable capability may simply be an \u003ccode>index.html\u003c/code> and local assets. No manifest is needed for the simplest file. Optional metadata can add a name, input schema, output schema, required capabilities, and documentation when discovery makes that useful.\u003c/p>\n\u003cp>Authors may use plain HTML, Web Components, React, Vue, Svelte, or a canvas library. Prebuilt JavaScript and CSS can ship with a skill or renderer. A library's build-time npm dependency does not require npm on the end user's machine. Ad hoc interfaces should work without a build step.\u003c/p>\n\u003cp>Actual framework support depends on the chosen bundled engine. Do not advertise a browser library as supported merely because an engine parses HTML and executes JavaScript.\u003c/p>\n\u003cp>Explicit file paths should always work. Reusable capabilities can live with the skill or in an optional folder near the fungi executable. Named discovery may use a short descriptor when needed; no registry server, installation command, or dependency solver is required. The exact folder name and lookup rules remain implementation choices.\u003c/p>\n\u003cp>Use composition at the right level: components inside one web renderer can share values and events; a native screenshot panel and a web form compose as workflow steps. Arbitrary third-party native widgets cannot be promised to share one layout merely because they both use fungi.\u003c/p>\n\u003ch2 id=\"native-escape-hatch\">Native escape hatch\u003c/h2>\n\u003cp>A native extension should be an ordinary executable: accept input, display its own interface, emit a result. It can be written in any language. The advanced process contract should not be required for someone making a basic HTML form.\u003c/p>\n\u003cp>Package the Go core and Electron renderer together in a portable directory. A native capability may be a companion executable; basic HTML/JSON authors still need no compiler or runtime installation. Keep renderer launch behind the same small process boundary instead of requiring a Go binding for every engine. No self-extraction mechanism is required for the accepted distribution.\u003c/p>\n\u003ch2 id=\"first-proof\">First proof\u003c/h2>\n\u003cp>\u003cstrong>Outcome:\u003c/strong> an agent opens a skill-authored interface, the human takes as long as needed, and the exact calling conversation receives a saved response without repeated model tool calls. The accepted platform scope is macOS first. The accepted harness targets are \u003cstrong>Codex, Claude Code, OpenCode, Grok, Kimi and Pi\u003c/strong>. A successful Codex test alone does not establish completion or universal compatibility.\u003c/p>\n\u003cp>Inspect and exercise the simplest supported return route in each harness early. A host-managed background completion, exact-session callback, or one pending call can satisfy the waiting requirement when its actual behavior is verified. A process ID with instructions to poll cannot. Keep any route that needs extra setup or cannot be verified visible as a gap; the manual “done” fallback remains usable but is not an automatic-return pass.\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Make the small contract concrete.\u003c/strong> Use two equivalent examples, plain HTML and a JSON form, to settle launch input, the page bridge, result/artifact shape, and exact-session collection. The result distinguishes submitted, cancelled, closed and failed outcomes. Keep caller identity and delivery configuration outside page-controlled data. An \u003ccode>open\u003c/code> acknowledgement must identify either the supported automatic route or the accepted manual “done” fallback. Help and machine-readable command output must make that distinction discoverable.\u003c/li>\n\u003cli>\u003cstrong>Build one complete round trip.\u003c/strong> Go starts the session and Electron host; the host renders text, one field, one slider, and submit/cancel, with a pasted/selected image attachment. Both HTML and flat JSON examples use the same submission path. Save the response before acknowledging submission or sending a completion notice. Include a tiny native helper accepting JSON and returning JSON/artifact data through the same engine contract. Implement and verify the return routes for all six named harnesses; use native host capabilities where they suffice. Preserve manual exact-session collection when automatic delivery is unavailable. Do not introduce an adapter registry or broad component system for this milestone.\u003c/li>\n\u003cli>\u003cstrong>Verify waiting, failure and packaging.\u003c/strong> Record the actual tool/event sequence during a human wait, measure idle resources, then submit and verify correct routing. Exercise two simultaneous sessions, duplicate submit, close/cancel, renderer crash, interrupted delivery and explicit recovery after process exit. Package a portable build and test offline launch with no separately installed Node/npm or browser runtime. Measure archive size and startup. Windows/Linux clean-environment packaging checks follow before claiming cross-platform delivery.\u003c/li>\n\u003c/ol>\n\u003cp>Use a deterministic fake renderer for core failure/routing tests so session correctness can be checked without opening windows. Use the real Electron UI and real harness for the user-visible return path; mocks cannot establish automatic resumption.\u003c/p>\n\u003cp>The milestone is complete when both authoring paths and the native helper return the expected JSON and artifact references, submitted results survive the exercised failures, outcomes remain distinct, sessions never cross, and each named harness has a verified automatic return path with an observed idle interval producing no recurring model checks. Record the interval, harness version and environment; a short test is not evidence of unlimited-duration reliability. Missing callbacks must leave a collectable result and the documented “done” fallback, while remaining an explicit automatic-delivery gap.\u003c/p>\n\u003cp>The first useful deliverable is this reliable round trip with tiny HTML, flat JSON and native-helper examples. Custom UI can use ordinary local HTML/assets without changing Go. Drawing tools, native capture UI, rich JSON composition, custom JSON component registration and external live updates are deferred. Broader UI libraries, external catalog protocols, MCP Apps hosting, remote desktops, and WASM can follow when a workflow needs them. The scope is accepted; implementation has not begun. \u003ca href=\"#/research/index\">Research rationale\u003c/a>\u003c/p>\n","backlinks":["index","planning","research/index","research/renderer-health"]},{"id":"features/delivery","title":"Returning to an agent","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-20\u003c/span>","updated":"2026-10-20","summary":"","source":"---\ntitle: Returning to an agent\nupdated: 2026-10-20\n---\n# Returning to an agent\n\n**ID: FEAT-delivery**\n\nThe [accepted requirement](../planning.md) is automatic response delivery without repeated model checks or AFK token expenditure. Fungi preserves results independently of the delivery route.\n\n## Entry points and expected outcomes\n\n- `--delivery auto`: bind an inherited exact `CODEX_THREAD_ID` when `codex queue` is supported; otherwise explicitly report manual delivery.\n- `--delivery wait`: keep one command pending through a process pipe, with no Fungi human deadline. The harness must retain that call or supply background completion.\n- `--delivery manual`: return an opened receipt; after the user says “done,” collect the exact session once.\n\nThe callback contains the executable, exact session and state-directory environment, not user response content. Delivery bookkeeping distinguishes `armed`, `attempting`, `accepted` and `unknown`. A notification failure never erases a committed result. An uncertain attempt is not automatically retried. Acceptance does not prove the originating agent consumed the notice.\n\n| Tested harness | Invocation for a human interaction | Evidence and limits |\n| --- | --- | --- |\n| Codex 0.163.0 | `auto` with inherited exact thread and available queue command | Helper, native-close and packaged form/image callbacks consumed; later native sleep/wake and two-hour helper callbacks also consumed once |\n| Claude Code 2.1.302 | `wait` through native background Bash in a suitable local interactive session | Headless form/image and three-minute completion passed; headless/cloud execution is bounded, so use manual for an unrestricted human wait there |\n| OpenCode 1.18.34 | `manual`; end turn; collect once after “done” | Native image flow passed; ordinary v1 Bash is bounded |\n| Grok 1.0.62 | `wait` through `run_terminal_command` with `block_until_ms: 0`; end turn | Native form/image and three-minute completion passed; retrieve completed output once after notification |\n| Kimi 2.2.0 | `wait` through background Bash with `disable_timeout: true`; end turn | Native form/image and three-minute completion passed after user sign-in |\n| Pi 1.3.0 | `wait` through one pending Bash call, timeout omitted | Native form/image and three-minute completion passed |\n\nThis is a versioned compatibility record, not a universal promise about another mode or future harness version. `auto` does not set another harness's tool arguments; skills choose the native route or the explicit fallback.\n\n## Verification recipe\n\nUse a disposable conversation and the native helper, with an isolated state directory. `helper wait 180` stays silent for three minutes before returning a real Fungi artifact/result. Allow only the fixture command; do not change persistent harness settings.\n\nFor Claude, use native background Bash, end the turn, and observe the completion event followed by result consumption. For Grok, use `block_until_ms: 0`, end the turn, and retrieve completed output once after notification. For Pi, omit the Bash timeout and retain one call. Record actual arguments: in the completed Claude test the model supplied a 600,000 ms timeout, so that test does not establish arbitrary AFK duration.\n\nFor Codex and OpenCode, ten-second pending-call probes returned real Fungi results. Codex requires permission to write the session directory. Canonicalize macOS `/var` paths before using them as an OpenCode working directory. These short tests do not prove an ended-turn callback.\n\nFor the Codex callback, launch from the intended live conversation, end the turn, submit the UI, and verify that the exact conversation consumes its notice. Check `delivery.json` separately. After the implementation turn ended, the queued notice for native-helper session `a4e20e6a9ce120f2ccf7461a5ae22b0a` reached the originating conversation. One collection returned its submitted data and artifact. This verifies callback consumption for that fixture, including a notice queued while the original turn was still active. Its older notice omitted the custom state directory, which was recovered from the known launch context.\n\nThe corrected notice for native-form session `f2b35d71fb650809ac354bdd593df8fd` subsequently reached the same originating conversation with its full executable, argument array and state-directory environment. One collection using those supplied values returned `closed` without answer data or artifacts. Both callback formats have now been consumed; the second verifies the corrected self-contained collection instructions.\n\nThe initial Kimi probe stopped before tool execution because its selected provider had no credential. After the user completed sign-in, Kimi 2.2.0 passed a three-minute background wait with `disable_timeout: true`, then a separate native form/image submission. Both continued after WAITING and read completed output once.\n\n## Coverage and limitations\n\nAll six harnesses have returned actual Fungi results. Native form/image automatic return passed in Codex, Pi, Grok, Kimi and Claude's bounded headless mode. OpenCode v1 passed the explicitly resumed manual flow. Codex consumed the final portable image callback after the prior turn ended; one collection using the supplied argv/environment returned the submitted response and matching image. [Current report](../verification/runs/2026-10-20-no-setup.md)\n\nNo OpenCode callback/plugin adapter is required or implemented. A bounded shell route is not presented as an indefinite one. One user-controlled macOS sleep/wake cycle subsequently returned its native skill response through the exact-origin Codex callback, collected once. A separate two-hour native-helper run also completed through the same callback route without polling; its timing artifact matched the saved result. Arbitrary-duration and broader sleep/wake reliability remain unverified.\n\nThe [fourth interview](../planning.md#no-setup-delivery-decision-on-2026-10-20) settled the setup boundary: use built-in capabilities only, with explicit manual fallback on unsupported versions. Do not require an integration or harness upgrade. A short bounded command still does not qualify as an arbitrary human wait.\n\n## Verification history\n\n- [2026-10-20 skill proof](../verification/runs/2026-10-20-skill-proof.md) — native skill return after one macOS sleep/wake cycle and automatic return from a two-hour helper both passed.\n- [2026-10-20 first proof](../verification/runs/2026-10-20-first-proof.md) — versioned probes, failures, corrections and explicit limits.\n- [2026-10-20 no-setup compatibility](../verification/runs/2026-10-20-no-setup.md) — native form/image journeys, Kimi after sign-in, and OpenCode's manual fallback.\n","toc":[{"id":"entry-points-and-expected-outcomes","title":"Entry points and expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limitations","title":"Coverage and limitations","depth":2},{"id":"verification-history","title":"Verification history","depth":2}],"titleAnchor":"returning-to-an-agent","links":["planning","verification/runs/2026-10-20-no-setup","planning","verification/runs/2026-10-20-skill-proof","verification/runs/2026-10-20-first-proof","verification/runs/2026-10-20-no-setup"],"attachments":[],"html":"\u003cp>\u003cstrong>ID: FEAT-delivery\u003c/strong>\u003c/p>\n\u003cp>The \u003ca href=\"#/planning\">accepted requirement\u003c/a> is automatic response delivery without repeated model checks or AFK token expenditure. Fungi preserves results independently of the delivery route.\u003c/p>\n\u003ch2 id=\"entry-points-and-expected-outcomes\">Entry points and expected outcomes\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>--delivery auto\u003c/code>: bind an inherited exact \u003ccode>CODEX_THREAD_ID\u003c/code> when \u003ccode>codex queue\u003c/code> is supported; otherwise explicitly report manual delivery.\u003c/li>\n\u003cli>\u003ccode>--delivery wait\u003c/code>: keep one command pending through a process pipe, with no Fungi human deadline. The harness must retain that call or supply background completion.\u003c/li>\n\u003cli>\u003ccode>--delivery manual\u003c/code>: return an opened receipt; after the user says “done,” collect the exact session once.\u003c/li>\n\u003c/ul>\n\u003cp>The callback contains the executable, exact session and state-directory environment, not user response content. Delivery bookkeeping distinguishes \u003ccode>armed\u003c/code>, \u003ccode>attempting\u003c/code>, \u003ccode>accepted\u003c/code> and \u003ccode>unknown\u003c/code>. A notification failure never erases a committed result. An uncertain attempt is not automatically retried. Acceptance does not prove the originating agent consumed the notice.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tested harness\u003c/th>\n\u003cth>Invocation for a human interaction\u003c/th>\n\u003cth>Evidence and limits\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Codex 0.163.0\u003c/td>\n\u003ctd>\u003ccode>auto\u003c/code> with inherited exact thread and available queue command\u003c/td>\n\u003ctd>Helper, native-close and packaged form/image callbacks consumed; later native sleep/wake and two-hour helper callbacks also consumed once\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Claude Code 2.1.302\u003c/td>\n\u003ctd>\u003ccode>wait\u003c/code> through native background Bash in a suitable local interactive session\u003c/td>\n\u003ctd>Headless form/image and three-minute completion passed; headless/cloud execution is bounded, so use manual for an unrestricted human wait there\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OpenCode 1.18.34\u003c/td>\n\u003ctd>\u003ccode>manual\u003c/code>; end turn; collect once after “done”\u003c/td>\n\u003ctd>Native image flow passed; ordinary v1 Bash is bounded\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Grok 1.0.62\u003c/td>\n\u003ctd>\u003ccode>wait\u003c/code> through \u003ccode>run_terminal_command\u003c/code> with \u003ccode>block_until_ms: 0\u003c/code>; end turn\u003c/td>\n\u003ctd>Native form/image and three-minute completion passed; retrieve completed output once after notification\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kimi 2.2.0\u003c/td>\n\u003ctd>\u003ccode>wait\u003c/code> through background Bash with \u003ccode>disable_timeout: true\u003c/code>; end turn\u003c/td>\n\u003ctd>Native form/image and three-minute completion passed after user sign-in\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pi 1.3.0\u003c/td>\n\u003ctd>\u003ccode>wait\u003c/code> through one pending Bash call, timeout omitted\u003c/td>\n\u003ctd>Native form/image and three-minute completion passed\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>This is a versioned compatibility record, not a universal promise about another mode or future harness version. \u003ccode>auto\u003c/code> does not set another harness's tool arguments; skills choose the native route or the explicit fallback.\u003c/p>\n\u003ch2 id=\"verification-recipe\">Verification recipe\u003c/h2>\n\u003cp>Use a disposable conversation and the native helper, with an isolated state directory. \u003ccode>helper wait 180\u003c/code> stays silent for three minutes before returning a real Fungi artifact/result. Allow only the fixture command; do not change persistent harness settings.\u003c/p>\n\u003cp>For Claude, use native background Bash, end the turn, and observe the completion event followed by result consumption. For Grok, use \u003ccode>block_until_ms: 0\u003c/code>, end the turn, and retrieve completed output once after notification. For Pi, omit the Bash timeout and retain one call. Record actual arguments: in the completed Claude test the model supplied a 600,000 ms timeout, so that test does not establish arbitrary AFK duration.\u003c/p>\n\u003cp>For Codex and OpenCode, ten-second pending-call probes returned real Fungi results. Codex requires permission to write the session directory. Canonicalize macOS \u003ccode>/var\u003c/code> paths before using them as an OpenCode working directory. These short tests do not prove an ended-turn callback.\u003c/p>\n\u003cp>For the Codex callback, launch from the intended live conversation, end the turn, submit the UI, and verify that the exact conversation consumes its notice. Check \u003ccode>delivery.json\u003c/code> separately. After the implementation turn ended, the queued notice for native-helper session \u003ccode>a4e20e6a9ce120f2ccf7461a5ae22b0a\u003c/code> reached the originating conversation. One collection returned its submitted data and artifact. This verifies callback consumption for that fixture, including a notice queued while the original turn was still active. Its older notice omitted the custom state directory, which was recovered from the known launch context.\u003c/p>\n\u003cp>The corrected notice for native-form session \u003ccode>f2b35d71fb650809ac354bdd593df8fd\u003c/code> subsequently reached the same originating conversation with its full executable, argument array and state-directory environment. One collection using those supplied values returned \u003ccode>closed\u003c/code> without answer data or artifacts. Both callback formats have now been consumed; the second verifies the corrected self-contained collection instructions.\u003c/p>\n\u003cp>The initial Kimi probe stopped before tool execution because its selected provider had no credential. After the user completed sign-in, Kimi 2.2.0 passed a three-minute background wait with \u003ccode>disable_timeout: true\u003c/code>, then a separate native form/image submission. Both continued after WAITING and read completed output once.\u003c/p>\n\u003ch2 id=\"coverage-and-limitations\">Coverage and limitations\u003c/h2>\n\u003cp>All six harnesses have returned actual Fungi results. Native form/image automatic return passed in Codex, Pi, Grok, Kimi and Claude's bounded headless mode. OpenCode v1 passed the explicitly resumed manual flow. Codex consumed the final portable image callback after the prior turn ended; one collection using the supplied argv/environment returned the submitted response and matching image. \u003ca href=\"#/verification/runs/2026-10-20-no-setup\">Current report\u003c/a>\u003c/p>\n\u003cp>No OpenCode callback/plugin adapter is required or implemented. A bounded shell route is not presented as an indefinite one. One user-controlled macOS sleep/wake cycle subsequently returned its native skill response through the exact-origin Codex callback, collected once. A separate two-hour native-helper run also completed through the same callback route without polling; its timing artifact matched the saved result. Arbitrary-duration and broader sleep/wake reliability remain unverified.\u003c/p>\n\u003cp>The \u003ca href=\"#/planning~no-setup-delivery-decision-on-2026-10-20\">fourth interview\u003c/a> settled the setup boundary: use built-in capabilities only, with explicit manual fallback on unsupported versions. Do not require an integration or harness upgrade. A short bounded command still does not qualify as an arbitrary human wait.\u003c/p>\n\u003ch2 id=\"verification-history\">Verification history\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-20-skill-proof\">2026-10-20 skill proof\u003c/a> — native skill return after one macOS sleep/wake cycle and automatic return from a two-hour helper both passed.\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-20-first-proof\">2026-10-20 first proof\u003c/a> — versioned probes, failures, corrections and explicit limits.\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-20-no-setup\">2026-10-20 no-setup compatibility\u003c/a> — native form/image journeys, Kimi after sign-in, and OpenCode's manual fallback.\u003c/li>\n\u003c/ul>\n","backlinks":["features/index","verification/runs/2026-10-20-first-proof","verification/runs/2026-10-20-no-setup","verification/runs/2026-10-20-skill-proof"]},{"id":"features/index","title":"Feature map","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-22\u003c/span>","updated":"2026-10-22","summary":"","source":"---\ntitle: Feature map\nupdated: 2026-10-22\n---\n# Feature map\n\nThe Go session engine and Electron renderer provide a development foundation\nfor skill-owned interfaces. Expected behavior follows the [accepted scope](../planning.md#accepted-first-milestone-scope);\ncoverage follows the [verified environments](../platforms.md) and dated\nreports, not the presence of a compiled package.\n\n- [Sessions, results and recovery](sessions.md) — FEAT-sessions\n- [HTML and flat JSON interfaces](interfaces.md) — FEAT-interfaces\n- [Returning to an agent](delivery.md) — FEAT-delivery\n- [Installation and updates](installation.md) — FEAT-installation\n\n[Verification setup](../verification/setup.md) · [First proof report](../verification/runs/2026-10-20-first-proof.md)\n","toc":[],"titleAnchor":"feature-map","links":["planning","platforms","features/sessions","features/interfaces","features/delivery","features/installation","verification/setup","verification/runs/2026-10-20-first-proof"],"attachments":[],"html":"\u003cp>The Go session engine and Electron renderer provide a development foundation\nfor skill-owned interfaces. Expected behavior follows the \u003ca href=\"#/planning~accepted-first-milestone-scope\">accepted scope\u003c/a>;\ncoverage follows the \u003ca href=\"#/platforms\">verified environments\u003c/a> and dated\nreports, not the presence of a compiled package.\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/features/sessions\">Sessions, results and recovery\u003c/a> — FEAT-sessions\u003c/li>\n\u003cli>\u003ca href=\"#/features/interfaces\">HTML and flat JSON interfaces\u003c/a> — FEAT-interfaces\u003c/li>\n\u003cli>\u003ca href=\"#/features/delivery\">Returning to an agent\u003c/a> — FEAT-delivery\u003c/li>\n\u003cli>\u003ca href=\"#/features/installation\">Installation and updates\u003c/a> — FEAT-installation\u003c/li>\n\u003c/ul>\n\u003cp>\u003ca href=\"#/verification/setup\">Verification setup\u003c/a> · \u003ca href=\"#/verification/runs/2026-10-20-first-proof\">First proof report\u003c/a>\u003c/p>\n","backlinks":["index","planning"]},{"id":"features/installation","title":"Installation and updates","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-23\u003c/span>","updated":"2026-10-23","summary":"","source":"---\ntitle: Installation and updates\nupdated: 2026-10-23\n---\n# Installation and updates\n\n**ID: FEAT-installation**\n\nImplement the user's [command installation and update requirement](../planning.md#command-installation-and-updates-on-2026-10-23)\nwith one prebuilt package per OS/CPU and shared Go update logic. This is a\ndevelopment implementation; published releases, signing and clean consumer\nmachine acceptance remain separate work. Skills use the same four page methods.\n\n## Entry points\n\n`fungi --version` reports JSON build identity. `fungi describe installation`\ndescribes these commands:\n\n| Command | Behavior |\n| --- | --- |\n| `fungi install --archive FILE --sha256 HASH [--dir DIRECTORY]` | Install a verified local package; default directory is `~/.fungi` |\n| `fungi update` | Fetch the matching archive/checksum from the latest GitHub release |\n| `fungi update --version vX.Y.Z` | Select a specific published release |\n| `fungi update --archive FILE --sha256 HASH` | Apply an explicitly supplied local release |\n| `fungi rollback` | Switch to the previous retained release without downloading |\n| `fungi prune` | Remove obsolete versions not required for rollback or sessions |\n\nUpdates, rollback and pruning operate on managed installations. Unpacked\nportable folders remain usable directly; they are not silently adopted.\nSuccessful mutations emit one JSON `installation` result with the stable\ncommand, current/previous versions, removed versions, cleanup warnings and\n`reusedRuntimeBytes` (the bytes shared with an existing renderer).\nErrors use the existing JSON error envelope and nonzero exit status.\n\nThe repository's `scripts/install.sh` and `scripts/install.ps1` download and\nverify one archive, extract it privately and invoke the Go installer. POSIX\nrequires a shell, curl or wget, tar and shasum or sha256sum. Windows uses\nPowerShell's download, ZIP and hashing commands. Neither requires Go, Node,\nnpm or Homebrew. Windows adds the user PATH entry unless `-NoPath` is given;\nPOSIX prints the directory to add, without editing shell startup files.\n\n`FUNGI_INSTALL_DIR` selects a bootstrap destination. The bootstrap-only\n`FUNGI_RELEASE_BASE_URL` permits an explicit mirror/test server; it does not\nchange the installed updater's GitHub source. There is no public installer\nURL or published release claim yet. Ordinary `fungi update` needs release\nassets to exist at `rengwu/fungi`.\n\n## Expected behavior\n\nThe installation contains a small stable `bin/fungi` entry point and immutable\n`versions/vX.Y.Z` directories. The entry point delegates through a committed\n`installation.json` selector; it is not replaced while Windows is executing\nit. The installation layout is versioned separately from session protocol 1.\n\nStage a complete package, verify its archive and executable hashes, validate\nOS/CPU/runtime metadata, and execute its version probe before switching the\nselector. Checksums come from the same HTTPS release source; they are not a\nseparate cryptographic publisher signature. An invalid download/package or\nfailed preactivation probe leaves the selected installation unchanged.\nInterrupted staging is disposable and an interrupted first install can retry.\nVersion names cannot be reused with different archive bytes.\n\nWhen the selected and incoming packages use the same Electron version, compare\nthe runtime's regular files by permissions, size and SHA-256. Identical files\ncan share filesystem hard links; unsupported links fall back to the verified\ncopies. Framework symlinks remain unchanged. Package files must stay immutable:\nediting a shared file in place would affect each version using it. Removing an\nold package removes its links without invalidating the retained version.\nThis reduces retained update storage, not the first download, update traffic\nor staging space. No separate runtime cache or skill-author API is introduced.\n\nAn update lock serializes mutations. Short activation locks coordinate version\nselection and cleanup; downloads do not hold this lock. Each running process\nholds an OS file lease on its version. There is no daemon or PID polling.\n\nManaged session receipts/callbacks use the stable command. Package-owned source\nand helper paths are retained for draft reopening, including sessions in\nalternate state directories. Keep the current version, previous version,\nversions in use and referenced packages. A closed/cancelled/interrupted session\ncan still need old assets. A submitted session cannot reopen and its bytes live\nin session storage. Cleanup inspection failures retain the affected version\nand produce warnings. Removing an obsolete package never removes external\nsession storage. Session storage inside the managed installation is rejected.\n\nLegacy portable receipts still reference their original executable; this\ninstaller does not migrate or delete existing `dist/` builds. It also does not\nsnapshot skill directories outside its installation: skill authors must keep\nthose assets available as before. Retaining a recoverable session may retain an\nolder package indefinitely. The stable launcher itself is not self-replaced;\na future incompatible launcher/layout change needs an explicit migration.\n\n## Build and verification recipe\n\nFrom a development checkout with the pinned runtime already downloaded:\n\n```sh\nnode scripts/package.mjs --release v0.1.0-test.1\nnode scripts/package.mjs --release v0.1.0-test.2\n```\n\nEach creates `dist/release-VERSION/fungi-OS-ARCH`, a `.tar.gz` (Unix) or `.zip`\n(Windows) archive and a `.sha256` sidecar. `RELEASE.json` identifies the version,\nOS/CPU, Electron version and CLI hash. Archive names use Go OS/CPU names, such\nas `darwin-arm64`, `windows-amd64` and `linux-amd64`. No release is published.\nThe build keeps Electron intact, strips Go debug information, uses standard\nmaximum standard-library archive compression and omits full wiki/evidence, skill bundles and compiled\ndemo helpers. Small HTML examples and upstream license notices remain.\n\nRun `go test -race -v ./...` on Unix (`go test -v ./...` on Windows) and\n`node scripts/install-smoke.mjs ARCHIVE_A ARCHIVE_B`. The latter uses a local\nHTTP fixture for the actual bootstrap, updates from the second local archive,\nkeeps one real Electron session open through activation, checks its PNG hash,\nverifies identical runtimes share files and rolls back. Its installed CLI\nchildren have an empty PATH. Windows uses\n`-NoPath` to avoid persistent test changes. `--core-only` deliberately omits UI\non the unsupported Ubuntu 24.04 baseline. A finite automated fixture gate is\nnot a human-facing polling mechanism.\n\nAlso run the existing renderer smoke driver against the stable installed\ncommand. Preserve the generated evidence before removing test-owned builds.\nNo test may delete older user/session-referenced `dist/` packages.\n\n## Coverage and limits\n\nThe [distribution run](../verification/runs/2026-10-23-distribution.md) records\nactual results and build identities. Clean-machine security prompts, public\nrelease downloads, signing/notarization, installer PATH behavior in fresh\ninteractive shells, power loss and future protocol/launcher migrations are not\ninferred from a local or hosted success. Full Fungi-native jstack integration\nremains deferred.\n\n## Verification history\n\n- [2026-10-23 distribution proof](../verification/runs/2026-10-23-distribution.md)\n","toc":[{"id":"entry-points","title":"Entry points","depth":2},{"id":"expected-behavior","title":"Expected behavior","depth":2},{"id":"build-and-verification-recipe","title":"Build and verification recipe","depth":2},{"id":"coverage-and-limits","title":"Coverage and limits","depth":2},{"id":"verification-history","title":"Verification history","depth":2}],"titleAnchor":"installation-and-updates","links":["planning","verification/runs/2026-10-23-distribution","verification/runs/2026-10-23-distribution"],"attachments":[],"html":"\u003cp>\u003cstrong>ID: FEAT-installation\u003c/strong>\u003c/p>\n\u003cp>Implement the user's \u003ca href=\"#/planning~command-installation-and-updates-on-2026-10-23\">command installation and update requirement\u003c/a>\nwith one prebuilt package per OS/CPU and shared Go update logic. Th ng renderer).\nErrors use the existing JSON error envelope and nonzero exit status.\u003c/p>\n\u003cp>The repository's \u003ccode>scripts/install.sh\u003c/code> and \u003ccode>scripts/install.ps1\u003c/code> download and\nverify one archive, extract it privately and invoke the Go installer. POSIX\nrequires a shell, curl or wget, tar and shasum or sha256sum. Windows uses\nPowerShell's download, ZIP and hashing commands. Neither requires Go, Node,\nnpm or Homebrew. Windows adds the user PATH entry unless \u003ccode>-NoPath\u003c/code> is given;\nPOSIX prints the directory to add, without editing shell startup files.\u003c/p>\n\u003cp>\u003ccode>FUNGI_INSTALL_DIR\u003c/code> selects a bootstrap destination. The bootstrap-only\n\u003ccode>FUNGI_RELEASE_BASE_URL\u003c/code> permits an explicit mirror/test server; it does not\nchange the installed updater's GitHub source. There is no public installer\nURL or published release claim yet. Ordinary \u003ccode>fungi update\u003c/code> needs release\nassets to exist at \u003ccode>rengwu/fungi\u003c/code>.\u003c/p>\n\u003ch2 id=\"expected-behavior\">Expected behavior\u003c/h2>\n\u003cp>The installation contains a small stable \u003ccode>bin/fungi\u003c/code> entry point and immutable\n\u003ccode>versions/vX.Y.Z\u003c/code> directories. The entry point delegates through a committed\n\u003ccode>installation.json\u003c/code> selector; it is not replaced while Windows is executing\nit. The installation layout is versioned separately from session protocol 1.\u003c/p>\n\u003cp>Stage a complete package, verify its archive and executable hashes, validate\nOS/CPU/runtime metadata, and execute its version probe before switching the\nselector. Checksums come from the same HTTPS release source; they are not a\nseparate cryptographic publisher signature. An invalid download/package or\nfailed preactivation probe leaves the selected installation unchanged.\nInterrupted staging is disposable and an interrupted first install can retry.\nVersion names cannot be reused with different archive bytes.\u003c/p>\n\u003cp>When the selected and incoming packages use the same Electron version, compare\nthe runtime's regular files by permissions, size and SHA-256. Identical files\ncan share filesystem hard links; unsupported links fall back to the verified\ncopies. Framework symlinks remain unchanged. Package files must stay immutable:\nediting a shared file in place would affect each version using it. Removing an\nold package removes its links without invalidating the retained version.\nThis reduces retained update storage, not the first download, update traffic\nor staging space. No separate runtime cache or skill-author API is introduced.\u003c/p>\n\u003cp>An update lock serializes mutations. Short activation locks coordinate version\nselection and cleanup; downloads do not hold this lock. Each running process\nholds an OS file lease on its version. There is no daemon or PID polling.\u003c/p>\n\u003cp>Managed session receipts/callbacks use the stable command. Package-owned source\nand helper paths are retained for draft reopening, including sessions in\nalternate state directories. Keep the current version, previous version,\nversions in use and referenced packages. A closed/cancelled/interrupted session\ncan still need old assets. A submitted session cannot reopen and its bytes live\nin session storage. Cleanup inspection failures retain the affected version\nand produce warnings. Removing an obsolete package never removes external\nsession storage. Session storage inside the managed installation is rejected.\u003c/p>\n\u003cp>Legacy portable receipts still reference their original executable; this\ninstaller does not migrate or delete existing \u003ccode>dist/\u003c/code> builds. It also does not\nsnapshot skill directories outside its installation: skill authors must keep\nthose assets available as before. Retaining a recoverable session may retain an\nolder package indefinitely. The stable launcher itself is not self-replaced;\na future incompatible launcher/layout change needs an explicit migration.\u003c/p>\n\u003ch2 id=\"build-and-verification-recipe\">Build and verification recipe\u003c/h2>\n\u003cp>From a development checkout with the pinned runtime already downloaded:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">node scripts/package.mjs --release v0.1.0-test.1\nnode scripts/package.mjs --release v0.1.0-test.2\n\u003c/code>\u003c/pre>\n\u003cp>Each creates \u003ccode>dist/release-VERSION/fungi-OS-ARCH\u003c/code>, a \u003ccode>.tar.gz\u003c/code> (Unix) or \u003ccode>.zip\u003c/code>\n(Windows) archive and a \u003ccode>.sha256\u003c/code> sidecar. \u003ccode>RELEASE.json\u003c/code> identifies the version,\nOS/CPU, Electron version and CLI hash. Archive names use Go OS/CPU names, such\nas \u003ccode>darwin-arm64\u003c/code>, \u003ccode>windows-amd64\u003c/code> and \u003ccode>linux-amd64\u003c/code>. No release is published.\nThe build keeps Electron intact, strips Go debug information, uses standard\nmaximum standard-library archive compression and omits full wiki/evidence, skill bundles and compiled\ndemo helpers. Small HTML examples and upstream license notices remain.\u003c/p>\n\u003cp>Run \u003ccode>go test -race -v ./...\u003c/code> on Unix (\u003ccode>go test -v ./...\u003c/code> on Windows) and\n\u003ccode>node scripts/install-smoke.mjs ARCHIVE_A ARCHIVE_B\u003c/code>. The latter uses a local\nHTTP fixture for the actual bootstrap, updates from the second local archive,\nkeeps one real Electron session open through activation, checks its PNG hash,\nverifies identical runtimes share files and rolls back. Its installed CLI\nchildren have an empty PATH. Windows uses\n\u003ccode>-NoPath\u003c/code> to avoid persistent test changes. \u003ccode>--core-only\u003c/code> deliberately omits UI\non the unsupported Ubuntu 24.04 baseline. A finite automated fixture gate is\nnot a human-facing polling mechanism.\u003c/p>\n\u003cp>Also run the existing renderer smoke driver against the stable installed\ncommand. Preserve the generated evidence before removing test-owned builds.\nNo test may delete older user/session-referenced \u003ccode>dist/\u003c/code> packages.\u003c/p>\n\u003ch2 id=\"coverage-and-limits\">Coverage and limits\u003c/h2>\n\u003cp>The \u003ca href=\"#/verification/runs/2026-10-23-distribution\">distribution run\u003c/a> records\nactual results and build identities. Clean-machine security prompts, public\nrelease downloads, signing/notarization, installer PATH behavior in fresh\ninteractive shells, power loss and future protocol/launcher migrations are not\ninferred from a local or hosted success. Full Fungi-native jstack integration\nremains deferred.\u003c/p>\n\u003ch2 id=\"verification-history\">Verification history\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-23-distribution\">2026-10-23 distribution proof\u003c/a>\u003c/li>\n\u003c/ul>\n","backlinks":["index","planning","platforms","features/index","verification/runs/2026-10-23-distribution","verification/setup"]},{"id":"features/interfaces","title":"HTML and flat JSON interfaces","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-23\u003c/span>","updated":"2026-10-23","summary":"","source":"---\ntitle: HTML and flat JSON interfaces\nupdated: 2026-10-23\n---\n# HTML and flat JSON interfaces\n\n**ID: FEAT-interfaces**\n\nSkills can bring a local HTML directory or a small JSON form. The shared page bridge returns to [the session engine](sessions.md). This is the [accepted primitive UI scope](../planning.md#accepted-first-milestone-scope), not the future component architecture.\n\n## Entry points and expected behavior\n\n`fungi open examples/review.html` shows a local animation preview, slider, notes and an optional image file. `fungi open examples/feedback.json` renders flat text, textarea, range and image fields. `fungi describe html` and `fungi describe form` expose the actual API and examples.\n\nThe portable package also includes `skills/grill-form/`. Run `fungi open skills/grill-form/assets/form.html --input skills/grill-form/example.json` for a complete skill-owned questionnaire. It accepts the older jstack question schema, renders Markdown and Mermaid offline, saves plain notes and one optional image, and returns readable question/choice labels in `data.answers`. This does not extend the engine's built-in JSON form schema. [Migration decision](../planning.md#skill-authoring-and-longer-waits)\n\nThe bridge is `ready`, `saveDraft`, `submit` and `cancel`. Draft saving optionally takes attachments, so image bytes survive explicit reopen. HTML authors need no build system or registration manifest. The JSON schema remains experimental.\n\nMutating calls preserve invocation order before Blob conversion begins. A failed save rejects that call without preventing later submission. The [authoring guide](../authoring.md) describes the complete replacement semantics, delivery procedure and limits. `examples/compare/index.html` demonstrates a custom comparison canvas and PNG result through the same API.\n\nThe local renderer supports ES modules, custom elements, Canvas/SVG/WebGL, local and Blob workers, WebAssembly and streamed local audio/video with single byte-range seeking. Skills provide their libraries; no component catalog or framework is installed in the engine. The asset handler confines real paths to the source root, rejects directories/unsupported methods and escapes, and streams bytes instead of buffering entire media files.\n\nThe Electron page has context isolation and sandboxing. Local assets are confined beneath the source directory; remote requests, navigation and OS permission requests are denied. Inline `srcdoc` frames support skill-owned previews, while frame document requests remain blocked. Skills provide their preview sandbox; the bridge accepts only the main frame. Native helpers remain trusted executables with ordinary OS access. Reference image fields have a file picker and an explicit editable paste target.\n\nSubmission closes the window after acknowledgement. Persistence failure retains the input and permits retry. Manual delivery is stated in the form. Window close saves a `closed` result; it preserves acknowledged drafts. A custom page must opt into saving its state.\n\n## Verification recipe\n\nFollow [setup](../verification/setup.md). Launch a new isolated form:\n\n1. Enter text, move the slider and select the generated `verification-output/reference.png`.\n2. Observe “Draft saved” and inspect `draft.json` plus the saved artifact hash.\n3. Close the native window. Collect once: expect `closed`, without answer data.\n4. Reopen that exact session. Expect a new session, restored values and the image preview.\n5. Submit. Compare the returned artifact's SHA-256 to the fixture; collect again and compare envelopes.\n\nFor the HTML failure path, save notes, then make only that disposable session directory non-writable. Submit: expect an error and retained input, with no `result.json`. Restore its permissions and retry; expect submission. Never change permissions outside the test-created directory.\n\nFor paste, copy image pixels into the OS clipboard, focus the visible paste target and paste. Expect a preview, a saved draft and a returned image artifact. This passed using a separate, one-image form that kept the paste target within the viewport. Plain text produced a useful error; pasting pixels from Preview produced a 401-byte PNG, a saved draft and a submitted artifact whose recorded hash matched its bytes. Clipboard re-encoding means it need not match the original file's hash.\n\nFor renderer recovery, save a distinctive draft in a disposable session, terminate only that session's page-renderer process, and collect its failed result. Reopen the exact session: expect a new linked session with the saved value. Closing that restored window must leave the original failed result unchanged.\n\n## Coverage and limitations\n\nThe [platform record](../platforms.md) defines the accepted no-install\nbaseline. A renderer that exits before readiness produces a saved\n`renderer_startup_failed` result with its diagnostic log location. This does\nnot infer a cause or retry with a different security policy.\n\nFile selection, image paste, image draft recovery, submission, cancellation, local HTML controls and actual write-failure recovery were observed through the native UI. Killing the isolated page renderer produced `failed` with `renderer_crashed`; explicit reopen restored `DRAFT-CRASH-RECOVER`, and closing that new window produced `closed`. The app uses a minimal native menu without development reload. The comparison example exports a custom canvas; a drawing editor, screenshot capture, nested JSON components and external live updates remain deferred. Feature-detect GPU and codec capabilities; hosted rendering results vary by platform.\n\n## Verification history\n\n- [2026-10-22/23 Windows desktop handoff](../verification/runs/windows-2026-10-22-203907.md) — agent-operated native input, visible draft restoration and comparison PNG/hash passed with an empty child PATH; the full renderer fixture remained unexecuted because symlink creation lacked privilege. Aggregate Untested.\n\n- [2026-10-22 verified baselines](../verification/runs/2026-10-22-baselines.md) — unchanged authoring API, explicit WebGL availability and diagnosable unsupported startup.\n\n- [2026-10-22 hosted checks](../verification/runs/2026-10-22-hosted.md) — real Electron execution, Windows pipe repair and Linux sandbox/graphics limits.\n\n- [2026-10-22 platform verification](../verification/runs/2026-10-22-platform.md) — call ordering, rendering primitives, saved/exported images, rich-form retry and a separate comparison example.\n\n- [2026-10-20 rich jstack demo](../verification/runs/2026-10-20-rich-grill.md) — inline previews, native draft checks and a completed user questionnaire with region feedback and exact-origin return.\n\n- [2026-10-20 skill proof](../verification/runs/2026-10-20-skill-proof.md) — historical grill-form port, native draft/image recovery, owner loss, retry and cancellation.\n- [2026-10-20 first proof](../verification/runs/2026-10-20-first-proof.md) — includes asset-loader and clipboard-fixture corrections, native artifact submission, and crash recovery.\n- [2026-10-20 no-setup compatibility](../verification/runs/2026-10-20-no-setup.md) — native form/image submission and originating-harness consumption.\n","toc":[{"id":"entry-points-and-expected-behavior","title":"Entry points and expected behavior","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limitations","title":"Coverage and limitations","depth":2},{"id":"verification-history","title":"Verification history","depth":2}],"titleAnchor":"html-and-flat-json-interfaces","links":["features/sessions","planning","planning","authoring","verification/setup","platforms","verification/runs/windows-2026-10-22-203907","verification/runs/2026-10-22-baselines","verification/runs/2026-10-22-hosted","verification/runs/2026-10-22-platform","verification/runs/2026-10-20-rich-grill","verification/runs/2026-10-20-skill-proof","verification/runs/2026-10-20-first-proof","verification/runs/2026-10-20-no-setup"],"attachments":[],"html":"\u003cp>\u003cstrong>ID: FEAT-interfaces\u003c/strong>\u003c/p>\n\u003cp>Skills can bring a local HTML directory or a small JSON form. The shared page bridge returns to \u003ca href=\"#/features/sessions\">the session engine\u003c/a>. This is the \u003ca href=\"#/planning~accepted-first-milestone-scope\">accepted primitive UI scope\u003c/a>, not the future component architecture.\u003c/p>\n\u003ch2 id=\"entry-points-and-expected-behavior\">Entry points and expected behavior\u003c/h2>\n\u003cp>\u003ccode>fungi open examples/review.html\u003c/code> shows a local animation preview, slider, notes and an optional image file. capes, and streams bytes instead of buffering entire media files.\u003c/p>\n\u003cp>The Electron page has context isolation and sandboxing. Local assets are confined beneath the source directory; remote requests, navigation and OS permission requests are denied. Inline \u003ccode>srcdoc\u003c/code> frames support skill-owned previews, while frame document requests remain blocked. Skills provide their preview sandbox; the bridge accepts only the main frame. Native helpers remain trusted executables with ordinary OS access. Reference image fields have a file picker and an explicit editable paste target.\u003c/p>\n\u003cp>Submission closes the window after acknowledgement. Persistence failure retains the input and permits retry. Manual delivery is stated in the form. Window close saves a \u003ccode>closed\u003c/code> result; it preserves acknowledged drafts. A custom page must opt into saving its state.\u003c/p>\n\u003ch2 id=\"verification-recipe\">Verification recipe\u003c/h2>\n\u003cp>Follow \u003ca href=\"#/verification/setup\">setup\u003c/a>. Launch a new isolated form:\u003c/p>\n\u003col>\n\u003cli>Enter text, move the slider and select the generated \u003ccode>verification-output/reference.png\u003c/code>.\u003c/li>\n\u003cli>Observe “Draft saved” and inspect \u003ccode>draft.json\u003c/code> plus the saved artifact hash.\u003c/li>\n\u003cli>Close the native window. Collect once: expect \u003ccode>closed\u003c/code>, without answer data.\u003c/li>\n\u003cli>Reopen that exact session. Expect a new session, restored values and the image preview.\u003c/li>\n\u003cli>Submit. Compare the returned artifact's SHA-256 to the fixture; collect again and compare envelopes.\u003c/li>\n\u003c/ol>\n\u003cp>For the HTML failure path, save notes, then make only that disposable session directory non-writable. Submit: expect an error and retained input, with no \u003ccode>result.json\u003c/code>. Restore its permissions and retry; expect submission. Never change permissions outside the test-created directory.\u003c/p>\n\u003cp>For paste, copy image pixels into the OS clipboard, focus the visible paste target and paste. Expect a preview, a saved draft and a returned image artifact. This passed using a separate, one-image form that kept the paste target within the viewport. Plain text produced a useful error; pasting pixels from Preview produced a 401-byte PNG, a saved draft and a submitted artifact whose recorded hash matched its bytes. Clipboard re-encoding means it need not match the original file's hash.\u003c/p>\n\u003cp>For renderer recovery, save a distinctive draft in a disposable session, terminate only that session's page-renderer process, and collect its failed result. Reopen the exact session: expect a new linked session with the saved value. Closing that restored window must leave the original failed result unchanged.\u003c/p>\n\u003ch2 id=\"coverage-and-limitations\">Coverage and limitations\u003c/h2>\n\u003cp>The \u003ca href=\"#/platforms\">platform record\u003c/a> defines the accepted no-install\nbaseline. A renderer that exits before readiness produces a saved\n\u003ccode>renderer_startup_failed\u003c/code> result with its diagnostic log location. This does\nnot infer a cause or retry with a different security policy.\u003c/p>\n\u003cp>File selection, image paste, image draft recovery, submission, cancellation, local HTML controls and actual write-failure recovery were observed through the native UI. Killing the isolated page renderer produced \u003ccode>failed\u003c/code> with \u003ccode>renderer_crashed\u003c/code>; explicit reopen restored \u003ccode>DRAFT-CRASH-RECOVER\u003c/code>, and closing that new window produced \u003ccode>closed\u003c/code>. The app uses a minimal native menu without development reload. The comparison example exports a custom canvas; a drawing editor, screenshot capture, nested JSON components and external live updates remain deferred. Feature-detect GPU and codec capabilities; hosted rendering results vary by platform.\u003c/p>\n\u003ch2 id=\"verification-history\">Verification history\u003c/h2>\n\u003cul>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/windows-2026-10-22-203907\">2026-10-22/23 Windows desktop handoff\u003c/a> — agent-operated native input, visible draft restoration and comparison PNG/hash passed with an empty child PATH; the full renderer fixture remained unexecuted because symlink creation lacked privilege. Aggregate Untested.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-22-baselines\">2026-10-22 verified baselines\u003c/a> — unchanged authoring API, explicit WebGL availability and diagnosable unsupported startup.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-22-hosted\">2026-10-22 hosted checks\u003c/a> — real Electron execution, Windows pipe repair and Linux sandbox/graphics limits.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-22-platform\">2026-10-22 platform verification\u003c/a> — call ordering, rendering primitives, saved/exported images, rich-form retry and a separate comparison example.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-20-rich-grill\">2026-10-20 rich jstack demo\u003c/a> — inline previews, native draft checks and a completed user questionnaire with region feedback and exact-origin return.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-20-skill-proof\">2026-10-20 skill proof\u003c/a> — historical grill-form port, native draft/image recovery, owner loss, retry and cancellation.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-20-first-proof\">2026-10-20 first proof\u003c/a> — includes asset-loader and clipboard-fixture corrections, native artifact submission, and crash recovery.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-20-no-setup\">2026-10-20 no-setup compatibility\u003c/a> — native form/image submission and originating-harness consumption.\u003c/p>\n\u003c/li>\n\u003c/ul>\n","backlinks":["features/index","verification/runs/2026-10-20-first-proof","verification/runs/2026-10-20-no-setup","verification/runs/2026-10-20-rich-grill","verification/runs/2026-10-20-skill-proof","verification/runs/2026-10-22-baselines","verification/runs/2026-10-22-hosted","verification/runs/2026-10-22-platform","verification/runs/windows-2026-10-22-203907"]},{"id":"features/sessions","title":"Sessions, results and recovery","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-23\u003c/span>","updated":"2026-10-23","summary":"","source":"---\ntitle: Sessions, results and recovery\nupdated: 2026-10-23\n---\n# Sessions, results and recovery\n\n**ID: FEAT-sessions**\n\nFungi owns one interaction and one immutable terminal result per session. This implements the [session contract](../contract.md#result-and-lifecycle) for the accepted first milestone.\n\n## Entry points\n\nUse `open`, `collect` and `reopen` in the Go CLI. An executable helper uses `open --exec HELPER --delivery wait -- ARGS`. See [setup](../verification/setup.md) for builds, isolation and fixtures. No AI account is needed for core checks.\n\n## Expected outcomes\n\n- Submission persists data and artifact bytes before acknowledgement.\n- Close, cancellation and failure remain distinct from a submitted response.\n- Repeated identical submission returns the saved result; conflicting terminal events cannot replace it.\n- Collect is repeatable and non-destructive. A held OS lock identifies a live owner; a saved launch without an owner/result is interrupted.\n- Losing the waiting CLI does not cancel the owner. The worker uses a detached process, ordinary pipes and an OS file lock; there is no local HTTP server.\n- Reopen creates a new linked session and restores the latest acknowledged JSON/image draft.\n- Native helper output is drained before interpreting exit. The helper need not depend on Electron.\n- Malformed output or a closed stdout ends the helper protocol and terminates the helper, even if its process would otherwise keep running. Persisted JSON is bounded including its final newline, so acknowledged boundary-sized records remain readable.\n\n## Verification recipe\n\nRun `go test -race -v . ./examples/helper` from the repository. The tests build real CLI/helper executables in a temporary directory. They exercise concurrent sessions, lost waiting clients, helper exit, repeated collection, duplicate submissions, file confinement, saved image drafts, interrupted recovery and failed publication.\n\nFor a visible result:\n\n```sh\ngo build -o verification-output/helper ./examples/helper\nFUNGI_STATE_DIR=\"$PWD/verification-output/sessions\" ./fungi open --exec \"$PWD/verification-output/helper\" --delivery wait\n```\n\nRead the returned artifact path. Run `collect` with the exact returned session and the same state directory; it must return the same envelope. Keep the result/draft directories until evidence is saved. Never use repeated collection to wait for human input.\n\n## Coverage and limitations\n\nThe macOS and Linux arm64 race-enabled suites passed. Hosted core execution also passed on Windows and Linux x64; the follow-up report records target-specific failures and repairs. Failure injection covers publication before acknowledgement; the UI separately exercised an actual filesystem permission error. One user-controlled macOS sleep/wake cycle preserved the note and image, accepted a new edit and returned the result. These tests do not establish power-loss or storage-hardware durability. Windows skips directory flushing after flushing and renaming each file; no directory-entry durability across power loss is promised.\n\n## Verification history\n\n- [2026-10-23 installation/update proof](../verification/runs/2026-10-23-distribution.md) — stable receipts, active sessions, package-owned draft assets and artifact preservation through version switches.\n\n- [2026-10-22/23 Windows desktop handoff](../verification/runs/windows-2026-10-22-203907.md) — native draft/close/reopen/submission/cancellation passed on Windows 11 x64; 17 core tests passed, one confinement fixture could not create its symlink. Aggregate Untested.\n\n- [2026-10-22 verified baselines](../verification/runs/2026-10-22-baselines.md) — saved renderer startup failure and identical collection, plus 18 core tests on four hosted targets.\n\n- [2026-10-22 hosted checks](../verification/runs/2026-10-22-hosted.md) — Windows/Linux/macOS core execution and target-specific renderer findings.\n\n- [2026-10-22 platform verification](../verification/runs/2026-10-22-platform.md) — malformed/closed helper output and exact JSON-limit regressions, plus the macOS core race suite.\n\n- [2026-10-20 skill proof](../verification/runs/2026-10-20-skill-proof.md) — real skill recovery, Linux arm64 core execution, one macOS sleep/wake cycle and a completed two-hour helper/owner/callback run.\n- [2026-10-20 no-setup compatibility](../verification/runs/2026-10-20-no-setup.md) — self-contained collection receipts and real native artifact sessions.\n\n- [2026-10-20 first proof](../verification/runs/2026-10-20-first-proof.md) — core checks and coverage gaps.\n","toc":[{"id":"entry-points","title":"Entry points","depth":2},{"id":"expected-outcomes","title":"Expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limitations","title":"Coverage and limitations","depth":2},{"id":"verification-history","title":"Verification history","depth":2}],"titleAnchor":"sessions-results-and-recovery","links":["contract","verification/setup","verification/runs/2026-10-23-distribution","verification/runs/windows-2026-10-22-203907","verification/runs/2026-10-22-baselines","verification/runs/2026-10-22-hosted","verification/runs/2026-10-22-platform","verification/runs/2026-10-20-skill-proof",
