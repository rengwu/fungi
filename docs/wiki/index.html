d. A timeout of an agent tool is a transport outcome, not evidence that the human cancelled. The third interview accepted close as a distinct terminal outcome with draft preservation; the \u003ca href=\"#/contract~result-and-lifecycle\">contract draft\u003c/a> proposes reopening into a new linked session.\u003c/p>\n\u003cp>Save the response and artifact bytes before returning success to the UI. Associate delivery with a stable result ID. Retry failed notifications locally within explicit bounds; do not repeatedly wake the model. A queued notification means the host accepted a message, not that the agent has read the result. Collection should be repeatable and should not delete data. Cleanup follows an explicit acknowledgement or retention policy.\u003c/p>\n\u003cp>Exactly-once handling across independent applications cannot be promised just by recording a local flag: a crash can occur after the receiver accepted a message and before fungi recorded success. Use repeatable result retrieval and deduplication by result ID where the host permits it. Where the host lacks an idempotency key, distinguish best-effort notification from confirmed consumption.\u003c/p>\n\u003ch2 id=\"storage-choice\">Storage choice\u003c/h2>\n\u003cp>For a small local tool, session directories with JSON records and artifact files are attractive: easy to inspect, recover, and move. But reliable persistence requires more than writing JSON and renaming a file. Go explicitly does not promise atomic rename on non-Unix platforms. SQLite's atomic-commit explanation shows why write ordering and flushes matter under crashes. \u003ca href=\"https://pkg.go.dev/os#Rename\" rel=\"noreferrer\">Go Rename contract\u003c/a>, \u003ca href=\"https://sqlite.org/atomiccommit.html\" rel=\"noreferrer\">SQLite atomic commit\u003c/a>\u003c/p>\n\u003cp>bbolt offers embedded transactions, but its database write lock constrains multiple processes sharing one database. It would be a reasonable option under a single owner, not a reason to introduce a permanent central daemon prematurely. \u003ca href=\"https://github.com/etcd-io/bbolt#caveats--limitations\" rel=\"noreferrer\">bbolt limitations\u003c/a>\u003c/p>\n\u003cp>Recommendation: keep a narrow persistence interface and choose a proven file-commit implementation or embedded transactional store after testing crash recovery on the supported platforms. Do not build an event-sourcing framework. One authoritative submitted result and modest delivery bookkeeping should be enough initially.\u003c/p>\n\u003ch2 id=\"proposed-verification-before-expanding-ui\">Proposed verification before expanding UI\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Required observation\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Human stays away for hours\u003c/td>\n\u003ctd>No fungi-caused model turns, status tool calls, or repeated notifications\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>User submits twice\u003c/td>\n\u003ctd>One authoritative result; repeated submission returns the existing receipt or an explicit conflict\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Renderer closes or crashes\u003c/td>\n\u003ctd>Distinct outcome; no fabricated successful response; saved draft survives\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Engine crashes around submission\u003c/td>\n\u003ctd>UI acknowledges only a committed result; recovery finds a valid result or explicit incomplete state\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Callback fails or its response is lost\u003c/td>\n\u003ctd>Result remains available; bounded retry; deduplication behavior documented\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Multiple conversations use fungi\u003c/td>\n\u003ctd>Each receives only its own session result\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Harness kills a process group\u003c/td>\n\u003ctd>No false success; persistence and supported recovery route remain clear\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Machine sleeps or reboots\u003c/td>\n\u003ctd>No lost committed data; automatic resumption is claimed only if an actual running/restarted receiver exists\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Disk full or artifact interrupted\u003c/td>\n\u003ctd>Submission stays unsuccessful; existing data is preserved\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Invalid or oversized extension output\u003c/td>\n\u003ctd>Bounded memory use; useful failure; no indefinite wait\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>These are proposed acceptance cases, not completed tests.\u003c/p>\n","backlinks":["research/index"]},{"id":"research/index","title":"Research findings and recommendation","section":"Research","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-19\u003c/span>","updated":"2026-10-19","summary":"","source":"---\ntitle: Research findings and recommendation\nupdated: 2026-10-19\n---\n# Research findings and recommendation\n\nResearch date: 2026-10-19. This is a design assessment, not a claim that fungi or any proposed integration has been implemented or verified.\n\n## Main finding\n\nThe strongest design is a small session engine with an unusually easy authoring surface. Most interface capabilities already exist in reusable libraries. Fungi's distinctive work is maintaining the relationship between an interaction, its saved result, and the correct calling agent, including when the human takes hours to respond.\n\nKeep ordinary HTML/CSS/JavaScript available directly, and provide the equally supported JSON authoring path accepted in the first interview. Both should use one renderer and result bridge. Native applications can use a small process contract. Avoid making authors implement delivery, recovery, or harness detection themselves.\n\n## Research map\n\n- [Engine and extension mechanisms](engine.md): process plugins, Go plugins, WebAssembly, storage, and failure boundaries.\n- [Rendering and packaging](rendering.md): system webviews, Wails, niche engines, native toolkits, and the real meaning of one binary.\n- [Bundled renderer follow-up](bundled-renderers.md): revised shortlist, actual Sciter binary inspection, licensing constraints, and the accepted Chromium/Electron fallback.\n- [Renderer adoption and maintenance](renderer-health.md): dated GitHub/API evidence, releases, contributor samples, wrapper health, and the current recommendation.\n- [Composition and component libraries](components.md): standard controls, forms, drawing, charts, editors, and agent-oriented UI formats.\n- [Pele follow-up](pele.md): user-suggested optional diagram asset, maintenance signals and a bounded local probe.\n- [Agent delivery and waiting](delivery.md): current harness mechanisms, their limits, and the no-model-polling contract.\n- [Proposed small authoring interface](../proposal.md): illustrative commands and a minimal skill-authored UI.\n\n## Recommendations after the first interview\n\nThe user chose bundled rendering instead of system webviews, both HTML and JSON authoring in the first release, and a manual “done” fallback. These decisions supersede the initial recommendations to compare Wails/thin webview hosts, defer the JSON path, and consider refusing launch without automatic delivery. [Accepted decisions](../planning.md)\n\nThe second round and chat clarifications additionally require an open-source default, substantial adoption and healthy recent development, and the simplest portable folder/archive packaging. The user subsequently accepted the resulting Electron + Go recommendation. CEF remains a researched alternative rather than a parallel implementation target. The selection is not a compatibility or performance benchmark. [Accepted direction](../planning.md#accepted-electron-go-direction)\n\n| Concern | Recommendation | Why |\n| --- | --- | --- |\n| Core responsibility | Own sessions, results, artifacts, lifecycle, and delivery | These remain useful regardless of renderer or UI library |\n| Common UI authoring | HTML/assets plus a tiny bridge, and a small JSON catalog | Both paths are accepted first-release scope; share implementation underneath |\n| Primitive test UI | Accepted: text, form input, slider, submit/cancel and pasted/selected image | Tests real interaction without committing to a large component framework |\n| Complex UI | Locally bundled libraries, selected by the skill | Reuses existing capabilities without inflating every fungi download |\n| Native extensions | Ordinary processes with a small JSON contract; include one tiny helper test | Independent languages and releases; no shared-library ABI |\n| Native host | Accepted: Electron companion beside the Go core | Strong adoption and maintained desktop integration reduce integration work; measure the actual footprint |\n| Packaging | Portable folder/archive with one CLI entry point | Accepted simplicity choice; no installer, runtime download or extraction-cache framework |\n| JSON scope | Accepted: flat built-in fields first; richer composition deferred | The user has larger JSON-authoring ideas to discuss separately |\n| WASM runtime | Defer | Useful for portable computation, but adds little to the first UI workflow |\n| Delivery | Best-effort supported route, save first, fall back to “done” | Open the interface even when automatic delivery is unavailable; no agent polling |\n| Reliability | Exercise failure cases before expanding components | A beautiful UI with lost or misrouted answers fails the main requirement |\n\nElectron + Go and the first milestone's scope are selected. Exact protocols and APIs remain proposals. Accepted decisions are recorded in [planning](../planning.md); the [first proof](../proposal.md#first-proof) targets macOS and verified automatic return in Codex, Claude Code, OpenCode, Grok, Kimi and Pi.\n\n## Evidence boundary\n\nRead the local jstack skills, collector code, native screencap helper, completion launcher, and Codex adapter. The source checkout was at `32324e4` with existing local changes to grill-form and its notes editor. No jstack files were modified. Its historical compatibility report describes tests performed by jstack; those were not repeated during this research.\n\nThe installed Codex CLI reported `0.163.0`; `codex queue --help` exposed `--thread` and `--message`. This establishes local command availability, not guaranteed future delivery or cross-harness compatibility.\n\nDuring the first interview, jstack's completion command returned `armed`, a notice with the exact session path subsequently arrived in this conversation, and collection/finish recovered and saved all six answers. This is evidence of one jstack questionnaire handoff in this environment, not a fungi implementation or an AFK-duration/platform/harness compatibility test.\n\nReviewed primary project documentation, specifications, and selected source code. In particular, inspected the actual cgo directives in `webview_go`, the HashiCorp process handshake, and Go's file-rename contract. Library size and performance claims have not been independently benchmarked. Other operating systems and harnesses have not been exercised here. No packages, application frameworks, or agent integrations were installed.\n\nAn initial CEF usage URL and an older Servo embedding page could not be retrieved. Follow-up research found the current canonical CEF documentation and Servo's current library release documentation. Sciter's current GitLab SDK replaced archived GitHub sources for packaging/license assessment. Two Linux Sciter binaries were downloaded into a temporary research directory and inspected as data, without execution or installation; details are in the bundled-renderer follow-up. Source links throughout the research identify the evidence behind each comparison.\n","toc":[{"id":"main-finding","title":"Main finding","depth":2},{"id":"research-map","title":"Research map","depth":2},{"id":"recommendations-after-the-first-interview","title":"Recommendations af ">Renderer adoption and maintenance\u003c/a>: dated GitHub/API evidence, releases, contributor samples, wrapper health, and the current recommendation.\u003c/li>\n\u003cli>\u003ca href=\"#/research/components\">Composition and component libraries\u003c/a>: standard controls, forms, drawing, charts, editors, and agent-oriented UI formats.\u003c/li>\n\u003cli>\u003ca href=\"#/research/pele\">Pele follow-up\u003c/a>: user-suggested optional diagram asset, maintenance signals and a bounded local probe.\u003c/li>\n\u003cli>\u003ca href=\"#/research/delivery\">Agent delivery and waiting\u003c/a>: current harness mechanisms, their limits, and the no-model-polling contract.\u003c/li>\n\u003cli>\u003ca href=\"#/proposal\">Proposed small authoring interface\u003c/a>: illustrative commands and a minimal skill-authored UI.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"recommendations-after-the-first-interview\">Recommendations after the first interview\u003c/h2>\n\u003cp>The user chose bundled rendering instead of system webviews, both HTML and JSON authoring in the first release, and a manual “done” fallback. These decisions supersede the initial recommendations to compare Wails/thin webview hosts, defer the JSON path, and consider refusing launch without automatic delivery. \u003ca href=\"#/planning\">Accepted decisions\u003c/a>\u003c/p>\n\u003cp>The second round and chat clarifications additionally require an open-source default, substantial adoption and healthy recent development, and the simplest portable folder/archive packaging. The user subsequently accepted the resulting Electron + Go recommendation. CEF remains a researched alternative rather than a parallel implementation target. The selection is not a compatibility or performance benchmark. \u003ca href=\"#/planning~accepted-electron-go-direction\">Accepted direction\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Concern\u003c/th>\n\u003cth>Recommendation\u003c/th>\n\u003cth>Why\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Core responsibility\u003c/td>\n\u003ctd>Own sessions, results, artifacts, lifecycle, and delivery\u003c/td>\n\u003ctd>These remain useful regardless of renderer or UI library\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Common UI authoring\u003c/td>\n\u003ctd>HTML/assets plus a tiny bridge, and a small JSON catalog\u003c/td>\n\u003ctd>Both paths are accepted first-release scope; share implementation underneath\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Primitive test UI\u003c/td>\n\u003ctd>Accepted: text, form input, slider, submit/cancel and pasted/selected image\u003c/td>\n\u003ctd>Tests real interaction without committing to a large component framework\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Complex UI\u003c/td>\n\u003ctd>Locally bundled libraries, selected by the skill\u003c/td>\n\u003ctd>Reuses existing capabilities without inflating every fungi download\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Native extensions\u003c/td>\n\u003ctd>Ordinary processes with a small JSON contract; include one tiny helper test\u003c/td>\n\u003ctd>Independent languages and releases; no shared-library ABI\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Native host\u003c/td>\n\u003ctd>Accepted: Electron companion beside the Go core\u003c/td>\n\u003ctd>Strong adoption and maintained desktop integration reduce integration work; measure the actual footprint\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Packaging\u003c/td>\n\u003ctd>Portable folder/archive with one CLI entry point\u003c/td>\n\u003ctd>Accepted simplicity choice; no installer, runtime download or extraction-cache framework\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>JSON scope\u003c/td>\n\u003ctd>Accepted: flat built-in fields first; richer composition deferred\u003c/td>\n\u003ctd>The user has larger JSON-authoring ideas to discuss separately\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>WASM runtime\u003c/td>\n\u003ctd>Defer\u003c/td>\n\u003ctd>Useful for portable computation, but adds little to the first UI workflow\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Delivery\u003c/td>\n\u003ctd>Best-effort supported route, save first, fall back to “done”\u003c/td>\n\u003ctd>Open the interface even when automatic delivery is unavailable; no agent polling\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Reliability\u003c/td>\n\u003ctd>Exercise failure cases before expanding components\u003c/td>\n\u003ctd>A beautiful UI with lost or misrouted answers fails the main requirement\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Electron + Go and the first milestone's scope are selected. Exact protocols and APIs remain proposals. Accepted decisions are recorded in \u003ca href=\"#/planning\">planning\u003c/a>; the \u003ca href=\"#/proposal~first-proof\">first proof\u003c/a> targets macOS and verified automatic return in Codex, Claude Code, OpenCode, Grok, Kimi and Pi.\u003c/p>\n\u003ch2 id=\"evidence-boundary\">Evidence boundary\u003c/h2>\n\u003cp>Read the local jstack skills, collector code, native screencap helper, completion launcher, and Codex adapter. The source checkout was at \u003ccode>32324e4\u003c/code> with existing local changes to grill-form and its notes editor. No jstack files were modified. Its historical compatibility report describes tests performed by jstack; those were not repeated during this research.\u003c/p>\n\u003cp>The installed Codex CLI reported \u003ccode>0.163.0\u003c/code>; \u003ccode>codex queue --help\u003c/code> exposed \u003ccode>--thread\u003c/code> and \u003ccode>--message\u003c/code>. This establishes local command availability, not guaranteed future delivery or cross-harness compatibility.\u003c/p>\n\u003cp>During the first interview, jstack's completion command returned \u003ccode>armed\u003c/code>, a notice with the exact session path subsequently arrived in this conversation, and collection/finish recovered and saved all six answers. This is evidence of one jstack questionnaire handoff in this environment, not a fungi implementation or an AFK-duration/platform/harness compatibility test.\u003c/p>\n\u003cp>Reviewed primary project documentation, specifications, and selected source code. In particular, inspected the actual cgo directives in \u003ccode>webview_go\u003c/code>, the HashiCorp process handshake, and Go's file-rename contract. Library size and performance claims have not been independently benchmarked. Other operating systems and harnesses have not been exercised here. No packages, application frameworks, or agent integrations were installed.\u003c/p>\n\u003cp>An initial CEF usage URL and an older Servo embedding page could not be retrieved. Follow-up research found the current canonical CEF documentation and Servo's current library release documentation. Sciter's current GitLab SDK replaced archived GitHub sources for packaging/license assessment. Two Linux Sciter binaries were downloaded into a temporary research directory and inspected as data, without execution or installation; details are in the bundled-renderer follow-up. Source links throughout the research identify the evidence behind each comparison.\u003c/p>\n","backlinks":["index","planning","proposal","research/bundled-renderers","research/components","research/delivery","research/engine","research/renderer-health","research/rendering"]},{"id":"research/pele","title":"Pele as an optional diagram asset","section":"Research","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-20\u003c/span>","updated":"2026-10-20","summary":"","source":"---\ntitle: Pele as an optional diagram asset\nupdated: 2026-10-20\n---\n# Pele as an optional diagram asset\n\nThe user suggested [Obsidian's Pele](https://github.com/obsidianmd/pele) during the simpler grill-form port. It renders Mermaid text to SVG; it is not a notes editor or native window engine. Its MIT-licensed package declares no runtime dependencies. It targets Mermaid 12.1.0 syntax with its own layout, so visual equivalence should not be assumed. [Package metadata](https://registry.npmjs.org/pele/1.7.0)\n\n## Fit and maintenance\n\nThe GitHub API snapshot on 2026-10-20 recorded 2,553 stars, 77 forks, creation on 2026-10-05 and a last push on 2026-10-19. The contributor listing attributed 195 commits to `kepano` and one to `uzuraDev`. Version 1.7.0 was released on 2026-10-19. These are strong early interest and activity signals, with a short history and concentrated maintenance. They do not establish mature long-term support. [Repository metadata](https://api.github.com/repos/obsidianmd/pele), [contributors](https://api.github.com/repos/obsidianmd/pele/contributors), [release commit](https://github.com/obsidianmd/pele/commit/8603bf3313add9143cd417015d4a6bd6c522dada)\n\nPele fits the skill-assets layer: vendor a pinned browser file and call its API from ordinary page JavaScript. Neither the Go runner nor Electron's bridge needs to know about diagrams. `render()` returns SVG synchronously; `mount()` adds container resizing, source updates and zoom. Individual diagram imports are available if bundle size matters. [API](https://pele.run/api)\n\nFor untrusted source, retain application-controlled options, disable links and images, bound source/output/edges, and display errors as text. Supplied icon markup and internal link handling remain the application's responsibility. Synchronous rendering alone does not impose a time limit; upstream recommends a terminable worker for that. [Security contract](https://pele.run/security)\n\n## Local probe\n\nDownloaded the pinned npm 1.7.0 tarball and verified its published SHA-512 integrity before reading the browser/module distributions. The browser file is 683,259 bytes, or 254,846 with local gzip. The older grill-form's Mermaid Tiny file is 2,811,019 bytes, or 752,544 gzip. These are measured files, not a rendering-speed benchmark or a statement of equivalent coverage.\n\nThree simple flowchart, sequence and state fixtures produced nonempty SVG with positive dimensions under Node 22.19.0, without a DOM or additional packages. Invalid syntax and a deliberately tiny source limit were rejected. This does not establish browser interaction, complex-diagram compatibility or visual quality. [Probe evidence](../evidence/2026-10-20-skill-proof/pele.json)\n\nRecommendation: keep Pele as a strong candidate for the next diagram-focused skill experiment. Preserve Mermaid Tiny in this requested historical baseline so the migration tests isolate the Fungi lifecycle changes. No new renderer abstraction or core dependency is justified.\n","toc":[{"id":"fit-and-maintenance","title":"Fit and maintenance","depth":2},{"id":"local-probe","title":"Local probe","depth":2}],"titleAnchor":"pele-as-an-optional-diagram-asset","links":[],"attachments":[{"path":"evidence/2026-10-20-skill-proof/pele.json","sha256":"d7184dc3b3e81ab52e160cba8d53712ee2d158b969d7cf8ccdaa4e5043a83f29"}],"html":"\u003cp>The user suggested \u003ca href=\"https://github.com/obsidianmd/pele\" rel=\"noreferrer\">Obsidian's Pele\u003c/a> during the simpler grill-form port. It renders Mermaid text to SVG; it is not a notes editor or native window engine. Its MIT-licensed package declares no runtime dependencies. It targets Mermaid 12.1.0 syntax with its own layout, so visual equivalence should not be assumed. \u003ca href=\"https://registry.npmjs.org/pele/1.7.0\" rel=\"noreferrer\">Package metadata\u003c/a>\u003c/p>\n\u003ch2 id=\"fit-and-maintenance\">Fit and maintenance\u003c/h2>\n\u003cp>The GitHub API snapshot on 2026-10-20 recorded 2,553 stars, 77 forks, creation on 2026-10-05 and a last push on 2026-10-19. The contributor listing attributed 195 commits to \u003ccode>kepano\u003c/code> and one to \u003ccode>uzuraDev\u003c/code>. Version 1.7.0 was released on 2026-10-19. These are strong early interest and activity signals, with a short history and concentrated maintenance. They do not establish mature long-term support. \u003ca href=\"https://api.github.com/repos/obsidianmd/pele\" rel=\"noreferrer\">Repository metadata\u003c/a>, \u003ca href=\"https://api.github.com/repos/obsidianmd/pele/contributors\" rel=\"noreferrer\">contributors\u003c/a>, \u003ca href=\"https://github.com/obsidianmd/pele/commit/8603bf3313add9143cd417015d4a6bd6c522dada\" rel=\"noreferrer\">release commit\u003c/a>\u003c/p>\n\u003cp>Pele fits the skill-assets layer: vendor a pinned browser file and call its API from ordinary page JavaScript. Neither the Go runner nor Electron's bridge needs to know about diagrams. \u003ccode>render()\u003c/code> returns SVG synchronously; \u003ccode>mount()\u003c/code> adds container resizing, source updates and zoom. Individual diagram imports are available if bundle size matters. \u003ca href=\"https://pele.run/api\" rel=\"noreferrer\">API\u003c/a>\u003c/p>\n\u003cp>For untrusted source, retain application-controlled options, disable links and images, bound source/output/edges, and display errors as text. Supplied icon markup and internal link handling remain the application's responsibility. Synchronous rendering alone does not impose a time limit; upstream recommends a terminable worker for that. \u003ca href=\"https://pele.run/security\" rel=\"noreferrer\">Security contract\u003c/a>\u003c/p>\n\u003ch2 id=\"local-probe\">Local probe\u003c/h2>\n\u003cp>Downloaded the pinned npm 1.7.0 tarball and verified its published SHA-512 integrity before reading the browser/module distributions. The browser file is 683,259 bytes, or 254,846 with local gzip. The older grill-form's Mermaid Tiny file is 2,811,019 bytes, or 752,544 gzip. These are measured files, not a rendering-speed benchmark or a statement of equivalent coverage.\u003c/p>\n\u003cp>Three simple flowchart, sequence and state fixtures produced nonempty SVG with positive dimensions under Node 22.19.0, without a DOM or additional packages. Invalid syntax and a deliberately tiny source limit were rejected. This does not establish browser interaction, complex-diagram compatibility or visual quality. \u003ca href=\"evidence/2026-10-20-skill-proof/pele.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: d7184dc3b3e81ab52e160cba8d53712ee2d158b969d7cf8ccdaa4e5043a83f29\">Probe evidence\u003c/a>\u003c/p>\n\u003cp>Recommendation: keep Pele as a strong candidate for the next diagram-focused skill experiment. Preserve Mermaid Tiny in this requested historical baseline so the migration tests isolate the Fungi lifecycle changes. No new renderer abstraction or core dependency is justified.\u003c/p>\n","backlinks":["planning","research/index","verification/runs/2026-10-20-skill-proof"]},{"id":"research/renderer-health","title":"Renderer adoption and maintenance","section":"Research","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-19\u003c/span>","updated":"2026-10-19","summary":"","source":"---\ntitle: Renderer adoption and maintenance\nupdated: 2026-10-19\n---\n# Renderer adoption and maintenance\n\n[Research overview](index.md) · [Accepted decisions](../planning.md) · [Bundled renderer investigation](bundled-renderers.md)\n\n**Decision following this research: the user accepted Electron + Go on 2026-10-19.** Electron best combines the requested substantial following, maintained releases, browser compatibility, and low integration complexity. CEF remains the principal researched alternative. No Fungi integration or performance benchmark has been run. [Accepted direction](../planning.md#accepted-electron-go-direction)\n\nThe second interview requires an open-source default. The subsequent chat instruction chooses simple portable folder/archive packaging. Together these remove the main reasons to favor a proprietary compact engine or engineer a self-extracting executable. Download size still matters, but the user has accepted Chromium/Electron if lighter options undermine reliability or ease of authoring.\n\n## What was measured\n\nPublic GitHub API observations on **2026-10-19** cover repository stars/forks, recent default-branch commits, linked author accounts, and published releases. The commit query starts on 2026-07-21 and stops after 100 results. Separate follow-ups inspect the latest 12 commits in Energy's main and component repositories. The [saved evidence](../attachments/research/renderer-health-2026-10-19.json) includes the query method, source URLs, commit samples, release dates, and limitations.\n\nStars measure accumulated interest, not deployed installations. Author samples are not team sizes: they omit unlinked authors, coauthors, reviewers, other repositories, and downstream work. A capped sample can span much less than 90 days. Do not compare these counts as productivity scores. Recent pushes, default-branch commits, published releases, and security backports are different evidence.\n\n| Project | GitHub stars | Recent evidence | Implication for Fungi |\n| --- | ---: | --- | --- |\n| [Electron](https://github.com/electron/electron) | 123,403 | Latest sampled commit Oct 18; 100-commit cap reached; 16 linked non-bot authors; v44.9.0 published Oct 17 UTC | Strongest overall candidate for an established desktop web host |\n| [CEF](https://github.com/chromiumembedded/cef) | 4,837 | Latest sampled default-branch commit Oct 10; cap reached; 12 linked authors; stable build artifacts dated Oct 17 | Established embedding engine; native integration work remains ours |\n| [Servo](https://github.com/servo/servo) | 38,186 | Latest sampled commit Oct 19; cap reached; 31 linked authors; v0.7.0 published Oct 5 | Substantial interest and active development; evolving web and embedding behavior |\n| [NW.js](https://github.com/nwjs/nw.js) | 41,140 | Latest sampled commit Oct 17; 65 commits in the query; one linked author account; October release announcement | Credible Chromium alternative; more concentrated activity in the inspected repository |\n| [Qt WebEngine](https://github.com/qt/qtwebengine) | 442 | Latest sampled commit Oct 16; cap reached; 13 linked authors | Active project; GitHub mirror stars underrepresent the Qt ecosystem |\n| [Blitz](https://github.com/DioxusLabs/blitz) | 4,277 | Latest sampled commit Oct 18; cap reached; five linked authors | Active specialized renderer, not a complete browser JavaScript environment |\n| [Energy](https://github.com/energye/energy) | 618 | No commits in the 90-day query; latest default-branch commit June 5; latest GitHub release June 17, 2025 | Its upstream CEF engine's health cannot substitute for binding maintenance |\n| [cef2go](https://github.com/cztomczak/cef2go) | 912 | No commits in the query; repository push timestamp in 2020; latest GitHub release in 2014 | Unsuitable foundation for the requested actively maintained default |\n\nAll inspected repositories were unarchived; that alone says little about support. CEF, NW.js and Qt WebEngine do not use GitHub Releases as their complete release record, so an empty API response was followed up through their actual distribution channels.\n\n## Why Electron leads\n\nElectron's v44.9.0 release includes fixes to inherited settings for newly opened windows and concurrent certificate-verification behavior. These are concrete desktop/runtime fixes, beyond repository activity alone. Its GitHub publication timestamp is Oct 17 UTC; the release website displays Oct 16. [Release notes](https://releases.electronjs.org/release/v44.9.0), [GitHub release](https://github.com/electron/electron/releases/tag/v44.9.0)\n\nThe project documents support for its three latest stable major versions, with different backport scopes, and an eight-week major-release cadence. Its public governance separates releases, security, Chromium upgrades and other responsibilities into working groups. This gives Fungi an identifiable upstream maintenance process, although Fungi would still need to ship runtime updates. [Support timelines](https://www.electronjs.org/docs/latest/tutorial/electron-timelines), [governance](https://github.com/electron/governance)\n\nThe integration advantage is practical: **a Go core can launch a small Electron companion without adopting a third-party Go/Electron binding**. Electron owns the native window and web renderer; Go owns sessions, results and agent delivery. This accepted direction revises the original Go-owned-window idea. Ordinary HTML/CSS/JavaScript and the JSON component catalog can share the same narrow page bridge. Skill authors would not need Electron APIs or a local Node installation. Fungi's build would package the runtime. [Process model](https://www.electronjs.org/docs/latest/tutorial/process-model), [distribution](https://www.electronjs.org/docs/latest/tutorial/application-distribution), [context isolation](https://www.electronjs.org/docs/latest/tutorial/context-isolation)\n\nThe cost is a larger runtime and Chromium's multiprocess model. No footprint, startup or idle-memory comparison has been measured here. Electron popularity does not prove Fungi will run on every clean Linux desktop or that any particular component library will work correctly.\n\n## CEF: healthy engine, separate integration decision\n\nCEF's own documentation directs users to its binary builds. The distribution feed contains stable Linux and Windows artifacts dated Oct 17. Its lack of GitHub Releases is therefore not evidence of inactivity. OBS's browser component is a concrete downstream CEF integration. [CEF build documentation](https://chromiumembedded.github.io/cef/branches_and_building), [binary distribution](https://cef-builds.spotifycdn.com/index.html), [OBS browser component](https://github.com/obsproject/obs-browser)\n\nCEF supplies C/C++ embedding APIs and a prescribed runtime/helper layout. Selecting it means maintaining a native host or depending on bindings, in addition to the Go session engine. It does not automatically eliminate Chromium's resources or helper processes. [General usage and application layout](https://chromiumembedded.github.io/cef/general_usage)\n\nEnergy deserves a fairer assessment than its main release date alone: its v3 work is split into [CEF](https://github.com/energye/cef) and [LCL](https://github.com/energye/lcl) repositories. Those have 16 and 35 stars respectively; their latest sampled commits are June 28 and July 1. The latest 12 commits in each of these and the main repository are attributed to the same linked account. This does not establish abandonment or the full contributor population, but it falls short of the desired evidence for a default dependency. Building our own CEF host avoids that wrapper dependency while increasing Fungi's maintenance scope.\n\nCEF remains the alternative if an implementation experiment demonstrates a meaningful packaging or resource advantage that justifies owning more native integration. There is no measured advantage yet.\n\n## Other established and emerging options\n\n**Servo passes the popularity and activity tests.** Its April library announcement explicitly describes a pre-1.0 API. The October progress report documents CSS Grid becoming enabled by default, improvements to interactive text selection and accessibility, and breaking embedding API changes. These are signs of active progress and evidence that relevant behavior is still evolving. That makes it a valuable future renderer candidate, but a riskier default for arbitrary skill-authored web libraries today. [Library release](https://servo.org/blog/2026/04/13/servo-0.1.0-release/), [recent progress](https://servo.org/blog/2026/10/09/august-in-servo/), [v0.7.0](https://github.com/servo/servo/releases/tag/v0.7.0)\n\n**NW.js also deserves consideration.** Its official blog announces v0.118 on Oct 10, following September releases. The repository author concentration is a maintenance signal, not proof of a one-person project: Chromium and other repositories supply substantial work. It remains a viable alternative, but this investigation found no requirement that makes it preferable to Electron's broader desktop integration ecosystem. [Release announcements](https://nwjs.io/blog/)\n\n**Qt WebEngine is actively maintained despite modest mirror stars.** Qt announced a separate WebEngine release cadence in September to make browser updates less dependent on whole-Qt releases. Its Chromium baseline and backported security level must be distinguished. The tradeoff is adopting Qt libraries, plugins and helpers around a Go core. GitHub's automatically detected repository license is not the license assessment for the full module/distribution. [Release direction](https://www.qt.io/blog/qt-webengine-will-release-separate), [Chromium versions](https://wiki.qt.io/QtWebEngine/ChromiumVersions), [deployment](https://doc.qt.io/qt-6/qtwebengine-deploying.html), [module licensing](https://doc.qt.io/qt-6.8/qtwebengine-licensing.html)\n\n**Blitz has recent development but a different scope.** Its project documentation distinguishes its HTML renderer from interactive Dioxus integration and says JavaScript bindings are absent. Making it the default would transfer missing web-platform work onto Fungi or constrain authoring. That conflicts with the requested simplicity and ordinary web-library reuse. [Project capabilities](https://github.com/DioxusLabs/blitz)\n\nSciter and Ultralight are excluded from the default by the accepted open-source requirement. Wails, Tauri, webview and similar system-webview hosts do not by themselves satisfy the accepted requirement to bundle a renderer without separate WebView2/WebKitGTK setup. These remain optional extension references; their popularity does not resolve that mismatch. [Earlier rendering investigation](rendering.md)\n\n## Keep the resulting design small\n\nUse one default renderer, a tiny page-to-session bridge, and a primitive reference component catalog. Let skills add local web assets or invoke native helper processes. Do not build a renderer marketplace, a universal UI language, multiple default engines, or an extraction/cache system to accommodate every researched option.\n\nRenderer choice does not solve automatic agent resumption. The [delivery contract](delivery.md) still needs a supported harness route, durable results and the accepted manual “done” fallback. Human waiting must not produce repeated model tool calls regardless of renderer.\n\nWith Electron + Go selected, the useful next evidence comes from the [first end-to-end proof](../proposal.md#first-proof) and packaging checks. Broader compatibility experiments can then cover a drawing surface and representative external libraries, with measured archive size, startup and idle resources. Revisit CEF only if Electron fails a concrete requirement or an evidenced improvement justifies the extra native host work. These experiments are proposed, not performed or scheduled.\n","toc":[{"id":"what-was-measured","title":"What was measured","depth":2},{"id":"why-electron-leads","title":"Why Electron leads","depth":2},{"id":"cef-healthy-engine-separate-integration-decision","title":"CEF: healthy engine, separate integration decision","depth":2},{"id":"other-established-and-emerging-options","title":"Other established and emerging options","depth":2},{"id":"keep-the-resulting-design-small","title":"Keep the resulting design small","depth":2}],"titleAnchor":"renderer-adoption-and-maintenance","links":["research/index","planning","research/bundled-renderers","planning","research/rendering","research/delivery","proposal"],"attachments":[{"path":"attachments/research/renderer-health-2026-10-19.json","sha256":"5296e177340fb601c324f301168466c509821d85f74cc67377d5d8266485113d"}],"html":"\u003cp>\u003ca href=\"#/research/index\">Research overview\u003c/a> · \u003ca href=\"#/planning\">Accepted decisions\u003c/a> · \u003ca href=\"#/research/bundled-renderers\">Bundled renderer investigation\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>Decision following this research: the user accepted Electron + Go on 2026-10-19.\u003c/strong> Electron best combines the requested substantial following, maintained releases, browser compatibility, and low ngine/ChromiumVersions\" rel=\"noreferrer\">Chromium versions\u003c/a>, \u003ca href=\"https://doc.qt.io/qt-6/qtwebengine-deploying.html\" rel=\"noreferrer\">deployment\u003c/a>, \u003ca href=\"https://doc.qt.io/qt-6.8/qtwebengine-licensing.html\" rel=\"noreferrer\">module licensing\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>Blitz has recent development but a different scope.\u003c/strong> Its project documentation distinguishes its HTML renderer from interactive Dioxus integration and says JavaScript bindings are absent. Making it the default would transfer missing web-platform work onto Fungi or constrain authoring. That conflicts with the requested simplicity and ordinary web-library reuse. \u003ca href=\"https://github.com/DioxusLabs/blitz\" rel=\"noreferrer\">Project capabilities\u003c/a>\u003c/p>\n\u003cp>Sciter and Ultralight are excluded from the default by the accepted open-source requirement. Wails, Tauri, webview and similar system-webview hosts do not by themselves satisfy the accepted requirement to bundle a renderer without separate WebView2/WebKitGTK setup. These remain optional extension references; their popularity does not resolve that mismatch. \u003ca href=\"#/research/rendering\">Earlier rendering investigation\u003c/a>\u003c/p>\n\u003ch2 id=\"keep-the-resulting-design-small\">Keep the resulting design small\u003c/h2>\n\u003cp>Use one default renderer, a tiny page-to-session bridge, and a primitive reference component catalog. Let skills add local web assets or invoke native helper processes. Do not build a renderer marketplace, a universal UI language, multiple default engines, or an extraction/cache system to accommodate every researched option.\u003c/p>\n\u003cp>Renderer choice does not solve automatic agent resumption. The \u003ca href=\"#/research/delivery\">delivery contract\u003c/a> still needs a supported harness route, durable results and the accepted manual “done” fallback. Human waiting must not produce repeated model tool calls regardless of renderer.\u003c/p>\n\u003cp>With Electron + Go selected, the useful next evidence comes from the \u003ca href=\"#/proposal~first-proof\">first end-to-end proof\u003c/a> and packaging checks. Broader compatibility experiments can then cover a drawing surface and representative external libraries, with measured archive size, startup and idle resources. Revisit CEF only if Electron fails a concrete requirement or an evidenced improvement justifies the extra native host work. These experiments are proposed, not performed or scheduled.\u003c/p>\n","backlinks":["planning","research/bundled-renderers","research/index","research/rendering"]},{"id":"research/rendering","title":"Rendering and packaging","section":"Research","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-19\u003c/span>","updated":"2026-10-19","summary":"","source":"---\ntitle: Rendering and packaging\nupdated: 2026-10-19\n---\n# Rendering and packaging\n\n[Research overview](index.md)\n\nAfter the first interview, the default must bundle its rendering engine. The earlier Wails/thin-webview recommendation is superseded. Those hosts remain optional extension references. The user also accepted bundled Chromium/Electron as the fallback if lighter choices are inadequate. See the [focused follow-up](bundled-renderers.md).\n\nThe second interview requires an open-source default; subsequent requests add substantial adoption and healthy recent development. Portable folder/archive packaging is accepted. Following the [maintenance assessment](renderer-health.md), the user selected Electron + Go. The broad catalog below preserves the earlier research, not a list of equally eligible defaults.\n\n## Separate three promises\n\nA single download, a single executable, and no non-system runtime dependencies are different properties. One Go executable can embed all HTML/JS/CSS assets while still relying on an operating system's web engine. A downloadable executable can also extract helper libraries on launch, which is one distribution file but several runtime files.\n\nFor fungi's UI-free core, a self-contained Go executable is a reasonable target. Each renderer must state its actual runtime requirements. A native window is not implemented by the Go language itself; a Go host ultimately calls platform window and rendering APIs.\n\n| Platform | Typical embedded web engine | Consequence |\n| --- | --- | --- |\n| macOS | System WebKit/Cocoa | No separately shipped browser engine for this route |\n| Windows | WebView2 | Check availability; Microsoft documents inclusion on Windows 11 and widespread but not universal availability on Windows 10 |\n| Linux | GTK and WebKitGTK | Required libraries vary by distribution and are not an unconditional OS baseline |\n\nThe upstream webview project explicitly lists Linux distribution dependencies. Microsoft's documentation distinguishes preinstalled runtime use from distributing a runtime yourself; a Fixed Version runtime adds substantial files and size. These constraints also apply when a wrapper advertises a small executable. [webview platform requirements](https://github.com/webview/webview#prerequisites), [WebView2 distribution](https://learn.microsoft.com/en-us/microsoft-edge/webview2/concepts/distribution)\n\n## Renderer candidates\n\n| Candidate | Useful fit | Main tradeoff | Fungi assessment |\n| --- | --- | --- | --- |\n| webview + Go binding | Small host for arbitrary HTML and JS/native calls | Thin API means fungi owns more lifecycle, navigation, and platform handling | Optional extension; system-webview prerequisites exclude it as the default |\n| Wails | Go desktop framework with window lifecycle, bindings, assets, and platform services | Larger framework surface; system-webview requirements remain | Optional extension; superseded as the proposed default |\n| Tauri / Wry | Native desktop host with web content and a capability-oriented architecture | Rust implementation; same system-webview dependency class | Good alternative renderer, not a reason to rewrite the Go core |\n| WebUI | Language-independent library with browser and optional webview modes | Browser mode relies on an installed browser and a local bridge | Useful optional fallback, not a solution to the user's preference for a dedicated window |\n| Purego webview wrappers | Go cross-compilation without compiling C on the author machine | Native shared library loading/extraction still exists | Interesting packaging experiment; no-cgo does not mean no native dependencies |\n| Sciter / Quark | Compact embedded HTML-like UI engine and standalone packaging | Distinct styling/runtime behavior and proprietary engine | Optional extension only under the accepted open-source-default requirement |\n| Ultralight | Embeddable WebKit-derived engine with native rendering APIs | Current developer-platform and static-linking restrictions need separate agreement | Exclude from the default shortlist under ordinary SDK terms |\n| Servo | Embeddable Rust web engine and WebView API | Requires a dedicated compatibility and packaging assessment | Open-source bundled-engine candidate; still pre-1.0 |\n| CEF | Chromium through native C/C++ APIs | Native integration and runtime resource/helper packaging | Accepted fallback family; compare maintenance with Electron |\n| Electron | Established Chromium/Node desktop architecture and web ecosystem | Bundles a broader runtime and uses multiple processes | Accepted default alongside the Go core |\n| Gio / Fyne | Go-oriented native GUI approaches | Their own widget/rendering models; browser component libraries do not transfer directly | Optional native renderers for workflows that benefit |\n| Slint | Declarative native UI with a Rust runtime and several language integrations | Separate UI language/toolchain and licensing choices | Alternative extension, not the default skill-authoring requirement |\n\nThe webview Go binding inspected here contains cgo directives and an older Linux WebKitGTK target than the current upstream C++ project's available choices. A Go wrapper must be evaluated on its own revision, not assumed to track upstream. [Go binding](https://github.com/webview/webview_go), [actual build directives](https://github.com/webview/webview_go/blob/master/webview.go)\n\nWails provides a Go/JavaScript bridge and asset embedding. Its current documentation identifies GTK/WebKitGTK and WebView2 requirements; build tool requirements should not be confused with requirements of a prebuilt release. Compare its lifecycle support with a thin binding before deciding that less framework code necessarily means a simpler fungi implementation. [Wails architecture](https://v3.wails.io/contributing/architecture/), [Wails prerequisites](https://v3.wails.io/getting-started/installation/)\n\nTauri documents system-webview prerequisites too. WebUI now advertises both installed-browser and optional embedded-webview modes, so it should not be dismissed using an outdated browser-only description. [Tauri prerequisites](https://v2.tauri.app/start/prerequisites/), [WebUI](https://github.com/webui-dev/webui)\n\nThe moxcomic Go wrapper explicitly describes loading native libraries and optionally extracting prebuilt copies, while still requiring GTK/WebKitGTK on Linux. This is an example of simplifying builds without eliminating runtime dependencies. Its reliability has not been tested here. [go-webview wrapper](https://github.com/moxcomic/go-webview)\n\nSciter's scapp supports appending UI resources into an executable. Quark supplies its own extended CSS and Reactor model; that is not evidence of drop-in compatibility with the full React/browser ecosystem. The current SDK is on GitLab; the older GitHub SDK is archived. Its engine EULA is separate from the repository's BSD license. [scapp packaging](https://docs.sciter.com/docs/scapp/), [Quark capabilities](https://quark.sciter.com/), [current engine EULA](https://gitlab.com/sciter-engine/sciter-js-sdk/-/blob/main/SCITER-ENGINE-EULA.md)\n\nUltralight provides official C/C++ APIs and describes a customized WebKit engine. Follow-up examination of its 2026-08 terms found an explicit developer-platform restriction in section 4.9 and a static-linking restriction in section 4.2. Fungi's intended third-party skill/runtime role makes ordinary SDK licensing an unsuitable assumption; a separate agreement would need to cover that use. [Ultralight](https://ultralig.ht/), [current terms](https://ultralig.ht/terms/2026-08)\n\nServo exposes a WebView API and supports multiple platforms. That establishes an embedding direction; it does not establish compatibility with fungi's eventual library suite. Electron's process model provides a useful reference for separating privileged native code from page content. [Servo](https://servo.org/), [Electron process model](https://www.electronjs.org/docs/latest/tutorial/process-model)\n\nGio uses Go and an immediate-mode model with platform window/input/GPU dependencies. Fyne and Slint are additional UI ecosystems; adopting any of them would add a different authoring model rather than make arbitrary web components native. [Gio](https://gioui.org/), [Fyne documentation](https://docs.fyne.io/started/), [Slint](https://slint.dev/)\n\n## Small native tools are instructive\n\nswiftDialog demonstrates that a command-driven native application can present Markdown, controls, and forms without becoming a full application-development environment. Its macOS scope makes it a workflow reference rather than fungi's cross-platform foundation. [swiftDialog](https://github.com/swiftDialog/swiftDialog)\n\nncruces/zenity is a useful example of a compact Go-facing dialog API. Its dependencies are platform-specific: Windows native support, macOS osascript, and external dialog tools on other Unixes. That is appropriate for an optional adapter, but not a universal no-install guarantee. [zenity](https://github.com/ncruces/zenity)\n\nTerminal forms such as Huh/Bubble Tea offer another renderer, including an accessible prompt mode. A terminal owned by an agent tool is not necessarily an interactive terminal the human can use, so this cannot be an automatic GUI fallback. [Huh](https://github.com/charmbracelet/huh)\n\n## Native capture remains its own capability\n\nDrawing into a canvas and capturing other desktop windows have different requirements. Browser screen capture requires an explicit user gesture and renewed permission; an arbitrary webview may not implement the full API. Linux's screenshot portal has its own request/response and capability model. Reusing screencap's interaction concept is sensible, but the platform capture implementation should live behind a capability rather than be implied by loading HTML. [getDisplayMedia](https://developer.mozilla.org/en-US/docs/Web/API/MediaDevices/getDisplayMedia), [XDG Screenshot portal](https://flatpak.github.io/xdg-desktop-portal/docs/doc-org.freedesktop.portal.Screenshot.html)\n\n## Recommended next comparison\n\nWhen implementation is authorized, exercise a bundled-engine candidate against the [focused comparison](bundled-renderers.md), using the same HTML and JSON forms, slider preview, close/reopen behavior, and blob submission. Compare actual packaging on macOS, Windows, and a named Linux baseline; test keyboard input, IME, accessibility, focus, and clipboard behavior. Do not choose on unverified download-size claims alone.\n\nThe accepted fallback is a bundled Chromium/Electron renderer, distinct from opening the user's installed browser. The latter can remain an optional extension. Remote/container transport is deferred by the first interview.\n","toc":[{"id":"separate-three-promises","title":"Separate three promises","depth":2},{"id":"renderer-candidates","title":"Renderer candidates","depth":2},{"id":"small-native-tools-are-instructive","title":"Small native tools are instructive","depth":2},{"id":"native-capture-remains-its-own-capability","title":"Native capture remains its own capability","depth":2},{"id":"recommended-next-comparison","title":"Recommended next comparison","depth":2}],"titleAnchor":"rendering-and-packaging","links":["research/index","research/bundled-renderers","research/renderer-health","research/bundled-renderers"],"attachments":[],"html":"\u003cp>\u003ca href=\"#/research/index\">Research overview\u003c/a>\u003c/p>\n\u003cp>After the first interview, the default must bundle its rendering engine. The earlier Wails/thin-webview recommendation is superseded. Those hosts remain optional extension references. The user also accepted bundled Chromium/Electron as the fallback if lighter choices are inadequate. See the \u003ca href=\"#/research/bundled-renderers\">focused follow-up\u003c/a>.\u003c/p>\n\u003cp>The second interview requires an open-source default; subsequent requests add substantial adoption and healthy recent development. Portable folder/archive packaging is accepted. Following the \u003ca href=\"#/research/renderer-health\">maintenance assessment\u003c/a>, the user selected Electron + Go. The broad catalog below preserves the earlier research, not a list of equally eligible defaults.\u003c/p>\n\u003ch2 id=\"separate-three-promises\">Separate three promises\u003c/h2>\n\u003cp>A single download, a single executable, and no non-system runtime dependencies are different properties. One Go executable can embed all HTML/JS/CSS assets while still relying on an operating system's web engine. A downloadable executable can also extract helper libraries on launch, which is one distribution file but several runtime files.\u003c/p>\n\u003cp>For fungi's UI-free core, a self-contained Go executable is a reasonable target. Each renderer must state its actual runtime requirements. A native window is not implemented by the Go language itself; a Go host ultimately calls platform window and rendering APIs.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Platform\u003c/th>\n\u003cth>Typical embedded web engine\u003c/th>\n\u003cth>Cons  external dialog tools on other Unixes. That is appropriate for an optional adapter, but not a universal no-install guarantee. \u003ca href=\"https://github.com/ncruces/zenity\" rel=\"noreferrer\">zenity\u003c/a>\u003c/p>\n\u003cp>Terminal forms such as Huh/Bubble Tea offer another renderer, including an accessible prompt mode. A terminal owned by an agent tool is not necessarily an interactive terminal the human can use, so this cannot be an automatic GUI fallback. \u003ca href=\"https://github.com/charmbracelet/huh\" rel=\"noreferrer\">Huh\u003c/a>\u003c/p>\n\u003ch2 id=\"native-capture-remains-its-own-capability\">Native capture remains its own capability\u003c/h2>\n\u003cp>Drawing into a canvas and capturing other desktop windows have different requirements. Browser screen capture requires an explicit user gesture and renewed permission; an arbitrary webview may not implement the full API. Linux's screenshot portal has its own request/response and capability model. Reusing screencap's interaction concept is sensible, but the platform capture implementation should live behind a capability rather than be implied by loading HTML. \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/MediaDevices/getDisplayMedia\" rel=\"noreferrer\">getDisplayMedia\u003c/a>, \u003ca href=\"https://flatpak.github.io/xdg-desktop-portal/docs/doc-org.freedesktop.portal.Screenshot.html\" rel=\"noreferrer\">XDG Screenshot portal\u003c/a>\u003c/p>\n\u003ch2 id=\"recommended-next-comparison\">Recommended next comparison\u003c/h2>\n\u003cp>When implementation is authorized, exercise a bundled-engine candidate against the \u003ca href=\"#/research/bundled-renderers\">focused comparison\u003c/a>, using the same HTML and JSON forms, slider preview, close/reopen behavior, and blob submission. Compare actual packaging on macOS, Windows, and a named Linux baseline; test keyboard input, IME, accessibility, focus, and clipboard behavior. Do not choose on unverified download-size claims alone.\u003c/p>\n\u003cp>The accepted fallback is a bundled Chromium/Electron renderer, distinct from opening the user's installed browser. The latter can remain an optional extension. Remote/container transport is deferred by the first interview.\u003c/p>\n","backlinks":["research/index","research/renderer-health"]},{"id":"verification/desktop","title":"Verify a portable desktop build","section":"Verification","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-22\u003c/span>","updated":"2026-10-22","summary":"","source":"---\ntitle: Verify a portable desktop build\nupdated: 2026-10-22\n---\n# Verify a portable desktop build\n\nRun on the target desktop after copying/extracting the **whole** portable\ndirectory. Go, Node, npm and a separately installed browser are unnecessary.\nHosted macOS and Windows renderer fixtures pass; physical input and\nclean-machine journeys still need this separate check. The Ubuntu 24.04\nportable renderer currently fails at sandbox startup; the bundled wiki's\nhosted-platform report records the failure. Record the OS/version/architecture and\n`BUILD.json` with the results. Do not bypass OS security protections or disable\nChromium's sandbox if startup fails; record the actual error.\n\nThe accepted Linux policy is no-install on explicitly verified environments.\nThe bundled `docs/wiki/platforms.md` lists the evidence and limits. A\n`renderer_startup_failed` result identifies its `worker.log`; preserve both.\nUbuntu 22.04's hosted workflow passes without WebGL, but that is not proof of\nevery Linux desktop. A green Ubuntu 24.04 CI job verifies the core and startup\nfailure diagnostics, not UI support.\n\n## Windows PowerShell\n\nOpen PowerShell in the extracted directory. Use a disposable state directory:\n\n```powershell\n$env:FUNGI_STATE_DIR = Join-Path $env:TEMP ('fungi-check-' + [guid]::NewGuid().ToString('N'))\nGet-Content .\\BUILD.json\n.\\fungi.exe describe\n.\\fungi.exe open --exec .\\examples\\helper.exe --delivery wait\n$opened = .\\fungi.exe open .\\examples\\compare\\index.html --delivery manual | ConvertFrom-Json\n$opened\n```\n\nThe helper should return `submitted` with a readable text artifact. In the\ncomparison window, move the divider, select a preference and enter a test\nnote. Wait for **Draft saved**, then close using the window's close button.\nCollect once and reopen:\n\n```powershell\n.\\fungi.exe collect $opened.session\n$reopened = .\\fungi.exe reopen $opened.session --delivery manual | ConvertFrom-Json\n$reopened\n```\n\nThe first outcome should be `closed`. The reopened window should restore the\ndivider, preference and note. Click **Send review**, then collect once:\n\n```powershell\n$result = .\\fungi.exe collect $reopened.session | ConvertFrom-Json\n$result | ConvertTo-Json -Depth 20\nGet-FileHash -Algorithm SHA256 $result.artifacts[0].path\n```\n\nExpect `submitted`, matching data and a `comparison` PNG whose SHA-256 matches\nthe returned metadata. Open that PNG to check the captured view. A blocked\nlaunch, lost draft, missing image or failed hash is a failed observation; keep\nthe session directory for diagnosis.\n\nFor a cancellation check, launch the comparison again with manual delivery,\nclick **Cancel**, and collect that exact session once. Expect `cancelled`.\nNo script execution-policy or machine configuration change is required.\n\n## Linux or another Mac\n\nUse the same sequence with POSIX commands and the paths from each receipt:\n\n```sh\nexport FUNGI_STATE_DIR=\"$(mktemp -d)/sessions\"\ncat BUILD.json\n./fungi describe\n./fungi open --exec ./examples/helper --delivery wait\n./fungi open ./examples/compare/index.html --delivery manual\n# After closing the window with an acknowledged draft:\n./fungi collect EXACT_SESSION_ID\n./fungi reopen EXACT_SESSION_ID --delivery manual\n# After submitting the reopened window:\n./fungi collect NEW_SESSION_ID\n```\n\nUse `sha256sum ARTIFACT_PATH` on Linux or `shasum -a 256 ARTIFACT_PATH` on macOS.\nLinux needs a supported desktop environment and the shared OS libraries used\nby Electron. A container-only Go pass does not validate windowing, graphics,\nclipboard, sandbox startup or a clean distribution. Record missing library or\nsandbox errors instead of prescribing installation as a passing no-setup test.\n\n## Return the observations\n\nKeep the build metadata, terminal results, any exact errors and the test-only\nstate directory. State whether draft restoration and the PNG looked correct.\nRecord automatic agent delivery separately using an already supported native\nhost route; this recipe deliberately uses manual delivery to isolate desktop\nbehavior. No model polling or repeated status calls are needed.\n","toc":[{"id":"windows-powershell","title":"Windows PowerShell","depth":2},{"id":"linux-or-another-mac","title":"Linux or another Mac","depth":2},{"id":"return-the-observations","title":"Return the observations","depth":2}],"titleAnchor":"verify-a-portable-desktop-build","links":[],"attachments":[],"html":"\u003cp>Run on the target desktop after copying/extracting the \u003cstrong>whole\u003c/strong> portable\ndirectory. Go, Node, npm and a separately installed browser are unnecessary.\nHosted macOS and Windows renderer fixtures pass; physical input and\nclean-machine journeys still need this separate check. The Ubuntu 24.04\nportable renderer currently fails at sandbox startup; the bundled wiki's\nhosted-platform report records the failure. Record the OS/version/architecture and\n\u003ccode>BUILD.json\u003c/code> with the results. Do not bypass OS security protections or disable\nChromium's sandbox if startup fails; record the actual error.\u003c/p>\n\u003cp>The accepted Linux policy is no-install on explicitly verified environments.\nThe bundled \u003ccode>docs/wiki/platforms.md\u003c/code> lists the evidence and limits. A\n\u003ccode>renderer_startup_failed\u003c/code> result identifies its \u003ccode>worker.log\u003c/code>; preserve both.\nUbuntu 22.04's hosted workflow passes without WebGL, but that is not proof of\nevery Linux desktop. A green Ubuntu 24.04 CI job verifies the core and startup\nfailure diagnostics, not UI support.\u003c/p>\n\u003ch2 id=\"windows-powershell\">Windows PowerShell\u003c/h2>\n\u003cp>Open PowerShell in the extracted directory. Use a disposable state directory:\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\">$env:FUNGI_STATE_DIR = Join-Path $env:TEMP ('fungi-check-' + [guid]::NewGuid().ToString('N'))\nGet-Content .\\BUILD.json\n.\\fungi.exe describe\n.\\fungi.exe open --exec .\\examples\\helper.exe --delivery wait\n$opened = .\\fungi.exe open .\\examples\\compare\\index.html --delivery manual | ConvertFrom-Json\n$opened\n\u003c/code>\u003c/pre>\n\u003cp>The helper should return \u003ccode>submitted\u003c/code> with a readable text artifact. In the\ncomparison window, move the divider, select a preference and enter a test\nnote. Wait for \u003cstrong>Draft saved\u003c/strong>, then close using the window's close button.\nCollect once and reopen:\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\">.\\fungi.exe collect $opened.session\n$reopened = .\\fungi.exe reopen $opened.session --delivery manual | ConvertFrom-Json\n$reopened\n\u003c/code>\u003c/pre>\n\u003cp>The first outcome should be \u003ccode>closed\u003c/code>. The reopened window should restore the\ndivider, preference and note. Click \u003cstrong>Send review\u003c/strong>, then collect once:\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\">$result = .\\fungi.exe collect $reopened.session | ConvertFrom-Json\n$result | ConvertTo-Json -Depth 20\nGet-FileHash -Algorithm SHA256 $result.artifacts[0].path\n\u003c/code>\u003c/pre>\n\u003cp>Expect \u003ccode>submitted\u003c/code>, matching data and a \u003ccode>comparison\u003c/code> PNG whose SHA-256 matches\nthe returned metadata. Open that PNG to check the captured view. A blocked\nlaunch, lost draft, missing image or failed hash is a failed observation; keep\nthe session directory for diagnosis.\u003c/p>\n\u003cp>For a cancellation check, launch the comparison again with manual delivery,\nclick \u003cstrong>Cancel\u003c/strong>, and collect that exact session once. Expect \u003ccode>cancelled\u003c/code>.\nNo script execution-policy or machine configuration change is required.\u003c/p>\n\u003ch2 id=\"linux-or-another-mac\">Linux or another Mac\u003c/h2>\n\u003cp>Use the same sequence with POSIX commands and the paths from each receipt:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">export FUNGI_STATE_DIR=\"$(mktemp -d)/sessions\"\ncat BUILD.json\n./fungi describe\n./fungi open --exec ./examples/helper --delivery wait\n./fungi open ./examples/compare/index.html --delivery manual\n# After closing the window with an acknowledged draft:\n./fungi collect EXACT_SESSION_ID\n./fungi reopen EXACT_SESSION_ID --delivery manual\n# After submitting the reopened window:\n./fungi collect NEW_SESSION_ID\n\u003c/code>\u003c/pre>\n\u003cp>Use \u003ccode>sha256sum ARTIFACT_PATH\u003c/code> on Linux or \u003ccode>shasum -a 256 ARTIFACT_PATH\u003c/code> on macOS.\nLinux needs a supported desktop environment and the shared OS libraries used\nby Electron. A container-only Go pass does not validate windowing, graphics,\nclipboard, sandbox startup or a clean distribution. Record missing library or\nsandbox errors instead of prescribing installation as a passing no-setup test.\u003c/p>\n\u003ch2 id=\"return-the-observations\">Return the observations\u003c/h2>\n\u003cp>Keep the build metadata, terminal results, any exact errors and the test-only\nstate directory. State whether draft restoration and the PNG looked correct.\nRecord automatic agent delivery separately using an already supported native\nhost route; this recipe deliberately uses manual delivery to isolate desktop\nbehavior. No model polling or repeated status calls are needed.\u003c/p>\n","backlinks":["platforms","verification/runs/2026-10-22-hosted","verification/runs/2026-10-22-platform","verification/setup","verification/windows"]},{"id":"verification/runs/2026-10-20-first-proof","title":"First prototype verification","section":"Verification","order":0,"metadata":{"result":"Untested"},"metadataHtml":"\u003cspan>Result: Untested\u003c/span> \u003cspan>Last updated: 2026-10-20\u003c/span>","updated":"2026-10-20","summary":"","source":"---\ntitle: First prototype verification\nupdated: 2026-10-20\nresult: Untested\n---\n# First prototype verification\n\nThis report preserves the initial run and its original scope. The [no-setup follow-up](2026-10-20-no-setup.md) records the later user decision, successful Kimi authentication, native image journeys and manual-fallback verification.\n\nThe prototype implements the Go owner, Electron bridge, flat forms, HTML authoring, artifacts, recovery and delivery modes. **The accepted six-harness AFK milestone is incomplete.** The aggregate is Untested because required paths remain unavailable or unverified.\n\n## Scope and build\n\nSelected features: [FEAT-sessions](../../features/sessions.md), [FEAT-interfaces](../../features/interfaces.md), [FEAT-delivery](../../features/delivery.md). The run emphasizes result correctness and return paths before UI breadth.\n\nThere is no Git revision. [Source/build manifest](../../evidence/2026-10-20-first-proof/manifest.json) records exact content hashes and tested binary identities. The final harness batch used binary SHA-256 `b52f2fd7cb5e28f981d2653495b2998c0a7aa882dfda1a2e8889e051350512ec`. Subsequent edits added form-default validation and adjusted the reference paste/menu UI; they did not change the pipe transport. The final core suite was rerun. Separate native tests exercised the final package's paste target, cancellation and crash recovery.\n\nEnvironment: macOS arm64; Go 1.26.4; Electron 44.9.0; Node 22.19.0 for development. See [setup](../setup.md) for fixture isolation, account state and actual commands.\n\n## Results\n\n| Scenario | Expected and observed | Result | Evidence |\n| --- | --- | --- | --- |\n| Core lifecycle and storage | Real CLI/helper tests cover immutable results, repeated collection, concurrent sessions, image drafts, recovery, confinement, duplicate ownership and publication failure | Passed | [Go tests](../../evidence/2026-10-20-first-proof/go-tests.log) |\n| Lost waiting CLI | Kill the launching waiter; detached owner still saves the later submitted result | Passed | [Go tests](../../evidence/2026-10-20-first-proof/go-tests.log) |\n| Helper exit and stdout drain | Exit without result is failed; a fully emitted submitted result survives a later nonzero exit | Passed | [Go tests](../../evidence/2026-10-20-first-proof/go-tests.log) |\n| Uncertain notification | Saved result survives; an ambiguous failed acknowledgement is recorded and not resent | Passed | [Go tests](../../evidence/2026-10-20-first-proof/go-tests.log) |\n| JSON form with selected image | Native file picker → saved image draft → close → new linked session → restored preview → submission; returned file hash matches fixture | Passed | [Saved UI results](../../evidence/2026-10-20-first-proof/ui-results.json), [fixture image](../../evidence/2026-10-20-first-proof/reference.png) |\n| Custom HTML controls and storage retry | Local slider/preview and notes work; non-writable session directory rejects submit without losing input; restoring access permits submission | Passed | [Saved UI results](../../evidence/2026-10-20-first-proof/ui-results.json) |\n| Native image paste | Plain text rejected; pixels copied from Preview produce preview, saved draft and submitted 401-byte PNG with matching stored hash | Passed | [Saved UI results](../../evidence/2026-10-20-first-proof/ui-results.json), [pasted image](../../evidence/2026-10-20-first-proof/pasted-image.png) |\n| Native Cancel button | Explicit Cancel closes the window and saves `cancelled` without answer data | Passed | [Saved UI results](../../evidence/2026-10-20-first-proof/ui-results.json) |\n| Renderer crash and reopen | Kill only the fixture's page renderer: `failed`/`renderer_crashed`; reopen restores acknowledged draft in a new linked window; closing it saves `closed` | Passed | [Saved UI results](../../evidence/2026-10-20-first-proof/ui-results.json) |\n| Codex pending command | Actual Fungi helper response returned in the same disposable conversation after a ten-second silent wait | Passed | [Harness probes](../../evidence/2026-10-20-first-proof/harness-probes.json) |\n| OpenCode pending command | Canonical working directory; one Bash invocation; actual result consumed after a ten-second wait | Passed | [Harness probes](../../evidence/2026-10-20-first-proof/harness-probes.json) |\n| Pi pending command | One Bash call, timeout null; actual response consumed after 180 seconds | Passed | [Harness probes](../../evidence/2026-10-20-first-proof/harness-probes.json) |\n| Claude background completion | Background launch → WAITING/end turn → completion event → one output-file read → actual result after 180 seconds | Passed | [Harness probes](../../evidence/2026-10-20-first-proof/harness-probes.json) |\n| Grok background completion | Background launch → WAITING → completion → one completed-output retrieval → actual result after 180 seconds | Passed | [Harness probes](../../evidence/2026-10-20-first-proof/harness-probes.json) |\n| Codex exact-conversation callback consumption | Native-helper notice queued during the active turn reached the originating conversation after that turn ended; one collect returned submitted data and its artifact | Passed | [Callback observation](../../evidence/2026-10-20-first-proof/codex-callback.json) |\n| Corrected self-contained Codex notice | Native-form notice reached the originating conversation with full executable, arguments and state-directory environment; one collect using those values returned `closed` | Passed | [Corrected callback observation](../../evidence/2026-10-20-first-proof/codex-callback-corrected.json) |\n| Kimi result delivery | Installed CLI rejected the test before tool execution: selected provider has no credential | Untested | [Harness probes](../../evidence/2026-10-20-first-proof/harness-probes.json) |\n| Arbitrary AFK duration and all-six native UI loop | Three-minute synthetic waits do not establish unlimited waits, sleep/wake reliability, or a native human interaction in every harness | Untested | [Delivery limitations](../../features/delivery.md#coverage-and-limitations) |\n| Portable local launch | Corrected directory's internal symlinks remain within the package; HTML UI launches with PATH restricted to `/usr/bin:/bin`, so no external Node/npm is used | Passed | [Package metadata](../../evidence/2026-10-20-first-proof/manifest.json), [UI result](../../evidence/2026-10-20-first-proof/ui-results.json) |\n| Downloaded clean-machine release | No notarized distribution, quarantine/Gatekeeper or fully disconnected clean-machine test | Untested | [Setup limits](../setup.md#observation-and-cleanup) |\n\nThe three-minute batches took approximately 190 seconds (Pi), 193 seconds (Claude) and 194 seconds (Grok), including model startup/final response time. Claude supplied a 600,000 ms tool timeout. That successful bounded test must not be described as an unlimited AFK guarantee. No repeated model status calls occurred during these waits; Claude and Grok each retrieved output once after completion.\n\nThe portable folder contains approximately 315 MiB before the final documentation refresh. One idle `ps` sample of the open demo found 5.8 MiB RSS for its Go owner and 262.6 MiB across four Electron processes, each showing 0% sampled CPU. This is one observation, not a peak-memory or cross-machine benchmark; the demo could also receive user edits. [Resource sample](../../evidence/2026-10-20-first-proof/resources.json)\n\n## Earlier failures and corrections\n\n1. Pi's default `gpt-5.5` was rejected by the existing provider. A supported model was selected only for the test invocation.\n2. Kimi failed for missing credentials. No attempt was made to obtain or change credentials.\n3. Codex read-only mode could not create session storage. Workspace-write exposed the initial loopback-listener restriction. Removing HTTP in favor of pipes and OS file locks made the subsequent Codex probe pass.\n4. OpenCode rejected a non-canonical `/var/...` working directory as external. Using the canonical `/private/var/...` path resolved the test's permission mismatch; permissions were not broadened.\n5. Electron's first asset loader called a network loader that its own request filter blocked. A confined direct file handler corrected it; native forms and HTML then rendered.\n6. The first package copy altered framework symlinks and failed to find ICU data. Preserving literal symlinks corrected the next build. The failed build is not a distributable.\n7. Early image-paste attempts did not establish a working clipboard/focus fixture. An explicit editable target was added; a separate one-image form kept it visible and passed native paste, draft save and submission. Other demo windows received user edits, which were preserved. The default development reload menu was removed; explicit close/reopen is the supported restoration path. A final one-line adjustment clears a previous paste-error banner when a valid image is accepted; it does not change artifact transport.\n8. The first Codex callback notice omitted a non-default state directory. That notice was subsequently consumed successfully using the launch context. New notices include the executable, argument array and state-directory environment; a subsequent native-form notice was consumed using those supplied values and returned the saved `closed` outcome.\n\n## Limits and next decision\n\nThe core is usable for further authoring experiments, and the macOS folder is a development package. The milestone is not complete. Resolve whether optional harness integrations may be loaded when ordinary shell tools have bounded lifetimes, and have the user authenticate Kimi. Then finish exact-caller/idle-agent delivery, longer AFK tests and the combined UI journey in all six harnesses.\n\nTesting was performed by the implementing agent; there was no independent reviewer. Wiki structure validation checks documentation integrity only.\n","toc":[{"id":"scope-and-build","title":"Scope and build","depth":2},{"id":"results","title":"Results","depth":2},{"id":"earlier-failures-and-corrections","title":"Earlier failures and corrections","depth":2},{"id":"limits-and-next-decision","title":"Limits and next decision","depth":2}],"titleAnchor":"first-prototype-verification","links":["verification/runs/2026-10-20-no-setup","features/sessions","features/interfaces","features/delivery","verification/setup","features/delivery","verification/setup"],"attachments":[{"path":"evidence/2026-10-20-first-proof/manifest.json","sha256":"4558674f2e6db0efbb54b612ef45d67af8adeae7dc7a558794ea9e333343762a"},{"path":"evidence/2026-10-20-first-proof/go-tests.log","sha256":"825880be694bb00a2d145015a7779814e1d89aa490292471e05f53e3e1480653"},{"path":"evidence/2026-10-20-first-proof/ui-results.json","sha256":"fef0198e823840376507889b535b1340a40f85b8416a826b7f296a29319b832c"},{"path":"evidence/2026-10-20-first-proof/reference.png","sha256":"1bd7e798fbfd3bd20de881435c7bfa7811db8466e73714a8ab7c1af6b7460e9a"},{"path":"evidence/2026-10-20-first-proof/pasted-image.png","sha256":"83e160394a50c08746093b421e7bbf7865d6591aac9f9b2d1f0850bea504c2d9"},{"path":"evidence/2026-10-20-first-proof/harness-probes.json","sha256":"e74063b94fc26ec72c7b75c6fce67d041778d0fc262c552e1cd0de920d319978"},{"path":"evidence/2026-10-20-first-proof/codex-callback.json","sha256":"9146ba86dcd81227a29a371d3fe37f0566f28fdbe66732f43e39eac8070c1161"},{"path":"evidence/2026-10-20-first-proof/codex-callback-corrected.json","sha256":"92c760a57f3898ff82236b6eb7c5e6dfa2566ca7de180d18cc5fa83a7b9eccf0"},{"path":"evidence/2026-10-20-first-proof/resou
