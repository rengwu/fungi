through C, old result immutable, artifact retained, rollback and later pruning succeed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Invalid downloads/archive paths\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Oversize, partial and missing HTTP responses rejected; ZIP traversal/absolute/drive paths, duplicate files, escaping links and TAR hardlinks rejected; normal symlinks/modes survive Unix round trips\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Shell bootstrap on development Mac\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-23-distribution/mac-install.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 1da54201783d621b89a2c1189e8a3bf7af6ada5addc6bd5f007806f9020ae10b\">Download evidence\u003c/a>: exactly one matching archive plus checksum fetched from a local fixture server, checksum checked, space-containing destination installed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Open Electron session across update\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>A acknowledges draft and PNG, B activates, A submits, original stable receipt collects the matching saved answer; \u003ca href=\"evidence/2026-10-23-distribution/submitted.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 229f4824e40ed5d6dbf4ba83b81ec3a4277153481fc5f3e0cb2635d3c048b7c0\">PNG\u003c/a> hash verified, rollback selects A\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Installed renderer regression\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-23-distribution/mac-renderer.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 9a8f27131105cdb4a8e0dc1db97bf371b3264da74d32d47edbf2d9b68952a074\">All 21 checks\u003c/a>, including WebGL, cancel/reopen, restored Blob, submission and hash through the stable installed command\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hosted macOS, Windows and Linux install/update paths\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Initial CI completed all four jobs, including actual platform bootstraps and local archive updates; Ubuntu 24.04 intentionally omits UI\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Runtime sharing, changed files and cleanup\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-23-distribution/runtime-reuse-tests.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: b9dbc02f051ca9decbb0befcf6c9632f363a467602a34e54eefc99b08b0ba122\">Race-enabled follow-up\u003c/a>: unchanged file shares an inode, changed file stays separate, removing the old directory preserves the new runtime; managed lifecycle regression passes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Actual Mac runtime sharing during update\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-23-distribution/mac-runtime-reuse.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: ee2c9e414726c65e8a7747f49d96451d8dbd3440770fe8b1bc54ffc0903a7f5b\">Install evidence\u003c/a>: runtime executable shares an inode; open session submits with matching PNG hash; rollback succeeds\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Renderer regression with shared runtime\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-23-distribution/mac-runtime-renderer.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e6649742caccb1f2ff813655f13f03e92caa597e3b11f7afab8724e46ecfd911\">All 21 checks\u003c/a> pass through the stable installed command after the sharing update and rollback, including WebGL and draft/Blob recovery\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hosted runtime-sharing follow-up\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Mac passes on \u003ccode>af2dbee\u003c/code>; \u003ca href=\"evidence/2026-10-23-distribution/windows-runtime-reuse.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: d22f2f7addaa1bbc9c0dc7ffb0448b93e0d02a1bf21028f3c2b55038f4f1600b\">Windows\u003c/a>, \u003ca href=\"evidence/2026-10-23-distribution/linux22-runtime-reuse.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 53789fce8e5fef1052e7153b8a5e6d6958379bfc4fcbb02be654b25d39e1d6a6\">Ubuntu 22.04\u003c/a> and \u003ca href=\"evidence/2026-10-23-distribution/linux24-runtime-reuse.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: fb3550de89541196ae6fc76ecb2e2f3b317d69b23aca7281fd39501de3d8f1c1\">Ubuntu 24.04 core\u003c/a> pass on \u003ccode>6d587ac\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Windows disconnect regression follow-up\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>The handshake correction passes on Windows and both Linux runners at \u003ccode>8bd24a0\u003c/code>; the following wiki check stopped their installer/renderer stages\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Fresh-checkout generated wiki\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Corrected generation passes a local export of staged files and the Windows/Linux hosted checks; the CRLF failure remains recorded below\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Latest complete CI matrix\u003c/td>\n\u003ctd>Untested\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/rengwu/fungi/actions/runs/39848109685\" rel=\"noreferrer\">Run 39848109685\u003c/a> passes Windows and both Linux jobs on \u003ccode>6d587ac\u003c/code>; attempts 1 and 2 Mac ran zero steps due to hosted capacity; no further retry is armed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CI-wait callback through managed installation\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-23-distribution/ci-callback.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 7f705290d96921f767d87cc3cdf034b69780c6aeec9c01f388aa881b2948d527\">Callback evidence\u003c/a>: both CI attempts saved their failure result, delivered a Codex notice to the originating conversation and were each collected once\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The first unsafe-archive test attempt reused a ZIP header object and failed in\nthe test writer. A fresh duplicate header corrected the fixture. The first\nmanaged-path assertion also exposed macOS \u003ccode>/var\u003c/code> versus \u003ccode>/private/var\u003c/code> aliases;\npackage-reference matching now resolves existing symlinks before retaining\nassets. The rerun passes. No failed product assertion was simply removed.\u003c/p>\n\u003cp>\u003ca href=\"https://github.com/rengwu/fungi/actions/runs/39844997609\" rel=\"noreferrer\">Follow-up CI 39844997609\u003c/a>\non \u003ccode>af2dbee1ea02bb0d2fe36f892e7fab985a6663c5\u003c/code> failed overall because the\nWindows driver terminated PowerShell at exactly 180 seconds (\u003ccode>killed: true\u003c/code>,\n\u003ccode>SIGTERM\u003c/code>); it had requested both release files but produced no stage output.\nThe update/sharing assertions therefore did not execute there. Preserve the\n\u003ca href=\"evidence/2026-10-23-distribution/ci-39844997609.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: d41505912c9e17457d42c9042483224a543ec577eb7892856edfcccb5cfecebf\">failed log\u003c/a> and\n\u003ca href=\"evidence/2026-10-23-distribution/ci-39844997609.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 1fe2ed0d4253e28665184fc518fe74c42cd27aa87152d4ae77e923f0b3e023bc\">job metadata\u003c/a>.\nThe prior Windows run took about 165 seconds for this entire scenario.\u003c/p>\n\u003cp>The correction adds bootstrap stage messages, records elapsed time and failure\nsignal metadata, and gives Windows extraction a 300-second fixture bound.\nIt also replaces per-chunk PowerShell progress with the concise stage messages;\n\u003ca href=\"https://github.com/microsoft/PowerShellForGitHub/issues/227\" rel=\"noreferrer\">Microsoft's module issue\u003c/a>\ndocuments this source of download overhead. The original timeout's exact\nphase is unknown, so progress rendering is a plausible contributor, not an\nestablished root cause. All functional assertions remain unchanged. No human\nwait timeout or host security setting changed.\u003c/p>\n\u003cp>The \u003ca href=\"https://github.com/rengwu/fungi/actions/runs/39846391476\" rel=\"noreferrer\">next Windows attempt\u003c/a>\non \u003ccode>58edcc6\u003c/code> stopped before the installer in\n\u003ccode>TestDisconnectedWaiterDoesNotCancel\u003c/code>: the test killed the CLI after one\nsecond and expected its ten-second helper's result eleven seconds later.\nThe result was absent; \u003ca href=\"evidence/2026-10-23-distribution/windows-120060671977.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: ae29cdd1a5af863988c8b1027b528edd5dab5ea1fb95928cfeeecc13bf294d36\">job log\u003c/a>\npreserves the failure. Those sleeps did not establish that the owner had\nstarted or the helper had completed. Without worker diagnostics from that\nattempt, delayed startup is an inference rather than a proven cause.\u003c/p>\n\u003cp>The correction uses the existing bounded helper gate: wait for an acknowledged\ndraft/readiness marker, kill the actual waiting CLI, assert no result exists,\nrelease submission and require the saved submitted result. It adds worker\ndiagnostics on failure. The fixture's observable-condition deadline is thirty\nseconds, matching the product startup bound; there is no fixed startup sleep\nor human polling. The queued Mac job in that superseded run was cancelled;\nboth Linux jobs had already passed; \u003ca href=\"evidence/2026-10-23-distribution/ci-39846391476.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: c51481ab353fd17b5b6244c837eeec778354d965afc574520a7f71f9ba04e78e\">job metadata\u003c/a>\nrecords that cancellation. The new committed-source rerun will cover\nall four targets.\u003c/p>\n\u003cp>The \u003ca href=\"evidence/2026-10-23-distribution/fixture-handshake-tests.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 1c14b1a00f656c3c39e198be3c43573b0530f498910ae7b3aa71c83cf3c56c82\">local race-enabled handshake and managed-update retest\u003c/a>\npassed before this follow-up was committed; it does not establish the Windows\nresult.\u003c/p>\n\u003cp>\u003ca href=\"https://github.com/rengwu/fungi/actions/runs/39847366853\" rel=\"noreferrer\">CI 39847366853\u003c/a>\non \u003ccode>8bd24a0\u003c/code> passed core and Node tests on Windows and both Linux targets,\nincluding the corrected disconnect assertion. All three then failed the wiki\nfreshness check, before renderer/installer stages. The \u003ca href=\"evidence/2026-10-23-distribution/windows-120064065885.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 9b80770b5d7f7507b546484247b6a42100ff166256fc8132d350cb885ac33175\">Windows log\u003c/a>\nand \u003ca href=\"evidence/2026-10-23-distribution/ci-39847366853.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 4f335cddefdad89af384e6c88738ce3983bdc266ffad5212214804a305ebe568\">metadata\u003c/a>\nrecord it. This was reproduced in a fresh local export of that commit:\nthe saved Windows job log had CRLF in the working tree when the wiki hashed\nattachments, but Git stored LF per repository policy. Normalize the evidence\nbefore rebuilding and verify a fresh staged checkout as well as the working\ntree. No wiki assertion is removed. The superseded queued Mac job was cancelled.\u003c/p>\n\u003cp>The corrected Windows run completed the bootstrap in \u003cstrong>11,773 ms\u003c/strong>, then passed\nthe real Electron session, shared-file, collected PNG and rollback assertions.\nBoth Linux jobs also passed their declared scopes. The final\n\u003ca href=\"evidence/2026-10-23-distribution/ci-39848109685.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 5659e461c38e1e175ce4dd9598a9e4fe7668f0efa063c1c571437bb14be6e654\">attempt 1 metadata\u003c/a>\nrecords an overall CI failure because Mac was cancelled after fifteen minutes\nwithout an assigned runner or any executed steps. GitHub's\n\u003ca href=\"evidence/2026-10-23-distribution/mac-capacity-attempt1.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 6ff3aff5fb183aac9592fe0a4fe138af96f91c3695667c591c7e271ec5034456\">annotations\u003c/a>\nstate that the job was not acquired by a hosted runner and identify macOS arm64\ncapacity constraints. This leaves the latest Mac scope untested; it is not a\nfailed product assertion. The single Mac-only retry on the same source also\nended after fifteen minutes without a runner or any steps. Its\n\u003ca href=\"evidence/2026-10-23-distribution/ci-39848109685-attempt2.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: f41abc6d080cc4c2daa4440b8c0cbd01d5c8b6e4a4e3066ae17072f23e708728\">final metadata\u003c/a>,\n\u003ca href=\"evidence/2026-10-23-distribution/mac-job-attempt2.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 709e4d3d8402f37a2e9b4c9f12327938cad72726059c720c75dd3f4fb7b1e637\">Mac job record\u003c/a> and\n\u003ca href=\"evidence/2026-10-23-distribution/mac-capacity-attempt2.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 6ff3aff5fb183aac9592fe0a4fe138af96f91c3695667c591c7e271ec5034456\">annotations\u003c/a>\npreserve the same capacity diagnosis. The earlier Windows/Linux successes\nremain valid; they were not rerun in attempt 2. There is no third automatic\nattempt or pending watcher. The latest hosted Mac scope remains externally\nblocked until runner capacity is available.\u003c/p>\n\u003cp>Fungi's separate CI-wait helper saved that failed CI conclusion and sent a\nCodex notice to the originating conversation. The agent received it and\ncollected the exact session once. The helper's \u003ccode>watchError: exit status 1\u003c/code>\nreflects the CI conclusion, not a failed Fungi delivery. The\n\u003ca href=\"evidence/2026-10-23-distribution/ci-callback.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 7f705290d96921f767d87cc3cdf034b69780c6aeec9c01f388aa881b2948d527\">callback evidence\u003c/a>\nrecords both observed returns. The retry's notice also reached this\nconversation, and its exact session was collected once. Each wait used one\nlocal helper with no model polling. Both helpers have finished; no callback\nis pending. This proves the installed callback path for these fixtures, not\ncallback delivery during an update. The final matrix result is not inferred\nfrom the earlier Mac success.\u003c/p>\n\u003ch2 id=\"size-observations\">Size observations\u003c/h2>\n\u003cp>\u003ca href=\"evidence/2026-10-23-distribution/runtime-storage.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: a7f7403afd3e61171470102f9dd46ec294c619a0b0a27111bc79fc619fee2443\">Filesystem measurement\u003c/a>\nof the two retained Mac versions records 658,133,714 logical bytes and\n335,661,895 bytes in unique regular files: \u003cstrong>322,471,819 bytes (307.5 MiB)\nshared\u003c/strong>. These figures exclude the small stable launcher and filesystem\noverhead; they are not download sizes. Electron's locales, GPU fallback and\nlicense notices remain intact. File sharing does not reduce full-archive\ndownload traffic or the space needed to stage an update. Unsupported hard\nlinks fall back to independent verified copies.\u003c/p>\n\u003cp>The Windows hosted update shares \u003cstrong>386,397,410 bytes (368.5 MiB)\u003c/strong> of runtime\nfiles; both Linux updates share \u003cstrong>297,192,653 bytes (283.4 MiB)\u003c/strong>. These are\nretained-storage savings for an unchanged Electron version, not reductions\nto first-download sizes.\u003c/p>\n\u003ch2 id=\"limits-and-follow-up\">Limits and follow-up\u003c/h2>\n\u003cp>The local HTTP fixture proves the bootstrap download path; updates use an\nexplicit local archive, not a live GitHub release. HTTP failures are tested\nseparately. A saved receipt was collected through the stable command; actual\nagent queue delivery during an update is not claimed here. UI actions in this\nrun are automated page fixtures, not native human keyboard/mouse input.\u003c/p>\n\u003cp>Physical Windows and Linux installation, fresh-shell PATH integration,\ndownloaded/quarantined consumer packages, signing/notarization, release\npublication, interruption during selector replacement and power-loss recovery\nremain unverified. Existing platform and harness limits remain in force.\nVerification was performed by the implementing agent; no independent review\nis claimed.\u003c/p>\n","backlinks":["index","planning","platforms","features/installation","features/sessions"]},{"id":"verification/runs/windows-2026-10-22-203907","title":"Windows desktop handoff (windows-2026-10-22-203907)","section":"Verification","order":0,"metadata":{"result":"Untested"},"metadataHtml":"\u003cspan>Result: Untested\u003c/span> \u003cspan>Last updated: 2026-10-23\u003c/span>","updated":"2026-10-23","summary":"","source":"---\ntitle: Windows desktop handoff (windows-2026-10-22-203907)\nupdated: 2026-10-23\nresult: Untested\n---\n# Windows desktop handoff (windows-2026-10-22-203907)\n\n**Untested overall; the visible desktop journey passed.** On this physical\nWindows 11 desktop, the portable package launched, accepted native input,\nacknowledged a draft, restored it after close/reopen, submitted the expected\nPNG and cancelled a separate session. Required symlink-dependent automated\nscenarios could not execute because this account lacks the fixture's symlink\nprivilege. Those are setup failures, not observed renderer or storage failures.\nNo product defect was observed and no product code was changed.\n\nThis executes the [Windows handoff](../windows.md) for\n[sessions](../../features/sessions.md) and\n[interfaces](../../features/interfaces.md). Verification began on\n2026-10-22 and finished on 2026-10-23, Asia/Kuala_Lumpur (UTC+08:00).\nThe implementing agent operated the synthetic fixture through native Windows\nmouse/keyboard input using computer-use 26.1013.40934 and `@oai/sky`.\nNo human questionnaire was answered and no independent review is claimed.\n\n## Source, environment and portable build\n\n- Branch: `foundation-hardening`; tested revision\n  `73eb9ad2a87cbd0ff274f2c9d99618c36839496e`.\n- The initial checkout was clean. No source edits were present when packaging;\n  this handoff adds documentation and evidence only.\n- OS: Microsoft Windows 11 Pro, version `10.0.26200`, build `26200`, native x64.\n- Harness: Codex CLI `0.163.0`; Go `1.26.5 windows/amd64`; Node `22.19.0`;\n  npm `10.9.3`; pinned Electron `44.9.0`.\n- Package: `dist/fungi-win32-x64-2026-10-22T12-43-04-614Z/`.\n- Executable SHA-256:\n  `6274b25d37ea37c280751f11141ec372bb402a2fd2b61dc3ad95f485eb5e66a5`,\n  independently matched against [BUILD.json](../../evidence/windows-2026-10-22-203907/BUILD.json).\n\n[Environment and toolchain provenance](../../evidence/windows-2026-10-22-203907/environment.json)\nrecords the exact build. Node and npm were initially absent from PATH. An\nofficial portable Node archive was downloaded into the ignored run directory,\nchecked against its published SHA-256 and used locally. No global toolchain\ninstallation or machine configuration change was made.\n\nSwitching from the older `main` checkout retained CRLF in 76 unchanged text\nfiles, despite this branch's `eol=lf` policy. The initial wiki check therefore\nreported stale output. Applying the existing LF policy made the same check\npass, with empty content and staged diffs before packaging. The\n[normalization record](../../evidence/windows-2026-10-22-203907/checkout-normalization.json)\nand both [initial](../../evidence/windows-2026-10-22-203907/wiki-check-baseline.log)\nand [corrected](../../evidence/windows-2026-10-22-203907/wiki-check-normalized.log)\nlogs retain that checkout issue. The generated wiki did not need a product fix.\n\n## Automated commands\n\nThe [command record](../../evidence/windows-2026-10-22-203907/commands.json)\nretains argv, exit codes, package paths and desktop command timestamps.\n\n| Command | Exit | Observation |\n| --- | --- | --- |\n| `npm.cmd ci --prefix renderer` | 0 | [Dependencies installed](../../evidence/windows-2026-10-22-203907/npm-ci.log) |\n| `node renderer/node_modules/electron/install.js` | 0 | [Pinned runtime downloaded](../../evidence/windows-2026-10-22-203907/electron-install.log) |\n| `node scripts/package.mjs --platform win32 --arch x64` | 0 | [Complete portable folder built](../../evidence/windows-2026-10-22-203907/package.log); executable hash matches metadata |\n| `go vet ./...` | 0 | [Passed](../../evidence/windows-2026-10-22-203907/go-vet.log) |\n| `go test -v ./...` | 1 | [17 of 18 root tests passed](../../evidence/windows-2026-10-22-203907/go-test.log); `TestArtifactConfinementAndLimits` stopped at fixture construction |\n| `node --test` | 1 | [Six of seven passed](../../evidence/windows-2026-10-22-203907/node-test.log); local asset test stopped at fixture construction |\n| `node docs/wiki/_build.mjs --check` | 1, then 0 | Passed after checkout line-ending normalization |\n| `node scripts/renderer-smoke.mjs \u003cpackage>/fungi.exe` | 1 | [Fixture setup failed](../../evidence/windows-2026-10-22-203907/renderer-smoke.log) before any renderer launch; all 21 capability checks remain unexecuted |\n\nThe Go failure says **A required privilege is not held by the client** at\n`store_test.go:93`. Node reports `EPERM` for `symlink` at\n`scripts/assets.test.mjs:15` and `scripts/renderer-smoke.mjs:28`.\nThese are the prerequisite failures anticipated by the handoff. No assertions\nwere removed, no symlink was replaced with a different fixture, and no\nDeveloper Mode, elevation, sandbox or WebGL policy change was used.\nThe complete suites are not reported as passing.\n\n## Visible desktop observations\n\nEvery packaged CLI invocation used an empty child PATH, an isolated\n`FUNGI_STATE_DIR`, no inherited `CODEX_THREAD_ID` and no renderer-directory\noverride. The test used the package's own executable, helper, HTML, assets\nand Electron runtime. `manual` delivery isolated desktop behavior.\n\n| Scenario | Result | Evidence and observation |\n| --- | --- | --- |\n| CLI and native helper | Passed | [Describe](../../evidence/windows-2026-10-22-203907/describe.json) and [helper result](../../evidence/windows-2026-10-22-203907/helper.json); readable [text artifact](../../evidence/windows-2026-10-22-203907/helper-note.txt), matching hash |\n| Portable window launch | Passed | [Launch receipt](../../evidence/windows-2026-10-22-203907/desktop-open.json); exact package process and unique fixture title selected; no OS launch block observed |\n| Native input and acknowledged draft | Passed | Dragged divider to 36%, selected After with keyboard/menu input, typed `WINDOWS-ACCEPTANCE-windows-2026-10-22-203907`; visible [Draft saved](../../evidence/windows-2026-10-22-203907/desktop-draft-saved.png), matching [saved data](../../evidence/windows-2026-10-22-203907/original-draft.json) |\n| Close and reopen | Passed | Native title-bar close, then [one collection](../../evidence/windows-2026-10-22-203907/desktop-closed.json) returned `closed`; [reopen receipt](../../evidence/windows-2026-10-22-203907/desktop-reopened.json) identifies a new session |\n| Visible restoration | Passed | [Restored divider](../../evidence/windows-2026-10-22-203907/desktop-restored-top.png), [preference/note/status](../../evidence/windows-2026-10-22-203907/desktop-restored.png), and [accessibility observation](../../evidence/windows-2026-10-22-203907/desktop-restored-ui.json) all match the acknowledged draft |\n| Submit and PNG | Passed | Clicked Send review, observed window closure, collected once; [submitted result](../../evidence/windows-2026-10-22-203907/desktop-submitted.json) retains all values and references the matching [comparison PNG](../../evidence/windows-2026-10-22-203907/comparison.png) |\n| Separate cancellation | Passed | [Fresh launch](../../evidence/windows-2026-10-22-203907/cancel-open.json), clicked visible [Cancel](../../evidence/windows-2026-10-22-203907/desktop-before-cancel.png), observed closure, [one collection](../../evidence/windows-2026-10-22-203907/desktop-cancelled.json) returned `cancelled` |\n\nThe original session is `89fed9e918766ea329b0113c77ab5561`; its\n[saved terminal result](../../evidence/windows-2026-10-22-203907/original-result-after-reopen.json)\nremains `closed` after the reopened session `8a5856276aae5d91a88ab8e95b846835`\nsubmitted. The [reopened launch](../../evidence/windows-2026-10-22-203907/reopened-launch.json)\nlinks those exact sessions. Cancellation is session\n`49a6f0d331dc3377d844dc0d3743a590`.\n\nThe exported PNG is 1200 by 600 pixels and 45,731 bytes. Its actual SHA-256\nmatches the returned metadata:\n`919a27da3ac5bb14c1efa3997d19d6ebb8512c7f42e36bc58e1ce3de9c181868`.\nIt was opened and visually checked against the native comparison view at 36%.\nThe three desktop sessions were each collected once after the terminal action;\nthere was no collection polling, DOM mutation or edited session data.\n\nThe native driver needed keyboard selection when dropdown coordinates extended\nbeyond the window, and refreshed screenshot coordinates when accessibility\nbounds became stale after scrolling. These were driver limitations, not\nfailed product scenarios. Desktop input/focus changed before cancellation;\nthe agent resumed at the user's request on 2026-10-23. That pause is not a\ncontrolled long-idle or sleep/wake test.\n\n## Evidence and remaining limits\n\n[Scenario observations](../../evidence/windows-2026-10-22-203907/observations.json)\nand the [evidence manifest](../../evidence/windows-2026-10-22-203907/manifest.json)\nrecord outcomes and file hashes. Personal path prefixes are replaced with\n`\u003crepo>`, `\u003ctemp>` and `\u003cuser>` in published text evidence. Original logs,\nreceipts, drafts, results and artifacts remain locally beneath\n`verification-output/windows-2026-10-22-203907/`; its `sessions/` directory is\nnot committed. All four [worker logs](../../evidence/windows-2026-10-22-203907/worker-logs.json)\nwere empty, and [cleanup observation](../../evidence/windows-2026-10-22-203907/cleanup.json)\nfound no remaining processes from the test package.\n\nThe physical desktop handoff is complete for launch, native input, draft\nrecovery, PNG submission/hash and cancellation on this machine. The aggregate\nremains **Untested** because the symlink-dependent core/asset tests and the\nfull 21-check renderer fixture were not exercised here. Existing hosted\nWindows coverage remains separate; it cannot fill those local gaps.\n\nThis source-built package running with an empty PATH does not establish a\nclean-machine or downloaded-archive launch through Windows security prompts.\nWindows clipboard, WebGL, automatic harness return, sleep/wake and power-loss\ndurability were not verified by this run. Public signing and broader platform\nsupport remain outside the observed scope.\n","toc":[{"id":"source-environment-and-portable-build","title":"Source, environment and portable build","depth":2},{"id":"automated-commands","title":"Automated commands","depth":2},{"id":"visible-desktop-observations","title":"Visible desktop observations","depth":2},{"id":"evidence-and-remaining-limits","title":"Evidence and remaining limits","depth":2}],"titleAnchor":"windows-desktop-handoff-windows-2026-10-22-203907","links":["verification/windows","features/sessions","features/interfaces"],"attachments":[{"path":"evidence/windows-2026-10-22-203907/BUILD.json","sha256":"7591fd657713f33a87bc66db420000a02497b6e5a39bc255b2da239dc1a7aece"},{"path":"evidence/windows-2026-10-22-203907/environment.json","sha256":"c3f7388dd0ba630f566a8491478156e000e5efd8aca8c6be4d251eae576ae422"},{"path":"evidence/windows-2026-10-22-203907/checkout-normalization.json","sha256":"b2b4e189161d6597f880e091cfbdea07dfe0ae6685c4d74b764289cf5461e65b"},{"path":"evidence/windows-2026-10-22-203907/wiki-check-baseline.log","sha256":"a329941f281fcb2b4a7c05a57244d2a6244373067789234859ba06daa45a4018"},{"path":"evidence/windows-2026-10-22-203907/wiki-check-normalized.log","sha256":"7c06fe8e562040923adab1a7f85a649b8ef8dafd9b9bfd3b2a7687e4fb247ed1"},{"path":"evidence/windows-2026-10-22-203907/commands.json","sha256":"f00f4d6727933c7f4d5e7554c7edd496d0fd30055909e433831004795f17791f"},{"path":"evidence/windows-2026-10-22-203907/npm-ci.log","sha256":"f53a16cb808fb52f78af55bac851af354d8552991235e613eca238a9d0008fab"},{"path":"evidence/windows-2026-10-22-203907/electron-install.log","sha256":"852ec5cd256681350843af4595936cc5bbdf21b06010d242f0b56d01c7ab54ef"},{"path":"evidence/windows-2026-10-22-203907/package.log","sha256":"43c7bbd5f98e9e8aca91d7020d6cd4a376d7c1ea9e5f3820923ddc9d1851911c"},{"path":"evidence/windows-2026-10-22-203907/go-vet.log","sha256":"852ec5cd256681350843af4595936cc5bbdf21b06010d242f0b56d01c7ab54ef"},{"path":"evidence/windows-2026-10-22-203907/go-test.log","sha256":"920ba53f1402ad8fd49499a388e1726aec4d8a6fb50cecb97d65078049b4851e"},{"path":"evidence/windows-2026-10-22-203907/node-test.log","sha256":"792383263b225187d171140f2858963f66c6de55c159215dbb5473f124641e27"},{"path":"evidence/windows-2026-10-22-203907/renderer-smoke.log","sha256":"7f677847924e9159a87ff54b45de44b9a3ccf084c450c3c88447aa4d38cff060"},{"path":"evidence/windows-2026-10-22-203907/describe.json","sha256":"9b25610ca705a43b3e808bdeb7915a2923c491d3d16823d87422647a7243fb33"},{"path":"evidence/windows-2026-10-22-203907/helper.json","sha256":"8b3463e62a99d06c202ef1e8c8d0f8d0c8d9bb297a94db0683efa87aa9677751"},{"path":"evidence/windows-2026-10-22-203907/helper-note.txt","sha256":"ef1b84da5133290bc7dfc017dbd2286b810edb1b655e9485caabc6343499a2ce"},{"path":"evidence/windows-2026-10-22-203907/desktop-open.json","sha256":"c87e18d7f008338a5e4db13a8522805b4c8c49c287f597b99a47952aa78bb7d1"},{"path":"evidence/windows-2026-10-22-203907/desktop-draft-saved.png","sha256":"cf8ac9b268b7bde8e38845a054ee0debcfbc1b78ca7ffb2b2195f13620c06e79"},{"path":"evidence/windows-2026-10-22-203907/original-draft.json","sha256":"a235a468c1b23ea09c9d92c5586d3a8a2a50cf7248e91b2fd94a769c9ea59f90"},{"path":"evidence/windows-2026-10-22-203907/desktop-closed.json","sha256":"8c42375c518efc3d75fdd9bd f334b995f3e7442301230a2201695d9af489c5db7501f4982"},{"path":"evidence/windows-2026-10-22-203907/cleanup.json","sha256":"17f3bc21020571e2fcc403ee039c78476ca088c1421009bcb5f3d8fc7b33cd54"}],"html":"\u003cp>\u003cstrong>Untested overall; the visible desktop journey passed.\u003c/strong> On this physical\nWindows 11 desktop, the portable package launched, accepted native input,\nacknowledged a draft, restored it after close/reopen, submitted the expected\nPNG and cancelled a separate session. Required symlink-dependent automated\nscenarios could not execute because this account lacks the fixture's symlink\nprivilege. Those are setup failures, not observed renderer or storage failures.\nNo product defect was observed and no product code was changed.\u003c/p>\n\u003cp>This executes the \u003ca href=\"#/verification/windows\">Windows handoff\u003c/a> for\n\u003ca href=\"#/features/sessions\">sessions\u003c/a> and\n\u003ca href=\"#/features/interfaces\">interfaces\u003c/a>. Verification began on\n2026-10-22 and finished on 2026-10-23, Asia/Kuala_Lumpur (UTC+08:00).\nThe implementing agent operated the synthetic fixture through native Windows\nmouse/keyboard input using computer-use 26.1013.40934 and \u003ccode>@oai/sky\u003c/code>.\nNo human questionnaire was answered and no independent review is claimed.\u003c/p>\n\u003ch2 id=\"source-environment-and-portable-build\">Source, environment and portable build\u003c/h2>\n\u003cul>\n\u003cli>Branch: \u003ccode>foundation-hardening\u003c/code>; tested revision\n\u003ccode>73eb9ad2a87cbd0ff274f2c9d99618c36839496e\u003c/code>.\u003c/li>\n\u003cli>The initial checkout was clean. No source edits were present when packaging;\nthis handoff adds documentation and evidence only.\u003c/li>\n\u003cli>OS: Microsoft Windows 11 Pro, version \u003ccode>10.0.26200\u003c/code>, build \u003ccode>26200\u003c/code>, native x64.\u003c/li>\n\u003cli>Harness: Codex CLI \u003ccode>0.163.0\u003c/code>; Go \u003ccode>1.26.5 windows/amd64\u003c/code>; Node \u003ccode>22.19.0\u003c/code>;\nnpm \u003ccode>10.9.3\u003c/code>; pinned Electron \u003ccode>44.9.0\u003c/code>.\u003c/li>\n\u003cli>Package: \u003ccode>dist/fungi-win32-x64-2026-10-22T12-43-04-614Z/\u003c/code>.\u003c/li>\n\u003cli>Executable SHA-256:\n\u003ccode>6274b25d37ea37c280751f11141ec372bb402a2fd2b61dc3ad95f485eb5e66a5\u003c/code>,\nindependently matched against \u003ca href=\"evidence/windows-2026-10-22-203907/BUILD.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 7591fd657713f33a87bc66db420000a02497b6e5a39bc255b2da239dc1a7aece\">BUILD.json\u003c/a>.\u003c/li>\n\u003c/ul>\n\u003cp>\u003ca href=\"evidence/windows-2026-10-22-203907/environment.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: c3f7388dd0ba630f566a8491478156e000e5efd8aca8c6be4d251eae576ae422\">Environment and toolchain provenance\u003c/a>\nrecords the exact build. Node and npm were initially absent from PATH. An\nofficial portable Node archive was downloaded into the ignored run directory,\nchecked against its published SHA-256 and used locally. No global toolchain\ninstallation or machine configuration change was made.\u003c/p>\n\u003cp>Switching from the older \u003ccode>main\u003c/code> checkout retained CRLF in 76 unchanged text\nfiles, despite this branch's \u003ccode>eol=lf\u003c/code> policy. The initial wiki check therefore\nreported stale output. Applying the existing LF policy made the same check\npass, with empty content and staged diffs before packaging. The\n\u003ca href=\"evidence/windows-2026-10-22-203907/checkout-normalization.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: b2b4e189161d6597f880e091cfbdea07dfe0ae6685c4d74b764289cf5461e65b\">normalization record\u003c/a>\nand both \u003ca href=\"evidence/windows-2026-10-22-203907/wiki-check-baseline.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: a329941f281fcb2b4a7c05a57244d2a6244373067789234859ba06daa45a4018\">initial\u003c/a>\nand \u003ca href=\"evidence/windows-2026-10-22-203907/wiki-check-normalized.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 7c06fe8e562040923adab1a7f85a649b8ef8dafd9b9bfd3b2a7687e4fb247ed1\">corrected\u003c/a>\nlogs retain that checkout issue. The generated wiki did not need a product fix.\u003c/p>\n\u003ch2 id=\"automated-commands\">Automated commands\u003c/h2>\n\u003cp>The \u003ca href=\"evidence/windows-2026-10-22-203907/commands.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: f00f4d6727933c7f4d5e7554c7edd496d0fd30055909e433831004795f17791f\">command record\u003c/a>\nretains argv, exit codes, package paths and desktop command timestamps.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Command\u003c/th>\n\u003cth>Exit\u003c/th>\n\u003cth>Observation\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>npm.cmd ci --prefix renderer\u003c/code>\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>\u003ca href=\"evidence/windows-2026-10-22-203907/npm-ci.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: f53a16cb808fb52f78af55bac851af354d8552991235e613eca238a9d0008fab\">Dependencies installed\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>node renderer/node_modules/electron/install.js\u003c/code>\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>\u003ca href=\"evidence/windows-2026-10-22-203907/electron-install.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 852ec5cd256681350843af4595936cc5bbdf21b06010d242f0b56d01c7ab54ef\">Pinned runtime downloaded\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>node scripts/package.mjs --platform win32 --arch x64\u003c/code>\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>\u003ca href=\"evidence/windows-2026-10-22-203907/package.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 43c7bbd5f98e9e8aca91d7020d6cd4a376d7c1ea9e5f3820923ddc9d1851911c\">Complete portable folder built\u003c/a>; executable hash matches metadata\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>go vet ./...\u003c/code>\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>\u003ca href=\"evidence/windows-2026-10-22-203907/go-vet.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 852ec5cd256681350843af4595936cc5bbdf21b06010d242f0b56d01c7ab54ef\">Passed\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>go test -v ./...\u003c/code>\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>\u003ca href=\"evidence/windows-2026-10-22-203907/go-test.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 920ba53f1402ad8fd49499a388e1726aec4d8a6fb50cecb97d65078049b4851e\">17 of 18 root tests passed\u003c/a>; \u003ccode>TestArtifactConfinementAndLimits\u003c/code> stopped at fixture construction\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>node --test\u003c/code>\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>\u003ca href=\"evidence/windows-2026-10-22-203907/node-test.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 792383263b225187d171140f2858963f66c6de55c159215dbb5473f124641e27\">Six of seven passed\u003c/a>; local asset test stopped at fixture construction\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>node docs/wiki/_build.mjs --check\u003c/code>\u003c/td>\n\u003ctd>1, then 0\u003c/td>\n\u003ctd>Passed after checkout line-ending normalization\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>node scripts/renderer-smoke.mjs &lt;package&gt;/fungi.exe\u003c/code>\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>\u003ca href=\"evidence/windows-2026-10-22-203907/renderer-smoke.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 7f677847924e9159a87ff54b45de44b9a3ccf084c450c3c88447aa4d38cff060\">Fixture setup failed\u003c/a> before any renderer launch; all 21 capability checks remain unexecuted\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The Go failure says \u003cstrong>A required privilege is not held by the client\u003c/strong> at\n\u003ccode>store_test.go:93\u003c/code>. Node reports \u003ccode>EPERM\u003c/code> for \u003ccode>symlink\u003c/code> at\n\u003ccode>scripts/assets.test.mjs:15\u003c/code> and \u003ccode>scripts/renderer-smoke.mjs:28\u003c/code>.\nThese are the prerequisite failures anticipated by the handoff. No assertions\nwere removed, no symlink was replaced with a different fixture, and no\nDeveloper Mode, elevation, sandbox or WebGL policy change was used.\nThe complete suites are not reported as passing.\u003c/p>\n\u003ch2 id=\"visible-desktop-observations\">Visible desktop observations\u003c/h2>\n\u003cp>Every packaged CLI invocation used an empty child PATH, an isolated\n\u003ccode>FUNGI_STATE_DIR\u003c/code>, no inherited \u003ccode>CODEX_THREAD_ID\u003c/code> and no renderer-directory\noverride. The test used the package's own executable, helper, HTML, assets\nand Electron runtime. \u003ccode>manual\u003c/code> delivery isolated desktop behavior.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Evidence and observation\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>CLI and native helper\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/windows-2026-10-22-203907/describe.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 9b25610ca705a43b3e808bdeb7915a2923c491d3d16823d87422647a7243fb33\">Describe\u003c/a> and \u003ca href=\"evidence/windows-2026-10-22-203907/helper.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 8b3463e62a99d06c202ef1e8c8d0f8d0c8d9bb297a94db0683efa87aa9677751\">helper result\u003c/a>; readable \u003ca href=\"evidence/windows-2026-10-22-203907/helper-note.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: ef1b84da5133290bc7dfc017dbd2286b810edb1b655e9485caabc6343499a2ce\">text artifact\u003c/a>, matching hash\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Portable window launch\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/windows-2026-10-22-203907/desktop-open.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: c87e18d7f008338a5e4db13a8522805b4c8c49c287f597b99a47952aa78bb7d1\">Launch receipt\u003c/a>; exact package process and unique fixture title selected; no OS launch block observed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Native input and acknowledged draft\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Dragged divider to 36%, selected After with keyboard/menu input, typed \u003ccode>WINDOWS-ACCEPTANCE-windows-2026-10-22-203907\u003c/code>; visible \u003ca href=\"evidence/windows-2026-10-22-203907/desktop-draft-saved.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: cf8ac9b268b7bde8e38845a054ee0debcfbc1b78ca7ffb2b2195f13620c06e79\">Draft saved\u003c/a>, matching \u003ca href=\"evidence/windows-2026-10-22-203907/original-draft.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: a235a468c1b23ea09c9d92c5586d3a8a2a50cf7248e91b2fd94a769c9ea59f90\">saved data\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Close and reopen\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Native title-bar close, then \u003ca href=\"evidence/windows-2026-10-22-203907/desktop-closed.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 8c42375c518efc3d75fdd9bdfa26151e125727d0df4a7ea0e5984b0a3dc85caa\">one collection\u003c/a> returned \u003ccode>closed\u003c/code>; \u003ca href=\"evidence/windows-2026-10-22-203907/desktop-reopened.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 8bcb20ff05211657d4cdc55c3a1fa55f3fb9948a0ad4f6774c52a54537de3c60\">reopen receipt\u003c/a> identifies a new session\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Visible restoration\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/windows-2026-10-22-203907/desktop-restored-top.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 5e58a307958865c75e9b1d425f9005a853ed2138fc360342ce997c07070e46c7\">Restored divider\u003c/a>, \u003ca href=\"evidence/windows-2026-10-22-203907/desktop-restored.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 06568c172faa02003138439e1661854dbfe5eeac0b4a4d3bd7ddb19650ed3de5\">preference/note/status\u003c/a>, and \u003ca href=\"evidence/windows-2026-10-22-203907/desktop-restored-ui.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: dfed544731bb51dc1028889355ff4f6220a7037fe01465ac44319a531ef61d5b\">accessibility observation\u003c/a> all match the acknowledged draft\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Submit and PNG\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Clicked Send review, observed window closure, collected once; \u003ca href=\"evidence/windows-2026-10-22-203907/desktop-submitted.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: d0b35d9d47a7b91ffc7e53eaf0175fe12daae1e0bbd01f68bcc7ecaa4883df9e\">submitted result\u003c/a> retains all values and references the matching \u003ca href=\"evidence/windows-2026-10-22-203907/comparison.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 919a27da3ac5bb14c1efa3997d19d6ebb8512c7f42e36bc58e1ce3de9c181868\">comparison PNG\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Separate cancellation\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/windows-2026-10-22-203907/cancel-open.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 99b6f90623adf8ac78577ed73ae20a39c8330c473e6af8a922b36c20740f9d7a\">Fresh launch\u003c/a>, clicked visible \u003ca href=\"evidence/windows-2026-10-22-203907/desktop-before-cancel.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 771914719ad5f2b64e34c482a9ea1a876ec75caa7abbef7a70816354c34b2f0e\">Cancel\u003c/a>, observed closure, \u003ca href=\"evidence/windows-2026-10-22-203907/desktop-cancelled.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: fb29d94327ef83a6317960a1649840019467d862deccf3e5d49ef9092174a9c1\">one collection\u003c/a> returned \u003ccode>cancelled\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The original session is \u003ccode>89fed9e918766ea329b0113c77ab5561\u003c/code>; its\n\u003ca href=\"evidence/windows-2026-10-22-203907/original-result-after-reopen.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 22c2708d16003892ee8f6603ea8dd6e40672d0d477c5b60afcd4fd9567159a38\">saved terminal result\u003c/a>\nremains \u003ccode>closed\u003c/code> after the reopened session \u003ccode>8a5856276aae5d91a88ab8e95b846835\u003c/code>\nsubmitted. The \u003ca href=\"evidence/windows-2026-10-22-203907/reopened-launch.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 52552d6400cc4614b3ef4a9debde9615e0d48a94ad2e79320269022d94bbe7cb\">reopened launch\u003c/a>\nlinks those exact sessions. Cancellation is session\n\u003ccode>49a6f0d331dc3377d844dc0d3743a590\u003c/code>.\u003c/p>\n\u003cp>The exported PNG is 1200 by 600 pixels and 45,731 bytes. Its actual SHA-256\nmatches the returned metadata:\n\u003ccode>919a27da3ac5bb14c1efa3997d19d6ebb8512c7f42e36bc58e1ce3de9c181868\u003c/code>.\nIt was opened and visually checked against the native comparison view at 36%.\nThe three desktop sessions were each collected once after the terminal action;\nthere was no collection polling, DOM mutation or edited session data.\u003c/p>\n\u003cp>The native driver needed keyboard selection when dropdown coordinates extended\nbeyond the window, and refreshed screenshot coordinates when accessibility\nbounds became stale after scrolling. These were driver limitations, not\nfailed product scenarios. Desktop input/focus changed before cancellation;\nthe agent resumed at the user's request on 2026-10-23. That pause is not a\ncontrolled long-idle or sleep/wake test.\u003c/p>\n\u003ch2 id=\"evidence-and-remaining-limits\">Evidence and remaining limits\u003c/h2>\n\u003cp>\u003ca href=\"evidence/windows-2026-10-22-203907/observations.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: d76d120e7f226eb928d8b5c53bc014bda80311394c0521a96be159b800753a4b\">Scenario observations\u003c/a>\nand the \u003ca href=\"evidence/windows-2026-10-22-203907/manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 1ac6f8dbb60d70b301c74d6b900a2482c0daaaa4f4a72842e0d40c4a53713ed6\">evidence manifest\u003c/a>\nrecord outcomes and file hashes. Personal path prefixes are replaced with\n\u003ccode>&lt;repo&gt;\u003c/code>, \u003ccode>&lt;temp&gt;\u003c/code> and \u003ccode>&lt;user&gt;\u003c/code> in published text evidence. Original logs,\nreceipts, drafts, results and artifacts remain locally beneath\n\u003ccode>verification-output/windows-2026-10-22-203907/\u003c/code>; its \u003ccode>sessions/\u003c/code> directory is\nnot committed. All four \u003ca href=\"evidence/windows-2026-10-22-203907/worker-logs.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 1f3926cdd1942ebf334b995f3e7442301230a2201695d9af489c5db7501f4982\">worker logs\u003c/a>\nwere empty, and \u003ca href=\"evidence/windows-2026-10-22-203907/cleanup.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 17f3bc21020571e2fcc403ee039c78476ca088c1421009bcb5f3d8fc7b33cd54\">cleanup observation\u003c/a>\nfound no remaining processes from the test package.\u003c/p>\n\u003cp>The physical desktop handoff is complete for launch, native input, draft\nrecovery, PNG submission/hash and cancellation on this machine. The aggregate\nremains \u003cstrong>Untested\u003c/strong> because the symlink-dependent core/asset tests and the\nfull 21-check renderer fixture were not exercised here. Existing hosted\nWindows coverage remains separate; it cannot fill those local gaps.\u003c/p>\n\u003cp>This source-built package running with an empty PATH does not establish a\nclean-machine or downloaded-archive launch through Windows security prompts.\nWindows clipboard, WebGL, automatic harness return, sleep/wake and power-loss\ndurability were not verified by this run. Public signing and broader platform\nsupport remain outside the observed scope.\u003c/p>\n","backlinks":["index","planning","platforms","features/interfaces","features/sessions","verification/windows"]},{"id":"verification/setup","title":"Verification setup","section":"Verification","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-23\u003c/span>","updated":"2026-10-23","summary":"","source":"---\ntitle: Verification setup\nupdated: 2026-10-23\n---\n# Verification setup\n\nRun from `/Users/rengwu/Desktop/Projects/fungi`. Early runs predate Git initialization; current runs record the Git base, dirty source hashes and binary SHA-256.\n\nFor the user's Windows checkout, follow the [Windows agent handoff](windows.md).\nIt includes the correct branch, source build, actual desktop checks and result\nrecording without relying on this Mac's paths or a sibling jstack checkout.\n\n## Build and launch\n\nDevelopment prerequisites on the tested machine: Go 1.26.4, Node 22.19.0, npm 10.9.3, macOS arm64. Electron is pinned to 44.9.0 in `renderer/package-lock.json`.\n\n```sh\nnpm ci --prefix renderer\nnode renderer/node_modules/electron/install.js\ngo build -o fungi .\n./fungi describe\ngo test -race -v . ./examples/helper\ngo vet . ./examples/helper\nnode scripts/package.mjs\n```\n\nThe explicit Electron download is a **build** step; the portable output includes the runtime. Packaging produces a unique directory under `dist/`, preserving framework symlinks. Do not test a half-built directory. Read its `BUILD.json` and hash its `fungi` executable.\n\nUse `FUNGI_STATE_DIR=\"$PWD/verification-output/sessions\"` for local UI fixtures. Use a separate root for each harness batch. `open` returns only after readiness, or keeps one pending pipe in `wait` mode. Never poll `collect` while awaiting a person.\n\n## UI driver and fixtures\n\nNative UI verification used the connected desktop driver against the exact Electron app path. Multiple Electron development apps share a bundle ID, so select the full app path and verify the window title. Bringing up an app through the driver sometimes also launched Electron's default page; terminate only the extra test-created launcher process, never unrelated Electron apps.\n\nThe generated PNG fixture is 64×64 RGB, 180 bytes, with SHA-256 `1bd7e798fbfd3bd20de881435c7bfa7811db8466e73714a8ab7c1af6b7460e9a`. Its source bytes are retained in evidence. The current reference form exposes accessible labels for text fields, the native file picker, and “Paste image for Reference image.”\n\nThe successful clipboard fixture used a separate form with one image field, keeping its paste target visible. Copying pixels from macOS Preview and pasting into that target yielded a 401-byte, 64×64 PNG with SHA-256 `83e160394a50c08746093b421e7bbf7865d6591aac9f9b2d1f0850bea504c2d9`. Both the original and clipboard-encoded bytes are retained. The crash fixture had one text field: after “Draft saved,” only its identified page-renderer PID was terminated. The restored window visibly contained the acknowledged value before it was closed.\n\nDo not overwrite the user's edits while they are trying a demo. Preserve acknowledged drafts. A changing desktop focus or failed clipboard setup is a driver limitation until separately diagnosed; it is not a product pass.\n\n## Harness probes\n\nCommands installed at the time of the run:\n\n| Harness | Version | Test configuration |\n| --- | --- | --- |\n| Codex | 0.163.0 | Disposable `exec`, ephemeral JSON output, workspace-write sandbox for Fungi storage |\n| Claude Code | 2.1.302 | Safe mode, no session persistence, Bash only, exact fixture command allowed, bounded turn count |\n| OpenCode | 1.18.34 | `run --pure --format json`, canonical disposable working directory |\n| Grok Build | 1.0.62 | Headless JSON events, bounded turns, no subagents/web search, exact fixture command |\n| Kimi Code | 2.0.1 | Print/JSON attempt; blocked by missing provider credential |\n| Pi | 1.3.0 | No extensions/MCP/skills/context files/session persistence; Bash only; invocation-only `openai-codex/gpt-6.1-sol` |\n\nPi's configured default model was rejected by its provider. The invocation-only override used its existing provider; no saved model setting changed. Raw streams remain in the disposable probe directory; the wiki contains sanitized tool calls, terminal texts and task notifications without account credentials or model reasoning payloads.\n\nThe probe driver imposes a finite external test deadline (120 or 240 seconds) and terminates only its own process groups on timeout. This is a test bound, not a Fungi human timeout.\n\n## No-setup follow-up fixtures\n\nThe follow-up lives under `verification-output/no-setup-verification/`. `run-ui-probe.py` launches one disposable harness conversation with an explicit fixture command and a 240-second external test bound. Each form has a unique title, response marker and state directory; the connected desktop driver chooses the exact packaged Electron app path. The user-edited source demo is separate.\n\nKimi's successful follow-up reports 2.2.0. It uses `run_in_background: true` and `disable_timeout: true`; no authentication files are read. Claude's headless test deliberately supplies 600,000 ms and does not represent unlimited interactive waiting. Non-Codex child probes do not inherit this test coordinator's `CODEX_THREAD_ID`.\n\nDo not name a Fungi form `opencode.json` in an OpenCode working directory: that name is reserved for its configuration and may be rewritten. The corrected fixture is `opencode-form.json`. The initial collision is recorded as a failed fixture attempt, not hidden or treated as a Fungi product failure.\n\nFor manual delivery, let the launch return and the harness end its turn, submit through the native window, then resume the exact recorded harness session with an explicit “done.” It must call the receipt's `collect` argv with `collectEnv` once. This tests manual fallback and cannot be counted as automatic completion.\n\n## Observation and cleanup\n\nInspect `launch.json`, `draft.json`, `result.json`, artifact bytes/hashes and `delivery.json` separately. The OS file lock proves owner liveness without a PID guess. Preserve the result and evidence before removing disposable data.\n\nDo not delete a user-modified demo draft. No persistent harness configuration or authentication was changed. Public signing/notarization, a clean machine with network disabled, Windows runtime and Linux desktop UI verification, long sleep/wake cycles and abrupt power-loss behavior remain outside current evidence. The later Linux core run is recorded below.\n\n## Skill authoring and idle probes\n\nThe simpler questionnaire lives at `skills/grill-form/assets/form.html`; pass its question JSON through `--input`. Native fixtures and receipts live under `verification-output/skill-proof/`. The `example.json` is explicitly a demonstration, so synthetic test answers are safe there. Never submit test answers into an actual interview.\n\n```sh\nnode --test scripts/grill-form.test.mjs\ngo build -o verification-output/idle-helper ./scripts/idle-helper\n./fungi open skills/grill-form/assets/form.html --input skills/grill-form/example.json --delivery manual\n```\n\nFor native recovery: enter a choice/note, select the known reference image, wait for “Draft saved,” close, collect once, and reopen. The initial session must stay `closed`. To test abrupt owner loss, identify the exact `_run SESSION` process in this disposable root before killing it; never terminate by generic Electron/Fungi process name. Collect the interrupted session once, reopen it, and verify the acknowledged draft and image. The submitted result must preserve the image hash.\n\nFor the Linux core recipe, copy only root Go sources/module, `examples/helper`, `scripts/protocol-fixture` and any selected `scripts/idle-helper` fixture into an isolated directory. The [recorded Docker command](../evidence/2026-10-20-skill-proof/linux-command.json) pins the official Go image, uses an unprivileged user, disables networking and mounts that source read-only. Its disposable container removes itself. The passed run is Linux arm64 under OrbStack; it is not a Linux desktop verification.\n\nThe idle helper takes `--input` JSON with `seconds` (1–86400) and `marker`. It acknowledges a draft, announces readiness, sleeps locally once, then submits timings and a JSON artifact. The five-second smoke check must pass before launching a long run. For a real callback test, run with `--delivery auto` from the intended conversation, preserve the receipt, and end the agent turn. Its one completion notice supplies the exact executable/session/environment for one collection. For other harnesses, use their already documented completion route. Do not wrap the wait in repeated tool calls.\n\nThe completed two-hour probe is session `622f59b42e05840dd408622f23c8416a`, with state beneath `verification-output/skill-proof/idle-long-sessions`. Its original executable is in `dist/fungi-darwin-arm64-2026-10-20T09-41-25-905Z`. Its [result](../evidence/2026-10-20-skill-proof/idle-long-result.json) records one collection after the exact-origin notice, matching timing artifact bytes and exit of the helper/owner. Retain the evidence. For future runs, keep the launched package and helper available until completion; do not suspend the machine without settling timing with its user. Record both the helper's elapsed measurement and the UTC timestamp difference when sleep occurs.\n\nThe user manually completed sleep/wake fixture `1897358a56ceff72064a252004170716`, using the same package and `verification-output/skill-proof/sleep-wake-sessions`. Its [baseline](../evidence/2026-10-20-skill-proof/sleep-wake-baseline.json) records the initial note/image and preparation time. After its completion notice, one collection returned the preserved note/image and user's post-wake edit. A minimal [power-log excerpt](../evidence/2026-10-20-skill-proof/sleep-wake-power.log) independently confirms actual sleep/wake within the interval. The [result record](../evidence/2026-10-20-skill-proof/sleep-wake-result.json) retains the callback, data and byte validation. For future repetitions, obtain the user's timing, prepare a fresh fixture, let them sleep/wake and submit, then collect once; inspect only relevant `Sleep`, `Wake` and `DarkWake` event rows since the baseline, excluding scheduled `Wake Requests`. Do not select an answer or submit on the user's behalf.\n\n## Platform foundation checks\n\n```sh\nnode --test scripts/*.test.mjs\ngo test -race -v . ./examples/helper ./scripts/protocol-fixture\ngo vet . ./examples/helper ./scripts/protocol-fixture\nnode scripts/package.mjs\nnode scripts/renderer-smoke.mjs /absolute/package/fungi\nnode scripts/package.mjs --platform win32 --arch x64\nnode scripts/package.mjs --platform linux --arch x64\n```\n\nThe renderer driver writes a new directory beneath `verification-output/`,\nopens only its disposable fixture, checks browser features, cancels, reopens\nand submits. It uses one pending CLI call per interaction; it does not invoke\na model callback or poll a person. `evidence.json` records results and artifact\nhashes. Its 45-second process bound is a test timeout, not a product wait limit.\nIt clears the child executable search path, preserves worker diagnostics on\nfailure, and does not turn unavailable WebGL into a passing rendering check.\nIts default scope requires all 21 checks. `--allow-unavailable-webgl` permits\nonly a null WebGL context and records it explicitly as unavailable; an\nincorrect render still fails. `--expect-startup-failure` instead requires one\nsaved `renderer_startup_failed` result and the indicated sandbox diagnostic\nlog. It fails if startup succeeds, prompting review of the platform record.\n\n`.github/workflows/verify.yml` runs the core, Node and wiki checks before the\nactual Electron fixture on hosted macOS, Windows, Ubuntu 22.04 and Ubuntu\n24.04. The renderer sandbox stays enabled. Linux uses the runner's existing\nXvfb; diagnostic namespace checks do not change its security policy. See the\n[hosted report](runs/2026-10-22-hosted.md) for failures and tested revisions.\nAfter the user's [Linux decision](../planning.md#linux-distribution-decision),\nUbuntu 22.04 uses the optional-WebGL scope; Ubuntu 24.04 tests the unsupported\nstartup error, not successful rendering. CI job names state those scopes.\n\nThe portable core test fixture replaces shell-only helpers. Desktop execution\nuses the [handoff recipe](desktop.md). The packaging command can download a\npinned official target runtime during development; a completed package does\nnot need a runtime download, Node, npm or Go on the user's machine.\n\n## Installation and updates\n\nFollow the [managed installation recipe](../features/installation.md#build-and-verification-recipe)\nto build two versioned archives and run `scripts/install-smoke.mjs`. It serves\none actual archive/checksum from a local fixture server, executes the platform\nbootstrap in a fresh directory with spaces in its name, holds a real Electron\nsession through an update, checks its saved PNG, verifies runtime file sharing\nand rolls back. Installed CLI children have an empty PATH. The driver emits\nfull evidence and saves it beneath its new `verification-output/install-smoke-*`\ndirectory. It sends no model callback and changes no persistent PATH.\n\nCI runs this after its renderer check on each target. Ubuntu 24.04 uses\n`--core-only`; Ubuntu 22.04 uses its existing Xvfb. Neither test changes host\nsandbox policy. These fixtures prove local release archives and bootstrap\ndownloads, not public GitHub assets, signing or clean consumer-machine setup.\n","toc":[{"id":"build-and-launch","title":"Build and launch","depth":2},{"id":"ui-driver-and-fixtures","title":"UI driver and fixtures","depth":2},{"id":"harness-probes","title":"Harness probes","depth":2},{"id":"no-setup-follow-up-fixtures","title":"No-setup follow-up fixtures","depth":2},{"id":"observation-and-cleanup","title":"Observation and cleanup","depth":2},{"id":"skill-authoring-and-idle-probes","title":"Skill authoring and idle probes","depth":2},{"id":"platform-foundation-checks","title":"Platform foundation checks","depth":2},{"id":"installation-and-updates","title":"Installation and updates","depth":2}],"titleAnchor":"verification-setup","links":["verification/windows","verification/runs/2026-10-22-hosted","planning","verification/desktop","features/installation"],"attachments":[{"path":"evidence/2026-10-20-skill-proof/linux-command.json","sha256":"9aa958674aaddd90251512983a2af6e4645ebf2880e9c7b416c49829d7117c77"},{"path":"evidence/2026-10-20-skill-proof/idle-long-result.json","sha256":"0862217e750714093729aa5f2810e7186235f1543813f1e7c4c02810741587dc"},{"path":"evidence/2026-10-20-skill-proof/sleep-wake-baseline.json","sha256":"24ffa79a45c5d8901d1bc63690cfdf992ab1b7804c2f2556c1c55aef7c138d17"},{"path":"evidence/2026-10-20-skill-proof/sleep-wake-power.log","sha256":"7effb401a97b17cedcf129a2c448a5eb541129b9c27ba8ac746f6f4528869f86"},{"path":"evidence/2026-10-20-skill-proof/sleep-wake-result.json","sha256":"b32e0229f842add9c3b1b483a38806fca7d9ea4e2e2ac30d280ea0c7cf99c7bd"}],"html":"\u003cp>Run from \u003ccode>/Users/rengwu/Desktop/Projects/fungi\u003c/code>. Early runs predate Git initialization; current runs record the Git base, dirty source hashes and binary SHA-256.\u003c/p>\n\u003cp>For the user's Windows checkout, follow the \u003ca href=\"#/verification/windows\">Windows agent handoff\u003c/a>.\nIt includes the correct branch, source build, actual desktop checks and result\nrecording without relying on this Mac's paths or a sibling jstack checkout.\u003c/p>\n\u003ch2 id=\"build-and-launch\">Build and launch\u003c/h2>\n\u003cp>Development prerequisites on the tested machine: Go 1.26.4, Node 22.19.0, npm 10.9.3, macOS arm64. Electron is pinned to 44.9.0 in \u003ccode>renderer/package-lock.json\u003c/code>.\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">npm ci --prefix renderer\nnode renderer/node_modules/electron/install.js\ngo build -o fungi .\n./fungi describe\ngo test -race -v . ./examples/helper\ngo vet . ./examples/helper\nnode scripts/package.mjs\n\u003c/code>\u003c/pre>\n\u003cp>The explicit Electron download is a \u003cstrong>build\u003c/strong> step; the portable output includes the runtime. Packaging produces a unique directory under \u003ccode>dist/\u003c/code>, preserving framework symlinks. Do not test a half-built directory. Read its \u003ccode>BUILD.json\u003c/code> and hash its \u003ccode>fungi\u003c/code> executable.\u003c/p>\n\u003cp>Use \u003ccode>FUNGI_STATE_DIR=\"$PWD/verification-output/sessions\"\u003c/code> for local UI fixtures. Use a separate root for each harness batch. \u003ccode>open\u003c/code> returns only after readiness, or keeps one pending pipe in \u003ccode>wait\u003c/code> mode. Never poll \u003ccode>collect\u003c/code> while awaiting a person.\u003c/p>\n\u003ch2 id=\"ui-driver-and-fixtures\">UI driver and fixtures\u003c/h2>\n\u003cp>Native UI verification used the connected desktop driver against the exact Electron app path. Multiple Electron development apps share a bundle ID, so select the full app path and verify the window title. Bringing up an app through the driver sometimes also launched Electron's default page; terminate only the extra test-created launcher process, never unrelated Electron apps.\u003c/p>\n\u003cp>The generated PNG fixture is 64×64 RGB, 180 bytes, with SHA-256 \u003ccode>1bd7e798fbfd3bd20de881435c7bfa7811db8466e73714a8ab7c1af6b7460e9a\u003c/code>. Its source bytes are retained in evidence. The current reference form exposes accessible labels for text fields, the native file picker, and “Paste image for Reference image.”\u003c/p>\n\u003cp>The successful clipboard fixture used a separate form with one image field, keeping its paste target visible. Copying pixels from macOS Preview and pasting into that target yielded a 401-byte, 64×64 PNG with SHA-256 \u003ccode>83e160394a50c08746093b421e7bbf7865d6591aac9f9b2d1f0850bea504c2d9\u003c/code>. Both the original and clipboard-encoded bytes are retained. The crash fixture had one text field: after “Draft saved,” only its identified page-renderer PID was terminated. The restored window visibly contained the acknowledged value before it was closed.\u003c/p>\n\u003cp>Do not overwrite the user's edits while they are trying a demo. Preserve acknowledged drafts. A changing desktop focus or failed clipboard setup is a driver limitation until separately diagnosed; it is not a product pass.\u003c/p>\n\u003ch2 id=\"harness-probes\">Harness probes\u003c/h2>\n\u003cp>Commands installed at the time of the run:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Harness\u003c/th>\n\u003cth>Version\u003c/th>\n\u003cth>Test configuration\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Codex\u003c/td>\n\u003ctd>0.163.0\u003c/td>\n\u003ctd>Disposable \u003ccode>exec\u003c/code>, ephemeral JSON output, workspace-write sandbox for Fungi storage\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Claude Code\u003c/td>\n\u003ctd>2.1.302\u003c/td>\n\u003ctd>Safe mode, no session persistence, Bash only, exact fixture command allowed, bounded turn count\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OpenCode\u003c/td>\n\u003ctd>1.18.34\u003c/td>\n\u003ctd>\u003ccode>run --pure --format json\u003c/code>, canonical disposable working directory\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Grok Build\u003c/td>\n\u003ctd>1.0.62\u003c/td>\n\u003ctd>Headless JSON events, bounded turns, no subagents/web search, exact fixture command\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kimi Code\u003c/td>\n\u003ctd>2.0.1\u003c/td>\n\u003ctd>Print/JSON attempt; blocked by missing provider credential\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pi\u003c/td>\n\u003ctd>1.3.0\u003c/td>\n\u003ctd>No extensions/MCP/skills/context files/session persistence; Bash only; invocation-only \u003ccode>openai-codex/gpt-6.1-sol\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Pi's configured default model was rejected by its provider. The invocation-only override used its existing provider; no saved model setting changed. Raw streams remain in the disposable probe directory; the wiki contains sanitized tool calls, terminal texts and task notifications without account credentials or model reasoning payloads.\u003c/p>\n\u003cp>The probe driver imposes a finite external test deadline (120 or 240 seconds) and terminates only its own process groups on timeout. This is a test bound, not a Fungi human timeout.\u003c/p>\n\u003ch2 id=\"no-setup-follow-up-fixtures\">No-setup follow-up fixtures\u003c/h2>\n\u003cp>The follow-up lives under \u003ccode>verification-output/no-setup-verification/\u003c/code>. \u003ccode>run-ui-probe.py\u003c/code> launches one disposable harness conversation with an explicit fixture command and a 240-second external test bound. Each form has a unique title, response marker and state directory; the connected desktop driver chooses the exact packaged Electron app path. The user-edited source demo is separate.\u003c/p>\n\u003cp>Kimi's successful follow-up reports 2.2.0. It uses \u003ccode>run_in_background: true\u003c/code> and \u003ccode>disable_timeout: true\u003c/code>; no authentication files are read. Claude's headless test deliberately supplies 600,000 ms and does not represent unlimited interactive waiting. Non-Codex child probes do not inherit this test coordinator's \u003ccode>CODEX_THREAD_ID\u003c/code>.\u003c/p>\n\u003cp>Do not name a Fungi form \u003ccode>opencode.json\u003c/code> in an OpenCode working directory: that name is reserved for its configuration and may be rewritten. The corrected fixture is \u003ccode>opencode-form.json\u003c/code>. The initial collision is recorded as a failed fixture attempt, not hidden or treated as a Fungi product failure.\u003c/p>\n\u003cp>For manual delivery, let the launch return and the harness end its turn, submit through the native window, then resume the exact recorded harness session with an explicit “done.” It must call the receipt's \u003ccode>collect\u003c/code> argv with \u003ccode>collectEnv\u003c/code> once. This tests manual fallback and cannot be counted as automatic completion.\u003c/p>\n\u003ch2 id=\"observation-and-cleanup\">Observation and cleanup\u003c/h2>\n\u003cp>Inspect \u003ccode>launch.json\u003c/code>, \u003ccode>draft.json\u003c/code>, \u003ccode>result.json\u003c/code>, artifact bytes/hashes and \u003ccode>delivery.json\u003c/code> separately. The OS file lock proves owner liveness without a PID guess. Preserve the result and evidence before removing disposable data.\u003c/p>\n\u003cp>Do not delete a user-modified demo draft. No persistent harness configuration or authentication was changed. Public signing/notarization, a clean machine with network disabled, Windows runtime and Linux desktop UI verification, long sleep/wake cycles and abrupt power-loss behavior remain outside current evidence. The later Linux core run is recorded below.\u003c/p>\n\u003ch2 id=\"skill-authoring-and-idle-probes\">Skill authoring and idle probes\u003c/h2>\n\u003cp>The simpler questionnaire lives at \u003ccode>skills/grill-form/assets/form.html\u003c/code>; pass its question JSON through \u003ccode>--input\u003c/code>. Native fixtures and receipts live under \u003ccode>verification-output/skill-proof/\u003c/code>. The \u003ccode>example.json\u003c/code> is explicitly a demonstration, so synthetic test answers are safe there. Never submit test answers into an actual interview.\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">node --test scripts/grill-form.test.mjs\ngo build -o verification-output/idle-helper ./scripts/idle-helper\n./fungi open skills/grill-form/assets/form.html --input skills/grill-form/example.json --delivery manual\n\u003c/code>\u003c/pre>\n\u003cp>For native recovery: enter a choice/note, select the known reference image, wait for “Draft saved,” close, collect once, and reopen. The initial session must stay \u003ccode>closed\u003c/code>. To test abrupt owner loss, identify the exact \u003ccode>_run SESSION\u003c/code> process in this disposable root before killing it; never terminate by generic Electron/Fungi process name. Collect the interrupted session once, reopen it, and verify the acknowledged draft and image. The submitted result must preserve the image hash.\u003c/p>\n\u003cp>For the Linux core recipe, copy only root Go sources/module, \u003ccode>examples/helper\u003c/code>, \u003ccode>scripts/protocol-fixture\u003c/code> and any selected \u003ccode>scripts/idle-helper\u003c/code> fixture into an isolated directory. The \u003ca href=\"evidence/2026-10-20-skill-proof/linux-command.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 9aa958674aaddd90251512983a2af6e4645ebf2880e9c7b416c49829d7117c77\">recorded Docker command\u003c/a> pins the official Go image, uses an unprivileged user, disables networking and mounts that source read-only. Its disposable container removes itself. The passed run is Linux arm64 under OrbStack; it is not a Linux desktop verification.\u003c/p>\n\u003cp>The idle helper takes \u003ccode>--input\u003c/code> JSON with \u003ccode>seconds\u003c/code> (1–86400) and \u003ccode>marker\u003c/code>. It acknowledges a draft, announces readiness, sleeps locally once, then submits timings and a JSON artifact. The five-second smoke check must pass before launching a long run. For a real callback test, run with \u003ccode>--delivery auto\u003c/code> from the intended conversation, preserve the receipt, and end the agent turn. Its one completion notice supplies the exact executable/session/environment for one collection. For other harnesses, use their already documented completion route. Do not wrap the wait in repeated tool calls.\u003c/p>\n\u003cp>The completed two-hour probe is session \u003ccode>622f59b42e05840dd408622f23c8416a\u003c/code>, with state beneath \u003ccode>verification-output/skill-proof/idle-long-sessions\u003c/code>. Its original executable is in \u003ccode>dist/fungi-darwin-arm64-20
