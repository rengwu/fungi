03ccode>DarkWake\u003c/code> event rows since the baseline, excluding scheduled \u003ccode>Wake Requests\u003c/code>. Do not select an answer or submit on the user's behalf.\u003c/p>\n\u003ch2 id=\"platform-foundation-checks\">Platform foundation checks\u003c/h2>\n\u003cpre>\u003ccode class=\"language-sh\">node --test scripts/*.test.mjs\ngo test -race -v . ./examples/helper ./scripts/protocol-fixture\ngo vet . ./examples/helper ./scripts/protocol-fixture\nnode scripts/package.mjs\nnode scripts/renderer-smoke.mjs /absolute/package/fungi\nnode scripts/package.mjs --platform win32 --arch x64\nnode scripts/package.mjs --platform linux --arch x64\n\u003c/code>\u003c/pre>\n\u003cp>The renderer driver writes a new directory beneath \u003ccode>verification-output/\u003c/code>,\nopens only its disposable fixture, checks browser features, cancels, reopens\nand submits. It uses one pending CLI call per interaction; it does not invoke\na model callback or poll a person. \u003ccode>evidence.json\u003c/code> records results and artifact\nhashes. Its 45-second process bound is a test timeout, not a product wait limit.\nIt clears the child executable search path, preserves worker diagnostics on\nfailure, and does not turn unavailable WebGL into a passing rendering check.\nIts default scope requires all 21 checks. \u003ccode>--allow-unavailable-webgl\u003c/code> permits\nonly a null WebGL context and records it explicitly as unavailable; an\nincorrect render still fails. \u003ccode>--expect-startup-failure\u003c/code> instead requires one\nsaved \u003ccode>renderer_startup_failed\u003c/code> result and the indicated sandbox diagnostic\nlog. It fails if startup succeeds, prompting review of the platform record.\u003c/p>\n\u003cp>\u003ccode>.github/workflows/verify.yml\u003c/code> runs the core, Node and wiki checks before the\nactual Electron fixture on hosted macOS, Windows, Ubuntu 22.04 and Ubuntu\n24.04. The renderer sandbox stays enabled. Linux uses the runner's existing\nXvfb; diagnostic namespace checks do not change its security policy. See the\n\u003ca href=\"#/verification/runs/2026-10-22-hosted\">hosted report\u003c/a> for failures and tested revisions.\nAfter the user's \u003ca href=\"#/planning~linux-distribution-decision\">Linux decision\u003c/a>,\nUbuntu 22.04 uses the optional-WebGL scope; Ubuntu 24.04 tests the unsupported\nstartup error, not successful rendering. CI job names state those scopes.\u003c/p>\n\u003cp>The portable core test fixture replaces shell-only helpers. Desktop execution\nuses the \u003ca href=\"#/verification/desktop\">handoff recipe\u003c/a>. The packaging command can download a\npinned official target runtime during development; a completed package does\nnot need a runtime download, Node, npm or Go on the user's machine.\u003c/p>\n\u003ch2 id=\"installation-and-updates\">Installation and updates\u003c/h2>\n\u003cp>Follow the \u003ca href=\"#/features/installation~build-and-verification-recipe\">managed installation recipe\u003c/a>\nto build two versioned archives and run \u003ccode>scripts/install-smoke.mjs\u003c/code>. It serves\none actual archive/checksum from a local fixture server, executes the platform\nbootstrap in a fresh directory with spaces in its name, holds a real Electron\nsession through an update, checks its saved PNG, verifies runtime file sharing\nand rolls back. Installed CLI children have an empty PATH. The driver emits\nfull evidence and saves it beneath its new \u003ccode>verification-output/install-smoke-*\u003c/code>\ndirectory. It sends no model callback and changes no persistent PATH.\u003c/p>\n\u003cp>CI runs this after its renderer check on each target. Ubuntu 24.04 uses\n\u003ccode>--core-only\u003c/code>; Ubuntu 22.04 uses its existing Xvfb. Neither test changes host\nsandbox policy. These fixtures prove local release archives and bootstrap\ndownloads, not public GitHub assets, signing or clean consumer-machine setup.\u003c/p>\n","backlinks":["index","features/index","features/interfaces","features/sessions","verification/runs/2026-10-20-first-proof"]},{"id":"verification/windows","title":"Windows agent handoff","section":"Verification","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-23\u003c/span>","updated":"2026-10-23","summary":"","source":"---\ntitle: Windows agent handoff\nupdated: 2026-10-23\n---\n# Windows agent handoff\n\nContinue Fungi's physical Windows verification from this checkout. The user\nrequested this handoff so an agent on their Windows machine can perform it\nafter pulling. No earlier conversation, Mac-local files, or sibling jstack\ncheckout is needed. [Their response](../journal/2026-10-22-grill-b8ce5a10-7261-48c1-9d80-ee54e103ec5e.md)\nrequests these instructions; it does **not** report a passing Windows test.\n\nThe [2026-10-22/23 execution](runs/windows-2026-10-22-203907.md) passed the\nvisible journey on Windows 11 Pro x64 build 26200. Its aggregate remains\n**Untested** because symlink-dependent automated scenarios could not execute\nunder that account. Clean-machine and downloaded-archive acceptance remain\nunverified. Use the steps below for a new run; retain that report as evidence.\n\nHosted Windows Server already passes the core and renderer fixture. This\nhandoff checks the portable package's behavior on the actual desktop: launch,\nvisible input, acknowledged drafts, close/reopen, PNG submission and cancel.\nRead [the verified baselines](runs/2026-10-22-baselines.md) and\n[platform limits](../platforms.md) for context. Keep Go + Electron, the four\npage methods, portable distribution and no-harness-setup behavior intact.\n\n## 1. Get the correct checkout\n\nRun in the Fungi repository using native Windows PowerShell, not WSL. The\nwork is on **`foundation-hardening`**, not `main`. Preserve local changes; do\nnot reset or clean them to switch branches.\n\n```powershell\ngit status --short --branch\ngit fetch origin\ngit switch foundation-hardening\ngit pull --ff-only origin foundation-hardening\ngit rev-parse HEAD\n```\n\nRecord the revision, dirty files, Windows version/build, CPU architecture and\nagent/harness version. Use a new evidence directory for this run:\n\n```powershell\n$FungiRoot = (Get-Location).Path\n$FungiRunId = 'windows-' + (Get-Date -Format 'yyyy-MM-dd-HHmmss')\n$FungiEvidence = Join-Path $FungiRoot ('verification-output\\' + $FungiRunId)\nNew-Item -ItemType Directory -Path $FungiEvidence | Out-Null\n[System.Environment]::OSVersion.VersionString\nGet-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture\n```\n\nKeep the absolute paths in your task notes. Separate agent shell calls may\nnot retain PowerShell variables or environment overrides; restore their\nrecorded values when opening a new shell.\n\n## 2. Build the portable folder\n\n`dist/`, executables and `renderer/node_modules/` are ignored by Git. **A pull\ndoes not download a ready-to-run package.** From a source checkout, building\nrequires Go 1.26.x, Node 22.12+ and npm. The hosted baseline used Go 1.26.4 and\nNode 22.19.0. These are development prerequisites; the completed package must\nrun without invoking them. No Visual Studio or C compiler is required by the\nGo packaging command (`CGO_ENABLED=0`).\n\nCheck existing tools first. If one is unavailable, record the missing build\nprerequisite; that is not a renderer failure. A complete prebuilt Windows\npackage can instead be supplied and used for the desktop steps, but none is\nstored in this repository. Do not assume the Mac's local archive is present.\n\n```powershell\ngo version\nnode --version\nnpm.cmd --version\nnode -p \"process.platform + ' ' + process.arch\"\n```\n\nThe commands below target Windows x64, matching the current hosted baseline.\nRecord an ARM/emulation environment explicitly rather than describing it as\nnative x64 coverage. Run each build command from the repository root and\ncheck its exit code; stop the dependent build steps on a nonzero exit.\n\n```powershell\nnpm.cmd ci --prefix renderer\nnode .\\renderer\\node_modules\\electron\\install.js\n$FungiPackage = (node .\\scripts\\package.mjs --platform win32 --arch x64).Trim()\nif ($LASTEXITCODE -ne 0) { throw 'Portable packaging failed' }\n$FungiExe = Join-Path $FungiPackage 'fungi.exe'\nGet-Content (Join-Path $FungiPackage 'BUILD.json')\nGet-FileHash -Algorithm SHA256 $FungiExe\n```\n\nThe Electron download is a build-time step, pinned by the lockfile. Preserve\nthe printed package path and its `BUILD.json`; verify the executable hash\nmatches `binarySHA256`. Never select the newest directory by guessing or use\na partially built folder. `runtimeVerified: false` in build metadata means\npackaging itself does not certify runtime behavior.\n\n## 3. Run the existing automated checks\n\nFrom the repository root, run and retain each command's output and exit code:\n\n```powershell\ngo vet ./...\ngo test -v ./...\nnode --test\nnode .\\docs\\wiki\\_build.mjs --check\nnode .\\scripts\\renderer-smoke.mjs $FungiExe\n```\n\nThe suites include session, installation/update, archive and page tests. The\nreal renderer fixture opens disposable windows, cancels, reopens, submits and\nverifies the PNG hash. It requires all 21 renderer checks by default and\nprints its `evidence.json` path. It clears the child PATH and caller ID,\nshowing that this packaged workflow uses its bundled runtime. Keep that\nevidence directory. Do not relax WebGL checks or disable the sandbox to\nmanufacture a pass.\n\nSome Go/Node tests and the renderer fixture create a file symlink to verify\npath confinement. An ordinary Windows account may lack that privilege. If\nfixture construction fails with a symlink permission error, retain the\nfailure, mark the affected checks unexecuted with that reason, and continue\nthe independent desktop journey below. Do not enable Developer Mode or run\nelevated just to make the suite green. Fungi's normal HTML workflow does not\nrequire the user to create a symlink. Other failures need diagnosis; do not\nclassify them as this known fixture prerequisite without evidence.\n\n## 4. Exercise the visible desktop journey\n\nFollow [the portable desktop checklist](desktop.md#windows-powershell), also\ncopied into `$FungiPackage\\VERIFY.md`. Start in the package folder:\n\n```powershell\nSet-Location $FungiPackage\n$env:FUNGI_STATE_DIR = Join-Path $FungiEvidence 'sessions'\n```\n\nUse this state directory throughout; omit the checklist's alternative\ntemporary-directory assignment. This keeps receipts, drafts, results,\nartifacts and `worker.log` together. Preserve the receipt JSON from each\nlaunch before interacting with its window.\n\nUse the available native desktop driver to enter a distinctive **synthetic**\nnote such as `WINDOWS-ACCEPTANCE-\u003crun ID>`, move the divider, choose a\npreference and observe **Draft saved**. Close, collect once, reopen, inspect\nrestored values, submit and verify the PNG visually and by SHA-256. Launch a\nseparate comparison and cancel it. Match exact window titles/processes and\nsession IDs; do not interact with the user's unrelated Electron windows.\n\nIf the agent has no desktop-control tool, let the user perform those visible\nsteps and supply the observations. An automated self-submitting fixture is\nnot evidence that physical input was exercised. Do not replace the visible\nsteps with DOM setters, edited session files or a fabricated result.\n\nThis journey deliberately uses `manual` delivery to isolate desktop behavior.\nCollect only after the corresponding observed close/submit/cancel, never in\na polling loop. If waiting for the human, end the turn and resume when they\nreport completion. Automatic harness return is a separate test and must use\nan already supported native route, with no plugin/configuration setup.\n\nOn failure, preserve the exact command, error, revision and session. A\n`renderer_startup_failed` result points to its diagnostic log. Record any OS\nlaunch block without bypassing it. Within the existing foundation scope,\nreproduce actual product defects, make the smallest repair, and rerun the\naffected checks on a newly identified build. Keep the failed baseline too.\n\n## 5. Save the result for the next agent\n\nCreate `docs/wiki/verification/runs/\u003cFungiRunId>.md` with a matching H1/title,\nthe actual date and `result: Passed`, `Failed` or `Untested`. Record the tested\nGit revision/dirty source, `BUILD.json`, binary hash, OS/architecture, driver,\ncommands and scenario-level observations. Any selected failed scenario makes\nthe aggregate Failed; use Untested when required scenarios remain unexecuted\nand none failed. Separate fixture setup failures from observed product failures.\n\nCopy relevant test-only UTF-8 logs, JSON receipts/results, screenshots and the\nreturned PNG under `docs/wiki/evidence/\u003cFungiRunId>/`; link them relatively\nfrom the report. Keep private machine/account data out of committed logs.\nState explicitly which of launch, draft recovery, PNG/hash and cancellation\npassed, and whether the agent or human operated the window. Do not claim a\nclean-machine install-free launch merely because a source build worked on a\nmachine with development tools; record that limitation.\n\nLink the report from `features/sessions.md`, `features/interfaces.md` and the\nwiki index. Update `planning.md` and `platforms.md` only to the extent the\nobservations support. Preserve older reports. From the repository root:\n\n```powershell\nSet-Location $FungiRoot\nnode .\\docs\\wiki\\_build.mjs\nnode .\\docs\\wiki\\_build.mjs --check\ngit diff --check\ngit status --short\n```\n\nCommit only the intended report/evidence/docs and any justified repair to\n`foundation-hardening`, then push that branch to `rengwu/fungi`. Leave\nunrelated changes alone. Do not commit `dist/`, dependencies or raw session\ndirectories. Report the result, commit and material gaps to the user. No\nnew grill is needed merely to start this already requested verification.\n","toc":[{"id":"1-get-the-correct-checkout","title":"1. Get the correct checkout","depth":2},{"id":"2-build-the-portable-folder","title":"2. Build the portable folder","depth":2},{"id":"3-run-the-existing-automated-checks","title":"3. Run the existing automated checks","depth":2},{"id":"4-exercise-the-visible-desktop-journey","title":"4. Exercise the visible desktop journey","depth":2},{"id":"5-save-the-result-for-the-next-agent","title":"5. Save the result for the next agent","depth":2}],"titleAnchor":"windows-agent-handoff","links":["journal/2026-10-22-grill-b8ce5a10-7261-48c1-9d80-ee54e103ec5e","verification/runs/windows-2026-10-22-203907","verification/runs/2026-10-22-baselines","platforms","verification/desktop"],"attachments":[],"html":"\u003cp>Continue Fungi's physical Windows verification from this checkout. The user\nrequested this handoff so an agent on their Windows machine can perform it\nafter pulling. No earlier conversation, Mac-local files, or sibling jstack\ncheckout is needed. \u003ca href=\"#/journal/2026-10-22-grill-b8ce5a10-7261-48c1-9d80-ee54e103ec5e\">Their response\u003c/a>\nrequests these instructions; it does \u003cstrong>not\u003c/strong> report a passing Windows test.\u003c/p>\n\u003cp>The \u003ca href=\"#/verification/runs/windows-2026-10-22-203907\">2026-10-22/23 execution\u003c/a> passed the\nvisible journey on Windows 11 Pro x64 build 26200. Its aggregate remains\n\u003cstrong>Untested\u003c/strong> because symlink-dependent automated scenarios could not execute\nunder that account. Clean-machine and downloaded-archive acceptance remain\nunverified. Use the steps below for a new run; retain that report as evidence.\u003c/p>\n\u003cp>Hosted Windows Server already passes the core and renderer fixture. This\nhandoff checks the portable package's behavior on the actual desktop: launch,\nvisible input, acknowledged drafts, close/reopen, PNG submission and cancel.\nRead \u003ca href=\"#/verification/runs/2026-10-22 <script>(() => {
  'use strict';
  const {title:wikiTitle,pages,sections} = JSON.parse(document.getElementById('wiki-data').textContent);
  const byId = new Map(pages.map(p=>[p.id,p]));
  const $ = id => document.getElementById(id);
  const colorScheme = matchMedia('(prefers-color-scheme: dark)');
  const colorInputs = document.querySelectorAll('input[name="color"]');
  function setColor(preference) {
    if (!['automatic', 'light', 'dark'].includes(preference)) preference = 'automatic';
    document.documentElement.dataset.colorPreference = preference;
    document.documentElement.dataset.theme = preference === 'automatic' ? (colorScheme.matches ? 'dark' : 'light') : preference;
    colorInputs.forEach(input => { input.checked = input.value === preference; });
  }
  setColor(document.documentElement.dataset.colorPreference);
  colorInputs.forEach(input => input.addEventListener('change', () => {
    setColor(input.value);
    try { localStorage.setItem('planning-wiki-color', input.value); } catch {}
  }));
  colorScheme.addEventListener('change', () => setColor(document.documentElement.dataset.colorPreference));
  window.addEventListener('storage', event => {
    if (event.key === 'planning-wiki-color' || event.key === null) setColor(event.newValue);
  });
  document.addEventListener('click', event => {
    if (!$('appearance').contains(event.target)) $('appearance').open = false;
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && $('appearance').open) {
      $('appearance').open = false;
      $('appearance').querySelector('summary').focus();
    }
  });
  let current = null;
  const link = (label,href) => { const a=document.createElement('a'); a.textContent=label; a.href=href; return a; };
  const route = id => '#/'+id.split('/').map(s=>encodeURIComponent(s).replace(/~/g,'%7E')).join('/');
  for (const section of sections) {
    const group=document.createElement('div');group.className='nav-group';
    const label=document.createElement('div');label.className='nav-group-label';label.textContent=section;group.append(label);
    pages.filter(p=>p.section===section).forEach(p=>{const a=link(p.id==='index'?'Main page':p.title,route(p.id));a.dataset.page=p.id;group.append(a);});
    $('navigation').append(group);
  }
  if (matchMedia('(max-width: 700px)').matches) $('navigation-details').open=false;
  function mode(source) {
    $('article-view').hidden=source;
    $('source-view').hidden=!source;
    $('read-tab').classList.toggle('selected',!source);
    $('source-tab').classList.toggle('selected',source);
    $('read-tab').setAttribute('aria-pressed',String(!source));
    $('source-tab').setAttribute('aria-pressed',String(source));
    $('contents').hidden=source || !current?.toc.length;
  }
  function markText(text,query) {
    const fragment=document.createDocumentFragment();
    const lower=text.toLowerCase(), needle=query.toLowerCase();
    let start=0, at;
    while (needle && (at=lower.indexOf(needle,start))!==-1) {
      fragment.append(document.createTextNode(text.slice(start,at)));
      const mark=document.createElement('mark');mark.textContent=text.slice(at,at+query.length);fragment.append(mark);start=at+query.length;
    }
    fragment.append(document.createTextNode(text.slice(start)));return fragment;
  }
  function search(query) {
    current=null;
    $('search').value=query;
    $('page-title').textContent='Search results';
    $('page-meta').hidden=true;document.querySelector('.toolbar').hidden=true;
    $('article-view').hidden=true;$('source-view').hidden=true;$('search-results').hidden=false;$('toc').replaceChildren();
    $('contents').hidden=true;
    const terms=query.toLowerCase().split(/\s+/).filter(Boolean);
    const matches=terms.length?pages.filter(p=>terms.every(t=>(p.title+' '+p.source).toLowerCase().includes(t))).sort((a,b)=>Number(b.title.toLowerCase().includes(query.toLowerCase()))-Number(a.title.toLowerCase().includes(query.toLowerCase()))):[];
    $('result-count').textContent=terms.length?`${matches.length} ${matches.length===1?'article':'articles'} matching “${query}”${matches.length?'':'. Try fewer words or a broader term.'}`:'Enter a word or phrase to search all articles.';
    $('results').replaceChildren();
    for (const p of matches) {
      const card=document.createElement('div');card.className='result';
      const small=document.createElement('small');small.textContent=p.section;
      const h=document.createElement('h2'),a=link('',route(p.id));a.append(markText(p.title,query));h.append(a);
      const excerpt=document.createElement('p');
      const plain=p.source.replace(/^---\n[\s\S]*?\n---\n/,'').replace(/[#*`|]/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/\s+/g,' ');
      const position=plain.toLowerCase().indexOf(terms[0]);const start=Math.max(0,position-65);
      excerpt.append(markText((start?'…':'')+plain.slice(start,start+240)+(plain.length>start+240?'…':''),query));
      card.append(small,h,excerpt);$('results').append(card);
    }
    document.title='Search — '+wikiTitle;
  }
  function render() {
    const rawHash=location.hash.slice(1);
    document.querySelectorAll('[aria-current=page]').forEach(a=>a.removeAttribute('aria-current'));
    if(rawHash.startsWith('/search?')) {search(new URLSearchParams(rawHash.slice(8)).get('q')||'');window.scrollTo(0,0);return;}
    let id='index',anchor='';
    try {
      const parts=(rawHash.startsWith('/')?rawHash.slice(1):'index').split('~');
      id=decodeURIComponent(parts[0]);anchor=decodeURIComponent(parts[1]||'');
    } catch {id='__invalid_route__';}

    const p=byId.get(id||'index');
    $('search-results').hidden=true;document.querySelector('.toolbar').hidden=!p;$('page-meta').hidden=!p;
    current=p||null;mode(false);
    if(!p){
      $('page-title').textContent='Page not found';
      $('article').replaceChildren(link('Return to the main page',route('index')));$('toc').replaceChildren();$('backlinks').hidden=true;document.title='Page not found — '+wikiTitle;return;
    }
    $('search').value='';$('page-title').textContent=p.title;
    $('page-meta').innerHTML=p.metadataHtml;
    $('page-meta').hidden=!p.metadataHtml;
    $('article').innerHTML=p.html;
    $('source-text').textContent=p.source;$('source-path').textContent=p.id+'.md';
    $('toc').replaceChildren();
    p.toc.forEach(h=>{const a=link(h.title,route(p.id)+'~'+h.id);if(h.depth>2)a.className='nested';$('toc').append(a);});
    $('backlink-list').replaceChildren();$('backlinks').hidden=!p.backlinks.length;
    p.backlinks.forEach(id=>$('backlink-list').append(link(byId.get(id).title,route(id))));
    document.querySelectorAll('[data-page]').forEach(a=>{if(a.dataset.page===p.id)a.setAttribute('aria-current','page');});
    document.title=p.id==='index'?wikiTitle:p.title+' — '+wikiTitle;
    if(anchor)requestAnimationFrame(()=>{if(anchor===p.titleAnchor)$('page-title').scrollIntoView();else document.getElementById(anchor)?.scrollIntoView();});else window.scrollTo(0,0);
  }
  $('search-form').addEventListener('submit',e=>{e.preventDefault();const hash='/search?q='+encodeURIComponent($('search').value.trim());if(location.hash==='#'+hash)render();else location.hash=hash;});
  $('read-tab').addEventListener('click',()=>mode(false));$('source-tab').addEventListener('click',()=>mode(true));
  $('print').addEventListener('click',()=>{mode(false);window.print();});
  document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();const target=$('search-results').hidden?$('article'):$('main');target.focus();target.scrollIntoView();});
  $('download').addEventListener('click',()=>{
    if(!current)return;const url=URL.createObjectURL(new Blob([current.source],{type:'text/markdown;charset=utf-8'}));
    const a=link('',url);a.download=current.id.split('/').pop()+'.md';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
  document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();$('search').focus();}});
  document.addEventListener('click',e=>{const a=e.target.closest('a');if(a?.getAttribute('href')?.startsWith('#/')&&matchMedia('(max-width: 700px)').matches)$('navigation-details').open=false;});
  window.addEventListener('hashchange',render);
  render();
})();
</script>
</body>
</html>
