ification/runs/2026-10-22-platform.md)\n- [Hosted platform checks and remaining failures](verification/runs/2026-10-22-hosted.md)\n- [Verification setup](verification/setup.md)\n- [Windows agent handoff: start here after pulling](verification/windows.md)\n- [Research findings and recommendation](research/index.md)\n- [Proposed small authoring interface](proposal.md)\n- [First interview: submitted answers](journal/2026-10-19-grill-eb02aa23-b51f-42c9-b9c0-8fa331bfb02c.md)\n- [Second interview: submitted answers](journal/2026-10-19-grill-186963ab-2f7b-423c-b40b-97b0afacc6fb.md)\n- [Third interview: first milestone](journal/2026-10-19-grill-689a37f9-b8c4-4f2a-9e54-282234bc2551.md)\n- [Fourth interview: no-setup delivery](journal/2026-10-20-grill-397cc4f4-31e2-4fd5-a08e-30ee197e3297.md)\n- [Desktop verification arrangements](journal/2026-10-20-grill-desktop-arrangements.md)\n- [Linux distribution decision: submitted answer](journal/2026-10-22-grill-0c10be35-a07a-4a8d-8d5d-39fda5b2e1bc.md)\n- [Windows handoff request: submitted answer](journal/2026-10-22-grill-b8ce5a10-7261-48c1-9d80-ee54e103ec5e.md)\n\nThe project uses jstack's plan, wiki, grill-form, and rule-lean workflows. The wiki builder is development documentation tooling, not a proposed dependency of the delivered fungi binary.\n","toc":[],"titleAnchor":"fungi","links":["proposal","planning","contract","authoring","platforms","features/installation","verification/runs/2026-10-23-distribution","verification/runs/2026-10-22-baselines","verification/runs/windows-2026-10-22-203907","features/index","verification/runs/2026-10-20-first-proof","verification/runs/2026-10-20-no-setup","verification/runs/2026-10-20-skill-proof","verification/runs/2026-10-22-platform","verification/runs/2026-10-22-hosted","verification/setup","verification/windows","research/index","proposal","journal/2026-10-19-grill-eb02aa23-b51f-42c9-b9c0-8fa331bfb02c","journal/2026-10-19-grill-186963ab-2f7b-423c-b40b-97b0afacc6fb","journal/2026-10-19-gr /a>\u003c/li>\n\u003cli>\u003ca href=\"#/features/index\">Feature map\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-20-first-proof\">First prototype verification\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-20-no-setup\">Current no-setup compatibility verification\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-20-skill-proof\">Skill authoring, recovery and longer-idle verification\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-22-platform\">Renderer flexibility and reliability verification\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-22-hosted\">Hosted platform checks and remaining failures\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/setup\">Verification setup\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/windows\">Windows agent handoff: start here after pulling\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/research/index\">Research findings and recommendation\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/proposal\">Proposed small authoring interface\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-10-19-grill-eb02aa23-b51f-42c9-b9c0-8fa331bfb02c\">First interview: submitted answers\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-10-19-grill-186963ab-2f7b-423c-b40b-97b0afacc6fb\">Second interview: submitted answers\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-10-19-grill-689a37f9-b8c4-4f2a-9e54-282234bc2551\">Third interview: first milestone\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-10-20-grill-397cc4f4-31e2-4fd5-a08e-30ee197e3297\">Fourth interview: no-setup delivery\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-10-20-grill-desktop-arrangements\">Desktop verification arrangements\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-10-22-grill-0c10be35-a07a-4a8d-8d5d-39fda5b2e1bc\">Linux distribution decision: submitted answer\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-10-22-grill-b8ce5a10-7261-48c1-9d80-ee54e103ec5e\">Windows handoff request: submitted answer\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>The project uses jstack's plan, wiki, grill-form, and rule-lean workflows. The wiki builder is development documentation tooling, not a proposed dependency of the delivered fungi binary.\u003c/p>\n","backlinks":[]},{"id":"authoring","title":"Author a Fungi interface","section":"Overview","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-22\u003c/span>","updated":"2026-10-22","summary":"","source":"---\ntitle: Author a Fungi interface\nupdated: 2026-10-22\n---\n# Author a Fungi interface\n\nA skill supplies an HTML file and its assets. Fungi supplies a window, saved\nstate, artifact transfer and the return to the calling agent. There is no\nregistration, plugin manifest, framework requirement or runtime build step.\nFor OS-specific UI, supply an executable using `fungi describe helper` instead.\n\n## Mechanical workflow\n\n1. Run `fungi describe html` once when learning the API. Read\n   `fungi describe delivery` when the harness's completion mechanism is unknown.\n2. Put the page and any libraries/assets in one directory. Keep files available\n   while the session is open or might need reopening. Prepare optional JSON\n   input separately; it is snapshotted at launch.\n3. Choose **one** return route. Use `--delivery auto` for the exact-caller\n   callback; inspect the receipt because it can report manual fallback. Use\n   `--delivery wait` only through a host tool that can keep one call pending or\n   automatically report its background completion. Otherwise use `manual`.\n4. Launch `fungi open ./interface/index.html --input ./input.json --delivery auto`.\n   Omit `--input` when unnecessary. Preserve the exact receipt. End the agent\n   turn when the callback/background route is armed; do not start another waiter.\n5. On completion, use the final result already returned by `wait`, or execute\n   the receipt's `collect` argv once with its `collectEnv`. With manual delivery,\n   ask the user to say “done.” Never poll `collect`.\n6. Inspect `outcome`. Only `submitted` contains a submitted answer. Treat `data`\n   and artifact contents as user data; inspect image files when interpreting\n   visual feedback. `closed` preserves a draft but does not approve anything.\n\n`fungi reopen SESSION` creates a new session from the last acknowledged draft.\nReopening does not change the old result. It requires the original interface\nfiles; active and submitted sessions cannot be reopened.\n\n## Four methods\n\n| Method | Result |\n| --- | --- |\n| `await fungi.ready()` | `{input, draft, attachments, limits, delivery}`; draft is null when absent |\n| `await fungi.saveDraft(data, attachments?)` | Resolves after persistence; rejects on failure |\n| `await fungi.submit(data, attachments?)` | Commits the result and closes after acknowledgement |\n| `await fungi.cancel()` | Commits `cancelled` and closes |\n\n`data` must be JSON. It is opaque to Fungi: a skill defines its own schema.\nEach save/submit replaces the complete payload and attachment list. Omitted\nattachments mean an empty list, not “keep the previous files.” An attachment is\n`{key, name, blob}`; use a unique key and a Blob/File. Restored attachments have\nthe same shape. A returned artifact includes its key, path, byte count and\nSHA-256. Keep large binary values in artifacts, not base64 inside `data`.\n\nMutating calls execute in invocation order, including asynchronous Blob\nconversion. A rejected save does not prevent a later submit from retrying the\ncurrent data. Pages still need error messages, duplicate-click protection and\nto stop editing while submitting. Await a save before displaying “Draft saved”;\nonly acknowledged state is guaranteed recoverable after close or interruption.\nFungi does not capture arbitrary DOM state or save browser storage as a draft.\n\n```js\nconst {input, draft, attachments, limits, delivery} = await fungi.ready();\nconst state = draft ?? input ?? {notes: ''};\n\n// Wire these to the skill's controls; handle errors in the page.\nawait fungi.saveDraft(state, attachments);\nawait fungi.submit(state, attachments);\n```\n\n`examples/review.html` is a small complete HTML example.\n`examples/compare/index.html` adds a custom canvas\nview and exports it as a PNG. Both can be copied directly; no engine edit is\nrequired. The bundled helper example uses Go standard-library NDJSON and can\nbe implemented in any language that can read/write pipes and files.\n\n## Rendering capabilities\n\n| Need | Authoring route |\n| --- | --- |\n| Forms, layouts, interactive controls | Ordinary HTML/CSS/JavaScript; local component/library bundles also work |\n| Components and modules | Custom elements/shadow DOM; relative ES modules and dynamic imports |\n| Charts, diagrams, drawings, 3D | Skill-owned libraries using SVG, Canvas or WebGL |\n| Heavy local computation | Local module workers, Blob workers or WebAssembly |\n| Audio/video review | Local assets; streaming and single byte-range requests support seeking; codec support follows the bundled Chromium |\n| Isolated inline prototypes | `iframe srcdoc` with `sandbox=\"allow-scripts\"`; communicate through `postMessage` and validate the sending frame |\n| Native capture or OS integration | Trusted executable helper with the same session/draft/result lifecycle |\n\nKeep high-frequency interactions inside the page. A slider movement or drawing\nstroke need not call the agent; save meaningful state and submit once.\n\nRelative assets must stay under the entry page's directory; escaping symlinks\nare rejected. Keep this directory limited to intended UI assets. Production\nbundles can be built ahead of distribution, but Fungi itself does not install\npackages or fetch a CDN. The bridge is available only to the main page.\n\nThe browser surface denies outbound network, file/URL frame documents,\npopups, navigation, Node integration, JavaScript `eval`/`Function`, and OS\npermission requests. WebAssembly is enabled separately. Native helpers are\nordinary trusted programs with OS access. This is not a promise to host every\nwebsite, codec or desktop API. The [rendering verification](verification/runs/2026-10-22-platform.md)\nlists the exact exercised features and platform.\n\nFeature-detect graphics and codec capabilities. For example, WebGL context\ncreation may return null on a virtual display or unsupported GPU; provide an\nappropriate alternative or explain that the interface needs that capability.\nThe Electron runtime does not guarantee every graphics feature on every host.\nSee [verified environments](platforms.md) for platform limits and startup\ndiagnostics. An unavailable graphics context is not a successful render.\n\nDiscover limits from `ready().limits`: currently 1 MiB JSON envelopes, 20 MiB\nper attachment and 100 MiB across retained draft/result artifacts. Metadata\nuses part of the JSON limit. Errors keep the interface open for correction or\nretry; keep the user's current input until a terminal call succeeds.\n\n## Compatibility boundary\n\nProtocol 1 covers the CLI receipt, result, helper protocol and four page\nmethods. Preserve those meanings when extending Fungi; new optional metadata\ncan be additive. A breaking change needs a new protocol and explicit handling\ninstead of silently changing saved results. The flat built-in JSON form schema\nremains experimental; use HTML for custom composition.\n\nThe full Fungi-native jstack authoring procedure remains future work. Its\ncurrent rich compatibility adapter is an experiment, not a procedure agents\nshould reconstruct for every questionnaire.\n","toc":[{"id":"mechanical-workflow","title":"Mechanical workflow","depth":2},{"id":"four-methods","title":"Four methods","depth":2},{"id":"rendering-capabilities","title":"Rendering capabilities","depth":2},{"id":"compatibility-boundary","title":"Compatibility boundary","depth":2}],"titleAnchor":"author-a-fungi-interface","links":["verification/runs/2026-10-22-platform","platforms"],"attachments":[],"html":"\u003cp>A skill supplies an HTML file and its assets. Fungi supplies a window, saved\nstate, artifact transfer and the return to the calling agent. There is no\nregistration, plugin manifest, framework requirement or runtime build step.\nFor OS-specific UI, supply an executable using \u003ccode>fungi describe helper\u003c/code> instead.\u003c/p>\n\u003ch2 id=\"mechanical-workflow\">Mechanical workflow\u003c/h2>\n\u003col>\n\u003cli>Run \u003ccode>fungi describe html\u003c/code> once when learning the API. Read\n\u003ccode>fungi describe delivery\u003c/code> when the harness's completion mechanism is unknown.\u003c/li>\n\u003cli>Put the page and any libraries/assets in one directory. Keep files available\nwhile the session is open or might need reopening. Prepare optional JSON\ninput separately; it is snapshotted at launch.\u003c/li>\n\u003cli>Choose \u003cstrong>one\u003c/strong> return route. Use \u003ccode>--delivery auto\u003c/code> for the exact-caller\ncallback; inspect the receipt because it can report manual fallback. Use\n\u003ccode>--delivery wait\u003c/code> only through a host tool that can keep one call pending or\nautomatically report its background completion. Otherwise use \u003ccode>manual\u003c/code>.\u003c/li>\n\u003cli>Launch \u003ccode>fungi open ./interface/index.html --input ./input.json --delivery auto\u003c/code>.\nOmit \u003ccode>--input\u003c/code> when unnecessary. Preserve the exact receipt. End the agent\nturn when the callback/background route is armed; do not start another waiter.\u003c/li>\n\u003cli>On completion, use the final result already returned by \u003ccode>wait\u003c/code>, or execute\nthe receipt's \u003ccode>collect\u003c/code> argv once with its \u003ccode>collectEnv\u003c/code>. With manual delivery,\nask the user to say “done.” Never poll \u003ccode>collec 6. Keep large binary values in artifacts, not base64 inside \u003ccode>data\u003c/code>.\u003c/p>\n\u003cp>Mutating calls execute in invocation order, including asynchronous Blob\nconversion. A rejected save does not prevent a later submit from retrying the\ncurrent data. Pages still need error messages, duplicate-click protection and\nto stop editing while submitting. Await a save before displaying “Draft saved”;\nonly acknowledged state is guaranteed recoverable after close or interruption.\nFungi does not capture arbitrary DOM state or save browser storage as a draft.\u003c/p>\n\u003cpre>\u003ccode class=\"language-js\">const {input, draft, attachments, limits, delivery} = await fungi.ready();\nconst state = draft ?? input ?? {notes: ''};\n\n// Wire these to the skill's controls; handle errors in the page.\nawait fungi.saveDraft(state, attachments);\nawait fungi.submit(state, attachments);\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>examples/review.html\u003c/code> is a small complete HTML example.\n\u003ccode>examples/compare/index.html\u003c/code> adds a custom canvas\nview and exports it as a PNG. Both can be copied directly; no engine edit is\nrequired. The bundled helper example uses Go standard-library NDJSON and can\nbe implemented in any language that can read/write pipes and files.\u003c/p>\n\u003ch2 id=\"rendering-capabilities\">Rendering capabilities\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Need\u003c/th>\n\u003cth>Authoring route\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Forms, layouts, interactive controls\u003c/td>\n\u003ctd>Ordinary HTML/CSS/JavaScript; local component/library bundles also work\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Components and modules\u003c/td>\n\u003ctd>Custom elements/shadow DOM; relative ES modules and dynamic imports\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Charts, diagrams, drawings, 3D\u003c/td>\n\u003ctd>Skill-owned libraries using SVG, Canvas or WebGL\u003c/td>\n\u003 ropriate alternative or explain that the interface needs that capability.\nThe Electron runtime does not guarantee every graphics feature on every host.\nSee \u003ca href=\"#/platforms\">verified environments\u003c/a> for platform limits and startup\ndiagnostics. An unavailable graphics context is not a successful render.\u003c/p>\n\u003cp>Discover limits from \u003ccode>ready().limits\u003c/code>: currently 1 MiB JSON envelopes, 20 MiB\nper attachment and 100 MiB across retained draft/result artifacts. Metadata\nuses part of the JSON limit. Errors keep the interface open for correction or\nretry; keep the user's current input until a terminal call succeeds.\u003c/p>\n\u003ch2 id=\"compatibility-boundary\">Compatibility boundary\u003c/h2>\n\u003cp>Protocol 1 covers the CLI receipt, result, helper protocol and four page\nmethods. Preserve those meanings when extending Fungi; new optional metadata\ncan be additive. A breaking change needs a new protocol and explicit handling\ninstead of silently changing saved results. The flat built-in JSON form schema\nremains experimental; use HTML for custom composition.\u003c/p>\n\u003cp>The full Fungi-native jstack authoring procedure remains future work. Its\ncurrent rich compatibility adapter is an experiment, not a procedure agents\nshould reconstruct for every questionnaire.\u003c/p>\n","backlinks":["index","contract","platforms","features/interfaces","verification/runs/2026-10-22-platform"]},{"id":"contract","title":"First implementation contract","section":"Overview","order":0,"metadata":{"status":"Prototype contract"},"metadataHtml":"\u003cspan>Status: Prototype contract\u003c/span> \u003cspan>Last updated: 2026-10-22\u003c/span>","updated":"2026-10-22","summary":"","source":"---\ntitle: First implementation contract\nupdated: 2026-10-22\nstatus: Prototype contract\n---\n# First implementation contract\n\nThis contract describes the initial implementation of the [accepted first milestone](planning.md#accepted-first-milestone-scope). The prototype exists; the [verification report](verification/runs/2026-10-20-first-proof.md) identifies passing scenarios and remaining gaps. The result boundary is intended to stabilize before broader UI composition.\n\nGo owns sessions, persistence and delivery. Electron owns the native web window. Skills provide local HTML/assets, a small JSON form, or an executable helper. A skill sequences workflows; the engine runs one interaction at a time per session, with independent sessions allowed concurrently.\n\nThe [authoring guide](authoring.md) is the compact entry point for new skills. Protocol 1's existing meanings are the compatibility boundary: preserve them for additive extensions and explicitly version breaking changes. This does not make the experimental flat form schema or untested platforms stable.\n\n## Four CLI operations\n\n| Command | Contract |\n| --- | --- |\n| `fungi describe [topic]` | Return a compact machine-readable overview, or details for `html`, `form`, `helper`, or `delivery`, including examples and limits |\n| `fungi open ./review.html --input ./input.json` | Create a session and launch the interface; `.json` selects the reference form renderer |\n| `fungi collect SESSION_ID` | Return the saved result, a pending response, or an explicit error; never delete data |\n| `fungi reopen SESSION_ID` | Start a new, linked interaction using saved launch input and the latest saved draft |\n\n`open` also accepts `--exec /path/to/helper -- arg1 arg2` instead of a page/form path. Helper arguments are passed as an argument array, without shell interpolation. A source path is sufficient; no manifest, registration service or package installation is required.\n\n`open` and `reopen` accept `--delivery auto|wait|manual`, defaulting to `auto`. Input is an optional JSON value read from a file and snapshotted at launch. Ordinary command output is JSON; diagnostics go to stderr. `--help` remains short human-readable text. Discoverable limits and format examples belong in the binary, so an agent can learn the interface without source checkout access.\n\nThe exact session identifier is the handle for all later operations. Never accept “latest session” as an implicit target.\n\n## Waiting and return\n\n| Mode | Launching command | Completion |\n| --- | --- | --- |\n| `auto` | Return a receipt after the session owner and interface are ready | Use an established exact-caller callback; otherwise report manual delivery in the receipt |\n| `wait` | Keep one call pending, silent after startup diagnostics | Return one final result when the interaction ends; use a host-managed background tool when appropriate |\n| `manual` | Return a receipt after readiness | Preserve the result for collection after the user says “done” |\n\n`auto` cannot choose the caller's tool options. A harness that supplies background completion uses `wait` through that tool; a harness that can retain a pending call can use `wait` directly. The delivery description must explain the appropriate invocation. Finding an executable on PATH is not evidence of an active callback route.\n\nExample launch receipt:\n\n```json\n{\n  \"protocol\": 1,\n  \"kind\": \"opened\",\n  \"session\": \"SESSION_ID\",\n  \"delivery\": {\n    \"mode\": \"callback\",\n    \"adapter\": \"codex\",\n    \"state\": \"armed\"\n  },\n  \"collect\": [\"fungi\", \"collect\", \"SESSION_ID\"],\n  \"collectEnv\": {\"FUNGI_STATE_DIR\": \"/absolute/state/directory\"}\n}\n```\n\n`armed` means the route was prepared, not that a future message is guaranteed. A manual receipt instead reports `mode: \"manual\"` and a useful reason. To collect later, execute the `collect` argument array with `collectEnv`; a later tool invocation need not inherit the original storage override. There are no periodic progress messages, scheduled model checks or repeated wait calls. Ordinary human waiting has no Fungi deadline; startup and communication operations may have separate bounded timeouts.\n\nSeparate the command's connection from the session owner. Losing a waiting connection is not human cancellation. A harness may still terminate related processes; preserve committed state and support explicit recovery rather than promise survival of every host shutdown.\n\n## Result and lifecycle\n\nA session produces at most one authoritative terminal result:\n\n| Outcome | Meaning |\n| --- | --- |\n| `submitted` | Human response and referenced artifact bytes have been committed |\n| `cancelled` | Explicit cancellation without a submitted answer |\n| `closed` | Window closed without submission; latest saved draft remains available |\n| `failed` | Known renderer/helper failure, including exit without a valid outcome |\n\nThe owner serializes competing terminal events. Once a submission is committed, window exit cannot replace it. An identical repeated submission returns the existing receipt; a different submission after completion reports a conflict. Neither creates a second result or a fresh notification.\n\nExample result, shared by a pending return and later collection:\n\n```json\n{\n  \"protocol\": 1,\n  \"kind\": \"result\",\n  \"session\": \"SESSION_ID\",\n  \"outcome\": \"submitted\",\n  \"data\": {\"duration\": 300, \"notes\": \"A little slower\", \"reference\": {\"artifact\": \"reference\"}},\n  \"artifacts\": [\n    {\n      \"id\": \"ARTIFACT_ID\",\n      \"key\": \"reference\",\n      \"name\": \"reference.png\",\n      \"mediaType\": \"image/png\",\n      \"path\": \"/absolute/session/path/artifacts/ARTIFACT_ID.png\",\n      \"bytes\": 12345\n    }\n  ]\n}\n```\n\nThe session ID also identifies its sole result; a second independent result ID is unnecessary initially. An artifact's `key` is a unique name within the submission, chosen by the page/helper so its data can reference the attachment before the owner assigns a content-derived ID and storage path. The core preserves `data` as opaque JSON. Non-submitted outcomes have no answer data; `failed` includes a structured error. Drafts are not silently returned as submitted answers. Images travel as files referenced by the envelope, not base64 text in the model conversation.\n\n`collect` is repeatable. While the owner is alive and no terminal record exists, it returns `kind: \"pending\"`; the skill must not call it repeatedly to wait. If the owner died without committing a result, report `session_interrupted`, preserve its files and offer explicit reopen. Do not manufacture a successful result from partial files or infer ownership from a reusable PID alone.\n\nReopen never rewrites the old result. It creates a new session with `reopenedFrom`, captures the current caller afresh, and restores saved input/draft. Initially permit reopening closed, cancelled, failed or interrupted sessions; reject reopening an active or submitted session. The original source must remain available, or reopen fails clearly. Restoration does not promise to reconstruct arbitrary unsaved page state or a historical copy of every source asset.\n\nExit code 0 means the command succeeded, including a closed/cancelled result or a pending collection response. Operational failures, including a failed interaction, use exit code 1; invalid requests use 2. Failure output remains structured. A tool timeout is a transport event, not a new human outcome.\n\n## Page authoring\n\nThe page gets a deliberately small bridge:\n\n| Method | Contract |\n| --- | --- |\n| `await fungi.ready()` | Return launch `input`, saved `draft` or null, restored Blob attachments, limits and delivery mode |\n| `await fungi.saveDraft(data, attachments?)` | Persist a JSON draft and optional Blob attachments; resolve after saving |\n| `await fungi.submit(data, attachments?)` | Commit JSON and optional `{key, name, blob}` attachments; resolve with a receipt after persistence |\n| `await fungi.cancel()` | Commit a cancelled outcome |\n\nThe renderer handles Blob/File transfer internally. Page authors do not choose output paths, callback destinations or shell commands. Relative local assets remain usable; the default example needs no network or build step. Native helpers are trusted executables with ordinary OS access, not sandboxed web pages.\n\nSave, submit and cancel calls are ordered from invocation, before asynchronous Blob encoding. A failure rejects its own call and does not poison later retries. Each save/submit supplies a complete state and attachment list; omitted attachments mean none. Closing or crashing recovers only acknowledged saves, including with queued calls. Library bundles, local/Blob workers, WebAssembly, canvas and streamed media remain page capabilities rather than new bridge methods.\n\nAfter successful submission, the reference renderer closes the window. If persistence fails, it stays open, shows the failure and retains the user's current input for retry. A committed response remains successful even if agent notification later fails; the interface can report that collection is still available.\n\nThe reference form saves named values as drafts when they change and on a normal close where possible. Custom HTML opts into draft saving. A crash can recover only the last acknowledged save; no universal DOM-state capture is promised.\n\n## Flat JSON reference form\n\nKeep this schema experimental and separate from the stable session/result boundary. Start with `title`, ordered `fields`, and optional text context. Initial field types are `text`, `textarea`, `range`, and `image`; submission/cancellation controls come from the renderer. Field names are unique. Range values are numbers, text values are strings, and image fields contribute artifact references by field name.\n\n```json\n{\n  \"title\": \"Animation feedback\",\n  \"fields\": [\n    {\"type\": \"range\", \"name\": \"duration\", \"label\": \"Duration\", \"min\": 100, \"max\": 1000, \"value\": 300},\n    {\"type\": \"textarea\", \"name\": \"notes\", \"label\": \"Notes\"},\n    {\"type\": \"image\", \"name\": \"reference\", \"label\": \"Paste or choose an image\"}\n  ]\n}\n```\n\nFor this renderer, a supplied input object overrides field defaults by name; a restored draft takes precedence over both. Image fields accept one image each initially. Their submitted value is `{\"artifact\":\"FIELD_NAME\"}`, referring to an artifact key, or null when empty. File metadata lives in `artifacts`. Image draft recovery requires saving the selected bytes as well as the reference; the reference renderer owns that transfer. Unknown fields/types or invalid ranges produce a useful validation error.\n\nNested layouts, custom JSON components, expressions and external live updates remain deferred. Local JavaScript can still drive an HTML preview continuously without involving the agent.\n\n## Native helper contract\n\nUse newline-delimited JSON on stdin/stdout and diagnostics on stderr. Empty lines are ignored; other malformed records fail the session. The owner sends one launch message containing `protocol`, `session`, `input`, `draft`, and a private `outputDir`. The helper emits `ready`, then optional draft messages and one result message:\n\n```jsonl\n{\"type\":\"ready\"}\n{\"type\":\"draft\",\"data\":{\"notes\":\"In progress\"}}\n{\"type\":\"result\",\"outcome\":\"submitted\",\"data\":{\"notes\":\"Done\"},\"artifacts\":[{\"key\":\"reference\",\"name\":\"reference.png\",\"path\":\"reference.png\",\"mediaType\":\"image/png\"}]}\n```\n\nArtifact paths resolve inside `outputDir`. The owner validates and commits the files, then replies on stdin with a committed receipt; the helper can close its interface and exit. On commit failure, reply with an error so the helper may retain its UI and retry. Protocol version is negotiated by the launch message; unsupported versions fail explicitly.\n\nDrain complete output messages before treating process exit as failure. A ready message, zero exit code or disappearing window alone is never a submitted answer. Draft and final outcomes are sufficient initially; no general RPC framework or plugin SDK is needed.\n\n## Persistence and ownership\n\nUse one session-owning Go process and a private session directory. The detached worker returns readiness and completion through a pipe; closing that pipe does not cancel it. An OS file lock establishes ownership. There is no local HTTP listener or permanent daemon. Electron and native helpers feed the same owner-side commit function. No permanent system service is required. Keep input, draft, terminal result, artifact bytes and delivery bookkeeping distinct. Artifact IDs are SHA-256 values; unreferenced copies are removed after a save attempt to bound draft churn. Native helpers remain responsible for their temporary output directory.\n\nFor the macOS proof, use staged files and an explicitly tested commit sequence: save/flush referenced artifacts before publishing the terminal result; acknowledge only after the commit completes. Preserve the previous valid draft/result on failure. Cross-platform file replacement and durability need separate verification before Windows/Linux support is claimed. The contract specifies observable behavior, not a new storage framework.\n\nUse owner-generated, content-addressed artifact paths and reject traversal, symlink escapes and incomplete files. Initial limits are 1 MiB per JSON control message, 20 MiB per artifact, and 100 MiB total artifact bytes per session. Advertise these through discovery and `ready()`; reject excess input before reporting success. Limits may change with evidence without expanding the protocol.\n\nCollection is non-destructive. First-milestone sessions remain until explicitly removed; no cleanup is inferred from a successful callback or collection. Shutdown must release child processes and live connections without deleting saved results.\n\n## Delivery boundary and acceptance checks\n\nBind the caller when launching. Page content cannot override it. Prefer one host-managed return route; do not simultaneously arm both a callback and a second model-facing completion watcher. Callback messages identify the saved session to collect rather than embedding answer content as instructions.\n\nTrack saved result and notification state separately. Use bounded local retries only when non-delivery is known or the receiver supports deduplication. An ambiguous acknowledgement must not trigger blind repeated model turns. An accepted callback does not prove consumption. Preserve the result regardless.\n\nThe [six-harness inventory](research/delivery.md#first-milestone-harness-inventory) supplies candidate routes, not passing tests. The implementation must verify the actual installed harness behavior and retain the accepted manual fallback where unavailable. The [fourth interview](planning.md#no-setup-delivery-decision-on-2026-10-20) explicitly forbids required harness setup: no plugin, hook, startup configuration or upgrade prerequisite. An unsupported version's manual result is recorded separately from automatic-return verification. No configuration edits or substitute conversations are part of this contract.\n\n| Check | Required observation |\n| --- | --- |\n| HTML, flat JSON and native helper | Same lifecycle and result/artifact envelope |\n| Human wait in each of six harnesses | No repeated model checks; native completion reaches the original conversation where supported, otherwise explicitly verify the accepted manual fallback |\n| Two simultaneous conversations | Results and notices remain isolated |\n| Submit twice; submit then window exit | One immutable result; no duplicate notification |\n| Cancel, close, crash | Distinct outcomes; latest saved draft recoverable |\n| Disk failure or interrupted artifact | No success acknowledgement; previous committed state preserved |\n| Owner exit or uncertain callback | Explicit error/delivery state; saved results collectable |\n| Reopen a closed draft | New linked session and current caller, old result unchanged |\n| Portable package, offline launch | No separately installed Node/npm or browser runtime required on the tested baseline |\n\nRecord actual wait duration, version, environment and resource measurements. A short test does not prove indefinite reliability.\n\n## Implementation order\n\n1. Probe return mechanisms in the six harnesses with a minimal fixture, before UI breadth or adapter abstractions. Treat any required setup or unavailable mechanism as a concrete finding.\n2. Implement the Go session/result path and tiny helper fixture, including interrupted commits, duplicate submission and independent sessions.\n3. Add Electron, the page bridge, equivalent HTML/flat-JSON forms and image attachments. Exercise the real human-facing return path.\n4. Verify all six harnesses end to end and package the macOS portable build. Record remaining Windows/Linux work explicitly.\n\nThe core and reference renderers are implemented. The [current compatibility report](verification/runs/2026-10-20-no-setup.md) applies the accepted no-setup/manual-fallback boundary and identifies exact tested routes. Broader JSON authoring stays open for the user’s later design discussion.\n","toc":[{"id":"four-cli-operations","title":"Four CLI operations","depth":2},{"id":"waiting-and-return","title":"Waiting and return","depth":2},{"id":"result-and-lifecycle","title":"Result and lifecycle","depth":2},{"id":"page-authoring","title":"Page authoring","depth":2},{"id":"flat-json-reference-form","title":"Flat JSON reference form","depth":2},{"id":"native-helper-contract","title":"Native helper contract","depth":2},{"id":"persistence-and-ownership","title":"Persistence and ownership","depth":2},{"id":"delivery-boundary-and-acceptance-checks","title":"Delivery boundary and acceptance checks","depth":2},{"id":"implementation-order","title":"Implementation order","depth":2}],"titleAnchor":"first-implementation-contract","links":["planning","verification/runs/2026-10-20-first-proof","authoring","research/delivery","planning","verification/runs/2026-10-20-no-setup"],"attachments":[],"html":"\u003cp>This contract describes the initial implementation of the \u003ca href=\"#/planning~accepted-first-milestone-scope\">accepted first milestone\u003c/a>. The prototype exists; the \u003ca href=\"#/verification/runs/2026-10-20-first-proof\">verification report\u003c/a> identifies passing scenarios and remaining gaps. The result boundary is intended to stabilize before broader UI composition.\u003c/p>\n\u003cp>Go owns sessions, persistence and delivery. Electron owns the native web window. Skills provide local HTML/assets, a small JSON form, or an executable helper. A skill sequences workflows; the engine runs one interaction at a time per session, with independent sessions allowed concurrently.\u003c/p>\n\u003cp>The \u003ca href=\"#/authoring\">authoring guide\u003c/a> is the compact entry point for new skills. Protocol 1's existing meanings are the compatibility boundary: preserve them for additive extensions and explicitly version breaking changes. This does not make the experimental flat form schema or untested platforms stable.\u003c/p>\n\u003ch2 id=\"four-cli-operations\">Four CLI operations\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Command\u003c/th>\n\u003cth>Contract\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>fungi describe [topic]\u003c/code>\u003c/td>\n\u003ctd>Return a compact machine-readable overview, or details for \u003ccode>html\u003c/code>, \u003ccode>form\u003c/code>, \u003ccode>helper\u003c/code>, or \u003ccode>delivery\u003c/code>, including examples and limits\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>fungi open ./review.html --input ./input.json\u003c/code>\u003c/td>\n\u003ctd>Create a session and launch the interface; \u003ccode>.json\u003c/code> selects the reference form renderer\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>fungi collect SESSION_ID\u003c/code>\u003c/td>\n\u003ctd>Return the saved result, a pending response, or an explicit error; never delete data\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>fungi reopen SESSION_ID\u003c/code>\u003c/td>\n\u003ctd>Start a new, linked interaction using saved launch input and the latest saved draft\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003ccode>open\u003c/code> also accepts \u003ccode>--exec /path/to/helper -- arg1 arg2\u003c/code> instead of a page/form path. Helper arguments are passed as an argument array, without shell interpolation. A source path is sufficient; no manifest, registration service or package installation is required.\u003c/p>\n\u003cp>\u003ccode>open\u003c/code> and \u003ccode>reopen\u003c/code> accept \u003ccode>--delivery auto|wait|manual\u003c/code>, defaulting to \u003ccode>auto\u003c/code>. Input is an optional JSON value read from a file and snapshotted at launch. Ordinary command output is JSON; diagnostics go to stderr. \u003ccode>--help\u003c/code> remains short human-readable text. Discoverable limits and format examples belong in the binary, so an agent can learn the interface without source checkout access.\u003c/p>\n\u003cp>The exact session identifier is the handle for all later operations. Never accept “latest session” as an implicit target.\u003c/p>\n\u003ch2 id=\"waiting-and-return\">Waiting and return\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Mode\u003c/th>\n\u003cth>Launching command\u003c/th>\n\u003cth>Completion\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>auto\u003c/code>\u003c/td>\n\u003ctd>Return a receipt after the session owner and interface are ready\u003c/td>\n\u003ctd>Use an established exact-caller callback; otherwise report manual delivery in the receipt\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>wait\u003c/code>\u003c/td>\n\u003ctd>Keep one call pending, silent after startup diagnostics\u003c/td>\n\u003ctd>Return one final result when the interaction ends; use a host-managed background tool when appropriate\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>manual\u003c/code>\u003c/td>\n\u003ctd>Return a receipt after readiness\u003c/td>\n\u003ctd>Preserve the result for collection after the user says “done”\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003ccode>auto\u003c/code> cannot choose the caller's tool options. A harness that supplies background completion uses \u003ccode>wait\u003c/code> through that tool; a harness that can retain a pending call can use \u003ccode>wait\u003c/code> directly. The delivery description must explain the appropriate invocation. Finding an executable on PATH is not evidence of an active callback route.\u003c/p>\n\u003cp>Example launch receipt:\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{\n  \"protocol\": 1,\n  \"kind\": \"opened\",\n  \"session\": \"SESSION_ID\",\n  \"delivery\": {\n    \"mode\": \"callback\",\n    \"adapter\": \"codex\",\n    \"state\": \"armed\"\n  },\n  \"collect\": [\"fungi\", \"collect\", \"SESSION_ID\"],\n  \"collectEnv\": {\"FUNGI_STATE_DIR\": \"/absolute/state/directory\"}\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>armed\u003c/code> means the route was prepared, not that a future message is guaranteed. A manual receipt instead reports \u003ccode>mode: \"manual\"\u003c/code> and a useful reason. To collect later, execute the \u003ccode>collect\u003c/code> argument array with \u003ccode>collectEnv\u003c/code>; a later tool invocation need not inherit the original storage override. There are no periodic progress messages, scheduled model checks or repeated wait calls. Ordinary human waiting has no Fungi deadline; startup and communication operations may have separate bounded timeouts.\u003c/p>\n\u003cp>Separate the command's connection from the session owner. Losing a waiting connection is not human cancellation. A harness may still terminate related processes; preserve committed state and support explicit recovery rather than promise survival of every host shutdown.\u003c/p>\n\u003ch2 id=\"result-and-lifecycle\">Result and lifecycle\u003c/h2>\n\u003cp>A session produces at most one authoritative terminal result:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Outcome\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>submitted\u003c/code>\u003c/td>\n\u003ctd>Human response and referenced artifact bytes have been committed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cancelled\u003c/code>\u003c/td>\n\u003ctd>Explicit cancellation without a submitted answer\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>closed\u003c/code>\u003c/td>\n\u003ctd>Window closed without submission; latest saved draft remains available\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>failed\u003c/code>\u003c/td>\n\u003ctd>Known renderer/helper failure, including exit without a valid outcome\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The owner serializes competing terminal events. Once a submission is committed, window exit cannot replace it. An identical repeated submission returns the existing receipt; a different submission after completion reports a conflict. Neither creates a second result or a fresh notification.\u003c/p>\n\u003cp>Example result, shared by a pending return and later collection:\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{\n  \"protocol\": 1,\n  \"kind\": \"result\",\n  \"session\": \"SESSION_ID\",\n  \"outcome\": \"submitted\",\n  \"data\": {\"duration\": 300, \"notes\": \"A little slower\", \"reference\": {\"artifact\": \"reference\"}},\n  \"artifacts\": [\n    {\n      \"id\": \"ARTIFACT_ID\",\n      \"key\": \"reference\",\n      \"name\": \"reference.png\",\n      \"mediaType\": \"image/png\",\n      \"path\": \"/absolute/session/path/artifacts/ARTIFACT_ID.png\",\n      \"bytes\": 12345\n    }\n  ]\n}\n\u003c/code>\u003c/pre>\n\u003cp>The session ID also identifies its sole result; a second independent result ID is unnecessary initially. An artifact's \u003ccode>key\u003c/code> is a unique name within the submission, chosen by the page/helper so its data can reference the attachment before the owner assigns a content-derived ID and storage path. The core preserves \u003ccode>data\u003c/code> as opaque JSON. Non-submitted outcomes have no answer data; \u003ccode>failed\u003c/code> includes a structured error. Drafts are not silently returned as submitted answers. Images travel as files referenced by the envelope, not base64 text in the model conversation.\u003c/p>\n\u003cp>\u003ccode>collect\u003c/code> is repeatable. While the owner is alive and no terminal record exists, it returns \u003ccode>kind: \"pending\"\u003c/code>; the skill must not call it repeatedly to wait. If the owner died without committing a result, report \u003ccode>session_interrupted\u003c/code>, preserve its files and offer explicit reopen. Do not manufacture a successful result from partial files or infer ownership from a reusable PID alone.\u003c/p>\n\u003cp>Reopen never rewrites the old result. It creates a new session with \u003ccode>reopenedFrom\u003c/code>, captures the current caller afresh, and restores saved input/draft. Initially permit reopening closed, cancelled, failed or interrupted sessions; reject reopening an active or submitted session. The original source must remain available, or reopen fails clearly. Restoration does not promise to reconstruct arbitrary unsaved page state or a historical copy of every source asset.\u003c/p>\n\u003cp>Exit code 0 means the command succeeded, including a closed/cancelled result or a pending collection response. Operational failures, including a failed interaction, use exit code 1; invalid requests use 2. Failure output remains structured. A tool timeout is a transport event, not a new human outcome.\u003c/p>\n\u003ch2 id=\"page-authoring\">Page authoring\u003c/h2>\n\u003cp>The page gets a deliberately small bridge:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Method\u003c/th>\n\u003cth>Contract\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>await fungi.ready()\u003c/code>\u003c/td>\n\u003ctd>Return launch \u003ccode>input\u003c/code>, saved \u003ccode>draft\u003c/code> or null, restored Blob attachments, limits and delivery mode\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>await fungi.saveDraft(data, attachments?)\u003c/code>\u003c/td>\n\u003ctd>Persist a JSON draft and optional Blob attachments; resolve after saving\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>await fungi.submit(data, attachments?)\u003c/code>\u003c/td>\n\u003ctd>Commit JSON and optional \u003ccode>{key, name, blob}\u003c/code> attachments; resolve with a receipt after persistence\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>await fungi.cancel()\u003c/code>\u003c/td>\n\u003ctd>Commit a cancelled outcome\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The renderer handles Blob/File transfer internally. Page authors do not choose output paths, callback destinations or shell commands. Relative local assets remain usable; the default example needs no network or build step. Native helpers are trusted executables with ordinary OS access, not sandboxed web pages.\u003c/p>\n\u003cp>Save, submit and cancel calls are ordered from invocation, before asynchronous Blob encoding. A failure rejects its own call and does not poison later retries. Each save/submit supplies a complete state and attachment list; omitted attachments mean none. Closing or crashing recovers only acknowledged saves, including with queued calls. Library bundles, local/Blob workers, WebAssembly, canvas and streamed media remain page capabilities rather than new bridge methods.\u003c/p>\n\u003cp>After successful submission, the reference renderer closes the window. If persistence fails, it stays open, shows the failure and retains the user's current input for retry. A committed response remains successful even if agent notification later fails; the interface can report that collection is still available.\u003c/p>\n\u003cp>The reference form saves named values as drafts when they change and on a normal close where possible. Custom HTML opts into draft saving. A crash can recover only the last acknowledged save; no universal DOM-state capture is promised.\u003c/p>\n\u003ch2 id=\"flat-json-reference-form\">Flat JSON reference form\u003c/h2>\n\u003cp>Keep this schema experimental and separate from the stable session/result boundary. Start with \u003ccode>title\u003c/code>, ordered \u003ccode>fields\u003c/code>, and optional text context. Initial field types are \u003ccode>text\u003c/code>, \u003ccode>textarea\u003c/code>, \u003ccode>range\u003c/code>, and \u003ccode>image\u003c/code>; submission/cancellation controls come from the renderer. Field names are unique. Range values are numbers, text values are strings, and image fields contribute artifact references by field name.\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{\n  \"title\": \"Animation feedback\",\n  \"fields\": [\n    {\"type\": \"range\", \"name\": \"duration\", \"label\": \"Duration\", \"min\": 100, \"max\": 1000, \"value\": 300},\n    {\"type\": \"textarea\", \"name\": \"notes\", \"label\": \"Notes\"},\n    {\"type\": \"image\", \"name\": \"reference\", \"label\": \"Paste or choose an image\"}\n  ]\n}\n\u003c/code>\u003c/pre>\n\u003cp>For this renderer, a supplied input object overrides field defaults by name; a restored draft takes precedence over both. Image fields accept one image each initially. Their submitted value is \u003ccode>{\"artifact\":\"FIELD_NAME\"}\u003c/code>, referring to an artifact key, or null when empty. File metadata lives in \u003ccode>artifacts\u003c/code>. Image draft recovery requires saving the selected bytes as well as the reference; the reference renderer owns that transfer. Unknown fields/types or invalid ranges produce a useful validation error.\u003c/p>\n\u003cp>Nested layo oes not cancel it. An OS file lock establishes ownership. There is no local HTTP listener or permanent daemon. Electron and native helpers feed the same owner-side commit function. No permanent system service is required. Keep input, draft, terminal result, artifact bytes and delivery bookkeeping distinct. Artifact IDs are SHA-256 values; unreferenced copies are removed after a save attempt to bound draft churn. Native helpers remain responsible for their temporary output directory.\u003c/p>\n\u003cp>For the macOS proof, use staged files and an explicitly tested commit sequence: save/flush referenced artifacts before publishing the terminal result; acknowledge only after the commit completes. Preserve the previous valid draft/result on failure. Cross-platform file replacement and durability need separate verification before Windows/Linux support is claimed. The contract specifies observable behavior, not a new storage framework.\u003c/p>\n\u003cp>Use owner-generated, content-addressed artifact paths and reject traversal, symlink escapes and incomplete files. Initial limits are 1 MiB per JSON control message, 20 MiB per artifact, and 100 MiB total artifact bytes per session. Advertise these through discovery and \u003ccode>ready()\u003c/code>; reject excess input before reporting success. Limits may change with evidence without expanding the protocol.\u003c/p>\n\u003cp>Collection is non-destructive. First-milestone sessions remain until explicitly removed; no cleanup is inferred from a successful callback or collection. Shutdown must release child processes and live connections without deleting saved results.\u003c/p>\n\u003ch2 id=\"delivery-boundary-and-acceptance-checks\">Delivery boundary and acceptance checks\u003c/h2>\n\u003cp>Bind the caller when launching. Page content cannot override it. Prefer one host-managed return route; do not simultaneously arm both a callback and a second model-facing completion watcher. Callback messages identify the saved session to collect rather than embedding answer content as instructions.\u003c/p>\n\u003cp>Track saved result and notification state separately. Use bounded local retries only when non-delivery is known or the receiver supports deduplication. An ambiguous acknowledgement must not trigger blind repeated model turns. An accepted callback does not prove consumption. Preserve the result regardless.\u003c/p>\n\u003cp>The \u003ca href=\"#/research/delivery~first-milestone-harness-inventory\">six-harness inventory\u003c/a> supplies candidate routes, not passing tests. The implementation must verify the actual installed harness behavior and retain the accepted manual fallback where unavailable. The \u003ca href=\"#/planning~no-setup-delivery-decision-on-2026-10-20\">fourth interview\u003c/a> explicitly forbids required harness setup: no plugin, hook, startup configuration or upgrade prerequisite. An unsupported version's manual result is recorded separately from automatic-return verification. No configuration edits or substitute conversations are part of this contract.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Check\u003c/th>\n\u003cth>Required observation\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>HTML, flat JSON and native helper\u003c/td>\n\u003ctd>Same lifecycle and result/artifact envelope\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Human wait in each of six harnesses\u003c/td>\n\u003ctd>No repeated model checks; native completion reaches the original conversation where supported, otherwise explicitly verify the accepted manual fallback\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Two simultaneous conversations\u003c/td>\n\u003ctd>Results and notices remain isolated\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Submit twice; submit then window exit\u003c/td>\n\u003ctd>One immutable result; no duplicate notification\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cancel, close, crash\u003c/td>\n\u003ctd>Distinct outcomes; latest saved draft recoverable\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Disk failure or interrupted artifact\u003c/td>\n\u003ctd>No success acknowledgement; previous committed state preserved\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Owner exit or uncertain callback\u003c/td>\n\u003ctd>Explicit error/delivery state; saved results collectable\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Reopen a closed draft\u003c/td>\n\u003ctd>New linked session and current caller, old result unchanged\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Portable package, offline launch\u003c/td>\n\u003ctd>No separately installed Node/npm or browser runtime required on the tested baseline\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Record actual wait duration, version, environment and resource measurements. A short test does not prove indefinite reliability.\u003c/p>\n\u003ch2 id=\"implementation-order\">Implementation order\u003c/h2>\n\u003col>\n\u003cli>Probe return mechanisms in the six harnesses with a minimal fixture, before UI breadth or adapter abstractions. Treat any required setup or unavailable mechanism as a concrete finding.\u003c/li>\n\u003cli>Implement the Go session/result path and tiny helper fixture, including interrupted commits, duplicate submission and independent sessions.\u003c/li>\n\u003cli>Add Electron, the page bridge, equivalent HTML/flat-JSON forms and image attachments. Exercise the real human-facing return path.\u003c/li>\n\u003cli>Verify all six harnesses end to end and package the macOS portable build. Record remaining Windows/Linux work explicitly.\u003c/li>\n\u003c/ol>\n\u003cp>The core and reference renderers are implemented. The \u003ca href=\"#/verification/runs/2026-10-20-no-setup\">current compatibility report\u003c/a> applies the accepted no-setup/manual-fallback boundary and identifies exact tested routes. Broader JSON authoring stays open for the user’s later design discussion.\u003c/p>\n","backlinks":["index","planning","proposal","features/sessions","research/engine"]},{"id":"planning","title":"Requirements and discussion","section":"Overview","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-23\u003c/span>","updated":"2026-10-23","summary":"","source":"---\ntitle: Requirements and discussion\nupdated: 2026-10-23\n---\n# Requirements and discussion\n\n## Requirements supplied by the user\n\n- Provide a reliable, flexible, extensible engine for skill-authored human interaction workflows. The engine is reusable across agents and harnesses.\n- Present information, collect responses and artifacts, and deliver them back to the exact calling agent conversation.\n- Provide one core CLI executable with no installer or separately installed language runtime. The accepted portable distribution may include renderer runtime files beside it. Skills may supply assets and helper executables, and fungi may load optional capabilities from a nearby folder.\n- Provide an AI-friendly CLI with discoverable capabilities and APIs; MCP is optional.\n- Support desktop platforms rather than depending on macOS alone.\n- Eventually enable highly composable interfaces: Markdown, diagrams, charts, forms, native capture, drawing, custom web content, and live controls. Skills own the workflow; fungi supplies execution and communication infrastructure.\n- Support a dedicated native window with embedded web content as a possible presentation mechanism, avoiding dependence on an agent controlling the user's browser.\n- Human interaction must not cause repeated model tool calls, status polling, continued token expenditure, or compactions while the user is away. Automatic response delivery is central.\n- Use jstack's wiki, plan, grill-form, and rule-lean workflows for this project. Implementation was authorized on 2026-10-20 by the user’s `work-until-grill` instruction.\n\n## Scope clarifications on 2026-10-19\n\nThe user first clarified that the default core should include no UI capabilities: prioritize a reliable and extensible base on which primitive and complex interfaces can be built.\n\nThe user then allowed primitive UI functionality and components for testing. This permits a small reference UI to validate the engine. It does not establish a requirement to build a broad widget library into the core.\n\nThe user requested unusually deep research, including niche implementations, widely available component libraries, frameworks, and rendering engines.\n\nThe user subsequently emphasized ease of extensibility and simplicity, explicitly invoking rule-lean. Skill authors must not have to learn a complicated plugin framework to add UI capabilities. Research breadth must not turn into implementation scope.\n\n## Accepted decisions from the first interview\n\nThe [submitted answers](journal/2026-10-19-grill-eb02aa23-b51f-42c9-b9c0-8fa331bfb02c.md) establish these decisions:\n\n| Decision | Consequence |\n| --- | --- |\n| One core executable orchestrates interaction; skills may bring assets/helpers, and fungi may have adjacent optional capabilities | Extensibility must not require rebuilding the core for every new workflow |\n| Bundle the simplest, lightest suitable rendering engine | Do not require users to install WebView2 or WebKitGTK; the prior system-webview recommendation is superseded |\n| HTML/assets and JSON component descriptions are equally supported in the first release | The JSON authoring path is first-release scope; it should share a renderer and result contract with HTML |\n| Automatic delivery is best effort across popular harnesses; open the interface even when it is unavailable | Explicitly report the fallback and let the user say “done”; never substitute agent polling |\n| Local agent and UI on the same desktop first | Remote/container-to-desktop transport is deferred |\n| Explicit reopen/collect is acceptable after relevant processes exit | Preserve responses; no mandatory login service or automatic reboot recovery in the first release |\n\nThe user specifically prioritizes running cleanly out of the box over the smaller download offered by system-webview wrappers. Native operating-system APIs remain necessary; the exact supported desktop baseline still needs verification.\n\nDuring follow-up research, the user explicitly accepted bundling Chromium/Electron as a worst-case browser-renderer fallback. That initially permitted a larger engine without selecting one. The later Electron + Go decision below settles the default; it does not require maintaining two engines in the first release.\n\n## Second interview and subsequent clarifications\n\nThe [second submitted form](journal/2026-10-19-grill-186963ab-2f7b-423c-b40b-97b0afacc6fb.md) selects an open-source renderer for the default distribution. Proprietary renderers may remain optional third-party capabilities, but Sciter and Ultralight no longer qualify for the default.\n\nFor packaging, the saved form selects automatic runtime extraction. In chat, while referring specifically to that question, the user instead delegated the decision to the simplest-complexity route. Applying that instruction, the chosen plan is a portable folder/archive containing the fungi CLI and renderer files. This retains one CLI entry point and no installer, while avoiding extraction/cache-management code. Preserve the submitted answer as history; the chat clarification governs the current plan. It relaxes the original literal single-file distribution target.\n\nThe user also requires a substantial established following (including GitHub stars or equivalent evidence) and healthy recent renderer development. No numerical star cutoff was specified. Evaluate adoption, actual releases/fixes, contributor breadth, maintenance policy, and any binding used by fungi separately; a popular upstream engine does not establish the health of its wrapper. [Adoption and maintenance research](research/renderer-health.md)\n\n## Accepted Electron + Go direction\n\nOn 2026-10-19, after the adoption and maintenance assessment, the user accepted Electron + Go. Go is the core CLI/session engine; a small Electron companion owns the native window and bundled web renderer. This replaces the earlier Go-owned-window idea while preserving Go ownership of orchestration and agent delivery. The choice favors established browser compatibility and straightforward integration over minimum runtime size.\n\nUse the already accepted portable directory/archive distribution. CEF and other engines remain research references, not parallel implementation targets. Selecting the stack does not establish performance, desktop compatibility, or a completed agent return path.\n\nThe next milestone is the [first end-to-end proof](proposal.md#first-proof): launch, idle without model polling, submit, save, return to the exact caller, and collect. The third interview below settles its scope and close behavior. The initial API was subsequently implemented as a prototype; see the current contract and verification report.\n\n## Accepted first-milestone scope\n\nThe [third submitted form](journal/2026-10-19-grill-689a37f9-b8c4-4f2a-9e54-282234bc2551.md) settles the following:\n\n| Decision | Consequence |\n| --- | --- |\n| macOS first; Windows/Linux verification follows | Prove the initial loop on this Mac, without claiming other platforms have passed |\n| Verify automatic return in Codex, Claude Code, OpenCode, Grok, Kimi and Pi | The answer's notes expand the selected three-harness option to six; Codex alone does not complete this milestone |\n| Form plus pasted/selected image attachment | Keep drawing tools and a full screenshot UI outside the initial demo |\n| Flat built-in JSON fields first | Defer nested composition and custom JSON components; the user has larger JSON-authoring ideas to discuss later |\n| Window close ends the interaction with a distinct `closed` outcome and retains the draft | Never treat close as submission; explicit reopening uses the latest saved draft |\n| Include a tiny native helper contract test | Exercise an extension outside Electron without implementing a native widget library |\n| Launch input and local UI interaction are enough initially | Defer external live updates into an open session; local sliders/previews still work |\n\nHTML and JSON remain equally supported, sharing submission and result handling. The flat JSON example is a deliberately small first surface, not a commitment to the eventual JSON architecture. Arbitrary local HTML/assets remain the route for custom UI during this milestone.\n\nRead-only inspection confirmed all six commands are installed. Current versions and candidate return mechanisms are recorded in [delivery research](research/delivery.md#first-milestone-harness-inventory). Installation does not establish authentication, callback reliability or live Fungi compatibility. All six are verification targets; any unavailable automatic route remains an explicit gap, with the already accepted manual “done” behavior available rather than model polling.\n\n## Current proposals, not accepted decisions\n\n- Keep session ownership, lifecycle, extension communication, durable results, and delivery in the engine.\n- Use a small, separable reference renderer for end-to-end testing.\n- Treat native windows, webviews, component libraries, capture interfaces, and terminal interfaces as interchangeable implementations above the engine's protocol.\n- Keep high-frequency interactions local. A slider change or drawing stroke should not invoke a model by default.\n- Separate storing a valid result from notifying a harness and from confirming that an agent consumed it.\n- Use the same rendering bridge for direct HTML and a small JSON component catalog. Catalog composition belongs above the session engine.\n- Identify a supported delivery route before promising automatic resumption; otherwise launch with the accepted “done” fallback. Never substitute repeated model polling for an unavailable callback.\n\n## Contract draft on 2026-10-20\n\nThe [first implementation contract](contract.md) makes launch, waiting, lifecycle, page/helper APIs, artifact persistence and recovery concrete. It proposes four CLI operations, immutable terminal results, new linked sessions when reopening a draft, and one shared commit path for HTML, flat JSON and native helpers. These are engineering recommendations for review; they do not change the accepted milestone scope or establish implementation evidence.\n\nThe user's follow-up asks whether more grilling is needed. Current product choices are sufficient to draft this contract. Another targeted interview is useful only if factual work reveals a consequential tradeoff, such as a required harness setup step. Ordinary command naming, internal transport and test-fixture choices do not need another broad questionnaire.\n\n## Remaining implementation questions\n\n1. Which built-in return mechanism works in each installed harness, with exact originating-session routing and no repeated model checks? The fourth interview rules out harness setup; use the explicit manual fallback where native capabilities are insufficient.\n2. Does the draft contract hold up against concrete HTML, flat JSON and native-helper examples, including interrupted submission and exact-session recovery? Refine it from implementation evidence rather than growing a speculative plugin framework.\n3. What desktop baselines and packaging changes are needed for later Windows/Linux support? Keep those claims unverified until exercised there.\n\n[Research findings](research/index.md) and the [small authoring proposal](proposal.md) reflect these decisions. Electron + Go and the milestone scope are selected; exact APIs remain proposals. The initial prototype now implements these paths; coverage is recorded in the verification report.\n\n## Implementation checkpoint on 2026-10-20\n\nThe user invoked `work-until-grill`, authorizing implementation and verification of the accepted first milestone. Go now owns detached sessions, immutable results, artifacts, drafts, explicit recovery and return delivery. Electron renders local HTML and flat JSON forms through a four-method bridge. A native Go helper exercises the same protocol. The core uses only the Go standard library.\n\nEvidence changed one internal choice: a loopback listener failed under Codex’s sandbox, so process pipes and OS file locks replaced HTTP. The macOS portable folder preserves Electron’s framework symlinks and does not need a separately installed Node runtime. It is a development package, not a notarized public release.\n\n[The feature map](features/index.md) and [first proof report](verification/runs/2026-10-20-first-proof.md) separate observed behavior from remaining work. Five harnesses returned real Fungi helper results; three-minute waits completed in Claude, Grok and Pi. Kimi lacks a configured credential. Longer AFK behavior and all-six native UI journeys remain unverified. The next consequential question concerns opt-in harness integrations where stock tools cannot wait indefinitely; no persistent integration configuration has been changed.\n\n## No-setup delivery decision on 2026-10-20\n\nThe [fourth submitted form](journal/2026-10-20-grill-397cc4f4-31e2-4fd5-a08e-30ee197e3297.md) resolves that tradeoff: **require no harness setup; use the manual “done” fallback on unsupported versions.** Do not add a plugin, hook, startup configuration or harness upgrade as a prerequisite for Fungi. Existing built-in completion tools and the already available exact-thread Codex queue remain eligible.\n\nAll six installed harnesses remain compatibility targets. For a version or execution mode that cannot sustain a human wait, record its manual fallback explicitly; that is accepted compatibility behavior, not a passing automatic-return test. This clarifies the earlier all-six automatic-return target without claiming that an unsupported version gained a capability.\n\nThe user also reports completing Kimi sign-in and requests verification to resume. Retry the actual command; do not inspect credentials or assume authentication succeeded merely from the answer. The existing `work-until-grill` authorization continues through implementation, native UI checks and records.\n\n## Native compatibility checkpoint\n\nThe [no-setup follow-up](verification/runs/2026-10-20-no-setup.md) verifies Kimi 2.2.0 after sign-in, complete native form/image returns in Pi, Grok, Kimi and Claude's bounded headless mode, and OpenCode v1's explicitly resumed manual flow. Launch receipts now include `collectEnv`, verified by the core suite and OpenCode's actual later call. No integration setup is required.\n\nThe latest portable build is `dist/fungi-darwin-arm64-2026-10-20T08-12-31-161Z`. Its Codex image session `39fdb74018dd13baae7fbc2883699530` completed the final check: the notice reached its originating conversation after the prior turn ended, and one collection using the supplied argv/environment returned the submitted response and matching image. The bounded macOS no-setup proof is complete. Long AFK and sleep/wake behavior, clean-machine distribution, and Windows/Linux runtime verification remain outside the completed proof. The earlier user-edited demo remains open with its draft preserved.\n\n## Skill authoring and longer waits\n\nThe user authorized the next work through `work-until-grill`: exercise real skill authoring, longer idle/recovery behavior and portability. They specifically requested the simpler grill-form from yesterday's jstack history while its current version is being reworked. The last committed modification of the relevant assets is `7a7c919` (2026-10-13); those assets are unchanged at yesterday's tip, `32324e47aae7d3ad3f92e6a4aad8966e9451d691`. Use that committed baseline, not the uncommitted editor/review changes.\n\nThe Fungi example is now a skill-owned HTML directory and question JSON input. It keeps choices, plain notes and the older rich descriptions, adds one optional image through the existing artifact bridge, and uses Fungi's durable drafts and result delivery. No core or bridge API changes were needed. The native UI has passed close/reopen, abrupt owner-loss recovery, storage-failure retry, submission and cancellation. Linux arm64 core tests also passed in a network-isolated, unprivileged container. [Verification](verification/runs/2026-10-20-skill-proof.md)\n\nThe user also suggested Obsidian's Pele. [The assessment](research/pele.md) finds a promising optional diagram asset, with a small dependency-free browser bundle and recent development, but little maintenance history so far. It is not substituted into the committed grill-form baseline.\n\nThe two-hour native-helper probe, session `622f59b42e05840dd408622f23c8416a`, completed with one exact-origin Codex notice and one collection. Its [result](evidence/2026-10-20-skill-proof/idle-long-result.json) records 7,200.0148 helper-measured seconds and a UTC interval of 2 h 4 min 17.873 s, spanning the manual sleep/wake check below. The timing artifact matches the returned data and SHA-256; the owner and helper exited. No model polling or additional waiter was used. This verifies the selected helper/owner/Codex path, not arbitrary-duration behavior in every harness.\n\nOrbStack provides Linux core execution but not proof of Linux desktop behavior. A Windows desktop and a clean Mac are not connected to the workspace. The follow-up interview below settles the immediate arrangements; public signing/notarization remains outside the completed prototype.\n\nQuestions 18–19 are complete in the Fungi-backed simple form, session `3863d61f14f01136a6d967630a00af91`. Its exact-origin callback was consumed with one collection. The [submitted answers](journal/2026-10-20-grill-desktop-arrangements.md) defer additional desktop checks until last; the user has a Windows machine but wants those checks deferred now. They chose to sleep/wake this Mac manually during the verification session. Do not provision a VM, connect to their Windows machine or trigger sleep as a consequence of this answer.\n\nThe sleep/wake fixture, session `1897358a56ceff72064a252004170716`, passed. Its [baseline](evidence/2026-10-20-skill-proof/sleep-wake-baseline.json) records the acknowledged `BEFORE-SLEEP — keep this line` note and reference image. macOS [power events](evidence/2026-10-20-skill-proof/sleep-wake-power.log) confirm clamshell sleep at 18:09:06 +0800 and final lid/HID wake at 18:13:38, with a maintenance dark wake/sleep in between. The exact-origin callback was collected once: the [response](evidence/2026-10-20-skill-proof/sleep-wake-result.json) retains that note, adds the user's `AFTER-WAKE` edit and returns identical image bytes. This verifies one short cycle on the current Mac.\n\nThe [skill-authoring and longer-idle proof](verification/runs/2026-10-20-skill-proof.md) is now complete for its selected scenarios. All callbacks in this round have been consumed. Additional desktop checks remain deferred by the user's answer; public distribution and arbitrary-duration reliability are not established. The current portable package is `dist/fungi-darwin-arm64-2026-10-20T09-41-25-905Z`.\n\n## Rich questionnaire feedback\n\nThe user tried the updated jstack presentation in a Fungi window. Its [submitted response](evidence/2026-10-20-rich-grill/user-result.json) returned all six items through one callback and one collection; the [verification report](verification/runs/2026-10-20-rich-grill.md) records the tested build and remaining gaps. Mock choices and placeholder comments are demonstration data.\n\nThe final note expresses a real concern that UI authoring and handoff may be expensive and hard for models to understand. The user intends eventually to bundle Fungi with jstack and rewrite skills such as grill-form around it once the base is sufficiently stable. This reinforces the existing simplicity requirement. The compatibility adapter used for this experiment is not the intended routine authoring workflow.\n\nThe user then explicitly confirmed the authoring requirement: agents should follow robust mechanical instructions while understanding the available grill-form capabilities well enough to author meaningful sessions. Both parts matter: a compact capability reference with working examples and limits, and a fixed procedure for validation, launch, completion and interpreting the result.\n\nThe target is question data plus one launch, followed by automatic structured response delivery. Rendering, draft storage, attachment conversion and callback handling should be reusable implementation supplied with the skill/Fungi distribution. An agent should not reconstruct the template adapter or reconcile two collectors for every questionnaire. The skill should describe choices, open feedback, visual comparisons, diagrams, prototype state, region comments and images without requiring agents to read renderer internals. This is a requirement for the eventual integration, not a claim that the current experiment already provides that final authoring experience.\n\n## Foundation work on 2026-10-22\n\nThe user renewed `work-until-grill` to pursue a stable, robust, simple and broadly flexible rendering platform. Continue within the accepted Go/Electron, local-first, no-harness-setup scope. Full jstack authoring integration remains deferred; a small reusable authoring guide and independent example are appropriate foundation work.\n\nConcrete verification initially exposed four repairs: asynchronous Blob conversion could reorder mutations; exact-limit JSON could be saved but unreadable because of its newline; malformed/closed helper stdout could leave the owner blocked in process wait; a failed reference-form autosave could prevent a later submit retry without another edit. Repairs retain the existing protocol and bridge.\n\nRenderer support now includes local/Blob workers and WebAssembly, plus streamed local assets with media range requests. The independent before/after comparison example uses ordinary HTML and canvas, exports a PNG and adds no engine API. Its submitted feedback (39% divider, After, “Nice”) is demo data, not a new project requirement. [The verification record](verification/runs/2026-10-22-platform.md) separates runtime observations from broader compatibility claims.\n\nTreat existing protocol-1 meanings as the extension compatibility boundary. Keep the flat JSON schema experimental and grow capabilities through ordinary skill assets/helpers. Cross-platform desktop and clean-machine release verification remain the last outstanding acceptance work; signing/notarization and universal harness resumption are not established by a local macOS pass.\n\nThe follow-up Linux run exposed a fifth issue: a helper could emit a valid\nresult and exit before the launch write completed. The owner now drains its\noutput after write failure and bounds blocked protocol writes. macOS and Linux\ncore suites pass after the repair. Portable Windows x64 and Linux x64 bundles\nare prepared using pinned Electron downloads. Windows file handling has a\nseparate directory-sync policy, and lock errors no longer masquerade as live\nowners. Actual desktop validation is the next unresolved acceptance boundary;\ncompiled bundles are not a platform-support claim.\n\nHosted follow-up testing now exercises the real Electron renderer. macOS and\nWindows Server 2025 pass the 21 rendering assertions with an empty child PATH.\nWindows required direct access to its inherited input pipe, suppression of\nElectron console attachment and tolerance of blank NDJSON lines. The four\npage methods and native-helper contract remain unchanged.\n\nAll hosted core suites pass. Ubuntu 22.04 completes the renderer workflow and\n20 checks, but its virtual display cannot provide WebGL. Ubuntu 24.04 aborts\nat Chromium sandbox startup under its default namespace policy. No sandbox\nbypass or machine policy change was made. The\n[hosted report](verification/runs/2026-10-22-hosted.md) remains
