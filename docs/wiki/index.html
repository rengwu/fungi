back-choose-cef-or-electron-on-total-complexity\">Chromium fallback: choose CEF or Electron on total complexity\u003c/h2>\n\u003cp>CEF exposes C/C++ APIs and supports JavaScript/native messaging. It brings runtime libraries, data/resources and multiple processes; macOS has a prescribed application-bundle layout. Its documentation's single-executable process-entry example does not mean all runtime files disappear. \u003ca href=\"https://chromiumembedded.github.io/cef/general_usage\" rel=\"noreferrer\">CEF architecture and packaging\u003c/a>\u003c/p>\n\u003cp>Electron provides an application shell around Chromium and Node. Its packaging also contains runtime files; an application archive is not the entire engine. A Go orchestrator can launch a bundled Electron renderer while the page sees only a narrow preload bridge. \u003ca href=\"https://www.electronjs.org/docs/latest/tutorial/application-distribution\" rel=\"noreferrer\">Electron packaging\u003c/a>, \u003ca href=\"https://www.electronjs.org/docs/latest/tutorial/context-isolation\" rel=\"noreferrer\">context isolation\u003c/a>\u003c/p>\n\u003cp>Energy is an existing Go/CEF route, but its current design also includes LCL and Delphi-based bridges plus a native runtime. That may save platform code, but it is not automatically the smallest maintenance surface. \u003ca href=\"https://github.com/energye/energy\" rel=\"noreferrer\">Energy architecture\u003c/a>\u003c/p>\n\u003cp>The initial proposal was automatic extraction into a private cache. The user's subsequent simplicity instruction instead selects a portable folder/archive with renderer files already present. It must work offline and need no runtime download or package-manager installation. Signing, helper layout and Linux system-library compatibility still need actual packaging tests. Do not use disabled Chromium sandboxing as a packaging shortcut.\u003c/p>\n\u003ch2 id=\"why-several-smaller-alternatives-do-not-win-automatically\">Why several smaller alternatives do not win automatically\u003c/h2>\n\u003cp>Ultralight's 2026-08 license section 4.9 requires a separate agreement for developer platforms/frameworks/runtimes offered to third parties. Section 4.2 restricts static-linking approaches. This is a direct selection constraint for fungi's stated purpose, not just a question of the listed price. No license was purchased or accepted. \u003ca href=\"https://ultralig.ht/terms/2026-08\" rel=\"noreferrer\">Versioned terms\u003c/a>\u003c/p>\n\u003cp>Blitz's current README calls it beta, says its HTML wrapper lacks interactivity, and says it has no JavaScript bindings; the interactive route uses Dioxus. Litehtml provides layout with host drawing callbacks and warns against using it as a full HTML engine. RmlUi expects documents authored for its own HTML/CSS subset and host-driven behavior/rendering. None is a drop-in host for arbitrary existing browser widgets. \u003ca href=\"https://github.com/DioxusLabs/blitz\" rel=\"noreferrer\">Blitz\u003c/a>, \u003ca href=\"https://github.com/litehtml/litehtml\" rel=\"noreferrer\">litehtml\u003c/a>, \u003ca href=\"https://github.com/mikke89/RmlUi\" rel=\"noreferrer\">RmlUi\u003c/a>\u003c/p>\n\u003cp>Blitsen tries to bridge that gap, but its current Bun migration supersedes earlier QuickJS size claims. Its own Linux x64 reference measurement is now 144.3 MB uncompressed / 54.7 MB gzip, with a pre-alpha warning and partial web compatibility. Those are upstream measurements, not reproduced here. This is a useful example of how reducing a dependency can move complexity into a homegrown browser API implementation. \u003ca href=\"https://blitsen.dev/docs/bun-migration/\" rel=\"noreferrer\">Current runtime decision\u003c/a>\u003c/p>\n\u003ch2 id=\"small-next-proof\">Small next proof\u003c/h2>\n\u003cp>Prefer one chosen renderer in the first implementation. Supporting every surveyed engine would defeat rule-lean.\u003c/p>\n\u003cp>Use the same tiny HTML and JSON forms, local slider animation, canvas-to-PNG result, and one representative existing library across the candidate and a Chromium baseline. Check clean launch, keyboard/IME/focus/accessibility, artifacts, close/crash handling and offline execution. Record total shipped files/bytes, cold start and idle memory on named platforms. If a smaller engine requires substantial adapters or a second primary UI language, count that as an authoring cost rather than hiding it behind binary-size savings.\u003c/p>\n\u003cp>This proof remains planned. Proprietary-default acceptability and packaging are now settled; current selection depends on the \u003ca href=\"#/research/renderer-health\">maintenance evidence\u003c/a> and the candidate's actual integration and compatibility results.\u003c/p>\n","backlinks":["research/index","research/renderer-health","research/rendering"]},{"id":"research/components","title":"Composition and component libraries","section":"Research","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-19\u003c/span>","updated":"2026-10-19","summary":"","source":"---\ntitle: Composition and component libraries\nupdated: 2026-10-19\n---\n# Composition and component libraries\n\n[Research overview](index.md)\n\n## The useful composability boundary\n\nLet the renderer own layout and interactivity. Let fungi own input, committed output, artifacts, and delivery. This allows a skill to reuse existing UI code instead of rewriting it for a fungi-specific widget tree.\n\nFor web interfaces, standard DOM elements and events are the lowest common denominator. Web Components offer reusable controls without requiring all authors to use the same framework. React, Vue, or Svelte can remain choices for larger interfaces. A skill may ship compiled assets without requiring an end user to install Node or a package manager.\n\nNo library should be loaded from a CDN by default. Bundle the assets a capability actually uses, including fonts and workers where necessary. Rich component authoring may use a build pipeline, but simple authored HTML should not require one.\n\nThe first interview accepts both direct HTML and JSON component descriptions in the first release. Keep one component implementation underneath both paths: a JSON renderer maps descriptions to controls and uses the same submit bridge. It need not make every custom HTML program expressible as JSON. Framework/library compatibility is a test requirement for the selected bundled engine, not something established by this survey.\n\n## Libraries worth reusing\n\n| Need | Candidate | Why it fits | Integration boundary |\n| --- | --- | --- | --- |\n| Small reusable controls | [Lit](https://lit.dev/docs/) | Builds on Web Components; composable with ordinary HTML | Good optional component implementation, not mandatory author framework |\n| Ready-made web controls | [Web Awesome](https://webawesome.com/) | Framework-independent standards-based components | Select core assets; distinguish free components from Pro resources |\n| Custom accessible React controls | [React Aria](https://react-aria.adobe.com/) | Keyboard, focus, input behavior, and internationalization | Good for sophisticated React surfaces; accessibility still needs host testing |\n| Familiar application components | [shadcn/ui](https://ui.shadcn.com/docs) | Customizable component code and distribution model | Useful in authored bundles; its scaffolding/registry should not become fungi's runtime requirement |\n| Schema-generated forms | [JSON Forms](https://jsonforms.io/) | Separates data schema, UI schema, and data; supports multiple frontend frameworks | A form capability above the engine, not the universal workflow format |\n| Live parameter tuning | [Tweakpane](https://tweakpane.github.io/docs/) | Compact standalone inputs, monitoring, plugins | Particularly close to the animation-timing use case |\n| Object-based drawing | [Fabric.js](https://www.fabricjs.com/) | Editable text, transformations, SVG conversion, serialization | Strong candidate for a modest drawing tool |\n| Interactive 2D scenes | [Konva](https://konvajs.org/docs/) | Shape/event model, layers, drag handling, serialization | Useful when interaction logic is custom; restore handlers/assets separately from serialized nodes |\n| Freehand stroke primitive | [perfect-freehand](https://github.com/steveruizok/perfect-freehand) | Converts pointer/pressure data into stroke geometry | Small building block; does not supply a complete editor |\n| Full sketching interface | [Excalidraw](https://github.com/excalidraw/excalidraw) | Embeddable editor, PNG/SVG and editable-scene output | Larger React-based capability; export both image and scene when useful |\n| Extensible canvas SDK | [tldraw](https://tldraw.dev/community/license) | Relevant canvas ecosystem, but production use requires an appropriate license key | Optional choice; not a frictionless default dependency |\n| Interactive charts | [Apache ECharts](https://echarts.apache.org/en/feature.html) | Broad chart types, interactions, Canvas/SVG renderers | Return selection/filter state alongside data or an image |\n| Declarative analytical charts | [Vega-Lite](https://vega.github.io/vega-lite/) | Concise JSON and composable interactive views | Natural fit for agent-generated chart specifications |\n| Editable node diagrams | [React Flow](https://reactflow.dev/) | Custom nodes, edges, pan/zoom, selection | Use when diagrams must be edited, not merely displayed |\n| Text-authored diagrams | [Mermaid](https://mermaid.js.org/intro/) | Familiar text syntax and SVG rendering | Preserve source; configure safe rendering; not a general diagram editor |\n| Structured rich text | [Tiptap](https://tiptap.dev/docs/editor/getting-started/overview) | Modular ProseMirror-based editor and custom nodes | Useful for annotated feedback; distinguish open-source and paid extensions |\n| Terminal interaction | [Huh](https://github.com/charmbracelet/huh) | Forms and accessible standard-prompt mode | Optional visible-terminal renderer |\n\nThe recommendation is to make these usable, not ship all of them. The first reference UI needs ordinary form controls. Add a library when it saves substantial implementation work for an actual capability.\n\n## Agent-oriented UI formats\n\n### A2UI\n\nA2UI separates declarative component descriptions from client-owned renderers and catalogs. It supports multiple rendering technologies and incremental JSON. This is useful when a skill wants a constrained catalog with predictable output. It is not a substitute for a local process owner, durable result storage, or an idle-conversation callback. Keep it as a possible renderer input format. [A2UI](https://a2ui.org/)\n\n### json-render\n\njson-render lets an application define typed components and actions, then map generated JSON to real components. It provides one approach for fungi's accepted JSON authoring path. The cost is maintaining that catalog, action semantics, bindings, and renderer integration. Compare it with a smaller form-specific adapter before adopting the full framework. Direct HTML remains equally supported. [json-render documentation](https://json-render.dev/docs)\n\n### MCP Apps\n\nMCP Apps packages an HTML interface as an MCP resource and defines communication with a supporting host, commonly through an isolated iframe. This is a valuable optional delivery surface when the user wants the interface inside chat. A native fungi window is a different host; compatibility requires implementing the relevant bridge and capabilities. Merely exposing an MCP tool does not make every harness an MCP Apps host. [MCP Apps overview](https://modelcontextprotocol.io/extensions/apps/overview)\n\n### AG-UI and Remote DOM\n\nAG-UI standardizes agent/frontend event streams, shared state, and human interruptions. It is broader than fungi's initial local interaction round trip. Use an adapter if a real integration needs it, rather than building an agent runtime to satisfy the protocol. [AG-UI](https://docs.ag-ui.com/introduction)\n\nShopify's Remote DOM mirrors a restricted component tree from a separate JavaScript environment to a host. It is relevant if fungi eventually runs mutually untrusted component authors in one surface. It also requires host/remote plumbing and component restrictions; that complexity is not justified for a single trusted skill-authored page. [Remote DOM](https://github.com/Shopify/remote-dom)\n\n## What should travel back to the agent\n\nA useful result preserves meaning, not only appearance. A form returns typed values; a chart returns selected data and filters; a drawing can return a PNG plus editable scene data; annotated screenshots return each image paired with its note. Fungi should store these as JSON plus artifact references, with a compact summary for the agent.\n\nAn image path is not equivalent to the model seeing the image. CLI clients need an image-reading tool or a harness attachment mechanism. MCP can express image/resource content, but the host still controls supported modalities. This belongs in capability discovery and skill instructions.\n\nKeep local changes local: dragging a node, moving a slider, typing, and drawing should not create model turns. Submission, explicit requests for assistance, or workflow-defined milestones may do so. This is the distinction that makes rich interaction compatible with the AFK requirement.\n","toc":[{"id":"the-useful-composability-boundary","title":"The useful composability boundary","depth":2},{"id":"libraries-worth-reusing","title":"Libraries worth reusing","depth":2},{"id":"agent-oriented-ui-formats","title":"Agent-oriented UI formats","depth":2},{"id":"a2ui","title":"A2UI","depth":3},{"id":"json-render","title":"json-render","depth":3},{"id":"mcp-apps","title":"MCP Apps","depth":3},{"id":"ag-ui-and-remote-dom","title":"AG-UI and Remote DOM","depth":3},{"id":"what-should-travel-back-to-the-agent","title":"What should travel back to the agent","depth":2}],"titleAnchor":"composition-and-component-libraries","links":["research/index"],"attachments":[],"html":"\u003cp>\u003ca href=\"#/research/index\">Research overview\u003c/a>\u003c/p>\n\u003ch2 id=\"the-useful-composability-boundary\">The useful composability boundary\u003c/h2>\n\u003cp>Let the renderer own layout and interactivity. Let fungi own input, committed output, artifacts, and delivery. This allows a skill to reuse existing UI code instead of rewriting it for a fungi-specific widget tree.\u003c/p>\n\u003cp>For web interfaces, standard DOM elements and events are the lowest common denominator. Web Components offer reusable controls without requiring all authors to use the same framework. React, Vue, or Svelte can remain choices for larger interfaces. A skill may ship compiled assets without requiring an end user to install Node or a package manager.\u003c/p>\n\u003cp>No library should be loaded from a CDN by default. Bundle the assets a capability actually uses, including fonts and workers where necessary. Rich component authoring may use a build pipeline, but simple authored HTML should not require one.\u003c/p>\n\u003cp>The first interview accepts both direct HTML and JSON component descriptions in the first release. Keep one component implementation underneath both paths: a JSON renderer maps descriptions to controls and uses the same submit bridge. It need not make every custom HTML program expressible as JSON. Framework/library compatibility is a test requirement for the selected bundled engine, not something established by this survey.\u003c/p>\n\u003ch2 id=\"libraries-worth-reusing\">Libraries worth reusing\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Need\u003c/th>\n\u003cth>Candidate\u003c/th>\n\u003cth>Why it fits\u003c/th>\n\u003cth>Integration boundary\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Small reusable controls\u003c/td>\n\u003ctd>\u003ca href=\"https://lit.dev/docs/\" rel=\"noreferrer\">Lit\u003c/a>\u003c/td>\n\u003ctd>Builds on Web Components; composable with ordinary HTML\u003c/td>\n\u003ctd>Good optional component implementation, not mandatory author framework\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ready-made web controls\u003c/td>\n\u003ctd>\u003ca href=\"https://webawesome.com/\" rel=\"noreferrer\">Web Awesome\u003c/a>\u003c/td>\n\u003ctd>Framework-independent standards-based components\u003c/td>\n\u003ctd>Select core assets; distinguish free components from Pro resources\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Custom accessible React controls\u003c/td>\n\u003ctd>\u003ca href=\"https://react-aria.adobe.com/\" rel=\"noreferrer\">React Aria\u003c/a>\u003c/td>\n\u003ctd>Keyboard, focus, input behavior, and internationalization\u003c/td>\n\u003ctd>Good for sophisticated React surfaces; accessibility still needs host testing\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Familiar application components\u003c/td>\n\u003ctd>\u003ca href=\"https://ui.shadcn.com/docs\" rel=\"noreferrer\">shadcn/ui\u003c/a>\u003c/td>\n\u003ctd>Customizable component code and distribution model\u003c/td>\n\u003ctd>Useful in authored bundles; its scaffolding/registry should not become fungi's runtime requirement\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schema-generated forms\u003c/td>\n\u003ctd>\u003ca href=\"https://jsonforms.io/\" rel=\"noreferrer\">JSON Forms\u003c/a>\u003c/td>\n\u003ctd>Separates data schema, UI schema, and data; supports multiple frontend frameworks\u003c/td>\n\u003ctd>A form capability above the engine, not the universal workflow format\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Live parameter tuning\u003c/td>\n\u003ctd>\u003ca href=\"https://tweakpane.github.io/docs/\" rel=\"noreferrer\">Tweakpane\u003c/a>\u003c/td>\n\u003ctd>Compact standalone inputs, monitoring, plugins\u003c/td>\n\u003ctd>Particularly close to the animation-timing use case\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Object-based drawing\u003c/td>\n\u003ctd>\u003ca href=\"https://www.fabricjs.com/\" rel=\"noreferrer\">Fabric.js\u003c/a>\u003c/td>\n\u003ctd>Editable text, transformations, SVG conversion, serialization\u003c/td>\n\u003ctd>Strong candidate for a modest drawing tool\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Interactive 2D scenes\u003c/td>\n\u003ctd>\u003ca href=\"https://konvajs.org/docs/\" rel=\"noreferrer\">Konva\u003c/a>\u003c/td>\n\u003ctd>Shape/event model, layers, drag handling, serialization\u003c/td>\n\u003ctd>Useful when interaction logic is custom; restore handlers/assets separately from serialized nodes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Freehand stroke primitive\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/steveruizok/perfect-freehand\" rel=\"noreferrer\">perfect-freehand\u003c/a>\u003c/td>\n\u003ctd>Converts pointer/pressure data into stroke geometry\u003c/td>\n\u003ctd>Small building block; does not supply a complete editor\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Full sketching interface\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/excalidraw/excalidraw\" rel=\"noreferrer\">Excalidraw\u003c/a>\u003c/td>\n\u003ctd>Embeddable editor, PNG/SVG and editable-scene output\u003c/td>\n\u003ctd>Larger React-based capability; export both image and scene when useful\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Extensible canvas SDK\u003c/td>\n\u003ctd>\u003ca href=\"https://tldraw.dev/community/license\" rel=\"noreferrer\">tldraw\u003c/a>\u003c/td>\n\u003ctd>Relevant canvas ecosystem, but production use requires an appropriate license key\u003c/td>\n\u003ctd>Optional choice; not a frictionless default dependency\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Interactive charts\u003c/td>\n\u003ctd>\u003ca href=\"https://echarts.apache.org/en/feature.html\" rel=\"noreferrer\">Apache ECharts\u003c/a>\u003c/td>\n\u003ctd>Broad chart types, interactions, Canvas/SVG renderers\u003c/td>\n\u003ctd>Return selection/filter state alongside data or an image\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Declarative analytical charts\u003c/td>\n\u003ctd>\u003ca href=\"https://vega.github.io/vega-lite/\" rel=\"noreferrer\">Vega-Lite\u003c/a>\u003c/td>\n\u003ctd>Concise JSON and composable interactive views\u003c/td>\n\u003ctd>Natural fit for agent-generated chart specifications\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Editable node diagrams\u003c/td>\n\u003ctd>\u003ca href=\"https://reactflow.dev/\" rel=\"noreferrer\">React Flow\u003c/a>\u003c/td>\n\u003ctd>Custom nodes, edges, pan/zoom, selection\u003c/td>\n\u003ctd>Use when diagrams must be edited, not merely displayed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Text-authored diagrams\u003c/td>\n\u003ctd>\u003ca href=\"https://mermaid.js.org/intro/\" rel=\"noreferrer\">Mermaid\u003c/a>\u003c/td>\n\u003ctd>Familiar text syntax and SVG rendering\u003c/td>\n\u003ctd>Preserve source; configure safe rendering; not a general diagram editor\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Structured rich text\u003c/td>\n\u003ctd>\u003ca href=\"https://tiptap.dev/docs/editor/getting-started/overview\" rel=\"noreferrer\">Tiptap\u003c/a>\u003c/td>\n\u003ctd>Modular ProseMirror-based editor and custom nodes\u003c/td>\n\u003ctd>Useful for annotated feedback; distinguish open-source and paid extensions\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Terminal interaction\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/charmbracelet/huh\" rel=\"noreferrer\">Huh\u003c/a>\u003c/td>\n\u003ctd>Forms and accessible standard-prompt mode\u003c/td>\n\u003ctd>Optional visible-terminal renderer\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The recommendation is to make these usable, not ship all of them. The first reference UI needs ordinary form controls. Add a library when it saves substantial implementation work for an actual capability.\u003c/p>\n\u003ch2 id=\"agent-oriented-ui-formats\">Agent-oriented UI formats\u003c/h2>\n\u003ch3 id=\"a2ui\">A2UI\u003c/h3>\n\u003cp>A2UI separates declarative component descriptions from client-owned renderers and catalogs. It supports multiple rendering technologies and incremental JSON. This is useful when a skill wants a constrained catalog with predictable output. It is not a substitute for a local process owner, durable result storage, or an idle-conversation callback. Keep it as a possible renderer input format. \u003ca href=\"https://a2ui.org/\" rel=\"noreferrer\">A2UI\u003c/a>\u003c/p>\n\u003ch3 id=\"json-render\">json-render\u003c/h3>\n\u003cp>json-render lets an application define typed components and actions, then map generated JSON to real components. It provides one approach for fungi's accepted JSON authoring path. The cost is maintaining that catalog, action semantics, bindings, and renderer integration. Compare it with a smaller form-specific adapter before adopting the full framework. Direct HTML remains equally supported. \u003ca href=\"https://json-render.dev/docs\" rel=\"noreferrer\">json-render documentation\u003c/a>\u003c/p>\n\u003ch3 id=\"mcp-apps\">MCP Apps\u003c/h3>\n\u003cp>MCP Apps packages an HTML interface as an MCP resource and defines communication with a supporting host, commonly through an isolated iframe. This is a valuable optional delivery surface when the user wants the interface inside chat. A native fungi window is a different host; compatibility requires implementing the relevant bridge and capabilities. Merely exposing an MCP tool does not make every harness an MCP Apps host. \u003ca href=\"https://modelcontextprotocol.io/extensions/apps/overview\" rel=\"noreferrer\">MCP Apps overview\u003c/a>\u003c/p>\n\u003ch3 id=\"ag-ui-and-remote-dom\">AG-UI and Remote DOM\u003c/h3>\n\u003cp>AG-UI standardizes agent/frontend event streams, shared state, and human interruptions. It is broader than fungi's initial local interaction round trip. Use an adapter if a real integration needs it, rather than building an agent runtime to satisfy the protocol. \u003ca href=\"https://docs.ag-ui.com/introduction\" rel=\"noreferrer\">AG-UI\u003c/a>\u003c/p>\n\u003cp>Shopify's Remote DOM mirrors a restricted component tree from a separate JavaScript environment to a host. It is relevant if fungi eventually runs mutually untrusted component authors in one surface. It also requires host/remote plumbing and component restrictions; that complexity is not justified for a single trusted skill-authored page. \u003ca href=\"https://github.com/Shopify/remote-dom\" rel=\"noreferrer\">Remote DOM\u003c/a>\u003c/p>\n\u003ch2 id=\"what-should-travel-back-to-the-agent\">What should travel back to the agent\u003c/h2>\n\u003cp>A useful result preserves meaning, not only appearance. A form returns typed values; a chart returns selected data and filters; a drawing can return a PNG plus editable scene data; annotated screenshots return each image paired with its note. Fungi should store these as JSON plus artifact references, with a compact summary for the agent.\u003c/p>\n\u003cp>An image path is not equivalent to the model seeing the image. CLI clients need an image-reading tool or a harness attachment mechanism. MCP can express image/resource content, but the host still controls supported modalities. This belongs in capability discovery and skill instructions.\u003c/p>\n\u003cp>Keep local changes local: dragging a node, moving a slider, typing, and drawing should not create model turns. Submission, explicit requests for assistance, or workflow-defined milestones may do so. This is the distinction that makes rich interaction compatible with the AFK requirement.\u003c/p>\n","backlinks":["research/index"]},{"id":"research/delivery","title":"Agent delivery and waiting","section":"Research","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-19\u003c/span>","updated":"2026-10-19","summary":"","source":"---\ntitle: Agent delivery and waiting\nupdated: 2026-10-19\n---\n# Agent delivery and waiting\n\n[Research overview](index.md)\n\n## What fungi can guarantee itself\n\nFungi can remain idle without invoking an LLM. It can save results and expose event-driven waits. It can avoid repeated progress output, model status checks, and timer-triggered agent turns. It cannot make an arbitrary inactive application receive a message without a supported host mechanism.\n\nCompatibility belongs to the harness, its version, its settings, and the execution environment. A model name such as DeepSeek or Grok does not identify those capabilities. The same model may run inside several different harnesses.\n\nThe accepted product policy is: no model polling; best-effort automatic delivery across popular harnesses; durable recovery when delivery is unavailable or interrupted. Open the interface even without an automatic route and clearly ask the user to say “done” after submitting. That continuation collects the exact saved session. [First interview decisions](../planning.md)\n\n## Delivery routes\n\n| Route | Suitable situation | Important limit |\n| --- | --- | --- |\n| Host-managed background completion | Host owns the command and injects completion into the right conversation | A returned process ID alone is insufficient; exit and cleanup behavior vary |\n| Existing-session callback | Harness exposes an authenticated queue or session-message API | Must target the original session; accepted message is not confirmed consumption |\n| One pending tool call | Host can keep it pending for the interaction duration | Transport timeout cannot be treated as a human deadline |\n| Manual collect after user continuation | No supported wake-up route or an interrupted delivery | Accepted fallback: user says “done”; collect the exact saved session |\n\nPrefer one supported route rather than running multiple delivery attempts that may independently wake the model. Do not use a subagent, repeated sleeps, scheduled model checks, or a stop-hook loop as the waiting mechanism.\n\n## First-milestone harness inventory\n\nThe third interview expands the first milestone's automatic-return targets to **Codex, Claude Code, OpenCode, Grok, Kimi and Pi**, all on macOS initially. The user reports all are installed; read-only version/help checks confirmed these commands on 2026-10-19:\n\n| Command | Installed version | First route to investigate |\n| --- | --- | --- |\n| `codex` | 0.163.0 | Exact-thread queue, already exposed by local CLI help |\n| `claude` | 2.1.302 | Host-managed background completion or a silent monitor |\n| `opencode` | 1.18.34 | Existing server's exact-session message API; establish instance identity and authentication |\n| `grok` | Grok Build 1.0.62, revision 1474f9cbdd91 | Background command completion or one silent monitor |\n| `kimi` | Kimi Code 2.0.1 | Background Bash completion with the human-wait timeout handled explicitly |\n| `pi` | `@earendil-works/pi-coding-agent` 1.3.0 | One pending built-in shell call, which has no default timeout in the installed source |\n\nThe [inventory and source hashes](../attachments/research/harness-inventory-2026-10-19.json) record the evidence boundary. No model prompts were sent, callbacks invoked, accounts checked, or harness settings changed during this inspection. No Fungi handoff has been tested. Installation is not evidence of authentication or usable model access.\n\nPrefer these existing mechanisms before introducing a custom plugin. A single pending tool call can meet the no-polling requirement even though the conversation remains in a tool-wait state; it is different from injecting a message into an already-ended turn. For each route, verify silent waiting, exact caller identity, task lifetime, cancellation and completion behavior. Do not count a manual fallback as a successful automatic-return test, or silently reduce the six-harness target to Codex.\n\n## Current harness evidence\n\n| Harness or interface | Evidence found | What remains unverified |\n| --- | --- | --- |\n| Codex | Official CLI documents `queue --thread ... --message ...`; local 0.163.0 exposes it. Jstack's existing adapter targets `CODEX_THREAD_ID` and probes support | Current live end-to-end fungi delivery; behavior when caller is unavailable; duplicate acceptance |\n| Claude Code | Background Bash exists. Current tool documentation also describes Monitor feeding command output lines or WebSocket events to the agent | Exact completion/wake behavior for each installed mode; a long-lived local UI through exit, memory pressure, and restart |\n| OpenCode | Server API provides exact-session asynchronous messages and event streams | Discovering and authenticating to the originating instance without configuration; race behavior with an active turn |\n| Gemini CLI | Configuration includes background completion modes; `inject` returns output to the agent, while `silent` is documented as default | Effective settings and task lifetime in an installed version; no automatic settings changes assumed |\n| Cursor | Stop/subagent-stop hooks can submit a follow-up when their lifecycle event fires | An externally triggered wake of an already idle local conversation is not established by those hook docs |\n| Grok Build | Current project documents background command completion notifications and monitor lines delivered to the conversation; local CLI 1.0.62 is installed | Actual idle-agent resumption, timeouts and caller routing in the installed version |\n| Kimi Code CLI | Current tool docs describe automatic background Bash completion notifications and a per-call `disable_timeout` option; local CLI 2.0.1 is installed | Actual idle-agent resumption, task lifetime and cancellation in this version |\n| Pi | Installed 1.3.0 shell implementation awaits process completion and has no default timeout; extension APIs also expose turn-triggering messages | Real long human wait and result consumption; extension route only if needed |\n| ACP | Defines client-controlled session creation/loading, prompts, updates, and cancellation | Does not itself establish access from an unrelated process to an already open IDE conversation |\n| Other/model-named agents | No universal wake API established | Need the actual harness, version, and exposed tools |\n\nCodex's official command description establishes exact-session message targeting; the local CLI check establishes availability in this environment. Jstack separately records earlier successful handoffs. These are different evidence levels. [Codex commands](https://learn.chatgpt.com/docs/developer-commands#codex-queue)\n\nClaude's background tasks have environment-dependent lifetimes and may be stopped when the harness exits. Its Monitor tool suggests another useful event route: fungi could emit one result event after being silent while waiting. Neither should be claimed as verified here. [Claude background Bash](https://code.claude.com/docs/en/interactive-mode#background-bash-commands), [Claude tools](https://code.claude.com/docs/en/tools-reference)\n\nOpenCode exposes `/session/:id/prompt_async` and server event streams. A fungi adapter should reuse an identified instance, rather than launch a separate agent with similar history. [OpenCode server](https://opencode.ai/docs/server/)\n\nGemini's `tools.shell.backgroundCompletionBehavior` distinguishes `silent`, `inject`, and `notify`; the default is `silent`. This is a concrete example of why finding a background command capability is not sufficient. [Gemini configuration](https://geminicli.com/docs/reference/configuration/)\n\nCursor's `followup_message` belongs to a hook response triggered by an agent lifecycle event. Repeatedly continuing the model merely to wait would violate fungi's intended behavior. The reviewed docs do not establish a general delayed external callback to local idle chat. [Cursor hooks](https://cursor.com/docs/hooks)\n\nGrok Build documents completion notifications for background terminal commands and a monitor whose output lines become conversation notifications. A Fungi waiter could remain silent until one terminal outcome. This is a candidate route; a visible notification must still be tested for actual model continuation. Recurring prompts and scheduler loops do not fit Fungi's waiting contract. [Grok background tasks](https://github.com/xai-org/grok-build/blob/main/crates/codegen/xai-grok-pager/docs/user-guide/20-background-tasks.md)\n\nKimi's current Bash documentation describes automatic completion notifications, a ten-minute background timeout by default in interactive mode, and a per-call `disable_timeout` control. The adapter must account for human waits explicitly rather than inherit that default or repeatedly invoke `WaitFor`. Print-mode waiting has separate settings and must not be assumed to match the interactive session. [Kimi tools](https://moonshotai.github.io/kimi-code/en/reference/tools), [background configuration](https://moonshotai.github.io/kimi-code/en/configuration/config-files#background)\n\nPi's installed `dist/core/tools/bash.js` declares an optional timeout with no default, awaits the child process, and returns the output. This suggests a simple pending-call route without installing an extension; it is source evidence, not a completed human-wait experiment. Pi also supports explicitly loaded local extensions and `sendMessage(..., { triggerTurn: true })`; keep that as an alternative if a concrete workflow needs an ended-turn callback. [Installed source evidence](../attachments/research/harness-inventory-2026-10-19.json), [Pi extension documentation](https://pi.dev/docs/latest/extensions)\n\nKimi's current repository replaces the archived Python implementation and supports ACP. Old Wire/CLI assumptions should not be copied blindly. ACP is valuable when the client owns the agent connection, but adopting it would not automatically let fungi attach to any existing IDE session. [Kimi Code CLI](https://github.com/MoonshotAI/kimi-code), [legacy project notice](https://github.com/MoonshotAI/kimi-cli), [ACP lifecycle](https://agentclientprotocol.com/protocol/v1/overview)\n\n## MCP does not remove the host problem\n\nMCP is useful for discovery, tool invocation, and structured results. The versioned 2025-11-25 Tasks specification includes asynchronous task results, but status notifications are optional and requestors are advised to poll for updates. That polling can happen inside ordinary host software without involving the model. Exposing `tasks/get` to the model and instructing it to keep checking would recreate the original problem. Do not infer support from the protocol alone; negotiate the actual host's capabilities. [MCP Tasks specification](https://modelcontextprotocol.io/specification/2025-11-25/basic/utilities/tasks)\n\nMCP Apps separately negotiates capabilities such as messages and model-context updates. The host decides what it supports. A UI message, a changed resource, and a resumed model turn are not interchangeable guarantees. [MCP Apps host capabilities](https://apps.extensions.modelcontextprotocol.io/api/interfaces/app.McpUiHostCapabilities.html)\n\n## Lessons from jstack\n\nLocal source inspected: `../jstack/skills/grill-form/scripts/grill-form.mjs`, `../jstack/skills/screencap/native/Screencap.m`, `../jstack/scripts/input-completion.mjs`, `../jstack/scripts/completion/codex.mjs`, and their skill/reference documents.\n\nUseful existing properties include exact session paths, validated receipts, preserved drafts, non-destructive collection, and a separate completion adapter. The shared helper probes Codex support, starts one collector, and exits; the remaining collector sends a short notice to the originating thread. `armed` records startup, not guaranteed eventual delivery.\n\nGrill-form still relies on a browser downloading an answer file and a local collector checking for it. Fungi can remove that indirection: the renderer submits directly to the owning session. A local wait loop consumes ordinary CPU/resources, not model tokens, but a direct event bridge also improves latency and avoids download-directory ambiguity.\n\nJstack's one-attempt/no-auto-restart policy is an intentional safety boundary for those helpers. Fungi should decide its own recovery design rather than inherit that rule accidentally. Retrying delivery can be safe when controlled by the engine and a stable result ID; restarting model turns to check readiness is not.\n\n## Routing and lifecycle rules worth keeping\n\n- Bind the caller identity at launch. Never infer the destination from the newest conversation, newest file, or current foreground window.\n- Keep callback configuration outside UI-controlled data. A page should submit an answer, not choose a thread or shell command.\n- Invoke adapter commands with an argument array, not an interpolated shell command.\n- Store the committed result before notifying. The notification should identify a result to collect rather than insert arbitrary captured content as instructions.\n- Distinguish saved, notification accepted, and consumed. Retain artifacts until an explicit acknowledgement or defined retention policy.\n- Bound local retries and deduplicate where the harness allows it. Preserve the response when delivery fails.\n- Ordinary AFK waiting, sleep, process termination, and reboot are distinct tests. After all relevant processes stop, some later explicit restart or installed service is necessary for delivery to resume.\n\nThe first interview accepted explicit reopen/collect after process exit. An always-running service, login installation, or automatic reboot recovery is therefore outside the first-release requirement. Saved responses remain recoverable.\n\n## Prototype findings on 2026-10-20\n\nLive probes now supplement the earlier source inventory. [The first proof report](../verification/runs/2026-10-20-first-proof.md) records actual Fungi results in five harnesses and three-minute waits in Claude, Grok and Pi. Kimi is credential-blocked. These are bounded tests, not unlimited AFK guarantees.\n\nThe inspected OpenCode Bash source defines a two-minute default and ten-minute maximum. An ordinary pending Bash call is therefore insufficient for arbitrary AFK waiting. The current development v2 documentation describes a separate background-call capability; it has not been established as an active route in the tested configuration. [Bash source](https://github.com/anomalyco/opencode/blob/dev/packages/core/src/tool/bash.ts), [v2 tool documentation](https://dev.opencode.ai/v2/docs/tools/)\n\nThe v2 documentation was rechecked after the native UI tests: its `shell` background mode explicitly has no default timeout and notifies the session on completion. The installed CLI remains 1.18.34 and the observed probe used its `bash` tool. A newer tool contract is a promising future route, not evidence that the installed v1 route already works indefinitely. No harness upgrade was performed.\n\nOpenCode’s documented local plugins and runtime configuration offer an opt-in integration route without editing global settings. This remains an implementation option, not a selected or verified adapter. [Plugins](https://opencode.ai/docs/plugins/), [configuration precedence](https://opencode.ai/docs/config/#precedence-order)\n\n## No-setup follow-up\n\nThe [fourth interview](../planning.md#no-setup-delivery-decision-on-2026-10-20) rejects a required integration step. Keep the OpenCode plugin route as research only. For the installed v1, use explicit manual delivery; do not require an upgrade to obtain v2's newer shell behavior.\n\nClaude's current documentation distinguishes local interactive background Bash, which has no time limit, from unattended/headless modes, which do. A text-prompt `-p` run defaults to ten minutes and can request at most two hours without changing configuration. Monitor is also bounded and does not solve arbitrary human waiting. Our three-minute and native-form tests use headless background Bash, so they verify notification/consumption within that mode's limit; they do not establish a long interactive wait. [Claude Bash lifecycle](https://code.claude.com/docs/en/tools-reference#time-limit-for-background-commands), [Monitor limits](https://code.claude.com/docs/en/tools-reference#monitor-tool)\n\nAfter the user signed in, Kimi reported version 2.2.0. Its live three-minute test used `run_in_background: true` and `disable_timeout: true`, ended with `WAITING`, then automatically continued and read the completed output once. A separate native form-and-image submission followed the same route. The print stream does not expose a separate completion-event payload, so the observed evidence is the unsolicited continuation and actual result consumption; no second prompt was injected. [Kimi Bash controls](https://moonshotai.github.io/kimi-code/en/reference/tools#shell)\n","toc":[{"id":"what-fungi-can-guarantee-itself","title":"What fungi can guarantee itself","depth":2},{"id":"delivery-routes","title":"Delivery routes","depth":2},{"id":"first-milestone-harness-inventory","title":"First-milestone harness inventory","depth":2},{"id":"current-harness-evidence","title":"Current harness evidence","depth":2},{"id":"mcp-does-not-remove-the-host-problem","title":"MCP does not remove the host problem","depth":2},{"id":"lessons-from-jstack","title":"Lessons from jstack","depth":2},{"id":"routing-and-lifecycle-rules-worth-keeping","title":"Routing and lifecycle rules worth keeping","depth":2},{"id":"prototype-findings-on-2026-10-20","title":"Prototype findings on 2026-10-20","depth":2},{"id":"no-setup-follow-up","title":"No-setup follow-up","depth":2}],"titleAnchor":"agent-delivery-and-waiting","links":["research/index","planning","verification/runs/2026-10-20-first-proof","planning"],"attachments":[{"path":"attachments/research/harness-inventory-2026-10-19.json","sha256":"98325cad621347f2b03b4e783af544723ce56fc0099287272de8c06259a16b5b"}],"html":"\u003cp>\u003ca href=\"#/research/index\">Research overview\u003c/a>\u003c/p>\n\u003ch2 id=\"what-fungi-can-guarantee-itself\">What fungi can guarantee itself\u003c/h2>\n\u003cp>Fungi can remain idle without invoking an LLM. It can save results and expose event-driven waits. It can avoid repeated progress output, model status checks, and timer-triggered agent turns. It cannot make an arbitrary inactive application receive a message without a supported host mechanism.\u003c/p>\n\u003cp>Compatibility belongs to the harness, its version, its settings, and the execution environment. A model name such as DeepSeek or Grok does not identify those capabilities. The same model may run inside several different harnesses.\u003c/p>\n\u003cp>The accepted product policy is: no model polling; best-effort automatic delivery across popular harnesses; durable recovery when delivery is unavailable or interrupted. Open the interface even without an automatic route and clearly ask the user to say “done” after submitting. That continuation collects the exact saved session. \u003ca href=\"#/planning\">First interview decisions\u003c/a>\u003c/p>\n\u003ch2 id=\"delivery-routes\">Delivery routes\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Route\u003c/th>\n\u003cth>Suitable situation\u003c/th>\n\u003cth>Important limit\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Host-managed background completion\u003c/td>\n\u003ctd>Host owns the command and injects completion into the right conversation\u003c/td>\n\u003ctd>A returned process ID alone is insufficient; exit and cleanup behavior vary\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Existing-session callback\u003c/td>\n\u003ctd>Harness exposes an authenticated queue or session-message API\u003c/td>\n\u003ctd>Must target the original session; accepted message is not confirmed consumption\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>One pending tool call\u003c/td>\n\u003ctd>Host can keep it pending for the interaction duration\u003c/td>\n\u003ctd>Transport timeout cannot be treated as a human deadline\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Manual collect after user continuation\u003c/td>\n\u003ctd>No supported wake-up route or an interrupted delivery\u003c/td>\n\u003ctd>Accepted fallback: user says “done”; collect the exact saved session\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Prefer one supported route rather than running multiple delivery attempts that may independently wake the model. Do not use a subagent, repeated sleeps, scheduled model checks, or a stop-hook loop as the waiting mechanism.\u003c/p>\n\u003ch2 id=\"first-milestone-harness-inventory\">First-milestone harness inventory\u003c/h2>\n\u003cp>The third interview expands the first milestone's automatic-return targets to \u003cstrong>Codex, Claude Code, OpenCode, Grok, Kimi and Pi\u003c/strong>, all on macOS initially. The user reports all are installed; read-only version/help checks confirmed these commands on 2026-10-19:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Command\u003c/th>\n\u003cth>Installed version\u003c/th>\n\u003cth>First route to investigate\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>codex\u003c/code>\u003c/td>\n\u003ctd>0.163.0\u003c/td>\n\u003ctd>Exact-thread queue, already exposed by local CLI help\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>claude\u003c/code>\u003c/td>\n\u003ctd>2.1.302\u003c/td>\n\u003ctd>Host-managed background completion or a silent monitor\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>opencode\u003c/code>\u003c/td>\n\u003ctd>1.18.34\u003c/td>\n\u003ctd>Existing server's exact-session message API; establish instance identity and authentication\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>grok\u003c/code>\u003c/td>\n\u003ctd>Grok Build 1.0.62, revision 1474f9cbdd91\u003c/td>\n\u003ctd>Background command completion or one silent monitor\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>kimi\u003c/code>\u003c/td>\n\u003ctd>Kimi Code 2.0.1\u003c/td>\n\u003ctd>Background Bash completion with the human-wait timeout handled explicitly\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>pi\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>@earendil-works/pi-coding-agent\u003c/code> 1.3.0\u003c/td>\n\u003ctd>One pending built-in shell call, which has no default timeout in the installed source\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The \u003ca href=\"attachments/research/harness-inventory-2026-10-19.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 98325cad621347f2b03b4e783af544723ce56fc0099287272de8c06259a16b5b\">inventory and source hashes\u003c/a> record the evidence boundary. No model prompts were sent, callbacks invoked, accounts checked, or harness settings changed during this inspection. No Fungi handoff has been tested. Installation is not evidence of authentication or usable model access.\u003c/p>\n\u003cp>Prefer these existing mechanisms before introducing a custom plugin. A single pending tool call can meet the no-polling requirement even though the conversation remains in a tool-wait state; it is different from injecting a message into an already-ended turn. For each route, verify silent waiting, exact caller identity, task lifetime, cancellation and completion behavior. Do not count a manual fallback as a successful automatic-return test, or silently reduce the six-harness target to Codex.\u003c/p>\n\u003ch2 id=\"current-harness-evidence\">Current harness evidence\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Harness or interface\u003c/th>\n\u003cth>Evidence found\u003c/th>\n\u003cth>What remains unverified\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Codex\u003c/td>\n\u003ctd>Official CLI documents \u003ccode>queue --thread ... --message ...\u003c/code>; local 0.163.0 exposes it. Jstack's existing adapter targets \u003ccode>CODEX_THREAD_ID\u003c/code> and probes support\u003c/td>\n\u003ctd>Current live end-to-end fungi delivery; behavior when caller is unavailable; duplicate acceptance\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Claude Code\u003c/td>\n\u003ctd>Background Bash exists. Current tool documentation also describes Monitor feeding command output lines or WebSocket events to the agent\u003c/td>\n\u003ctd>Exact completion/wake behavior for each installed mode; a long-lived local UI through exit, memory pressure, and restart\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OpenCode\u003c/td>\n\u003ctd>Server API provides exact-session asynchronous messages and event streams\u003c/td>\n\u003ctd>Discovering and authenticating to the originating instance without configuration; race behavior with an active turn\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Gemini CLI\u003c/td>\n\u003ctd>Configuration includes background completion modes; \u003ccode>inject\u003c/code> returns output to the agent, while \u003ccode>silent\u003c/code> is documented as default\u003c/td>\n\u003ctd>Effective settings and task lifetime in an installed version; no automatic settings changes assumed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cursor\u003c/td>\n\u003ctd>Stop/subagent-stop hooks can submit a follow-up when their lifecycle event fires\u003c/td>\n\u003ctd>An externally triggered wake of an already idle local conversation is not established by those hook docs\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Grok Build\u003c/td>\n\u003ctd>Current project documents background command completion notifications and monitor lines delivered to the conversation; local CLI 1.0.62 is installed\u003c/td>\n\u003ctd>Actual idle-agent resumption, timeouts and caller routing in the installed version\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kimi Code CLI\u003c/td>\n\u003ctd>Current tool docs describe automatic background Bash completion notifications and a per-call \u003ccode>disable_timeout\u003c/code> option; local CLI 2.0.1 is installed\u003c/td>\n\u003ctd>Actual idle-agent resumption, task lifetime and cancellation in this version\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pi\u003c/td>\n\u003ctd>Installed 1.3.0 shell implementation awaits process completion and has no default timeout; extension APIs also expose turn-triggering messages\u003c/td>\n\u003ctd>Real long human wait and result consumption; extension route only if needed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ACP\u003c/td>\n\u003ctd>Defines client-controlled session creation/loading, prompts, updates, and cancellation\u003c/td>\n\u003ctd>Does not itself establish access from an unrelated process to an already open IDE conversation\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Other/model-named agents\u003c/td>\n\u003ctd>No universal wake API established\u003c/td>\n\u003ctd>Need the actual harness, version, and exposed tools\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Codex's official command description establishes exact-session message targeting; the local CLI check establishes availability in this environment. Jstack separately records earlier successful handoffs. These are different evidence levels. \u003ca href=\"https://learn.chatgpt.com/docs/developer-commands#codex-queue\" rel=\"noreferrer\">Codex commands\u003c/a>\u003c/p>\n\u003cp>Claude's background tasks have environment-dependent lifetimes and may be stopped when the harness exits. Its Monitor tool suggests another useful event route: fungi could emit one result event after being silent while waiting. Neither should be claimed as verified here. \u003ca href=\"https://code.claude.com/docs/en/interactive-mode#background-bash-commands\" rel=\"noreferrer\">Claude background Bash\u003c/a>, \u003ca href=\"https://code.claude.com/docs/en/tools-reference\" rel=\"noreferrer\">Claude tools\u003c/a>\u003c/p>\n\u003cp>OpenCode exposes \u003ccode>/session/:id/prompt_async\u003c/code> and server event streams. A fungi adapter should reuse an identified instance, rather than launch a separate agent with similar history. \u003ca href=\"https://opencode.ai/docs/server/\" rel=\"noreferrer\">OpenCode server\u003c/a>\u003c/p>\n\u003cp>Gemini's \u003ccode>tools.shell.backgroundCompletionBehavior\u003c/code> distinguishes \u003ccode>silent\u003c/code>, \u003ccode>inject\u003c/code>, and \u003ccode>notify\u003c/code>; the default is \u003ccode>silent\u003c/code>. This is a concrete example of why finding a background command capability is not sufficient. \u003ca href=\"https://geminicli.com/docs/reference/configuration/\" rel=\"noreferrer\">Gemini configuration\u003c/a>\u003c/p>\n\u003cp>Cursor's \u003ccode>followup_message\u003c/code> belongs to a hook response triggered by an agent lifecycle event. Repeatedly continuing the model merely to wait would violate fungi's intended behavior. The reviewed docs do not establish a general delayed external callback to local idle chat. \u003ca href=\"https://cursor.com/docs/hooks\" rel=\"noreferrer\">Cursor hooks\u003c/a>\u003c/p>\n\u003cp>Grok Build documents completion notifications for background terminal commands and a monitor whose output lines become conversation notifications. A Fungi waiter could remain silent until one terminal outcome. This is a candidate route; a visible notification must still be tested for actual model continuation. Recurring prompts and scheduler loops do not fit Fungi's waiting contract. \u003ca href=\"https://github.com/xai-org/grok-build/blob/main/crates/codegen/xai-grok-pager/docs/user-guide/20-background-tasks.md\" rel=\"noreferrer\">Grok background tasks\u003c/a>\u003c/p>\n\u003cp>Kimi's current Bash documentation describes automatic completion notifications, a ten-minute background timeout by default in interactive mode, and a per-call \u003ccode>disable_timeout\u003c/code> control. The adapter must account for human waits explicitly rather than inherit that default or repeatedly invoke \u003ccode>WaitFor\u003c/code>. Print-mode waiting has separate settings and must not be assumed to match the interactive session. \u003ca href=\"https://moonshotai.github.io/kimi-code/en/reference/tools\" rel=\"noreferrer\">Kimi tools\u003c/a>, \u003ca href=\"https://moonshotai.github.io/kimi-code/en/configuration/config-files#background\" rel=\"noreferrer\">background configuration\u003c/a>\u003c/p>\n\u003cp>Pi's installed \u003ccode>dist/core/tools/bash.js\u003c/code> declares an optional timeout with no default, awaits the child process, and returns the output. This suggests a simple pending-call route without installing an extension; it is source evidence, not a completed human-wait experiment. Pi also supports explicitly loaded local extensions and \u003ccode>sendMessage(..., { triggerTurn: true })\u003c/code>; keep that as an alternative if a concrete workflow needs an ended-turn callback. \u003ca href=\"attachments/research/harness-inventory-2026-10-19.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 98325cad621347f2b03b4e783af544723ce56fc0099287272de8c06259a16b5b\">Installed source evidence\u003c/a>, \u003ca href=\"https://pi.dev/docs/latest/extensions\" rel=\"noreferrer\">Pi extension documentation\u003c/a>\u003c/p>\n\u003cp>Kimi's current repository replaces the archived Python implementation and supports ACP. Old Wire/CLI assumptions should not be copied blindly. ACP is valuable when the client owns the agent connection, but adopting it would not automatically let fungi attach to any existing IDE session. \u003ca href=\"https://github.com/MoonshotAI/kimi-code\" rel=\"noreferrer\">Kimi Code CLI\u003c/a>, \u003ca href=\"https://github.com/MoonshotAI/kimi-cli\" rel=\"noreferrer\">legacy project notice\u003c/a>, \u003ca href=\"https://agentclientprotocol.com/protocol/v1/overview\" rel=\"noreferrer\">ACP lifecycle\u003c/a>\u003c/p>\n\u003ch2 id=\"mcp-does-not-remove-the-host-problem\">MCP does not remove the host problem\u003c/h2>\n\u003cp>MCP is useful for discovery, tool invocation, and structured results. The versioned 2025-11-25 Tasks specification includes asynchronous task results, but status notifications are optional and requestors are advised to poll for updates. That polling can happen inside ordinary host software without involving the model. Exposing \u003ccode>tasks/get\u003c/code> to the model and instructing it to keep checking would recreate the original problem. Do not infer support from the protocol alone; negotiate the actual host's capabilities. \u003ca href=\"https://modelcontextprotocol.io/specification/2025-11-25/basic/utilities/tasks\" rel=\"noreferrer\">MCP Tasks specification\u003c/a>\u003c/p>\n\u003cp>MCP Apps separately negotiates capabilities such as messages and model-context updates. The host decides what it supports. A UI message, a changed resource, and a resumed model turn are not interchangeable guarantees. \u003ca href=\"https://apps.extensions.modelcontextprotocol.io/api/interfaces/app.McpUiHostCapabilities.html\" rel=\"noreferrer\">MCP Apps host capabilities\u003c/a>\u003c/p>\n\u003ch2 id=\"lessons-from-jstack\">Lessons from jstack\u003c/h2>\n\u003cp>Local source inspected: \u003ccode>../jstack/skills/grill-form/scripts/grill-form.mjs\u003c/code>, \u003ccode>../jstack/skills/screencap/native/Screencap.m\u003c/code>, \u003ccode>../jstack/scripts/input-completion.mjs\u003c/code>, \u003ccode>../jstack/scripts/completion/codex.mjs\u003c/code>, and their skill/reference documents.\u003c/p>\n\u003cp>Useful existing properties include exact session paths, validated receipts, preserved drafts, non-destructive collection, and a separate completion adapter. The shared helper probes Codex support, starts one collector, and exits; the remaining collector sends a short notice to the originating thread. \u003ccode>armed\u003c/code> records startup, not guaranteed eventual delivery.\u003c/p>\n\u003cp>Grill-form still relies on a browser downloading an answer file and a local collector checking for it. Fungi can remove that indirection: the renderer submits directly to the owning session. A local wait loop consumes ordinary CPU/resources, not model tokens, but a direct event bridge also improves latency and avoids download-directory ambiguity.\u003c/p>\n\u003cp>Jstack's one-attempt/no-auto-restart policy is an intentional safety boundary for those helpers. Fungi should decide its own recovery design rather than inherit that rule accidentally. Retrying delivery can be safe when controlled by the engine and a stable result ID; restarting model turns to check readiness is not.\u003c/p>\n\u003ch2 id=\"routing-and-lifecycle-rules-worth-keeping\">Routing and lifecycle rules worth keeping\u003c/h2>\n\u003cul>\n\u003cli>Bind the caller identity at launch. Never infer the destination from the newest conversation, newest file, or current foreground window.\u003c/li>\n\u003cli>Keep callback configuration outside UI-controlled data. A page should submit an answer, not choose a thread or shell command.\u003c/li>\n\u003cli>Invoke adapter commands with an argument array, not an interpolated shell command.\u003c/li>\n\u003cli>Store the committed result before notifying. The notification should identify a result to collect rather than insert arbitrary captured content as instructions.\u003c/li>\n\u003cli>Distinguish saved, notification accepted, and consumed. Retain artifacts until an explicit acknowledgement or defined retention policy.\u003c/li>\n\u003cli>Bound local retries and deduplicate where the harness allows it. Preserve the response when delivery fails.\u003c/li>\n\u003cli>Ordinary AFK waiting, sleep, process termination, and reboot are distinct tests. After all relevant processes stop, some later explicit restart or installed service is necessary for delivery to resume.\u003c/li>\n\u003c/ul>\n\u003cp>The first interview accepted explicit reopen/collect after process exit. An always-running service, login installation, or automatic reboot recovery is therefore outside the first-release requirement. Saved responses remain recoverable.\u003c/p>\n\u003ch2 id=\"prototype-findings-on-2026-10-20\">Prototype findings on 2026-10-20\u003c/h2>\n\u003cp>Live probes now supplement the earlier source inventory. \u003ca href=\"#/verification/runs/2026-10-20-first-proof\">The first proof report\u003c/a> records actual Fungi results in five harnesses and three-minute waits in Claude, Grok and Pi. Kimi is credential-blocked. These are bounded tests, not unlimited AFK guarantees.\u003c/p>\n\u003cp>The inspected OpenCode Bash source defines a two-minute default and ten-minute maximum. An ordinary pending Bash call is therefore insufficient for arbitrary AFK waiting. The current development v2 documentation describes a separate background-call capability; it has not been established as an active route in the tested configuration. \u003ca href=\"https://github.com/anomalyco/opencode/blob/dev/packages/core/src/tool/bash.ts\" rel=\"noreferrer\">Bash source\u003c/a>, \u003ca href=\"https://dev.opencode.ai/v2/docs/tools/\" rel=\"noreferrer\">v2 tool documentation\u003c/a>\u003c/p>\n\u003cp>The v2 documentation was rechecked after the native UI tests: its \u003ccode>shell\u003c/code> background mode explicitly has no default timeout and notifies the session on completion. The installed CLI remains 1.18.34 and the observed probe used its \u003ccode>bash\u003c/code> tool. A newer tool contract is a promising future route, not evidence that the installed v1 route already works indefinitely. No harness upgrade was performed.\u003c/p>\n\u003cp>OpenCode’s documented local plugins and runtime configuration offer an opt-in integration route without editing global settings. This remains an implementation option, not a selected or verified adapter. \u003ca href=\"https://opencode.ai/docs/plugins/\" rel=\"noreferrer\">Plugins\u003c/a>, \u003ca href=\"https://opencode.ai/docs/config/#precedence-order\" rel=\"noreferrer\">configuration precedence\u003c/a>\u003c/p>\n\u003ch2 id=\"no-setup-follow-up\">No-setup follow-up\u003c/h2>\n\u003cp>The \u003ca href=\"#/planning~no-setup-delivery-decision-on-2026-10-20\">fourth interview\u003c/a> rejects a required integration step. Keep the OpenCode plugin route as research only. For the installed v1, use explicit manual delivery; do not require an upgrade to obtain v2's newer shell behavior.\u003c/p>\n\u003cp>Claude's current documentation distinguishes local interactive background Bash, which has no time limit, from unattended/headless modes, which do. A text-prompt \u003ccode>-p\u003c/code> run defaults to ten minutes and can request at most two hours without changing configuration. Monitor is also bounded and does not solve arbitrary human waiting. Our three-minute and native-form tests use headless background Bash, so they verify notification/consumption within that mode's limit; they do not establish a long interactive wait. \u003ca href=\"https://code.claude.com/docs/en/tools-reference#time-limit-for-background-commands\" rel=\"noreferrer\">Claude Bash lifecycle\u003c/a>, \u003ca href=\"https://code.claude.com/docs/en/tools-reference#monitor-tool\" rel=\"noreferrer\">Monitor limits\u003c/a>\u003c/p>\n\u003cp>After the user signed in, Kimi reported version 2.2.0. Its live three-minute test used \u003ccode>run_in_background: true\u003c/code> and \u003ccode>disable_timeout: true\u003c/code>, ended with \u003ccode>WAITING\u003c/code>, then automatically continued and read the completed output once. A separate native form-and-image submission followed the same route. The print stream does not expose a separate completion-event payload, so the observed evidence is the unsolicited continuation and actual result consumption; no second prompt was injected. \u003ca href=\"https://moonshotai.github.io/kimi-code/en/reference/tools#shell\" rel=\"noreferrer\">Kimi Bash controls\u003c/a>\u003c/p>\n","backlinks":["contract","planning","research/index","research/renderer-health","verification/runs/2026-10-20-no-setup"]},{"id":"research/engine","title":"Engine and extension mechanisms","section":"Research","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-20\u003c/span>","updated":"2026-10-20","summary":"","source":"---\ntitle: Engine and extension mechanisms\nupdated: 2026-10-20\n---\n# Engine and extension mechanisms\n\n[Research overview](index.md)\n\n## What belongs in the engine\n\nThe engine should know who requested an interaction, what was launched, where its result is stored, and how completion reaches that caller. It need not understand a slider, a drawing stroke, a React component, or an interview's decision tree.\n\nThe minimal useful responsibilities are:\n\n1. Accept input and identify the exact caller and session.\n2. Launch the chosen interface and observe readiness, exit, and failure.\n3. Accept explicit submit/cancel events and retain recoverable drafts where supported.\n4. Save a result and its artifacts before acknowledging submission.\n5. Deliver a completion notice or return a result through a supported host mechanism.\n6. Allow collection and recovery by exact session identifier.\n\nKeep this a session runner rather than a general workflow scheduler. A skill can sequence forms, drawing, and review steps. A renderer can implement multiple pages or local branching without asking the model on every interaction.\n\n## Extension mechanisms compared\n\n| Mechanism | Author experience | Useful property | Cost or limitation | Assessment |\n| --- | --- | --- | --- | --- |\n| HTML file or directory | Write ordinary web content and call submit | Lowest friction for generated or reusable UI | Needs a web renderer; custom code needs a constrained bridge | Preferred common path |\n| External executable | Read JSON input; write a structured result | Language independence and separate releases | Extra executable, process lifetime, and trust must be handled | Preferred native escape hatch |\n| Compiled-in Go packages | Implement a small internal interface | One selected executable; no runtime plugin loader | Adding native functionality requires a new build | Good for first-party distributions |\n| Go `plugin` shared libraries | Match host interfaces and exact builds | Direct calls and shared data | No Windows support; strict toolchain/dependency compatibility | Reject as the general extension contract |\n| WebAssembly | Compile a module against host imports | Portable computation with controlled host access | Runtime and ABI to maintain; no native UI appears without host functions | Defer until a concrete need |\n| Universal component DSL | Describe every UI using a custom schema | Validatable, discoverable catalog | New authoring language and ongoing adapters for every renderer | Optional renderer, not core requirement |\n\nGo's own documentation lists platform and build-compatibility restrictions and recommends considering IPC. This is stronger evidence than assuming that a Go core should use Go's package named `plugin`. [Go plugin documentation](https://pkg.go.dev/plugin)\n\nHashiCorp's go-plugin demonstrates mature subprocess separation, version handshakes, and reattachment. Its actual startup handshake negotiates a local socket and RPC protocol. That is a useful design reference, but adopting its full RPC interface and generated gRPC machinery is not automatically simpler for a skill author. Process separation also does not sandbox the child from the filesystem or network. [go-plugin](https://github.com/hashicorp/go-plugin), [handshake implementation contract](https://github.com/hashicorp/go-plugin/blob/main/docs/internals.md)\n\nwazero is a pure-Go WebAssembly runtime that avoids a cgo/native-library requirement. Extism demonstrates the host-function approach to granting additional capabilities to modules. Neither gives a UI-free core a browser engine or native window for free. A WASM extension needing windows still needs those capabilities implemented in the host. [wazero](https://wazero.io/), [Extism host functions](https://extism.org/docs/concepts/host-functions/)\n\n## Keep the protocol smaller than the implementation\n\nFor ordinary web UI, the author should see input, submit, cancel, and optional draft saving. Session IDs, callback retries, artifact paths, and harness routing stay inside fungi.\n\nFor a native process, start with one input envelope and one final result envelope. If draft updates or intermediate events become necessary, add bounded JSON-line events without making a full RPC server mandatory. Standard output carries protocol data; standard error carries bounded diagnostics. A clean process exit without a valid result is not a submission.\n\nUseful versioning is a small protocol version and explicit optional capabilities. Avoid a dependency solver, plugin marketplace, arbitrary callback scripts, and mandatory registries in the first release. An explicit local path should be enough to run authored content.\n\n## Reliability without a large framework\n\nSubmission, renderer exit, and agent consumption are different events. A UI may close without submission. A result may be saved after the harness disconnects. A callback may be accepted while its acknowledgement is lost. Represent those differences internally without making authors operate a complicated state machine.\n\nObservable outcomes are submitted, cancelled, closed with draft retained, and failed. A timeout of an agent tool is a transport outcome, not evidence that the human cancelled. The third interview accepted close as a distinct terminal outcome with draft preservation; the [contract draft](../contract.md#result-and-lifecycle) proposes reopening into a new linked session.\n\nSave the response and artifact bytes before returning success to the UI. Associate delivery with a stable result ID. Retry failed notifications locally within explicit bounds; do not repeatedly wake the model. A queued notification means the host accepted a message, not that the agent has read the result. Collection should be repeatable and should not delete data. Cleanup follows an explicit acknowledgement or retention policy.\n\nExactly-once handling across independent applications cannot be promised just by recording a local flag: a crash can occur after the receiver accepted a message and before fungi recorded success. Use repeatable result retrieval and deduplication by result ID where the host permits it. Where the host lacks an idempotency key, distinguish best-effort notification from confirmed consumption.\n\n## Storage choice\n\nFor a small local tool, session directories with JSON records and artifact files are attractive: easy to inspect, recover, and move. But reliable persistence requires more than writing JSON and renaming a file. Go explicitly does not promise atomic rename on non-Unix platforms. SQLite's atomic-commit explanation shows why write ordering and flushes matter under crashes. [Go Rename contract](https://pkg.go.dev/os#Rename), [SQLite atomic commit](https://sqlite.org/atomiccommit.html)\n\nbbolt offers embedded transactions, but its database write lock constrains multiple processes sharing one database. It would be a reasonable option under a single owner, not a reason to introduce a permanent central daemon prematurely. [bbolt limitations](https://github.com/etcd-io/bbolt#caveats--limitations)\n\nRecommendation: keep a narrow persistence interface and choose a proven file-commit implementation or embedded transactional store after testing crash recovery on the supported platforms. Do not build an event-sourcing framework. One authoritative submitted result and modest delivery bookkeeping should be enough initially.\n\n## Proposed verification before expanding UI\n\n| Scenario | Required observation |\n| --- | --- |\n| Human stays away for hours | No fungi-caused model turns, status tool calls, or repeated notifications |\n| User submits twice | One authoritative result; repeated submission returns the existing receipt or an explicit conflict |\n| Renderer closes or crashes | Distinct outcome; no fabricated successful response; saved draft survives |\n| Engine crashes around submission | UI acknowledges only a committed result; recovery finds a valid result or explicit incomplete state |\n| Callback fails or its response is lost | Result remains available; bounded retry; deduplication behavior documented |\n| Multiple conversations use fungi | Each receives only its own session result |\n| Harness kills a process group | No false success; persistence and supported recovery route remain clear |\n| Machine sleeps or reboots | No lost committed data; automatic resumption is claimed only if an actual running/restarted receiver exists |\n| Disk full or artifact interrupted | Submission stays unsuccessful; existing data is preserved |\n| Invalid or oversized extension output | Bounded memory use; useful failure; no indefinite wait |\n\nThese are proposed acceptance cases, not completed tests.\n","toc":[{"id":"what-belongs-in-the-engine","title":"What belongs in the engine","depth":2},{"id":"extension-mechanisms-compared","title":"Extension mechanisms compared","depth":2},{"id":"keep-the-protocol-smaller-than-the-implementation","title":"Keep the protocol smaller than the implementation","depth":2},{"id":"reliability-without-a-large-framework","title":"Reliability without a large framework","depth":2},{"id":"storage-choice","title":"Storage choice","depth":2},{"id":"proposed-verification-before-expanding-ui","title":"Proposed verification before expanding UI","depth":2}],"titleAnchor":"engine-and-extension-mechanisms","links":["research/index","contract"],"attachments":[],"html":"\u003cp>\u003ca href=\"#/research/index\">Research overview\u003c/a>\u003c/p>\n\u003ch2 id=\"what-belongs-in-the-engine\">What belongs in the engine\u003c/h2>\n\u003cp>The engine should know who requested an interaction, what was launched, where its result is stored, and how completion reaches that caller. It need not understand a slider, a drawing stroke, a React component, or an interview's decision tree.\u003c/p>\n\u003cp>The minimal useful responsibilities are:\u003c/p>\n\u003col>\n\u003cli>Accept input and identify the exact caller and session.\u003c/li>\n\u003cli>Launch the chosen interface and observe readiness, exit, and failure.\u003c/li>\n\u003cli>Accept expli
