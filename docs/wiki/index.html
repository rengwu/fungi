 **Failed** overall.\nThis exposed a choice between keeping no-install distribution with\nexplicit supported Linux environments, allowing an optional Linux installation\npath, or deferring Linux UI. The following interview resolves it. Full jstack\nauthoring integration remains deferred.\n\n## Linux distribution decision\n\nThe [submitted answer to question 20](journal/2026-10-22-grill-0c10be35-a07a-4a8d-8d5d-39fda5b2e1bc.md)\nselects **keep no-install; support explicitly verified Linux environments**.\nThe Fungi callback was collected once, and the matching jstack transcript\nwas validated and finished. There were no additional notes.\n\nKeep the portable folder/archive and bundled Electron runtime. Publish the\ntested environments and their capability limits; make unsupported startup\nfailures diagnosable. This authorizes neither an installer nor sandbox\nbypasses, elevated helper setup or global host policy changes. Ubuntu 22.04's\ntested workflow is usable without WebGL; Ubuntu 24.04's tested default\nsandbox policy remains outside UI support. The earlier broad matrix remains\nFailed in its historical report.\n\nThe [platform record](platforms.md) distinguishes workflow coverage, optional\nGPU/codec availability and physical clean-machine acceptance. Full jstack\nauthoring integration remains deferred. No new skill/plugin architecture is\nneeded to apply this decision.\n\nThe [baseline follow-up](verification/runs/2026-10-22-baselines.md) passes\nthose selected scopes on revision `199759a`. Unsupported startup now returns\na saved, distinct failure with the diagnostic log path. The four-method page\nAPI remains unchanged. The foundation is ready for further skill work within\nthe documented limits. Physical target-machine and clean-machine acceptance\nremain the separate distribution gap; no such result is inferred from CI.\n\nThe final Windows handoff was opened as Fungi session\n`61a2170bba8d62aa0291aec1aad663cc`, using the new Mac portable package and an\narmed exact-conversation callback. Question 21 asks for the observed physical\nWindows result or an explicit deferral; it does not assume either. The ZIP is\n`dist/fungi-win32-x64-2026-10-22T09-50-20-630Z.zip`, with the full portable\nfolder and `VERIFY.md`. Its SHA-256 is\n`413a6526920e3c8d0fbae17d4a79d31fe50a9309472ee74901eb95cf465529c9`.\n\nThe callback was collected exactly once and the matching jstack transcript\nwas validated and finished. The [submitted response](journal/2026-10-22-grill-b8ce5a10-7261-48c1-9d80-ee54e103ec5e.md)\nasks for instructions in the wiki: the user will pull on Windows and have the\nagent there execute them. It does not report a pass, failure or deferral.\nPhysical Windows verification therefore remains pending execution there.\n\nThe [Windows agent handoff](verification/windows.md) is the entry point. It\nspecifies `foundation-hardening`, building from tracked source because\nportable packages are ignored by Git, the automated and visible checks, and\nhow to commit evidence back into this wiki. No new questionnaire is pending;\nthe next action belongs to the Windows agent after the pull. The original\nreceipt and response remain under\n`verification-output/platform-2026-10-22/windows-handoff/` on this Mac.\n\n## Physical Windows handoff on 2026-10-22/23\n\nThe user requested execution of the Windows guide and later asked the agent\nto continue. The [completed handoff record](verification/runs/windows-2026-10-22-203907.md)\nidentifies revision `73eb9ad`, the locally built portable package, native\nWindows 11 Pro x64 build 26200 and the evidence. The agent operated synthetic\ncontrols through native mouse/keyboard input. Launch, acknowledged draft,\nclose/reopen with restored values, PNG submission/hash and separate\ncancellation all passed with an empty child PATH.\n\nThe overall run is **Untested**: 17 core and six Node tests passed, but the\nremaining core/asset tests and the full renderer fixture could not create\ntheir prerequisite symlinks under this account. Exact setup failures are\nretained; no elevation, security-policy change or weakened fixture was used.\nA checkout line-ending mismatch was resolved by applying the branch's\nexisting LF policy; no product source repair was needed. Node/npm were used\nfrom an isolated portable toolchain for building only.\n\nThis completes the visible desktop journey on that machine and records the\nremaining automated coverage gap. It does not certify a clean-machine or\ndownloaded-archive launch, Windows clipboard, WebGL, automatic agent return,\nsleep/wake or power-loss behavior. The earlier hosted and Mac reports retain\ntheir original scopes. Full jstack authoring integration remains deferred.\n\n## Command installation and updates on 2026-10-23\n\nThe user asks to target a script/command installation for the eventual release,\nwith as few dependencies as possible, and easy updates on every platform\ncomparable in convenience to updating a CLI through npm. These are release\nrequirements; Node/npm and Homebrew should remain optional.\n\nThis clarifies the earlier no-install wording: keep a complete portable archive\nwith no separately installed language runtime or renderer, and offer a command\nthat downloads and places it. The Linux decision still excludes installing OS\ndependencies, elevated sandbox helpers or changed security policy as part of\nthis path. A download script does not expand the supported environments.\n\nThe recommended design is an official shell bootstrap for macOS/Linux and a\nPowerShell bootstrap for Windows, each selecting one OS/CPU package. Shared\nupdate logic belongs in the Go CLI, with a proposed `fungi update` command.\nHomebrew/npm channels can wrap the same release artifacts later. Exact flags,\nhosting and installation layouts remain implementation decisions. No installer\nor updater existed at this planning checkpoint; this discussion records the release target.\n\nUpdates must preserve the working installation on failure and retain sessions,\ndrafts and artifacts. Stage and verify a release before activating it through\na stable command path. Retain rollback and versions still required by sessions;\nprune obsolete, unreferenced versions rather than accumulating every build.\nCurrent receipts embed absolute executable paths, and reopened sessions can\nreference package-owned assets. Resolve and test that compatibility before\nautomatic pruning implements this retention policy.\n\nThe [platform plan](platforms.md#planned-command-installation-and-updates)\nrecords the proposed delivery flow and acceptance checks. Signing, release\npublication and clean-machine verification remain outstanding. Full jstack\nauthoring integration remains deferred.\n\n## Installation implementation on 2026-10-23\n\nThe user invoked `work-until-grill` for the installation/update milestone and\nasked how to shrink the bundle. The [development implementation](features/installation.md)\nadds versioned archives, script bootstraps, a stable command, Go-managed update,\nrollback and reference-aware cleanup. It preserves the four-method page API.\nThe [verification run](verification/runs/2026-10-23-distribution.md) separates\nlocal observations from hosted and clean-machine acceptance.\n\nKeep Electron and its languages, GPU fallback and license notices intact for\nnow. Local measurements show the runtime accounts for roughly 96–97% of the\nprevious packages. Release builds omit full wiki/evidence, separately authored\nskill bundles and the compiled demo helper; they strip Go debug information\nand use maximum standard-library archive compression. The follow-up updater\nshares byte-identical renderer files through filesystem hard links, falling\nback to verified copies where unavailable. This reduces retained update\nstorage without a runtime registry or changes for skill authors. Complete\narchives still download and stage before activation; neither the first\ndownload nor update traffic is reduced by file sharing.\n\nNo installer/update test authorizes public release publication or signing with\nan account identity. Exact GitHub release downloads, signing/notarization and\nphysical clean-machine acceptance remain release work. Full jstack authoring\nintegration remains deferred.\n\nThe installation implementation and records are pushed. The latest Windows\nand Linux CI scopes pass; the latest Mac job and one bounded retry obtained\nno hosted runner. The [verification record](verification/runs/2026-10-23-distribution.md)\nretains earlier Mac passes and marks the latest matrix **Untested**. Both waits\nreturned through Fungi callbacks and were collected once each. No automatic\nretry or pending callback remains; the next verification action is the same\nMac job after hosted capacity recovers. This is an external verification\nblocker, not a user design decision or a completed release qualification.\n","toc":[{"id":"requirements-supplied-by-the-user","title":"Requirements supplied by the user","depth":2},{"id":"scope-clarifications-on-2026-10-19","title":"Scope clarifications on 2026-10-19","depth":2},{"id":"accepted-decisions-from-the-first-interview","title":"Accepted decisions from the first interview","depth":2},{"id":"second-interview-and-subsequent-clarifications","title":"Second interview and subsequent clarifications","depth":2},{"id":"accepted-electron-go-direction","title":"Accepted Electron + Go direction","depth":2},{"id":"accepted-first-milestone-scope","title":"Accepted first-milestone scope","depth":2},{"id":"current-proposals-not-accepted-decisions","title":"Current proposals, not accepted decisions","depth":2},{"id":"contract-draft-on-2026-10-20","title":"Contract draft on 2026-10-20","depth":2},{"id":"remaining-implementation-questions","title":"Remaining implementation questions","depth":2},{"id":"implementation-checkpoint-on-2026-10-20","title":"Implementation checkpoint on 2026-10-20","depth":2},{"id":"no-setup-delivery-decision-on-2026-10-20","title":"No-setup delivery decision on 2026-10-20","depth":2},{"id":"native-compatibility-checkpoint","title":"Native compatibility checkpoint","depth":2},{"id":"skill-authoring-and-longer-waits","title":"Skill authoring and longer waits","depth":2},{"id":"rich-questionnaire-feedback","title":"Rich questionnaire feedback","depth":2},{"id":"foundation-work-on-2026-10-22","title":"Foundation work on 2026-10-22","depth":2},{"id":"linux-distribution-decision","title":"Linux distribution decision","depth":2},{"id":"physical-windows-handoff-on-2026-10-22-23","title":"Physical Windows handoff on 2026-10-22/23","depth":2},{"id":"command-installation-and-updates-on-2026-10-23","title":"Command installation and updates on 2026-10-23","depth":2},{"id":"installation-implementation-on-2026-10-23","title":"Installation implementation on 2026-10-23","depth":2}],"titleAnchor":"requirements-and-discussion","links":["journal/2026-10-19-grill-eb02aa23-b51f-42c9-b9c0-8fa331bfb02c","journal/2026-10-19-grill-186963ab-2f7b-423c-b40b-97b0afacc6fb","research/renderer-health","proposal","journal/2026-10-19-grill-689a37f9-b8c4-4f2a-9e54-282234bc2551","research/delivery","contract","research/index","proposal","features/index","verification/runs/2026-10-20-first-proof","journal/2026-10-20-grill-397cc4f4-31e2-4fd5-a08e-30ee197e3297","verification/runs/2026-10-20-no-setup","verification/runs/2026-10-20-skill-proof","research/pele","journal/2026-10-20-grill-desktop-arrangements","verification/runs/2026-10-20-skill-proof","verification/runs/2026-10-20-rich-grill","verification/runs/2026-10-22-platform","verification/runs/2026-10-22-hosted","journal/2026-10-22-grill-0c10be35-a07a-4a8d-8d5d-39fda5b2e1bc","platforms","verification/runs/2026-10-22-baselines","journal/2026-10-22-grill-b8ce5a10-7261-48c1-9d80-ee54e103ec5e","verification/windows","verification/runs/windows-2026-10-22-203907","platforms","features/installation","verification/runs/2026-10-23-distribution","verification/runs/2026-10-23-distribution"],"attachments":[{"path":"evidence/2026-10-20-skill-proof/idle-long-result.json","sha256":"0862217e750714093729aa5f2810e7186235f1543813f1e7c4c02810741587dc"},{"path":"evidence/2026-10-20-skill-proof/sleep-wake-baseline.json","sha256":"24ffa79a45c5d8901d1bc63690cfdf992ab1b7804c2f2556c1c55aef7c138d17"},{"path":"evidence/2026-10-20-skill-proof/sleep-wake-power.log","sha256":"7effb401a97b17cedcf129a2c448a5eb541129b9c27ba8ac746f6f4528869f86"},{"path":"evidence/2026-10-20-skill-proof/sleep-wake-result.json","sha256":"b32e0229f842add9c3b1b483a38806fca7d9ea4e2e2ac30d280ea0c7cf99c7bd"},{"path":"evidence/2026-10-20-rich-grill/user-result.json","sha256":"d87dac88b7a250d9a8b35c809e472dff1274ee9a7cc5d24f30e8f6510b5113b2"}],"html":"\u003ch2 id=\"requirements-supplied-by-the-user\">Requirements supplied by the user\u003c/h2>\n\u003cul>\n\u003cli>Provide a reliable, flexible, extensible engine for skill-authored human interaction workflows. The engine is reusable across agents and harnesses.\u003c/li>\n\u003cli>Present information, collect responses and artifacts, and deliver them back to the exact calling agent conversation.\u003c/li>\n\u003cli>Provide one core CLI executable with no installer or separately installed language runtime. The accepted portable distribution may include renderer runtime files beside it. Skills may supply assets and helper executables, and fungi may load optional capabilities from a nearby folder.\u003c/li>\n\u003cli>Provide an AI-friendly CLI with discoverable capabilities and APIs; MCP is optional.\u003c/li>\n\u003cli>Support desktop platforms rather than depending on macOS alone.\u003c/li>\n\u003cli>Eventually enable highly composable interfaces: Markdown, diagrams, charts, forms, native capture, drawing, custom web content, and live controls. Skills own the workflow; fungi supplies execution and communication infrastructure.\u003c/li>\n\u003cli>Support a dedicated native window with embedded web content as a possible presentation mechanism, avoiding dependence on an agent controlling the user's browser.\u003c/li>\n\u003cli>Human interaction must not cause repeated model tool calls, status polling, continued token expenditure, or compactions while the user is away. Automatic response delivery is central.\u003c/li>\n\u003cli>Use jstack's wiki, plan, grill-form, and rule-lean workflows for this project. Implementation was authorized on 2026-10-20 by the user’s \u003ccode>work-until-grill\u003c/code> instruction.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"scope-clarifications-on-2026-10-19\">Scope clarifications on 2026-10-19\u003c/h2>\n\u003cp>The user first clarified that the default core should include no UI capabilities: prioritize a reliable and extensible base on which primitive and complex interfaces can be built.\u003c/p>\n\u003cp>The user then allowed primitive UI functionality and components for testing. This permits a small reference UI to validate the engine. It does not establish a requirement to build a broad widget library into the core.\u003c/p>\n\u003cp>The user requested unusually deep research, including niche implementations, widely available component libraries, frameworks, and rendering engines.\u003c/p>\n\u003cp>The user subsequently emphasized ease of extensibility and simplicity, explicitly invoking rule-lean. Skill authors must not have to learn a complicated plugin framework to add UI capabilities. Research breadth must not turn into implementation scope.\u003c/p>\n\u003ch2 id=\"accepted-decisions-from-the-first-interview\">Accepted decisions from the first interview\u003c/h2>\n\u003cp>The \u003ca href=\"#/journal/2026-10-19-grill-eb02aa23-b51f-42c9-b9c0-8fa331bfb02c\">submitted answers\u003c/a> establish these decisions:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Decision\u003c/th>\n\u003cth>Consequence\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>One core executable orchestrates interaction; skills may bring assets/helpers, and fungi may have adjacent optional capabilities\u003c/td>\n\u003ctd>Extensibility must not require rebuilding the core for every new workflow\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Bundle the simplest, lightest suitable rendering engine\u003c/td>\n\u003ctd>Do not require users to install WebView2 or WebKitGTK; the prior system-webview recommendation is superseded\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTML/assets and JSON component descriptions are equally supported in the first release\u003c/td>\n\u003ctd>The JSON authoring path is first-release scope; it should share a renderer and result contract with HTML\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Automatic delivery is best effort across popular harnesses; open the interface even when it is unavailable\u003c/td>\n\u003ctd>Explicitly report the fallback and let the user say “done”; never substitute agent polling\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Local agent and UI on the same desktop first\u003c/td>\n\u003ctd>Remote/container-to-desktop transport is deferred\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Explicit reopen/collect is acceptable after relevant processes exit\u003c/td>\n\u003ctd>Preserve responses; no mandatory login service or automatic reboot recovery in the first release\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The user specifically prioritizes running cleanly out of the box over the smaller download offered by system-webview wrappers. Native operating-system APIs remain necessary; the exact supported desktop baseline still needs verification.\u003c/p>\n\u003cp>During follow-up research, the user explicitly accepted bundling Chromium/Electron as a worst-case browser-renderer fallback. That initially permitted a larger engine without selecting one. The later Electron + Go decision below settles the default; it does not require maintaining two engines in the first release.\u003c/p>\n\u003ch2 id=\"second-interview-and-subsequent-clarifications\">Second interview and subsequent clarifications\u003c/h2>\n\u003cp>The \u003ca href=\"#/journal/2026-10-19-grill-186963ab-2f7b-423c-b40b-97b0afacc6fb\">second submitted form\u003c/a> selects an open-source renderer for the default distribution. Proprietary renderers may remain optional third-party capabilities, but Sciter and Ultralight no longer qualify for the default.\u003c/p>\n\u003cp>For packaging, the saved form selects automatic runtime extraction. In chat, while referring specifically to that question, the user instead delegated the decision to the simplest-complexity route. Applying that instruction, the chosen plan is a portable folder/archive containing the fungi CLI and renderer files. This retains one CLI entry point and no installer, while avoiding extraction/cache-management code. Preserve the submitted answer as history; the chat clarification governs the current plan. It relaxes the original literal single-file distribution target.\u003c/p>\n\u003cp>The user also requires a substantial established following (including GitHub stars or equivalent evidence) and healthy recent renderer development. No numerical star cutoff was specified. Evaluate adoption, actual releases/fixes, contributor breadth, maintenance policy, and any binding used by fungi separately; a popular upstream engine does not establish the health of its wrapper. \u003ca href=\"#/research/renderer-health\">Adoption and maintenance research\u003c/a>\u003c/p>\n\u003ch2 id=\"accepted-electron-go-direction\">Accepted Electron + Go direction\u003c/h2>\n\u003cp>On 2026-10-19, after the adoption and maintenance assessment, the user accepted Electron + Go. Go is the core CLI/session engine; a small Electron companion owns the native window and bundled web renderer. This replaces the earlier Go-owned-window idea while preserving Go ownership of orchestration and agent delivery. The choice favors established browser compatibility and straightforward integration over minimum runtime size.\u003c/p>\n\u003cp>Use the already accepted portable directory/archive distribution. CEF and other engines remain research references, not parallel implementation targets. Selecting the stack does not establish performance, desktop compatibility, or a completed agent return path.\u003c/p>\n\u003cp>The next milestone is the \u003ca href=\"#/proposal~first-proof\">first end-to-end proof\u003c/a>: launch, idle without model polling, submit, save, return to the exact caller, and collect. The third interview below settles its scope and close behavior. The initial API was subsequently implemented as a prototype; see the current contract and verification report.\u003c/p>\n\u003ch2 id=\"accepted-first-milestone-scope\">Accepted first-milestone scope\u003c/h2>\n\u003cp>The \u003ca href=\"#/journal/2026-10-19-grill-689a37f9-b8c4-4f2a-9e54-282234bc2551\">third submitted form\u003c/a> settles the following:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Decision\u003c/th>\n\u003cth>Consequence\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>macOS first; Windows/Linux verification follows\u003c/td>\n\u003ctd>Prove the initial loop on this Mac, without claiming other platforms have passed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Verify automatic return in Codex, Claude Code, OpenCode, Grok, Kimi and Pi\u003c/td>\n\u003ctd>The answer's notes expand the selected three-harness option to six; Codex alone does not complete this milestone\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Form plus pasted/selected image attachment\u003c/td>\n\u003ctd>Keep drawing tools and a full screenshot UI outside the initial demo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Flat built-in JSON fields first\u003c/td>\n\u003ctd>Defer nested composition and custom JSON components; the user has larger JSON-authoring ideas to discuss later\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Window close ends the interaction with a distinct \u003ccode>closed\u003c/code> outcome and retains the draft\u003c/td>\n\u003ctd>Never treat close as submission; explicit reopening uses the latest saved draft\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Include a tiny native helper contract test\u003c/td>\n\u003ctd>Exercise an extension outside Electron without implementing a native widget library\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Launch input and local UI interaction are enough initially\u003c/td>\n\u003ctd>Defer external live updates into an open session; local sliders/previews still work\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>HTML and JSON remain equally supported, sharing submission and result handling. The flat JSON example is a deliberately small first surface, not a commitment to the eventual JSON architecture. Arbitrary local HTML/assets remain the route for custom UI during this milestone.\u003c/p>\n\u003cp>Read-only inspection confirmed all six commands are installed. Current versions and candidate return mechanisms are recorded in \u003ca href=\"#/research/delivery~first-milestone-harness-inventory\">delivery research\u003c/a>. Installation does not establish authentication, callback reliability or live Fungi compatibility. All six are verification targets; any unavailable automatic route remains an explicit gap, with the already accepted manual “done” behavior available rather than model polling.\u003c/p>\n\u003ch2 id=\"current-proposals-not-accepted-decisions\">Current proposals, not accepted decisions\u003c/h2>\n\u003cul>\n\u003cli>Keep session ownership, lifecycle, extension communication, durable results, and delivery in the engine.\u003c/li>\n\u003cli>Use a small, separable reference renderer for end-to-end testing.\u003c/li>\n\u003cli>Treat native windows, webviews, component libraries, capture interfaces, and terminal interfaces as interchangeable implementations above the engine's protocol.\u003c/li>\n\u003cli>Keep high-frequency interactions local. A slider change or drawing stroke should not invoke a model by default.\u003c/li>\n\u003cli>Separate storing a valid result from notifying a harness and from confirming that an agent consumed it.\u003c/li>\n\u003cli>Use the same rendering bridge for direct HTML and a small JSON component catalog. Catalog composition belongs above the session engine.\u003c/li>\n\u003cli>Identify a supported delivery route before promising automatic resumption; otherwise launch with the accepted “done” fallback. Never substitute repeated model polling for an unavailable callback.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"contract-draft-on-2026-10-20\">Contract draft on 2026-10-20\u003c/h2>\n\u003cp>The \u003ca href=\"#/contract\">first implementation contract\u003c/a> makes launch, waiting, lifecycle, page/helper APIs, artifact persistence and recovery concrete. It proposes four CLI operations, immutable terminal results, new linked sessions when reopening a draft, and one shared commit path for HTML, flat JSON and native helpers. These are engineering recommendations for review; they do not change the accepted milestone scope or establish implementation evidence.\u003c/p>\n\u003cp>The user's follow-up asks whether more grilling is needed. Current product choices are sufficient to draft this contract. Another targeted interview is useful only if factual work reveals a consequential tradeoff, such as a required harness setup step. Ordinary command naming, internal transport and test-fixture choices do not need another broad questionnaire.\u003c/p>\n\u003ch2 id=\"remaining-implementation-questions\">Remaining implementation questions\u003c/h2>\n\u003col>\n\u003cli>Which built-in return mechanism works in each installed harness, with exact originating-session routing and no repeated model checks? The fourth interview rules out harness setup; use the explicit manual fallback where native capabilities are insufficient.\u003c/li>\n\u003cli>Does the draft contract hold up against concrete HTML, flat JSON and native-helper examples, including interrupted submission and exact-session recovery? Refine it from implementation evidence rather than growing a speculative plugin framework.\u003c/li>\n\u003cli>What desktop baselines and packaging changes are needed for later Windows/Linux support? Keep those claims unverified until exercised there.\u003c/li>\n\u003c/ol>\n\u003cp>\u003ca href=\"#/research/index\">Research findings\u003c/a> and the \u003ca href=\"#/proposal\">small authoring proposal\u003c/a> reflect these decisions. Electron + Go and the milestone scope are selected; exact APIs remain proposals. The initial prototype now implements these paths; coverage is recorded in the verification report.\u003c/p>\n\u003ch2 id=\"implementation-checkpoint-on-2026-10-20\">Implementation checkpoint on 2026-10-20\u003c/h2>\n\u003cp>The user invoked \u003ccode>work-until-grill\u003c/code>, authorizing implementation and verification of the accepted first milestone. Go now owns detached sessions, immutable results, artifacts, drafts, explicit recovery and return delivery. Electron renders local HTML and flat JSON forms through a four-method bridge. A native Go helper exercises the same protocol. The core uses only the Go standard library.\u003c/p>\n\u003cp>Evidence changed one internal choice: a loopback listener failed under Codex’s sandbox, so process pipes and OS file locks replaced HTTP. The macOS portable folder preserves Electron’s framework symlinks and does not need a separately installed Node runtime. It is a development package, not a notarized public release.\u003c/p>\n\u003cp>\u003ca href=\"#/features/index\">The feature map\u003c/a> and \u003ca href=\"#/verification/runs/2026-10-20-first-proof\">first proof report\u003c/a> separate observed behavior from remaining work. Five harnesses returned real Fungi helper results; three-minute waits completed in Claude, Grok and Pi. Kimi lacks a configured credential. Longer AFK behavior and all-six native UI journeys remain unverified. The next consequential question concerns opt-in harness integrations where stock tools cannot wait indefinitely; no persistent integration configuration has been changed.\u003c/p>\n\u003ch2 id=\"no-setup-delivery-decision-on-2026-10-20\">No-setup delivery decision on 2026-10-20\u003c/h2>\n\u003cp>The \u003ca href=\"#/journal/2026-10-20-grill-397cc4f4-31e2-4fd5-a08e-30ee197e3297\">fourth submitted form\u003c/a> resolves that tradeoff: \u003cstrong>require no harness setup; use the manual “done” fallback on unsupported versions.\u003c/strong> Do not add a plugin, hook, startup configuration or harness upgrade as a prerequisite for Fungi. Existing built-in completion tools and the already available exact-thread Codex queue remain eligible.\u003c/p>\n\u003cp>All six installed harnesses remain compatibility targets. For a version or execution mode that cannot sustain a human wait, record its manual fallback explicitly; that is accepted compatibility behavior, not a passing automatic-return test. This clarifies the earlier all-six automatic-return target without claiming that an unsupported version gained a capability.\u003c/p>\n\u003cp>The user also reports completing Kimi sign-in and requests verification to resume. Retry the actual command; do not inspect credentials or assume authentication succeeded merely from the answer. The existing \u003ccode>work-until-grill\u003c/code> authorization continues through implementation, native UI checks and records.\u003c/p>\n\u003ch2 id=\"native-compatibility-checkpoint\">Native compatibility checkpoint\u003c/h2>\n\u003cp>The \u003ca href=\"#/verification/runs/2026-10-20-no-setup\">no-setup follow-up\u003c/a> verifies Kimi 2.2.0 after sign-in, complete native form/image returns in Pi, Grok, Kimi and Claude's bounded headless mode, and OpenCode v1's explicitly resumed manual flow. Launch receipts now include \u003ccode>collectEnv\u003c/code>, verified by the core suite and OpenCode's actual later call. No integration setup is required.\u003c/p>\n\u003cp>The latest portable build is \u003ccode>dist/fungi-darwin-arm64-2026-10-20T08-12-31-161Z\u003c/code>. Its Codex image session \u003ccode>39fdb74018dd13baae7fbc2883699530\u003c/code> completed the final check: the notice reached its originating conversation after the prior turn ended, and one collection using the supplied argv/environment returned the submitted response and matching image. The bounded macOS no-setup proof is complete. Long AFK and sleep/wake behavior, clean-machine distribution, and Windows/Linux runtime verification remain outside the completed proof. The earlier user-edited demo remains open with its draft preserved.\u003c/p>\n\u003ch2 id=\"skill-authoring-and-longer-waits\">Skill authoring and longer waits\u003c/h2>\n\u003cp>The user authorized the next work through \u003ccode>work-until-grill\u003c/code>: exercise real skill authoring, longer idle/recovery behavior and portability. They specifically requested the simpler grill-form from yesterday's jstack history while its current version is being reworked. The last committed modification of the relevant assets is \u003ccode>7a7c919\u003c/code> (2026-10-13); those assets are unchanged at yesterday's tip, \u003ccode>32324e47aae7d3ad3f92e6a4aad8966e9451d691\u003c/code>. Use that committed baseline, not the uncommitted editor/review changes.\u003c/p>\n\u003cp>The Fungi example is now a skill-owned HTML directory and question JSON input. It keeps choices, plain notes and the older rich descriptions, adds one optional image through the existing artifact bridge, and uses Fungi's durable drafts and result delivery. No core or bridge API changes were needed. The native UI has passed close/reopen, abrupt owner-loss recovery, storage-failure retry, submission and cancellation. Linux arm64 core tests also passed in a network-isolated, unprivileged container. \u003ca href=\"#/verification/runs/2026-10-20-skill-proof\">Verification\u003c/a>\u003c/p>\n\u003cp>The user also suggested Obsidian's Pele. \u003ca href=\"#/research/pele\">The assessment\u003c/a> finds a promising optional diagram asset, with a small dependency-free browser bundle and recent development, but little maintenance history so far. It is not substituted into the committed grill-form baseline.\u003c/p>\n\u003cp>The two-hour native-helper probe, session \u003ccode>622f59b42e05840dd408622f23c8416a\u003c/code>, completed with one exact-origin Codex notice and one collection. Its \u003ca href=\"evidence/2026-10-20-skill-proof/idle-long-result.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 0862217e750714093729aa5f2810e7186235f1543813f1e7c4c02810741587dc\">result\u003c/a> records 7,200.0148 helper-measured seconds and a UTC interval of 2 h 4 min 17.873 s, spanning the manual sleep/wake check below. The timing artifact matches the returned data and SHA-256; the owner and helper exited. No model polling or additional waiter was used. This verifies the selected helper/owner/Codex path, not arbitrary-duration behavior in every harness.\u003c/p>\n\u003cp>OrbStack provides Linux core execution but not proof of Linux desktop behavior. A Windows desktop and a clean Mac are not connected to the workspace. The follow-up interview below settles the immediate arrangements; public signing/notarization remains outside the completed prototype.\u003c/p>\n\u003cp>Questions 18–19 are complete in the Fungi-backed simple form, session \u003ccode>3863d61f14f01136a6d967630a00af91\u003c/code>. Its exact-origin callback was consumed with one collection. The \u003ca href=\"#/journal/2026-10-20-grill-desktop-arrangements\">submitted answers\u003c/a> defer additional desktop checks until last; the user has a Windows machine but wants those checks deferred now. They chose to sleep/wake this Mac manually during the verification session. Do not provision a VM, connect to their Windows machine or trigger sleep as a consequence of this answer.\u003c/p>\n\u003cp>The sleep/wake fixture, session \u003ccode>1897358a56ceff72064a252004170716\u003c/code>, passed. Its \u003ca href=\"evidence/2026-10-20-skill-proof/sleep-wake-baseline.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 24ffa79a45c5d8901d1bc63690cfdf992ab1b7804c2f2556c1c55aef7c138d17\">baseline\u003c/a> records the acknowledged \u003ccode>BEFORE-SLEEP — keep this line\u003c/code> note and reference image. macOS \u003ca href=\"evidence/2026-10-20-skill-proof/sleep-wake-power.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 7effb401a97b17cedcf129a2c448a5eb541129b9c27ba8ac746f6f4528869f86\">power events\u003c/a> confirm clamshell sleep at 18:09:06 +0800 and final lid/HID wake at 18:13:38, with a maintenance dark wake/sleep in between. The exact-origin callback was collected once: the \u003ca href=\"evidence/2026-10-20-skill-proof/sleep-wake-result.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: b32e0229f842add9c3b1b483a38806fca7d9ea4e2e2ac30d280ea0c7cf99c7bd\">response\u003c/a> retains that note, adds the user's \u003ccode>AFTER-WAKE\u003c/code> edit and returns identical image bytes. This verifies one short cycle on the current Mac.\u003c/p>\n\u003cp>The \u003ca href=\"#/verification/runs/2026-10-20-skill-proof\">skill-authoring and longer-idle proof\u003c/a> is now complete for its selected scenarios. All callbacks in this round have been consumed. Additional desktop checks remain deferred by the user's answer; public distribution and arbitrary-duration reliability are not established. The current portable package is \u003ccode>dist/fungi-darwin-arm64-2026-10-20T09-41-25-905Z\u003c/code>.\u003c/p>\n\u003ch2 id=\"rich-questionnaire-feedback\">Rich questionnaire feedback\u003c/h2>\n\u003cp>The user tried the updated jstack presentation in a Fungi window. Its \u003ca href=\"evidence/2026-10-20-rich-grill/user-result.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: d87dac88b7a250d9a8b35c809e472dff1274ee9a7cc5d24f30e8f6510b5113b2\">submitted response\u003c/a> returned all six items through one callback and one collection; the \u003ca href=\"#/verification/runs/2026-10-20-rich-grill\">verification report\u003c/a> records the tested build and remaining gaps. Mock choices and placeholder comments are demonstration data.\u003c/p>\n\u003cp>The final note expresses a real concern that UI authoring and handoff may be expensive and hard for models to understand. The user intends eventually to bundle Fungi with jstack and rewrite skills such as grill-form around it once the base is sufficiently stable. This reinforces the existing simplicity requirement. The compatibility adapter used for this experiment is not the intended routine authoring workflow.\u003c/p>\n\u003cp>The user then explicitly confirmed the authoring requirement: agents should follow robust mechanical instructions while understanding the available grill-form capabilities well enough to author meaningful sessions. Both parts matter: a compact capability reference with working examples and limits, and a fixed procedure for validation, launch, completion and interpreting the result.\u003c/p>\n\u003cp>The target is question data plus one launch, followed by automatic structured response delivery. Rendering, draft storage, attachment conversion and callback handling should be reusable implementation supplied with the skill/Fungi distribution. An agent should not reconstruct the template adapter or reconcile two collectors for every questionnaire. The skill should describe choices, open feedback, visual comparisons, diagrams, prototype state, region comments and images without requiring agents to read renderer internals. This is a requirement for the eventual integration, not a claim that the current experiment already provides that final authoring experience.\u003c/p>\n\u003ch2 id=\"foundation-work-on-2026-10-22\">Foundation work on 2026-10-22\u003c/h2>\n\u003cp>The user renewed \u003ccode>work-until-grill\u003c/code> to pursue a stable, robust, simple and broadly flexible rendering platform. Continue within the accepted Go/Electron, local-first, no-harness-setup scope. Full jstack authoring integration remains deferred; a small reusable authoring guide and independent example are appropriate foundation work.\u003c/p>\n\u003cp>Concrete verification initially exposed four repairs: asynchronous Blob conversion could reorder mutations; exact-limit JSON could be saved but unreadable because of its newline; malformed/closed helper stdout could leave the owner blocked in process wait; a failed reference-form autosave could prevent a later submit retry without another edit. Repairs retain the existing protocol and bridge.\u003c/p>\n\u003cp>Renderer support now includes local/Blob workers and WebAssembly, plus streamed local assets with media range requests. The independent before/after comparison example uses ordinary HTML and canvas, exports a PNG and adds no engine API. Its submitted feedback (39% divider, After, “Nice”) is demo data, not a new project requirement. \u003ca href=\"#/verification/runs/2026-10-22-platform\">The verification record\u003c/a> separates runtime observations from broader compatibility claims.\u003c/p>\n\u003cp>Treat existing protocol-1 meanings as the extension compatibility boundary. Keep the flat JSON schema experimental and grow capabilities through ordinary skill assets/helpers. Cross-platform desktop and clean-machine release verification remain the last outstanding acceptance work; signing/notarization and universal harness resumption are not established by a local macOS pass.\u003c/p>\n\u003cp>The follow-up Linux run exposed a fifth issue: a helper could emit a valid\nresult and exit before the launch write completed. The owner now drains its\noutput after write failure and bounds blocked protocol writes. macOS and Linux\ncore suites pass after the repair. Portable Windows x64 and Linux x64 bundles\nare prepared using pinned Electron downloads. Windows file handling has a\nseparate directory-sync policy, and lock errors no longer masquerade as live\nowners. Actual desktop validation is the next unresolved acceptance boundary;\ncompiled bundles are not a platform-support claim.\u003c/p>\n\u003cp>Hosted follow-up testing now exercises the real Electron renderer. macOS and\nWindows Server 2025 pass the 21 rendering assertions with an empty child PATH.\nWindows required direct access to its inherited input pipe, suppression of\nElectron console attachment and tolerance of blank NDJSON lines. The four\npage methods and native-helper contract remain unchanged.\u003c/p>\n\u003cp>All hosted core suites pass. Ubuntu 22.04 completes the renderer workflow and\n20 checks, but its virtual display cannot provide WebGL. Ubuntu 24.04 aborts\nat Chromium sandbox startup under its default namespace policy. No sandbox\nbypass or machine policy change was made. The\n\u003ca href=\"#/verification/runs/2026-10-22-hosted\">hosted report\u003c/a> remains \u003cstrong>Failed\u003c/strong> overall.\nThis exposed a choice between keeping no-install distribution with\nexplicit supported Linux environments, allowing an optional Linux installation\npath, or deferring Linux UI. The following interview resolves it. Full jstack\nauthoring integration remains deferred.\u003c/p>\n\u003ch2 id=\"linux-distribution-decision\">Linux distribution decision\u003c/h2>\n\u003cp>The \u003ca href=\"#/journal/2026-10-22-grill-0c10be35-a07a-4a8d-8d5d-39fda5b2e1bc\">submitted answer to question 20\u003c/a>\nselects \u003cstrong>keep no-install; support explicitly verified Linux environments\u003c/strong>.\nThe Fungi callback was collected once, and the matching jstack transcript\nwas validated and finished. There were no additional notes.\u003c/p>\n\u003cp>Keep the portable folder/archive and bundled Electron runtime. Publish the\ntested environments and their capability limits; make unsupported startup\nfailures diagnosable. This authorizes neither an installer nor sandbox\nbypasses, elevated helper setup or global host policy changes. Ubuntu 22.04's\ntested workflow is usable without WebGL; Ubuntu 24.04's tested default\nsandbox policy remains outside UI support. The earlier broad matrix remains\nFailed in its historical report.\u003c/p>\n\u003cp>The \u003ca href=\"#/platforms\">platform record\u003c/a> distinguishes workflow coverage, optional\nGPU/codec availability and physical clean-machine acceptance. Full jstack\nauthoring integration remains deferred. No new skill/plugin architecture is\nneeded to apply this decision.\u003c/p>\n\u003cp>The \u003ca href=\"#/verification/runs/2026-10-22-baselines\">baseline follow-up\u003c/a> passes\nthose selected scopes on revision \u003ccode>199759a\u003c/code>. Unsupported startup now returns\na saved, distinct failure with the diagnostic log path. The four-method page\nAPI remains unchanged. The foundation is ready for further skill work within\nthe documented limits. Physical target-machine and clean-machine acceptance\nremain the separate distribution gap; no such result is inferred from CI.\u003c/p>\n\u003cp>The final Windows handoff was opened as Fungi session\n\u003ccode>61a2170bba8d62aa0291aec1aad663cc\u003c/code>, using the new Mac portable package and an\narmed exact-conversation callback. Question 21 asks for the observed physical\nWindows result or an explicit deferral; it does not assume either. The ZIP is\n\u003ccode>dist/fungi-win32-x64-2026-10-22T09-50-20-630Z.zip\u003c/code>, with the full portable\nfolder and \u003ccode>VERIFY.md\u003c/code>. Its SHA-256 is\n\u003ccode>413a6526920e3c8d0fbae17d4a79d31fe50a9309472ee74901eb95cf465529c9\u003c/code>.\u003c/p>\n\u003cp>The callback was collected exactly once and the matching jstack transcript\nwas validated and finished. The \u003ca href=\"#/journal/2026-10-22-grill-b8ce5a10-7261-48c1-9d80-ee54e103ec5e\">submitted response\u003c/a>\nasks for instructions in the wiki: the user will pull on Windows and have the\nagent there execute them. It does not report a pass, failure or deferral.\nPhysical Windows verification therefore remains pending execution there.\u003c/p>\n\u003cp>The \u003ca href=\"#/verification/windows\">Windows agent handoff\u003c/a> is the entry point. It\nspecifies \u003ccode>foundation-hardening\u003c/code>, building from tracked source because\nportable packages are ignored by Git, the automated and visible checks, and\nhow to commit evidence back into this wiki. No new questionnaire is pending;\nthe next action belongs to the Windows agent after the pull. The original\nreceipt and response remain under\n\u003ccode>verification-output/platform-2026-10-22/windows-handoff/\u003c/code> on this Mac.\u003c/p>\n\u003ch2 id=\"physical-windows-handoff-on-2026-10-22-23\">Physical Windows handoff on 2026-10-22/23\u003c/h2>\n\u003cp>The user requested execution of the Windows guide and later asked the agent\nto continue. The \u003ca href=\"#/verification/runs/windows-2026-10-22-203907\">completed handoff record\u003c/a>\nidentifies revision \u003ccode>73eb9ad\u003c/code>, the locally built portable package, native\nWindows 11 Pro x64 build 26200 and the evidence. The agent operated synthetic\ncontrols through native mouse/keyboard input. Launch, acknowledged draft,\nclose/reopen with restored values, PNG submission/hash and separate\ncancellation all passed with an empty child PATH.\u003c/p>\n\u003cp>The overall run is \u003cstrong>Untested\u003c/strong>: 17 core and six Node tests passed, but the\nremaining core/asset tests and the full renderer fixture could not create\ntheir prerequisite symlinks under this account. Exact setup failures are\nretained; no elevation, security-policy change or weakened fixture was used.\nA checkout line-ending mismatch was resolved by applying the branch's\nexisting LF policy; no product source repair was needed. Node/npm were used\nfrom an isolated portable toolchain for building only.\u003c/p>\n\u003cp>This completes the visible desktop journey on that machine and records the\nremaining automated coverage gap. It does not certify a clean-machine or\ndownloaded-archive launch, Windows clipboard, WebGL, automatic agent return,\nsleep/wake or power-loss behavior. The earlier hosted and Mac reports retain\ntheir original scopes. Full jstack authoring integration remains deferred.\u003c/p>\n\u003ch2 id=\"command-installation-and-updates-on-2026-10-23\">Command installation and updates on 2026-10-23\u003c/h2>\n\u003cp>The user asks to target a script/command installation for the eventual release,\nwith as few dependencies as possible, and easy updates on every platform\ncomparable in convenience to updating a CLI through npm. These are release\nrequirements; Node/npm and Homebrew should remain optional.\u003c/p>\n\u003cp>This clarifies the earlier no-install wording: keep a complete portable archive\nwith no separately installed language runtime or renderer, and offer a command\nthat downloads and places it. The Linux decision still excludes installing OS\ndependencies, elevated sandbox helpers or changed security policy as part of\nthis path. A download script does not expand the supported environments.\u003c/p>\n\u003cp>The recommended design is an official shell bootstrap for macOS/Linux and a\nPowerShell bootstrap for Windows, each selecting one OS/CPU package. Shared\nupdate logic belongs in the Go CLI, with a proposed \u003ccode>fungi update\u003c/code> command.\nHomebrew/npm channels can wrap the same release artifacts later. Exact flags,\nhosting and installation layouts remain implementation decisions. No installer\nor updater existed at this planning checkpoint; this discussion records the release target.\u003c/p>\n\u003cp>Updates must preserve the working installation on failure and retain sessions,\ndrafts and artifacts. Stage and verify a release before activating it through\na stable command path. Retain rollback and versions still required by sessions;\nprune obsolete, unreferenced versions rather than accumulating every build.\nCurrent receipts embed absolute executable paths, and reopened sessions can\nreference package-owned assets. Resolve and test that compatibility before\nautomatic pruning implements this retention policy.\u003c/p>\n\u003cp>The \u003ca href=\"#/platforms~planned-command-installation-and-updates\">platform plan\u003c/a>\nrecords the proposed delivery flow and acceptance checks. Signing, release\npublication and clean-machine verification remain outstanding. Full jstack\nauthoring integration remains deferred.\u003c/p>\n\u003ch2 id=\"installation-implementation-on-2026-10-23\">Installation implementation on 2026-10-23\u003c/h2>\n\u003cp>The user invoked \u003ccode>work-until-grill\u003c/code> for the installation/update milestone and\nasked how to shrink the bundle. The \u003ca href=\"#/features/installation\">development implementation\u003c/a>\nadds versioned archives, script bootstraps, a stable command, Go-managed update,\nrollback and reference-aware cleanup. It preserves the four-method page API.\nThe \u003ca href=\"#/verification/runs/2026-10-23-distribution\">verification run\u003c/a> separates\nlocal observations from hosted and clean-machine acceptance.\u003c/p>\n\u003cp>Keep Electron and its languages, GPU fallback and license notices intact for\nnow. Local measurements show the runtime accounts for roughly 96–97% of the\nprevious packages. Release builds omit full wiki/evidence, separately authored\nskill bundles and the compiled demo helper; they strip Go debug information\nand use maximum standard-library archive compression. The follow-up updater\nshares byte-identical renderer files through filesystem hard links, falling\nback to verified copies where unavailable. This reduces retained update\nstorage without a runtime registry or changes for skill authors. Complete\narchives still download and stage before activation; neither the first\ndownload nor update traffic is reduced by file sharing.\u003c/p>\n\u003cp>No installer/update test authorizes public release publication or signing with\nan account identity. Exact GitHub release downloads, signing/notarization and\nphysical clean-machine acceptance remain release work. Full jstack authoring\nintegration remains deferred.\u003c/p>\n\u003cp>The installation implementation and records are pushed. The latest Windows\nand Linux CI scopes pass; the latest Mac job and one bounded retry obtained\nno hosted runner. The \u003ca href=\"#/verification/runs/2026-10-23-distribution\">verification record\u003c/a>\nretains earlier Mac passes and marks the latest matrix \u003cstrong>Untested\u003c/strong>. Both waits\nreturned through Fungi callbacks and were collected once each. No automatic\nretry or pending callback remains; the next verification action is the same\nMac job after hosted capacity recovers. This is an external verification\nblocker, not a user design decision or a completed release qualification.\u003c/p>\n","backlinks":["index","contract","platforms","proposal","features/delivery","features/index","features/installation","features/interfaces","research/bundled-renderers","research/delivery","research/index","research/renderer-health","verification/runs/2026-10-20-no-setup","verification/runs/2026-10-20-rich-grill","verification/runs/2026-10-20-skill-proof","verification/setup"]},{"id":"platforms","title":"Verified environments and portable distribution","section":"Overview","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-23\u003c/span>","updated":"2026-10-23","summary":"","source":"---\ntitle: Verified environments and portable distribution\nupdated: 2026-10-23\n---\n# Verified environments and portable distribution\n\nFungi ships as a portable directory containing the Go executable and pinned\nElectron runtime. Copy or extract the whole directory; no installer, Node,\nGo, npm or separate browser is required on a verified environment. It does\nnot install missing OS libraries or change sandbox policy.\n\nThe [Linux distribution decision](planning.md#linux-distribution-decision)\nkeeps this no-install model and limits support to explicitly verified\nenvironments. These are development-preview baselines, not a claim that every\nmachine with the same OS name works. OS libraries, security policy, desktop\nsession and graphics capabilities still matter. Signing/notarization and\nclean-machine distribution have not passed acceptance.\n\nFor the eventual release, command installation and updates are now requirements;\nsee the [proposed delivery flow](#planned-command-installation-and-updates).\nThe [development implementation](features/installation.md) now exists; its\n[verification record](verification/runs/2026-10-23-distribution.md) does not\nestablish public release availability or clean-machine acceptance.\n\n## Current evidence\n\n| Environment actually exercised | Verified scope | Limits |\n| --- | --- | --- |\n| Development Mac, macOS 27.0 arm64 (26A5368g) | Native input, paste, saved drafts, recovery, image artifacts, exact-conversation return; portable renderer with empty PATH | One short sleep/wake cycle; two-hour idle proof uses a native helper, not the Electron window |\n| Hosted macOS 26.6.2 arm64 | Core, actual Electron workflow and all 21 renderer checks, including WebGL | Hosted runner; not a clean consumer machine |\n| Hosted Windows Server 2025 x64, 10.0.26100 | Core, actual Electron workflow and all 21 renderer checks, including WebGL | Hosted runner; consumer desktop coverage is recorded separately below; clean-machine/archive acceptance remains unverified |\n| Physical Windows 11 Pro x64, 10.0.26200 | Source-built portable package with empty child PATH; agent-operated native input, acknowledged draft, close/reopen, comparison PNG/hash and cancellation | 17 core and six Node tests passed; symlink-dependent tests and all 21 renderer fixture checks unexecuted for lack of fixture privilege. No clean-machine/archive, clipboard or local WebGL claim |\n| Hosted Ubuntu 22.04.5 x64 with Xvfb | Core, actual Electron cancel/reopen/submit workflow, artifacts and 20 renderer checks | WebGL 2 context unavailable; no physical desktop/input or clean-machine claim |\n| Hosted Ubuntu 24.04.5 x64 with Xvfb | Core only; portable renderer fails before readiness under tested sandbox policy | **Unsupported for UI in this environment** |\n| Linux arm64 under OrbStack | Core tests in an isolated unprivileged container | Desktop renderer untested |\n\nThe [original hosted report](verification/runs/2026-10-22-hosted.md) preserves\nthe failed broad rendering matrix and exact runner images. Selecting a\nnarrower baseline does not change those observations. Hosted runners update;\neach later report identifies the image actually tested.\nThe [follow-up baseline run](verification/runs/2026-10-22-baselines.md) passes\nthe selected scopes below, including the unsupported-startup diagnostic test.\nThe [Windows desktop handoff](verification/runs/windows-2026-10-22-203907.md),\ncompleted on 2026-10-23, passes its visible desktop journey. Its aggregate is\n**Untested** because required symlink-dependent scenarios could not execute on\nthat account. This adds the observed Windows 11 workflow without extending\nthe hosted renderer capability results to this machine.\n\n## Skill authoring\n\nOrdinary HTML/CSS, forms, modules, Canvas 2D, SVG, workers, WebAssembly and\nlocal media use the same four-method bridge. Skills bring their libraries and\nassets. Feature-detect WebGL and codecs; provide an alternative or explain\nwhen an interface requires an unavailable feature. Fungi does not override\nChromium's GPU blocklist or switch off its sandbox to enable an interface.\n\nNo platform plugin or installation detector is needed in a skill. See\n[authoring](authoring.md) for the mechanical launch and response procedure.\n\n## Failed startup\n\nIf the renderer starts but exits before readiness, the CLI returns nonzero\nwith one saved `failed` result and `error.code: renderer_startup_failed`.\nIts message locates the session's `worker.log`; inspect that file for the\nactual runtime or OS error. Collection returns the same saved failure.\nThe code identifies a startup failure, not its cause: a missing display,\nlibrary or sandbox permission must be diagnosed from the log.\n\nOn the tested Ubuntu 24.04 runner, Chromium requests a root-owned sandbox\nhelper after unprivileged namespace creation is denied. That environment is\noutside the portable UI baseline. Record the failure; use a verified desktop\nenvironment. An OS dependency installer, privileged helper setup or changed\nhost policy is not part of the accepted distribution. Do not automatically retry with\n`--no-sandbox`.\n\n## What a green check means\n\nCI names its scope explicitly. macOS and Windows require WebGL and all\nworkflow checks. Ubuntu 22.04 requires the same workflow but records a null\nWebGL context as **unavailable**, never as a successful rendering check. If a\ncontext exists but renders incorrectly, the check fails. Ubuntu 24.04 tests\nthe core and the saved unsupported-startup error with sandbox diagnostics;\nits green job does not claim UI support. Unexpected successful startup there\nrequires review and a full rendering run before widening the baseline.\n\nThe [desktop recipe](verification/desktop.md) covers the remaining physical\narchive handoff. A successful cross-build alone does not add a supported\nenvironment.\n\n## Planned command installation and updates\n\nThe [2026-10-23 requirement](planning.md#command-installation-and-updates-on-2026-10-23)\nis a simple command to install and update Fungi on each supported platform,\nwithout requiring a language toolchain or package manager. The recommended\nfirst release uses complete prebuilt archives and a small bootstrap:\n\n| Platform | Proposed bootstrap | Subsequent update |\n| --- | --- | --- |\n| macOS | Shell script using curl or wget and OS archive tools | `fungi update` |\n| Supported Linux environments | Same shell bootstrap, selecting the matching OS/CPU archive | `fungi update` |\n| Windows | PowerShell script using built-in download, ZIP extraction and hashing | `fungi update` |\n\nThe commands below were subsequently implemented as a development preview;\nsee the [current contract](features/installation.md). The bootstrap should\nselect one OS/CPU package, download and verify it, place it in a user-owned\nlocation without administrator access, and make the stable `fungi` command\navailable. It should report any required shell restart or PATH adjustment.\nManual archive download remains available. No Go, Node, npm, Git, Homebrew or\nseparate browser should be needed to run the installed package.\n\nKeep release selection and update logic in Go rather than maintaining separate\nupdaters per platform. Updates should be explicit and repeatable, with useful\nexit codes and machine-readable results for agents. Start with full-package\ndownloads; delta updates and a background updater are unnecessary for this\ntarget. Optional Homebrew/npm distribution can use the same artifacts later.\nPackage-manager-owned installations should update through their manager rather\nthan be overwritten by Fungi's updater.\n\nStage and verify the complete next version separately, then activate it through\na stable command path. A failed download, verification or activation must leave\nthe last working installation usable. Support selecting a specific release and\nreturning to the previous version. Keep session state outside replaceable\ninstallation files. Running sessions must finish normally during an update,\nincluding on Windows where running binaries may prevent replacement.\n\nLegacy portable receipts/callbacks contain absolute executable paths, and\nreopening can refer to assets in an older package. The managed implementation\nnow issues stable command paths and retains package references; it does not\nmigrate legacy portable receipts or delete their packages. Retain the current\nrelease, a rollback release and any older versions still needed by sessions;\nprune only unreferenced versions.\nAvoid treating terminal sessions as automatically safe to discard: their saved\nreceipts and drafts can still be collected or reopened later.\n\nAcceptance must cover clean-machine installation, repeated install/update,\ninterrupted and invalid downloads, concurrent update attempts, activation\nfailure, rollback, and updates while a session is open or awaiting collection.\nVerify old callback commands, draft reopening and artifact access after update\nand cleanup on each supported platform. Signing/notarization and authentic\nrelease publication remain part of release readiness. No such result is claimed\nby the current portable-package tests.\n\nPlatform references: Windows PowerShell provides\n[HTTP downloads](https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.utility/invoke-webrequest?view=powershell-5.1),\n[ZIP extraction](https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.archive/expand-archive?view=powershell-5.1)\nand [SHA-256 hashing](https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.utility/get-filehash?view=powershell-5.1).\nUse `-UseBasicParsing` for downloads on PowerShell 5.1. An optional npm channel\nadds the [Node/npm prerequisite](https://docs.npmjs.com/downloading-and-installing-node-js-and-npm/),\nso it should not be the only installation path.\n","toc":[{"id":"current-evidence","title":"Current evidence","depth":2},{"id":"skill-authoring","title":"Skill authoring","depth":2},{"id":"failed-startup","title":"Failed startup","depth":2},{"id":"what-a-green-check-means","title":"What a green check means","depth":2},{"id":"planned-command-installation-and-updates","title":"Planned command installation and updates","depth":2}],"titleAnchor":"verified-environments-and-portable-distribution","links":["planning","platforms","features/installation","verification/runs/2026-10-23-distribution","verification/runs/2026-10-22-hosted","verification/runs/2026-10-22-baselines","verification/runs/windows-2026-10-22-203907" n is denied. That environment is\noutside the portable UI baseline. Record the failure; use a verified desktop\nenvironment. An OS dependency installer, privileged helper setup or changed\nhost policy is not part of the accepted distribution. Do not automatically retry with\n\u003ccode>--no-sandbox\u003c/code>.\u003c/p>\n\u003ch2 id=\"what-a-green-check-means\">What a green check means\u003c/h2>\n\u003cp>CI names its scope explicitly. macOS and Windows require WebGL and all\nworkflow checks. Ubuntu 22.04 requires the same workflow but records a null\nWebGL context as \u003cstrong>unavailable\u003c/strong>, never as a successful rendering check. If a\ncontext exists but renders incorrectly, the check fails. Ubuntu 24.04 tests\nthe core and the saved unsupported-startup error with sandbox diagnostics;\nits green job does not claim UI support. Unexpected successful startup there\nrequires review and a full rendering run before widening the baseline.\u003c/p>\n\u003cp>The \u003ca href=\"#/verification/desktop\">desktop recipe\u003c/a> covers the remaining physical\narchive handoff. A successful cross-build alone does not add a supported\nenvironment.\u003c/p>\n\u003ch2 id=\"planned-command-installation-and-updates\">Planned command installation and updates\u003c/h2>\n\u003cp>The \u003ca href=\"#/planning~command-installation-and-updates-on-2026-10-23\">2026-10-23 requirement\u003c/a>\nis a simple command to install and update Fungi on each supported platform,\nwithout requiring a language toolchain or package manager. The recommended\nfirst release uses complete prebuilt archives and a small bootstrap:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Platform\u003c/th>\n\u003cth>Proposed bootstrap\u003c/th>\n\u003cth>Subsequent update\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>macOS\u003c/td>\n\u003ctd>Shell script using curl or wget and OS archive tools\u003c/td>\n\u003ctd>\u003ccode>fungi update\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Supported Linux environments\u003c/td>\n\u003ctd>Same shell bootstrap, selecting the matching OS/CPU archive\u003c/td>\n\u003ctd>\u003ccode>fungi update\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Windows\u003c/td>\n\u003ctd>PowerShell script using built-in download, ZIP extraction and hashing\u003c/td>\n\u003ctd>\u003ccode>fungi update\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The commands below were subsequently implemented as a development preview;\nsee the \u003ca href=\"#/features/installation\">current contract\u003c/a>. The bootstrap should\nselect one OS/CPU package, download and verify it, place it in a user-owned\nlocation without administrator access, and make the stable \u003ccode>fungi\u003c/code> command\navailable. It should report any required shell restart or PATH adjustment.\nManual archive download remains available. No Go, Node, npm, Git, Homebrew or\nseparate browser should be needed to run the installed package.\u003c/p>\n\u003cp>Keep release selection and update logic in Go rather than maintaining separate\nupdaters per platform. Updates should be explicit and repeatable, with useful\nexit codes and machine-readable results for agents. Start with full-package\ndownloads; delta updates and a background updater are unnecessary for this\ntarget. Optional Homebrew/npm distribution can use the same artifacts later.\nPackage-manager-owned installations should update through their manager rather\nthan be overwritten by Fungi's updater.\u003c/p>\n\u003cp>Stage and verify the complete next version separately, then activate it through\na stable command path. A failed download, verification or activation must leave\nthe last working installation usable. Support selecting a specific release and\nreturning to the previous version. Keep session state outside replaceable\ninstallation files. Running sessions must finish normally during an update,\nincluding on Windows where running binaries may prevent replacement.\u003c/p>\n\u003cp>Legacy portable receipts/callbacks contain absolute executable paths, and\nreopening can refer to assets in an older package. The managed implementation\nnow issues stable command paths and retains package references; it does not\nmigrate legacy portable receipts or delete their packages. Retain the current\nrelease, a rollback release and any older versions still needed by sessions;\nprune only unreferenced versions.\nAvoid treating terminal sessions as automatically safe to discard: their saved\nreceipts and drafts can still be collected or reopened later.\u003c/p>\n\u003cp>Acceptance must cover clean-machine installation, repeated install/update,\ninterrupted and invalid downloads, concurrent update attempts, activation\nfailure, rollback, and updates while a session is open or awaiting collection.\nVerify old callback commands, draft reopening and artifact access after update\nand cleanup on each supported platform. Signing/notarization and authentic\nrelease publication remain part of release readiness. No such result is claimed\nby the current portable-package tests.\u003c/p>\n\u003cp>Platform references: Windows PowerShell provides\n\u003ca href=\"https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.utility/invoke-webrequest?view=powershell-5.1\" rel=\"noreferrer\">HTTP downloads\u003c/a>,\n\u003ca href=\"https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.archive/expand-archive?view=powershell-5.1\" rel=\"noreferrer\">ZIP extraction\u003c/a>\nand \u003ca href=\"https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.utility/get-filehash?view=powershell-5.1\" rel=\"noreferrer\">SHA-256 hashing\u003c/a>.\nUse \u003ccode>-UseBasicParsing\u003c/code> for downloads on PowerShell 5.1. An optional npm channel\nadds the \u003ca href=\"https://docs.npmjs.com/downloading-and-installing-node-js-and-npm/\" rel=\"noreferrer\">Node/npm prerequisite\u003c/a>,\nso it should not be the only installation path.\u003c/p>\n","backlinks":["index","authoring","planning","features/index","features/interfaces","verification/runs/2026-10-22-baselines","verification/windows"]},{"id":"proposal","title":"Proposed small authoring interface","section":"Overview","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-20\u003c/span>","updated":"2026-10-20","summary":"","source":"---\ntitle: Proposed small authoring interface\nupdated: 2026-10-20\n---\n# Proposed small authoring interface\n\nThis earlier illustrative design is retained as discussion history. For the implemented commands and JavaScript methods, use the [prototype contract](contract.md) and CLI discovery. The first interview accepted both HTML and JSON authoring in the first release, bundled rendering, adjacent optional capabilities, and manual “done” fallback when automatic delivery cannot be established. The interface details below remain proposals.\n\nThe [implementation contract draft](contract.md) now defines the proposed command, result, helper and recovery semantics. This page keeps the short authoring examples and milestone rationale; use the contract for precise behavior.\n\nThe user has selected Electron + Go: Go owns the session engine and CLI; a small Electron companion owns the native window and web renderer. Packaging is a portable folder/archive with one fungi CLI entry point and bundled runtime files, following the user's instruction to choose the simplest route. The [third interview](planning.md#accepted-first-milestone-scope) settles the first milestone's scope. Exact APIs and internal implementation sequence remain proposals.\n\n## Author a file, then open it\n\nA basic skill should need only a file like this:\n\n```html\n\u003cform id=\"review\">\n  \u003clabel>Animation duration\n    \u003cinput name=\"duration\" type=\"range\" min=\"100\" max=\"1000\" step=\"10\">\n  \u003c/label>\n  \u003clabel>Notes \u003ctextarea name=\"notes\">\u003c/textarea>\u003c/label>\n  \u003cbutton>Submit\u003c/button>\n\u003c/form>\n\u003cscript type=\"module\">\n  const { input } = await fungi.ready();\n  const form = document.querySelector('#review');\n  form.elements.duration.value = input.duration ?? 300;\n  form.onsubmit = async event => {\n    event.preventDefault();\n    await fungi.submit({\n      duration: Number(form.elements.duration.value),\n      notes: form.elements.notes.value\n    });\n  };\n\u003c/script>\n```\n\nThe renderer supplies the small bridge. An illustrative invocation is:\n\n```sh\nfungi open ./review.html --input ./input.json\n```\n\nThe agent should get either a supported automatic-delivery acknowledgement with an exact session identifier, a final result through a host-managed pending call, or a notice that the UI is open and the user should say “done” after submitting. It must not get a process ID accompanied by instructions to keep polling. The same exact-session collection path works for automatic notices and manual continuation.\n\nA reference component library can shorten common forms later. The plain HTML path remains valid so novel interfaces never wait for fungi to invent another widget type.\n\n## JSON authoring in the same first release\n\nSupport a small declarative form through the same renderer and result bridge. An illustrative file is:\n\n```json\n{\n  \"title\": \"Animation feedback\",\n  \"fields\": [\n    { \"type\": \"range\", \"name\": \"duration\", \"label\": \"Duration\", \"min\": 100, \"max\": 1000, \"value\": 300 },\n    { \"type\": \"text\", \"name\": \"notes\", \"label\": \"Notes\" }\n  ]\n}\n```\n\nThe corresponding invocation could be `fungi open ./review.json`. The renderer turns this into components, collects named values, and submits the same JSON result a hand-authored page would submit. Common fields should not require JavaScript from the skill author. The accepted initial scope is flat built-in fields. Nested layouts and custom JSON component registration are deferred for the user's larger JSON-authoring discussion; do not design that framework into this milestone.\n\nEqual first-release support means both paths are documented, usable, and exercised. It does not require a JSON representation for every possible JavaScript program. Custom components can own their local behavior; the engine should not gain an expression evaluator, workflow DSL, or separate catalog-specific lifecycle.\n\n## A small bridge\n\n| Capability | Meaning |\n| --- | --- |\n| `ready()` | Read launch input, restored draft if present, and available renderer capabilities |\n| `submit(data, attachments?)` | Commit JSON and optional blobs; resolve only after fungi has saved them |\n| `cancel()` | Explicitly finish without submitted data |\n| `saveDraft(data)` | Optional recovery support for custom interfaces |\n\nDo not expose an arbitrary shell, filesystem, or harness API to page content. A canvas can submit a PNG blob and its editable scene JSON together; fungi supplies artifact references in the returned result. A slider can animate a local preview continuously while the model remains idle.\n\nThe native window's close action is handled by the renderer/engine, not by requiring every skill to implement fragile browser-unload behavior. Accepted behavior: report a distinct `closed` outcome, preserve the latest saved draft, and allow explicit reopen. Close must never imply submission. Draft preservation is limited to data already saved; custom pages opt into `saveDraft`.\n\n## Growing an interface\n\nA reusable capability may simply be an `index.html` and local assets. No manifest is needed for the simplest file. Optional metadata can add a name, input schema, output schema, required capabilities, and documentation when discovery makes that useful.\n\nAuthors may use plain HTML, Web Components, React, Vue, Svelte, or a canvas library. Prebuilt JavaScript and CSS can ship with a skill or renderer. A library's build-time npm dependency does not require npm on the end user's machine. Ad hoc interfaces should work without a build step.\n\nActual framework support depends on the chosen bundled engine. Do not advertise a browser library as supported merely because an engine parses HTML and executes JavaScript.\n\nExplicit file paths should always work. Reusable capabilities can live with the skill or in an optional folder near the fungi executable. Named discovery may use a short descriptor when needed; no registry server, installation command, or dependency solver is required. The exact folder name and lookup rules remain implementation choices.\n\nUse composition at the right level: components inside one web renderer can share values and events; a native screenshot panel and a web form compose as workflow steps. Arbitrary third-party native widgets cannot be promised to share one layout merely because they both use fungi.\n\n## Native escape hatch\n\nA native extension should be an ordinary executable: accept input, display its own interface, emit a result. It can be written in any language. The advanced process contract should not be required for someone making a basic HTML form.\n\nPackage the Go core and Electron renderer together in a portable directory. A native capability may be a companion executable; basic HTML/JSON authors still need no compiler or runtime installation. Keep renderer launch behind the same small process boundary instead of requiring a Go binding for every engine. No self-extraction mechanism is required for the accepted distribution.\n\n## First proof\n\n**Outcome:** an agent opens a skill-authored interface, the human takes as long as needed, and the exact calling conversation receives a saved response without repeated model tool calls. The accepted platform scope is macOS first. The accepted harness targets are **Codex, Claude Code, OpenCode, Grok, Kimi and Pi**. A successful Codex test alone does not establish completion or universal compatibility.\n\nInspect and exercise the simplest supported return route in each harness early. A host-managed background completion, exact-session callback, or one pending call can satisfy the waiting requirement when its actual behavior is verified. A process ID with instructions to poll cannot. Keep any route that needs extra setup or cannot be verified visible as a gap; the manual “done” fallback remains usable but is not an automatic-return pass.\n\n1. **Make the small contract concrete.** Use two equivalent examples, plain HTML and a JSON form, to settle launch input, the page bridge, result/artifact shape, and exact-session collection. The result distinguishes submitted, cancelled, closed and failed outcomes. Keep caller identity and delivery configuration outside page-controlled data. An `open` acknowledgement must identify either the supported automatic route or the accepted manual “done” fallback. Help and machine-readable command output must make that distinction discoverable.\n2. **Build one complete round trip.** Go starts the session and Electron host; the host renders text, one field, one slider, and submit/cancel, with a pasted/selected image attachment. Both HTML and flat JSON examples use the same submission path. Save the response before acknowledging submission or sending a completion notice. Include a tiny native helper accepting JSON and returning JSON/artifact data through the same engine contract. Implement and verify the return routes for all six named harnesses; use native host capabilities where they suffice. Preserve manual exact-session collection when automatic delivery is unavailable. Do not introduce an adapter registry or broad component system for this milestone.\n3. **Verify waiting, failure and packaging.** Record the actual tool/event sequence during a human wait, measure idle resources, then submit and verify correct routing. Exercise two simultaneous sessions, duplicate submit, close/cancel, renderer crash, interrupted delivery and explicit recovery after process exit. Package a portable build and test offline launch with no separately installed Node/npm or browser runtime. Measure archive size and startup. Windows/Linux clean-environment packaging checks follow before claiming cross-platform delivery.\n\nUse a deterministic fake renderer for core failure/routing tests so session correctness can be checked without opening windows. Use the real Electron UI and real harness for the user-visible return path; mocks cannot establish automatic resumption.\n\nThe milestone is complete when both authoring paths and the native helper return the expected JSON and artifact references, submitted results survive the exercised failures, outcomes remain distinct, sessions never cross, and each named harness has a verified automatic return path with an observed idle interval producing no recurring model checks. Record the interval, harness version and environment; a short test is not evidence of unlimited-duration reliability. Missing callbacks must leave a collectable result and the documented “done” fallback, while remaining an explicit automatic-delivery gap.\n\nThe first useful deliverable is this reliable round trip with tiny HTML, flat JSON and native-helper examples. Custom UI can use ordinary local HTML/assets without changing Go. Drawing tools, native capture UI, rich JSON composition, custom JSON component registration and external live updates are deferred. Broader UI libraries, external catalog protocols, MCP Apps hosting, remote desktops, and WASM can follow when a workflow needs them. The scope is accepted; implementation has not begun. [Research rationale](research/index.md)\n","toc":[{"id":"author-a-file-then-open-it","title":"Author a file, then open it","depth":2},{"id":"json-authoring-in-the-same-first-release","title":"JSON authoring in the same first release","depth":2},{"id":"a-small-bridge","title":"A small bridge","depth":2},{"id":"growing-an-interface","title":"Growing an interface","depth":2},{"id":"native-escape-hatch","title":"Native escape hatch","de
