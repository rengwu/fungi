nThe packager's `runtimeVerified: false` means packaging alone does not certify\na target; the runtime observations are recorded separately here.\n\nConsumer Windows input/clipboard, clean-machine security prompts, public\nsigning/notarization, arbitrary Linux desktops, every GPU/codec/library and\npower-loss durability remain unverified. Existing harness and AFK evidence\nremains version- and route-specific; this run does not expand it. The\nimplementing agent performed verification; no independent review is claimed.\nFull Fungi-native jstack authoring integration remains deferred.\n","toc":[{"id":"build-and-scope","title":"Build and scope","depth":2},{"id":"exercised-scenarios","title":"Exercised scenarios","depth":2},{"id":"portable-handoff-and-remaining-limits","title":"Portable handoff and remaining limits","depth":2}],"titleAnchor":"verified-platform-baselines-and-startup-diagnostics","links":["features/sessions","features/interfaces","verification/runs/2026-10-22-hosted","journal/2026-10-22-grill-0c10be35-a07a-4a8d-8d5d-39fda5b2e1bc","platforms"],"attachments":[{"path":"evidence/2026-10-22-baselines/ci.json","sha256":"c75d48cb6030cac3d8df8db9ccddecb6ac468c5fe559b28312ff0b3d3b5e73ca"},{"path":"evidence/2026-10-22-baselines/observations.json","sha256":"08fc6ba415119bf41dbf1b135acc0ce6c2cff3796c30e696944ef469749fcc9f"},{"path":"evidence/2026-10-22-baselines/macos-renderer.json","sha256":"72c613c474bcd69d22c81db5659f7d871111f3bddbc7b0237afc0a5d20ad762d"},{"path":"evidence/2026-10-22-baselines/windows-renderer.json","sha256":"4c3d3266a1500ffa146d9377014f4bbc8a9253c97d3d4209518f57e9f1f5364f"},{"path":"evidence/2026-10-22-baselines/ubuntu22-renderer.json","sha256":"62a469a719c2b1031b9830c398225bfb3fc36a58629398e44f326aa44758b52c"},{"path":"evidence/2026-10-22-baselines/ubuntu24-renderer.json","sha256":"dbc269d69a6bbe283544b5d6ef5c61e0d46b93d085b23f86915549fa49593c67"},{"path":"evidence/2026-10-22-baselines/mac-package-renderer.json","sha256":"f444b26629d120fad1cc9b3eb65f112e029ae8f82e205b86b73c11f3cc7a44b7"},{"path":"evidence/2026-10-22-baselines/windows.log","sha256":"53d10f6f06d1c1e84e4070758f76277551c011ef2f576fa15f74cd0f7ed5af4f"},{"path":"evidence/2026-10-22-baselines/macos.log","sha256":"e112a12723c1981e6c8658095063f64467c795ac275410390a88320a12df4ce4"},{"path":"evidence/2026-10-22-baselines/ubuntu22.log","sha256":"0ca947b32a287a2c159b3593c9feb684f9c25638e5855d471dee318bbf17b977"},{"path":"evidence/2026-10-22-baselines/ubuntu24.log","sha256":"8a5b6fb3b4e0404dd652803b82de0d93b3beb8f9f76925a5f602e61938cae2a9"},{"path":"evidence/2026-10-22-baselines/packages.json","sha256":"545d7e0adb9f6cd3383a2fd623b3e2f224bb046c0bcdc23e0516cbff59ea1583"}],"html":"\u003cp>\u003cstrong>Passed for the selected scope:\u003c/strong> the user's accepted no-install platform\nboundary, a saved and diagnosable renderer startup failure, and regression\nchecks of the supported workflows. This covers \u003ca href=\"#/features/sessions\">sessions\u003c/a>\nand \u003ca href=\"#/features/interfaces\">interfaces\u003c/a>. The earlier\n\u003ca href=\"#/verification/runs/2026-10-22-hosted\">broad hosted run\u003c/a> remains \u003cstrong>Failed\u003c/strong>; Ubuntu 24.04 has\nnot gained UI support and Ubuntu 22.04's virtual display still lacks WebGL.\u003c/p>\n\u003ch2 id=\"build-and-scope\">Build and scope\u003c/h2>\n\u003cp>Product revision: \u003ccode>199759a5f0341d8b97b8683385a1d4d06080b8ef\u003c/code>, Electron\n44.9.0, Go 1.26.4. \u003ca href=\"https://github.com/rengwu/fungi/actions/runs/39758430600\" rel=\"noreferrer\">The CI run\u003c/a>\nand \u003ca href=\"evidence/2026-10-22-baselines/ci.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: c75d48cb6030cac3d8df8db9ccddecb6ac468c5fe559b28312ff0b3d3b5e73ca\">saved job record\u003c/a> identify\nthe exact source. \u003ca href=\"evidence/2026-10-22-baselines/observations.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 08fc6ba415119bf41dbf1b135acc0ce6c2cff3796c30e696944ef469749fcc9f\">Observed results\u003c/a>\ninclude the actual runner OS versions; logs retain image versions and checks.\u003c/p>\n\u003cp>The \u003ca href=\"#/journal/2026-10-22-grill-0c10be35-a07a-4a8d-8d5d-39fda5b2e1bc\">accepted answer\u003c/a>\nkeeps portable distribution on explicitly verified environments. The\n\u003ca href=\"#/platforms\">platform record\u003c/a> makes those limits discoverable. It\ndoes not prescribe an installer, elevated helper, changed host policy or\ndisabled sandbox. No four-method bridge or native-helper protocol changed.\u003c/p>\n\u003cp>The code now identifies a bundled renderer that exits before readiness as\n\u003ccode>renderer_startup_failed\u003c/code>, retaining the failure in the normal immutable\nresult and pointing to its actual \u003ccode>worker.log\u003c/code>. It does not guess the cause\nfrom an exit signal or parse arbitrary log text into remediation commands.\u003c/p>\n\u003ch2 id=\"exercised-scenarios\">Exercised scenarios\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Observation\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Local core and Node regression\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>18 root Go tests with race detection, Go vet and seven Node tests; the new fixture starts the real CLI with a deliberately failing renderer executable, reads its stderr log and collects the identical saved failure\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Existing helper exit behavior\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Native helper retains \u003ccode>helper_exited\u003c/code>; an already-written valid submission survives a later nonzero helper exit\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hosted core on all four targets\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Each target passes Go vet, 18 root tests, seven Node tests and wiki validation; race detector on Unix, ordinary tests on Windows\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hosted macOS 26.6.2 arm64\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-22-baselines/macos-renderer.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 72c613c474bcd69d22c81db5659f7d871111f3bddbc7b0237afc0a5d20ad762d\">All 21 renderer checks\u003c/a>, cancel/reopen/submit, restored Blob and independently checked PNG SHA-256\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hosted Windows Server 2025 x64, 10.0.26100\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-22-baselines/windows-renderer.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 4c3d3266a1500ffa146d9377014f4bbc8a9253c97d3d4209518f57e9f1f5364f\">All 21 renderer checks\u003c/a> and the same complete workflow\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hosted Ubuntu 22.04.5 x64 with Xvfb\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-22-baselines/ubuntu22-renderer.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 62a469a719c2b1031b9830c398225bfb3fc36a58629398e44f326aa44758b52c\">20 required checks\u003c/a> and the complete workflow; WebGL context explicitly unavailable and excluded from this selected baseline\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Unsupported Ubuntu 24.04.5 startup error\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-22-baselines/ubuntu24-renderer.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: dbc269d69a6bbe283544b5d6ef5c61e0d46b93d085b23f86915549fa49593c67\">Nonzero CLI result\u003c/a> is saved as \u003ccode>renderer_startup_failed\u003c/code>; its indicated log contains Chromium's actual sandbox abort; no UI readiness or submission is claimed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Fresh portable macOS build, macOS 27.0 arm64\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-22-baselines/mac-package-renderer.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: f444b26629d120fad1cc9b3eb65f112e029ae8f82e205b86b73c11f3cc7a44b7\">All 21 checks\u003c/a>, full workflow and PNG hash with an empty child PATH\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The hosted diagnostic logs are \u003ca href=\"evidence/2026-10-22-baselines/windows.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 53d10f6f06d1c1e84e4070758f76277551c011ef2f576fa15f74cd0f7ed5af4f\">Windows\u003c/a>,\n\u003ca href=\"evidence/2026-10-22-baselines/macos.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e112a12723c1981e6c8658095063f64467c795ac275410390a88320a12df4ce4\">macOS\u003c/a>,\n\u003ca href=\"evidence/2026-10-22-baselines/ubuntu22.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 0ca947b32a287a2c159b3593c9feb684f9c25638e5855d471dee318bbf17b977\">Ubuntu 22.04\u003c/a> and\n\u003ca href=\"evidence/2026-10-22-baselines/ubuntu24.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 8a5b6fb3b4e0404dd652803b82de0d93b3beb8f9f76925a5f602e61938cae2a9\">Ubuntu 24.04\u003c/a>.\u003c/p>\n\u003cp>The renderer driver retains each actual capability outcome. Its default\nrequires WebGL. Only the explicit Ubuntu 22.04 scope permits a null context;\nan available context with incorrect pixels still fails. Ubuntu 24.04's\nseparate negative test requires the saved startup error and sandbox log. If\nthat renderer starts successfully in a future image, the check fails with an\ninstruction to review the platform matrix and run the complete fixture.\u003c/p>\n\u003cp>All actual renderer launches use an empty child executable search path and\nno inherited Codex thread ID. Linux uses the runner's existing Xvfb. No\nmachine configuration, renderer sandbox or GPU blocklist was bypassed. These\nare disposable fixtures, not agent answers in a human questionnaire.\u003c/p>\n\u003ch2 id=\"portable-handoff-and-remaining-limits\">Portable handoff and remaining limits\u003c/h2>\n\u003cp>\u003ca href=\"evidence/2026-10-22-baselines/packages.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 545d7e0adb9f6cd3383a2fd623b3e2f224bb046c0bcdc23e0516cbff59ea1583\">Build metadata and source hashes\u003c/a>\nidentify the fresh macOS arm64, Windows x64 and Linux x64 portable directories\ncreated at \u003ccode>2026-10-22T09-50-20-*\u003c/code>. The Mac package ran locally. Hosted Windows\nand Linux used matching source builds; their cross-packaged archives still\nneed physical target-machine acceptance using the bundled \u003ccode>VERIFY.md\u003c/code>.\nThe packager's \u003ccode>runtimeVerified: false\u003c/code> means packaging alone does not certify\na target; the runtime observations are recorded separately here.\u003c/p>\n\u003cp>Consumer Windows input/clipboard, clean-machine security prompts, public\nsigning/notarization, arbitrary Linux desktops, every GPU/codec/library and\npower-loss durability remain unverified. Existing harness and AFK evidence\nremains version- and route-specific; this run does not expand it. The\nimplementing agent performed verification; no independent review is claimed.\nFull Fungi-native jstack authoring integration remains deferred.\u003c/p>\n","backlinks":["index","planning","platforms","features/interfaces","features/sessions","verification/windows"]},{"id":"verification/runs/2026-10-22-hosted","title":"Hosted platform verification","section":"Verification","order":0,"metadata":{"result":"Failed"},"metadataHtml":"\u003cspan>Result: Failed\u003c/span> \u003cspan>Last updated: 2026-10-22\u003c/span>","updated":"2026-10-22","summary":"","source":"---\ntitle: Hosted platform verification\nupdated: 2026-10-22\nresult: Failed\n---\n# Hosted platform verification\n\nThis follows the [local foundation run](2026-10-22-platform.md) and exercises\n[sessions](../../features/sessions.md) and [interfaces](../../features/interfaces.md)\non hosted desktop operating systems. The aggregate is **Failed**: the portable\nrenderer did not start on every target, and a virtual display lacked WebGL.\nSuccessful core tests do not override\nthat result or establish clean-machine distribution support.\n\n## Builds and observations\n\nThe first [core matrix](../../evidence/2026-10-22-hosted/first-core.json) ran\n`ea59e6c`. Go vet, the 17 root tests, and seven Node tests passed on all three\nsystems. Unix used the race detector; Windows did not. The Windows wiki check\nfailed because checkout line endings changed generated content and evidence\nhashes. A repository `.gitattributes` now preserves LF text bytes. The next\nmatrix passed the wiki check on Windows too.\n\nThe [renderer baseline](../../evidence/2026-10-22-hosted/baseline.json) ran\n`60cf3e4`; `1aaa8dc` repeated it with worker diagnostics. The runner built the\nCLI and used the pinned Electron 44.9.0 runtime. The test driver gave Fungi an\nempty executable search path and removed the originating Codex thread ID.\nLinux used Xvfb. No renderer sandbox or host security policy was disabled.\n\nThe final [CI run](../../evidence/2026-10-22-hosted/final-ci.json) tests\n`df4da9f` after the repairs below. [Runner versions](../../evidence/2026-10-22-hosted/platforms.json)\nidentify the actual images; these are hosted environments, not fresh consumer\nmachines. Each final target passed Go vet, 17 root tests, seven Node tests and\nthe wiki check.\n\nThe final source was also rebuilt into portable macOS arm64, Windows x64 and\nLinux x64 directories at `2026-10-22T09-13-00-267Z`.\n[Package metadata and source hashes](../../evidence/2026-10-22-hosted/packages.json)\nidentify them. The rebuilt macOS package independently passed the same\n[21-check renderer fixture](../../evidence/2026-10-22-hosted/mac-package-renderer.json)\nwith an empty child PATH. Hosted Windows execution used the corresponding\nsource build, not this cross-packaged archive; a physical archive handoff\nremains separate acceptance work.\n\n| Final observed system | Core and Node checks | Actual renderer fixture |\n| --- | --- | --- |\n| macOS 26.6.2 arm64 (25G83) | Passed | [Passed](../../evidence/2026-10-22-hosted/final-macos-latest.log): all 21 checks, cancel/reopen/submit and PNG hash |\n| Windows Server 2025 x64 (10.0.26100) | Passed | [Passed](../../evidence/2026-10-22-hosted/final-windows-latest.log): all 21 checks and the same result/artifact workflow |\n| Ubuntu 22.04.5 x64 with Xvfb | Passed | [Failed](../../evidence/2026-10-22-hosted/final-ubuntu-22.04.log): 20 checks pass; WebGL context unavailable on the virtual display |\n| Ubuntu 24.04.5 x64 with Xvfb | Passed | [Failed](../../evidence/2026-10-22-hosted/final-ubuntu-24.04.log): Chromium sandbox startup abort before readiness |\n\nThe [startup logs](../../evidence/2026-10-22-hosted/startup-failures.log)\npreserve the actual failures. This uses the same rendering fixture as the\nlocal run, not automated input in a person's questionnaire. No physical\nclipboard, accessibility, IME, window-manager or consumer Windows desktop\njourney is implied by a hosted test.\n\n## Diagnosis and repairs\n\nElectron's [Windows initialization](https://github.com/electron/electron/blob/v44.9.0/lib/common/init.ts)\nreplaces `process.stdin` with an EOF-only stream. Its\n[Windows entry point](https://github.com/electron/electron/blob/v44.9.0/shell/app/electron_main_win.cc)\ncan also attach standard streams to a console. Fungi's repair reads the\ninherited input descriptor directly on Windows and sets Electron's documented\n[`ELECTRON_NO_ATTACH_CONSOLE`](https://www.electronjs.org/docs/latest/api/environment-variables#electron_no_attach_console-windows)\nfor the renderer child. Native helpers keep their normal pipe contract. This\nis an internal transport adjustment, with no new skill API or dependency.\nThe subsequent Windows run still encountered an empty NDJSON record before\nreadiness. The scanner now ignores blank lines while continuing to reject\nmalformed nonempty records; its regression covers blank/whitespace/CRLF lines\naround a valid message. The final Windows run passes the actual round trip.\n\nThe [first repair attempt](../../evidence/2026-10-22-hosted/pipe-repair-attempt.json)\nat `af7c52c` hit a test timing issue before reaching Windows rendering: a\nmalformed-helper test completed in 1.03 seconds but had a one-second assertion.\nThe [log](../../evidence/2026-10-22-hosted/windows-timing-failure.log) retains it.\nThe fixture now deliberately stays alive for 30 seconds while the test allows\nfive seconds for owner termination. This tolerates hosted process startup\nwhile still failing if the owner waits for the broken helper's natural exit.\n\nThat attempt also exercised Ubuntu 22.04. The\n[actual renderer log](../../evidence/2026-10-22-hosted/ubuntu22-initial.log)\nshows 20 checks passing, including cancel/reopen/submit and the PNG hash.\nWebGL failed because Chromium blocklisted it on the virtual display. This\nis not a complete rendering pass; hardware-dependent APIs must be feature\ndetected by authored interfaces. No blocklist override or software-rendering\nflag was added to make the check pass.\n\nUbuntu's fatal log requests a root-owned, mode-4755 sandbox helper. That is\nincompatible with simply unpacking an ordinary user-owned portable archive\non this runner. Ubuntu documents\n[AppArmor restrictions on unprivileged user namespaces](https://documentation.ubuntu.com/security/security-features/privilege-restriction/apparmor/),\nand its [security matrix](https://documentation.ubuntu.com/security/security-features/security-features-tables/)\ndistinguishes 22.04 from 24.04 and later. Chromium's\n[sandbox documentation](https://chromium.googlesource.com/chromium/src/+/HEAD/sandbox/linux/README.md)\ndescribes the namespace and privileged-helper mechanisms. These sources\nexplain the platform constraint. The final Ubuntu 24.04 diagnostic records\n`apparmor_restrict_unprivileged_userns=1` and a denied UID-map write in a\ndisposable namespace probe. Ubuntu 22.04 starts the renderer without host\nchanges; its remaining WebGL failure is recorded separately.\n\n## Remaining acceptance boundary\n\nThe current package cannot be advertised as a no-setup renderer on every\nLinux desktop. Choosing a narrower supported baseline or a Linux-specific\ninstallation path changes the distribution promise and needs user judgment.\nNo installer, global AppArmor change, elevated sandbox-helper installation\nor sandbox bypass has been added.\n\nThe [desktop recipe](../desktop.md) remains available for physical target\nchecks. Signing/notarization, clean-machine launch, arbitrary hardware,\nlong-duration renderer waits and universal harness resumption are not proven.\nThe implementing agent conducted these checks; no independent review is claimed.\n","toc":[{"id":"builds-and-observations","title":"Builds and observations","depth":2},{"id":"diagnosis-and-repairs","title":"Diagnosis and repairs","depth":2},{"id":"remaining-acceptance-boundary","title":"Remaining acceptance boundary","depth":2}],"titleAnchor":"hosted-platform-verification","links":["verification/runs/2026-10-22-platform","features/sessions","features/interfaces","verification/desktop"],"attachments":[{"path":"evidence/2026-10-22-hosted/first-core.json","sha256":"621ec4c171cc302d96d2c498d52ce11f6978fd1beda7464e32a7f07d80458802"},{"path":"evidence/2026-10-22-hosted/baseline.json","sha256":"610ec7b60378667a93fd3d6612c0787be013d4a2bf0877c717b718ca177b8373"},{"path":"evidence/2026-10-22-hosted/final-ci.json","sha256":"b3bf0ef2a99f12d49126aa93153ca8cbb89628eb5e72aea7559bdf0bea837b5c"},{"path":"evidence/2026-10-22-hosted/platforms.json","sha256":"5f9cc3bfbae1144db868025d42da9f7f682711ed0de125d4e6618830192e9c59"},{"path":"evidence/2026-10-22-hosted/packages.json","sha256":"28ed02bbf634119d4273b92c8f553cdd1bad5a9cd2827eaddcd635fcf0cbfd32"},{"path":"evidence/2026-10-22-hosted/mac-package-renderer.json","sha256":"ca34cbe892c5bfd71f0ecb04db1a345ecae53d3dadebbf0a979bfac88e2b84a9"},{"path":"evidence/2026-10-22-hosted/final-macos-latest.log","sha256":"df948d97ea32b279b9daea18f0e081b29a470cd79516729ffef6d27c3212a664"},{"path":"evidence/2026-10-22-hosted/final-windows-latest.log","sha256":"5c05dd38198c69f48100d720b167a1e567e120afbdb7846a5cbd96a40cdfe5b8"},{"path":"evidence/2026-10-22-hosted/final-ubuntu-22.04.log","sha256":"61ebbfba125b82b4066a8e71faa6574470cb373da0170ee741eb20262b419088"},{"path":"evidence/2026-10-22-hosted/final-ubuntu-24.04.log","sha256":"b60c192787b2a6385510b67106bdb9194f7fcc42738238f2be79b278cdd03363"},{"path":"evidence/2026-10-22-hosted/startup-failures.log","sha256":"ee497fba7b727045d46876c366518611c2649b4b4c735f4f2812c339f172f928"},{"path":"evidence/2026-10-22-hosted/pipe-repair-attempt.json","sha256":"972ae81efecbd67f1bb371e24fb9a186db56c1475443e3dec7bef310d264fc40"},{"path":"evidence/2026-10-22-hosted/windows-timing-failure.log","sha256":"4cba6ad99628bd1e1537af236cb883ee941f1bf9d24ed761b1b56a19b4b15d4f"},{"path":"evidence/2026-10-22-hosted/ubuntu22-initial.log","sha256":"bd1cd544946338b747eb3440f386855eafcb701cabac1a85905a285c6c240a16"}],"html":"\u003cp>This follows the \u003ca href=\"#/verification/runs/2026-10-22-platform\">local foundation run\u003c/a> and exercises\n\u003ca href=\"#/features/sessions\">sessions\u003c/a> and \u003ca href=\"#/features/interfaces\">interfaces\u003c/a>\non hosted desktop operating systems. The aggregate is \u003cstrong>Failed\u003c/strong>: the portable\nrenderer did not start on every target, and a virtual display lacked WebGL.\nSuccessful core tests do not override\nthat result or establish clean-machine distribution support.\u003c/p>\n\u003ch2 id=\"builds-and-observations\">Builds and observations\u003c/h2>\n\u003cp>The first \u003ca href=\"evidence/2026-10-22-hosted/first-core.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 621ec4c171cc302d96d2c498d52ce11f6978fd1beda7464e32a7f07d80458802\">core matrix\u003c/a> ran\n\u003ccode>ea59e6c\u003c/code>. Go vet, the 17 root tests, and seven Node tests passed on all three\nsystems. Unix used the race detector; Windows did not. The Windows wiki check\nfailed because checkout line endings changed generated content and evidence\nhashes. A repository \u003ccode>.gitattributes\u003c/code> now preserves LF text bytes. The next\nmatrix passed the wiki check on Windows too.\u003c/p>\n\u003cp>The \u003ca href=\"evidence/2026-10-22-hosted/baseline.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 610ec7b60378667a93fd3d6612c0787be013d4a2bf0877c717b718ca177b8373\">renderer baseline\u003c/a> ran\n\u003ccode>60cf3e4\u003c/code>; \u003ccode>1aaa8dc\u003c/code> repeated it with worker diagnostics. The runner built the\nCLI and used the pinned Electron 44.9.0 runtime. The test driver gave Fungi an\nempty executable search path and removed the originating Codex thread ID.\nLinux used Xvfb. No renderer sandbox or host security policy was disabled.\u003c/p>\n\u003cp>The final \u003ca href=\"evidence/2026-10-22-hosted/final-ci.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: b3bf0ef2a99f12d49126aa93153ca8cbb89628eb5e72aea7559bdf0bea837b5c\">CI run\u003c/a> tests\n\u003ccode>df4da9f\u003c/code> after the repairs below. \u003ca href=\"evidence/2026-10-22-hosted/platforms.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 5f9cc3bfbae1144db868025d42da9f7f682711ed0de125d4e6618830192e9c59\">Runner versions\u003c/a>\nidentify the actual images; these are hosted environments, not fresh consumer\nmachines. Each final target passed Go vet, 17 root tests, seven Node tests and\nthe wiki check.\u003c/p>\n\u003cp>The final source was also rebuilt into portable macOS arm64, Windows x64 and\nLinux x64 directories at \u003ccode>2026-10-22T09-13-00-267Z\u003c/code>.\n\u003ca href=\"evidence/2026-10-22-hosted/packages.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 28ed02bbf634119d4273b92c8f553cdd1bad5a9cd2827eaddcd635fcf0cbfd32\">Package metadata and source hashes\u003c/a>\nidentify them. The rebuilt macOS package independently passed the same\n\u003ca href=\"evidence/2026-10-22-hosted/mac-package-renderer.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: ca34cbe892c5bfd71f0ecb04db1a345ecae53d3dadebbf0a979bfac88e2b84a9\">21-check renderer fixture\u003c/a>\nwith an empty child PATH. Hosted Windows execution used the corresponding\nsource build, not this cross-packaged archive; a physical archive handoff\nremains separate acceptance work.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Final observed system\u003c/th>\n\u003cth>Core and Node checks\u003c/th>\n\u003cth>Actual renderer fixture\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>macOS 26.6.2 arm64 (25G83)\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-22-hosted/final-macos-latest.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: df948d97ea32b279b9daea18f0e081b29a470cd79516729ffef6d27c3212a664\">Passed\u003c/a>: all 21 checks, cancel/reopen/submit and PNG hash\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Windows Server 2025 x64 (10.0.26100)\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-22-hosted/final-windows-latest.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 5c05dd38198c69f48100d720b167a1e567e120afbdb7846a5cbd96a40cdfe5b8\">Passed\u003c/a>: all 21 checks and the same result/artifact workflow\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ubuntu 22.04.5 x64 with Xvfb\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-22-hosted/final-ubuntu-22.04.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 61ebbfba125b82b4066a8e71faa6574470cb373da0170ee741eb20262b419088\">Failed\u003c/a>: 20 checks pass; WebGL context unavailable on the virtual display\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ubuntu 24.04.5 x64 with Xvfb\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-22-hosted/final-ubuntu-24.04.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: b60c192787b2a6385510b67106bdb9194f7fcc42738238f2be79b278cdd03363\">Failed\u003c/a>: Chromium sandbox startup abort before readiness\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The \u003ca href=\"evidence/2026-10-22-hosted/startup-failures.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: ee497fba7b727045d46876c366518611c2649b4b4c735f4f2812c339f172f928\">startup logs\u003c/a>\npreserve the actual failures. This uses the same rendering fixture as the\nlocal run, not automated input in a person's questionnaire. No physical\nclipboard, accessibility, IME, window-manager or consumer Windows desktop\njourney is implied by a hosted test.\u003c/p>\n\u003ch2 id=\"diagnosis-and-repairs\">Diagnosis and repairs\u003c/h2>\n\u003cp>Electron's \u003ca href=\"https://github.com/electron/electron/blob/v44.9.0/lib/common/init.ts\" rel=\"noreferrer\">Windows initialization\u003c/a>\nreplaces \u003ccode>process.stdin\u003c/code> with an EOF-only stream. Its\n\u003ca href=\"https://github.com/electron/electron/blob/v44.9.0/shell/app/electron_main_win.cc\" rel=\"noreferrer\">Windows entry point\u003c/a>\ncan also attach standard streams to a console. Fungi's repair reads the\ninherited input descriptor directly on Windows and sets Electron's documented\n\u003ca href=\"https://www.electronjs.org/docs/latest/api/environment-variables#electron_no_attach_console-windows\" rel=\"noreferrer\">\u003ccode>ELECTRON_NO_ATTACH_CONSOLE\u003c/code>\u003c/a>\nfor the renderer child. Native helpers keep their normal pipe contract. This\nis an internal transport adjustment, with no new skill API or dependency.\nThe subsequent Windows run still encountered an empty NDJSON record before\nreadiness. The scanner now ignores blank lines while continuing to reject\nmalformed nonempty records; its regression covers blank/whitespace/CRLF lines\naround a valid message. The final Windows run passes the actual round trip.\u003c/p>\n\u003cp>The \u003ca href=\"evidence/2026-10-22-hosted/pipe-repair-attempt.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 972ae81efecbd67f1bb371e24fb9a186db56c1475443e3dec7bef310d264fc40\">first repair attempt\u003c/a>\nat \u003ccode>af7c52c\u003c/code> hit a test timing issue before reaching Windows rendering: a\nmalformed-helper test completed in 1.03 seconds but had a one-second assertion.\nThe \u003ca href=\"evidence/2026-10-22-hosted/windows-timing-failure.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 4cba6ad99628bd1e1537af236cb883ee941f1bf9d24ed761b1b56a19b4b15d4f\">log\u003c/a> retains it.\nThe fixture now deliberately stays alive for 30 seconds while the test allows\nfive seconds for owner termination. This tolerates hosted process startup\nwhile still failing if the owner waits for the broken helper's natural exit.\u003c/p>\n\u003cp>That attempt also exercised Ubuntu 22.04. The\n\u003ca href=\"evidence/2026-10-22-hosted/ubuntu22-initial.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: bd1cd544946338b747eb3440f386855eafcb701cabac1a85905a285c6c240a16\">actual renderer log\u003c/a>\nshows 20 checks passing, including cancel/reopen/submit and the PNG hash.\nWebGL failed because Chromium blocklisted it on the virtual display. This\nis not a complete rendering pass; hardware-dependent APIs must be feature\ndetected by authored interfaces. No blocklist override or software-rendering\nflag was added to make the check pass.\u003c/p>\n\u003cp>Ubuntu's fatal log requests a root-owned, mode-4755 sandbox helper. That is\nincompatible with simply unpacking an ordinary user-owned portable archive\non this runner. Ubuntu documents\n\u003ca href=\"https://documentation.ubuntu.com/security/security-features/privilege-restriction/apparmor/\" rel=\"noreferrer\">AppArmor restrictions on unprivileged user namespaces\u003c/a>,\nand its \u003ca href=\"https://documentation.ubuntu.com/security/security-features/security-features-tables/\" rel=\"noreferrer\">security matrix\u003c/a>\ndistinguishes 22.04 from 24.04 and later. Chromium's\n\u003ca href=\"https://chromium.googlesource.com/chromium/src/+/HEAD/sandbox/linux/README.md\" rel=\"noreferrer\">sandbox documentation\u003c/a>\ndescribes the namespace and privileged-helper mechanisms. These sources\nexplain the platform constraint. The final Ubuntu 24.04 diagnostic records\n\u003ccode>apparmor_restrict_unprivileged_userns=1\u003c/code> and a denied UID-map write in a\ndisposable namespace probe. Ubuntu 22.04 starts the renderer without host\nchanges; its remaining WebGL failure is recorded separately.\u003c/p>\n\u003ch2 id=\"remaining-acceptance-boundary\">Remaining acceptance boundary\u003c/h2>\n\u003cp>The current package cannot be advertised as a no-setup renderer on every\nLinux desktop. Choosing a narrower supported baseline or a Linux-specific\ninstallation path changes the distribution promise and needs user judgment.\nNo installer, global AppArmor change, elevated sandbox-helper installation\nor sandbox bypass has been added.\u003c/p>\n\u003cp>The \u003ca href=\"#/verification/desktop\">desktop recipe\u003c/a> remains available for physical target\nchecks. Signing/notarization, clean-machine launch, arbitrary hardware,\nlong-duration renderer waits and universal harness resumption are not proven.\nThe implementing agent conducted these checks; no independent review is claimed.\u003c/p>\n","backlinks":["index","planning","platforms","features/interfaces","features/sessions","verification/runs/2026-10-22-baselines","verification/runs/2026-10-22-platform","verification/setup"]},{"id":"verification/runs/2026-10-22-platform","title":"Rendering flexibility and foundation repairs","section":"Verification","order":0,"metadata":{"result":"Passed"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Last updated: 2026-10-22\u003c/span>","updated":"2026-10-22","summary":"","source":"---\ntitle: Rendering flexibility and foundation repairs\nupdated: 2026-10-22\nresult: Passed\n---\n# Rendering flexibility and foundation repairs\n\nThe user requested autonomous work toward a stable, robust, simple and broadly\nflexible platform. This run covers [FEAT-sessions](../../features/sessions.md)\nand [FEAT-interfaces](../../features/interfaces.md): lifecycle defects, ordinary\nbrowser capabilities, a separate skill-owned comparison UI, and the remaining\nrich-grill image/retry scenarios. The selected local and container checks\npassed. **Windows and Linux desktop execution are outside this pass;\ncross-packaged builds remain unverified on their target desktops.**\nLater [hosted platform checks](2026-10-22-hosted.md) have their own verdict\nand do not expand the scope of this earlier pass.\n\n## Build and environment\n\nWork is based on `eca3d85` with local changes. The [manifest](../../evidence/2026-10-22-platform/manifest.json)\nfingerprints source, binaries and three prepared packages. Native UI journeys\nused the development executable on macOS 27.0 arm64 (26A5368g), Go 1.26.4 and\nElectron 44.9.0. They preceded the later helper-write and platform-file repairs;\ntheir binary and unchanged renderer hashes are recorded separately. The final\npackaged renderer check uses\n`dist/fungi-darwin-arm64-2026-10-22T08-33-53-221Z/fungi` and the final Go source.\n\nThe Linux core run uses the existing official Go image pinned by digest, under\nOrbStack. Its [command](../../evidence/2026-10-22-platform/linux-command.json)\ndisables networking, uses UID/GID 65534, mounts only copied source read-only and\nremoves its test container on exit. OrbStack was initially stopped and was\nstarted through its installed app. No new VM or Windows connection was created.\n\nAutomated fixtures use one pending CLI call. Native tests use manual receipts\nand one collection after observed completion. No model polling, additional\ncallback waiter, authentication or harness configuration change was used.\n\n## Results on the changed build\n\n| Scenario | Expected and observed | Result | Evidence |\n| --- | --- | --- | --- |\n| Core sessions and persistence | 17 root tests pass on macOS and Linux arm64, including concurrency, waiter loss, recovery, immutable results, artifacts, uncertain callbacks and new regressions | Passed | [macOS race suite](../../evidence/2026-10-22-platform/go-tests.log), [Linux race suite](../../evidence/2026-10-22-platform/linux-tests.log) |\n| Mutation ordering and retry | Slow Blob encoding cannot be overtaken by save/submit/cancel; a rejected save allows a later submit | Passed | [Node tests](../../evidence/2026-10-22-platform/node-tests.log) |\n| Asset serving | Confined paths, symlinks, GET/HEAD, MIME, empty files and valid/invalid byte ranges behave as expected | Passed | [Node tests](../../evidence/2026-10-22-platform/node-tests.log) |\n| Packaged rendering | 21 assertions pass through the actual CLI, owner, Electron, preload and artifact storage with an empty child PATH | Passed | [Renderer result](../../evidence/2026-10-22-platform/renderer.json) |\n| Independent comparison UI | 39% divider, After preference and “Nice” return with a 1200×600 PNG whose recorded hash matches its bytes | Passed | [Native results](../../evidence/2026-10-22-platform/native-evidence.json), [PNG](../../evidence/2026-10-22-platform/comparison.png) |\n| Rich-grill image and state | Native paste creates Image #1; note, image and 560 ms/ease-out state survive close/reopen and submission; image hash matches the draft | Passed | [Native results](../../evidence/2026-10-22-platform/native-evidence.json), [image](../../evidence/2026-10-22-platform/rich-image.png) |\n| Rich-grill storage failure/retry | Mode 0500 on only the disposable session directory causes a visible error and no result; restoring 0700 allows retry with unchanged data | Passed | [Native failure and result](../../evidence/2026-10-22-platform/native-evidence.json) |\n| Reference-form failed autosave | Input survives failed autosave; restoring permissions allows submit without another edit | Passed | [Native result](../../evidence/2026-10-22-platform/native-evidence.json) |\n| Portable assembly | macOS arm64, Windows x64 and Linux x64 directories contain target binaries/helpers and Electron 44.9.0; cross-target downloads use pinned checksums | Passed | [Package metadata](../../evidence/2026-10-22-platform/manifest.json) |\n\nPackaged assertions exercise ES modules/dynamic import, custom elements and\nshadow DOM, Canvas PNG export, SVG rasterization, WebGL, local module and Blob\nworkers, streaming WebAssembly compilation, local JSON/Blob fetch, one-second\nWAV metadata/seeking, and byte ranges. They also check inline-frame isolation,\nabsent Node/IPC globals, denied external/file requests, symlink confinement,\noversized JSON/artifact rejection, envelope overhead, and restored draft data\nand Blob bytes. The fixture cancels, explicitly reopens its own session and\nsubmits; the driver independently verifies its PNG hash. This is programmatic\nrenderer evidence, not a physical clipboard or GPU-driver compatibility test.\nThe empty executable search path demonstrates that this packaged workflow\ndoes not invoke a separately installed Node or Go executable.\n\nThe comparison was submitted while the agent was inspecting its window; the\nresponse was preserved and collected once. The native rich-form test uses\nclearly labelled synthetic verification data. Jstack's collector accepted the\nreconstructed image response and `finish` saved a temporary review/transcript.\nThe permission error retained the enabled submit button, note, image chip and\nprototype state. No terminal result existed until retry succeeded.\n\n## Defects and changes\n\n[Baseline observations](../../evidence/2026-10-22-platform/regressions.json)\nrecord reproduced failures rather than treating earlier demos as exhaustive:\n\n- Blob conversion preceded main-process ordering, allowing newer calls to\n  overtake older image saves. The preload now orders mutations before\n  conversion, checks total Blob size before allocation, and permits retry.\n- Exact-limit JSON could be acknowledged but unreadable because its newline\n  exceeded the read limit. Publication counts that byte. Renderer messages\n  also check the full envelope before sending, so metadata overhead cannot\n  terminate the helper protocol.\n- Malformed/closed stdout could block the owner in `Wait`. The owner now ends\n  the broken protocol and drains complete messages before interpreting exit.\n- The first Linux attempt exposed a launch-write race: an already-emitted\n  result was lost on broken pipe. Preserve [that failed attempt](../../evidence/2026-10-22-platform/linux-before-fix.log).\n  The repair drains stdout after launch-write failure and bounds actual helper\n  writes to five seconds. This is a communication timeout, not a human-wait\n  timeout. A helper that never reads a large launch is terminated with failure.\n- The reference form and timing example no longer let a failed autosave poison\n  submission. They stop editing during terminal operations and restore retry\n  controls on error.\n- Lock contention is distinguished from storage/path errors. Windows skips\n  unsupported Unix-style directory flushing after the already-flushed file is\n  renamed. Windows directory-entry persistence across power loss is not\n  promised; its runtime path remains untested.\n\nThe rendering surface keeps the same four methods. Workers and WebAssembly\nuse explicit CSP directives; local media streams with byte ranges. Skills own\ntheir libraries and preview sandboxing. Electron documents the\n[streaming protocol flag](https://www.electronjs.org/docs/latest/api/protocol),\nand MDN documents the separate [WebAssembly CSP permission](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Content-Security-Policy).\nMicrosoft requires [a writable handle for FlushFileBuffers](https://learn.microsoft.com/en-us/windows/win32/api/fileapi/nf-fileapi-flushfilebuffers);\nthat API evidence does not substitute for Windows execution.\n\n## Limits and next acceptance work\n\nThe [authoring guide](../../authoring.md) and example reduce setup to local\nassets, four methods and one delivery route. An independent skill author or\nagent has not evaluated their usability. The implementing agent performed\nthis run; no independent review is claimed.\n\nCross-packaging, compilation and Linux core execution do not establish target\ndesktop UI, clipboard, filesystem replacement, graphics or no-setup launch.\nThe [desktop handoff recipe](../desktop.md) is prepared for those checks.\nPublic signing/notarization, a clean Mac, power-loss recovery, every codec,\nSharedArrayBuffer-dependent runtimes and arbitrary library compatibility are\noutside this run. Harness and long-idle evidence remains version-specific;\nit was not rerun or expanded into a universal claim. Full Fungi-native jstack\nauthoring remains deferred.\n","toc":[{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results-on-the-changed-build","title":"Results on the changed build","depth":2},{"id":"defects-and-changes","title":"Defects and changes","depth":2},{"id":"limits-and-next-acceptance-work","title":"Limits and next acceptance work","depth":2}],"titleAnchor":"rendering-flexibility-and-foundation-repairs","links":["features/sessions","features/interfaces","verification/runs/2026-10-22-hosted","authoring","verification/desktop"],"attachments":[{"path":"evidence/2026-10-22-platform/manifest.json","sha256":"ed2e5c445b86c10398a37ef918d5d8bcd6260a0d4e1842874c833818951b8a2c"},{"path":"evidence/2026-10-22-platform/linux-command.json","sha256":"4b4dc4f07093d0595e3696ac92c257cda5f53bafc97d7b3c9cd579bcfcc356d7"},{"path":"evidence/2026-10-22-platform/go-tests.log","sha256":"4f6fbb3d9cde502c50e213b90b29847a15f476369e48d008ed6a66d3cc42daaa"},{"path":"evidence/2026-10-22-platform/linux-tests.log","sha256":"270ba8dff0cc3861c82880ae48d7ce20d98f13400b1dfbde7388146706d3b912"},{"path":"evidence/2026-10-22-platform/node-tests.log","sha256":"c751817fab84febe59b1621e4fd87c98ea2ab26869ad118d12fcc754b2b495ee"},{"path":"evidence/2026-10-22-platform/renderer.json","sha256":"7236a6d98ba38d869a27c55cf393a2d65c06c9ff60d86d37357e4f268e6e3dca"},{"path":"evidence/2026-10-22-platform/native-evidence.json","sha256":"107fa7cecb7c660ccd546291f67b1c278510a0501b9ab89de60461857fe791b1"},{"path":"evidence/2026-10-22-platform/comparison.png","sha256":"c1d9cb178213fd0a180a260f64392594b6785ec6e9b1dd83893045e36adf1752"},{"path":"evidence/2026-10-22-platform/rich-image.png","sha256":"83e160394a50c08746093b421e7bbf7865d6591aac9f9b2d1f0850bea504c2d9"},{"path":"evidence/2026-10-22-platform/regressions.json","sha256":"f4811bcbddf581e368a393e4c391105ba9b4bb7b384d611ae20cb3857422f47d"},{"path":"evidence/2026-10-22-platform/linux-before-fix.log","sha256":"75db1c030d0fd48e172d64cd94692031b8a999f58b541da3390328c6f8b30a53"}],"html":"\u003cp>The user requested autonomous work toward a stable, robust, simple and broadly\nflexible platform. This run covers \u003ca href=\"#/features/sessions\">FEAT-sessions\u003c/a>\nand \u003ca href=\"#/features/interfaces\">FEAT-interfaces\u003c/a>: lifecycle defects, ordinary\nbrowser capabilities, a separate skill-owned comparison UI, and the remaining\nrich-grill image/retry scenarios. The selected local and container checks\npassed. \u003cstrong>Windows and Linux desktop execution are outside this pass;\ncross-packaged builds remain unverified on their target desktops.\u003c/strong>\nLater \u003ca href=\"#/verification/runs/2026-10-22-hosted\">hosted platform checks\u003c/a> have their own verdict\nand do not expand the scope of this earlier pass.\u003c/p>\n\u003ch2 id=\"build-and-environment\">Build and environment\u003c/h2>\n\u003cp>Work is based on \u003ccode>eca3d85\u003c/code> with local changes. The \u003ca href=\"evidence/2026-10-22-platform/manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: ed2e5c445b86c10398a37ef918d5d8bcd6260a0d4e1842874c833818951b8a2c\">manifest\u003c/a>\nfingerprints source, binaries and three prepared packages. Native UI journeys\nused the development executable on macOS 27.0 arm64 (26A5368g), Go 1.26.4 and\nElectron 44.9.0. They preceded the later helper-write and platform-file repairs;\ntheir binary and unchanged renderer hashes are recorded separately. The final\npackaged renderer check uses\n\u003ccode>dist/fungi-darwin-arm64-2026-10-22T08-33-53-221Z/fungi\u003c/code> and the final Go source.\u003c/p>\n\u003cp>The Linux core run uses the existing official Go image pinned by digest, under\nOrbStack. Its \u003ca href=\"evidence/2026-10-22-platform/linux-command.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 4b4dc4f07093d0595e3696ac92c257cda5f53bafc97d7b3c9cd579bcfcc356d7\">command\u003c/a>\ndisables networking, uses UID/GID 65534, mounts only copied source read-only and\nremoves its test container on exit. OrbStack was initially stopped and was\nstarted through its installed app. No new VM or Windows connection was created.\u003c/p>\n\u003cp>Automated fixtures use one pending CLI call. Native tests use manual receipts\nand one collection after observed completion. No model polling, additional\ncallback waiter, authentication or harness configuration change was used.\u003c/p>\n\u003ch2 id=\"results-on-the-changed-build\">Results on the changed build\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Expected and observed\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Evidence\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Core sessions and persistence\u003c/td>\n\u003ctd>17 root tests pass on macOS and Linux arm64, including concurrency, waiter loss, recovery, immutable results, artifacts, uncertain callbacks and new regressions\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-22-platform/go-tests.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 4f6fbb3d9cde502c50e213b90b29847a15f476369e48d008ed6a66d3cc42daaa\">macOS race suite\u003c/a>, \u003ca href=\"evidence/2026-10-22-platform/linux-tests.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 270ba8dff0cc3861c82880ae48d7ce20d98f13400b1dfbde7388146706d3b912\">Linux race suite\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Mutation ordering and retry\u003c/td>\n\u003ctd>Slow Blob encoding cannot be overtaken by save/submit/cancel; a rejected save allows a later submit\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-22-platform/node-tests.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: c751817fab84febe59b1621e4fd87c98ea2ab26869ad118d12fcc754b2b495ee\">Node tests\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Asset serving\u003c/td>\n\u003ctd>Confined paths, symlinks, GET/HEAD, MIME, empty files and valid/invalid byte ranges behave as expected\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-22-platform/node-tests.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: c751817fab84febe59b1621e4fd87c98ea2ab26869ad118d12fcc754b2b495ee\">Node tests\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Packaged rendering\u003c/td>\n\u003ctd>21 assertions pass through the actual CLI, owner, Electron, preload and artifact storage with an empty child PATH\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-22-platform/renderer.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 7236a6d98ba38d869a27c55cf393a2d65c06c9ff60d86d37357e4f268e6e3dca\">Renderer result\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Independent comparison UI\u003c/td>\n\u003ctd>39% divider, After preference and “Nice” return with a 1200×600 PNG whose recorded hash matches its bytes\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-22-platform/native-evidence.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 107fa7cecb7c660ccd546291f67b1c278510a0501b9ab89de60461857fe791b1\">Native results\u003c/a>, \u003ca href=\"evidence/2026-10-22-platform/comparison.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: c1d9cb178213fd0a180a260f64392594b6785ec6e9b1dd83893045e36adf1752\">PNG\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Rich-grill image and state\u003c/td>\n\u003ctd>Native paste creates Image #1; note, image and 560 ms/ease-out state survive close/reopen and submission; image hash matches the draft\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-22-platform/native-evidence.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 107fa7cecb7c660ccd546291f67b1c278510a0501b9ab89de60461857fe791b1\">Native results\u003c/a>, \u003ca href=\"evidence/2026-10-22-platform/rich-image.png\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 83e160394a50c08746093b421e7bbf7865d6591aac9f9b2d1f0850bea504c2d9\">image\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Rich-grill storage failure/retry\u003c/td>\n\u003ctd>Mode 0500 on only the disposable session directory causes a visible error and no result; restoring 0700 allows retry with unchanged data\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-22-platform/native-evidence.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 107fa7cecb7c660ccd546291f67b1c278510a0501b9ab89de60461857fe791b1\">Native failure and result\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Reference-form failed autosave\u003c/td>\n\u003ctd>Input survives failed autosave; restoring permissions allows submit without another edit\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-22-platform/native-evidence.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 107fa7cecb7c660ccd546291f67b1c278510a0501b9ab89de60461857fe791b1\">Native result\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Portable assembly\u003c/td>\n\u003ctd>macOS arm64, Windows x64 and Linux x64 directories contain target binaries/helpers and Electron 44.9.0; cross-target downloads use pinned checksums\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-22-platform/manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: ed2e5c445b86c10398a37ef918d5d8bcd6260a0d4e1842874c833818951b8a2c\">Package metadata\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Packaged assertions exercise ES modules/dynamic import, custom elements and\nshadow DOM, Canvas PNG export, SVG rasterization, WebGL, local module and Blob\nworkers, streaming WebAssembly compilation, local JSON/Blob fetch, one-second\nWAV metadata/seeking, and byte ranges. They also check inline-frame isolation,\nabsent Node/IPC globals, denied external/file requests, symlink confinement,\noversized JSON/artifact rejection, envelope overhead, and restored draft data\nand Blob bytes. The fixture cancels, explicitly reopens its own session and\nsubmits; the driver independently verifies its PNG hash. This is programmatic\nrenderer evidence, not a physical clipboard or GPU-driver compatibility test.\nThe empty executable search path demonstrates that this packaged workflow\ndoes not invoke a separately installed Node or Go executable.\u003c/p>\n\u003cp>The comparison was submitted while the agent was inspecting its window; the\nresponse was preserved and collected once. The native rich-form test uses\nclearly labelled synthetic verification data. Jstack's collector accepted the\nreconstructed image response and \u003ccode>finish\u003c/code> saved a temporary review/transcript.\nThe permission error retained the enabled submit button, note, image chip and\nprototype state. No terminal result existed until retry succeeded.\u003c/p>\n\u003ch2 id=\"defects-and-changes\">Defects and changes\u003c/h2>\n\u003cp>\u003ca href=\"evidence/2026-10-22-platform/regressions.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: f4811bcbddf581e368a393e4c391105ba9b4bb7b384d611ae20cb3857422f47d\">Baseline observations\u003c/a>\nrecord reproduced failures rather than treating earlier demos as exhaustive:\u003c/p>\n\u003cul>\n\u003cli>Blob conversion preceded main-process ordering, allowing newer calls to\novertake older image saves. The preload now orders mutations before\nconversion, checks total Blob size before allocation, and permits retry.\u003c/li>\n\u003cli>Exact-limit JSON could be acknowledged but unreadable because its newline\nexceeded the read limit. Publication counts that byte. Renderer messages\nalso check the full envelope before sending, so metadata overhead cannot\nterminate the helper protocol.\u003c/li>\n\u003cli>Malformed/closed stdout could block the owner in \u003ccode>Wait\u003c/code>. The owner now ends\nthe broken protocol and drains complete messages before interpreting exit.\u003c/li>\n\u003cli>The first Linux attempt exposed a launch-write race: an already-emitted\nresult was lost on broken pipe. Preserve \u003ca href=\"evidence/2026-10-22-platform/linux-before-fix.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 75db1c030d0fd48e172d64cd94692031b8a999f58b541da3390328c6f8b30a53\">that failed attempt\u003c/a>.\nThe repair drains stdout after launch-write failure and bounds actual helper\nwrites to five seconds. This is a communication timeout, not a human-wait\ntimeout. A helper that never reads a large launch is terminated with failure.\u003c/li>\n\u003cli>The reference form and timing example no longer let a failed autosave poison\nsubmission. They stop editing during terminal operations and restore retry\ncontrols on error.\u003c/li>\n\u003cli>Lock contention is distinguished from storage/path errors. Windows skips\nunsupported Unix-style directory flushing after the already-flushed file is\nrenamed. Windows directory-entry persistence across power loss is not\npromised; its runtime path remains untested.\u003c/li>\n\u003c/ul>\n\u003cp>The rendering surface keeps the same four methods. Workers and WebAssembly\nuse explicit CSP directives; local media streams with byte ranges. Skills own\ntheir libraries and preview sandboxing. Electron documents the\n\u003ca href=\"https://www.electronjs.org/docs/latest/api/protocol\" rel=\"noreferrer\">streaming protocol flag\u003c/a>,\nand MDN documents the separate \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Content-Security-Policy\" rel=\"noreferrer\">WebAssembly CSP permission\u003c/a>.\nMicrosoft requires \u003ca href=\"https://learn.microsoft.com/en-us/windows/win32/api/fileapi/nf-fileapi-flushfilebuffers\" rel=\"noreferrer\">a writable handle for FlushFileBuffers\u003c/a>;\nthat API evidence does not substitute for Windows execution.\u003c/p>\n\u003ch2 id=\"limits-and-next-acceptance-work\">Limits and next acceptance work\u003c/h2>\n\u003cp>The \u003ca href=\"#/authoring\">authoring guide\u003c/a> and example reduce setup to local\nassets, four methods and one delivery route. An independent skill author or\nagent has not evaluated their usability. The implementing agent performed\nthis run; no independent review is claimed.\u003c/p>\n\u003cp>Cross-packaging, compilation and Linux core execution do not establish target\ndesktop UI, clipboard, filesystem replacement, graphics or no-setup launch.\nThe \u003ca href=\"#/verification/desktop\">desktop handoff recipe\u003c/a> is prepared for those checks.\nPublic signing/notarization, a clean Mac, power-loss recovery, every codec,\nSharedArrayBuffer-dependent runtimes and arbitrary library compatibility are\noutside this run. Harness and long-idle evidence remains version-specific;\nit was not rerun or expanded into a universal claim. Full Fungi-native jstack\nauthoring remains deferred.\u003c/p>\n","backlinks":["index","authoring","planning","features/interfaces","features/sessions","verification/runs/2026-10-22-hosted"]},{"id":"verification/runs/2026-10-23-distribution","title":"Command installation and update proof","section":"Verification","order":0,"metadata":{"result":"Untested"},"metadataHtml":"\u003cspan>Result: Untested\u003c/span> \u003cspan>Last updated: 2026-10-23\u003c/span>","updated":"2026-10-23","summary":"","source":"---\ntitle: Command installation and update proof\nupdated: 2026-10-23\nresult: Untested\n---\n# Command installation and update proof\n\n**Untested overall: the newest Mac job and its single retry never obtained\na hosted runner.** Automatic retries have stopped; no callback is pending.\nWindows and both Linux jobs now pass on `6d587ac`; the initial four-platform\nrun, Mac runtime-sharing CI and selected local Mac scenarios also passed.\nThis run covers [installation](../../features/installation.md)\nand preservation of [sessions](../../features/sessions.md) through updates.\nIt does not establish a public release or clean consumer-machine support.\n\n## Build and environment\n\nLocal base `c768218`, with implementation edits; [source hashes](../../evidence/2026-10-23-distribution/source-hashes.json)\nrecord the dirty source checkpoint. macOS 27.0 arm64, Go 1.26.4, Node 22.19.0\nand Electron 44.9.0. [Package A](../../evidence/2026-10-23-distribution/package-a.json)\nand [package B](../../evidence/2026-10-23-distribution/package-b.json) identify\nthe actual executable hashes and sizes. Their versions are `v0.1.0-install.1`\nand `v0.1.0-install.2`. Later packaging changes increase archive compression\nand substitute a compact portable README; those two archives predate these\npackaging-only changes. [Initial CI run 39843208109](https://github.com/rengwu/fungi/actions/runs/39843208109)\npassed on `8d4f23b6900f736cc7ee9bc4b05d222a87aa1704`; its\n[metadata](../../evidence/2026-10-23-distribution/ci-39843208109.json) and\n[log](../../evidence/2026-10-23-distribution/ci-39843208109.log) preserve exact job scopes.\n\nThe file-sharing follow-up uses local packages\n[`v0.1.0-install.3`](../../evidence/2026-10-23-distribution/package-c.json) and\n[`v0.1.0-install.4`](../../evidence/2026-10-23-distribution/package-d.json).\nTheir [source checkpoint](../../evidence/2026-10-23-distribution/runtime-reuse-source.json)\nidentifies the edits atop `8d4f23b`. These include the final compact README\nand maximum Go archive compression. Package C is 329,066,779 bytes unpacked\nand 137,878,147 bytes compressed (313.8 and 131.5 MiB).\n\nLocal installation interactions use synthetic fixtures and isolated session/install\ndirectories. These fixtures submit no real questionnaire and queue no agent\ncallback. A separate CI-wait helper exercises an actual callback, recorded\nbelow. No release is published and no shell profile/PATH is changed. Installed\nCLI children use an empty PATH; the shell bootstrap uses standard OS tools.\n\n## Scenarios\n\n| Scenario | Result | Observation |\n| --- | --- | --- |\n| Core regression and archive tests | Passed | [Race-enabled log](../../evidence/2026-10-23-distribution/go-tests.log): 20 root tests and two archive test groups; Go vet and seven Node tests also passed |\n| Managed A → B → C, recovery and cleanup | Passed | Actual CLI/helper processes; stable receipt path, failed checksum preserves A, concurrent mutation rejected, running/recoverable A retained, draft restored through C, old result immutable, artifact retained, rollback and later pruning succeed |\n| Invalid downloads/archive paths | Passed | Oversize, partial and missing HTTP responses rejected; ZIP traversal/absolute/drive paths, duplicate files, escaping links and TAR hardlinks rejected; normal symlinks/modes survive Unix round trips |\n| Shell bootstrap on development Mac | Passed | [Download evidence](../../evidence/2026-10-23-distribution/mac-install.json): exactly one matching archive plus checksum fetched from a local fixture server, checksum checked, space-containing destination installed |\n| Open Electron session across update | Passed | A acknowledges draft and PNG, B activates, A submits, original stable receipt collects the matching saved answer; [PNG](../../evidence/2026-10-23-distribution/submitted.png) hash verified, rollback selects A |\n| Installed renderer regression | Passed | [All 21 checks](../../evidence/2026-10-23-distribution/mac-renderer.json), including WebGL, cancel/reopen, restored Blob, submission and hash through the stable installed command |\n| Hosted macOS, Windows and Linux install/update paths | Passed | Initial CI completed all four jobs, including actual platform bootstraps and local archive updates; Ubuntu 24.04 intentionally omits UI |\n| Runtime sharing, changed files and cleanup | Passed | [Race-enabled follow-up](../../evidence/2026-10-23-distribution/runtime-reuse-tests.log): unchanged file shares an inode, changed file stays separate, removing the old directory preserves the new runtime; managed lifecycle regression passes |\n| Actual Mac runtime sharing during update | Passed | [Install evidence](../../evidence/2026-10-23-distribution/mac-runtime-reuse.json): runtime executable shares an inode; open session submits with matching PNG hash; rollback succeeds |\n| Renderer regression with shared runtime | Passed | [All 21 checks](../../evidence/2026-10-23-distribution/mac-runtime-renderer.json) pass through the stable installed command after the sharing update and rollback, including WebGL and draft/Blob recovery |\n| Hosted runtime-sharing follow-up | Passed | Mac passes on `af2dbee`; [Windows](../../evidence/2026-10-23-distribution/windows-runtime-reuse.json), [Ubuntu 22.04](../../evidence/2026-10-23-distribution/linux22-runtime-reuse.json) and [Ubuntu 24.04 core](../../evidence/2026-10-23-distribution/linux24-runtime-reuse.json) pass on `6d587ac` |\n| Windows disconnect regression follow-up | Passed | The handshake correction passes on Windows and both Linux runners at `8bd24a0`; the following wiki check stopped their installer/renderer stages |\n| Fresh-checkout generated wiki | Passed | Corrected generation passes a local export of staged files and the Windows/Linux hosted checks; the CRLF failure remains recorded below |\n| Latest complete CI matrix | Untested | [Run 39848109685](https://github.com/rengwu/fungi/actions/runs/39848109685) passes Windows and both Linux jobs on `6d587ac`; attempts 1 and 2 Mac ran zero steps due to hosted capacity; no further retry is armed |\n| CI-wait callback through managed installation | Passed | [Callback evidence](../../evidence/2026-10-23-distribution/ci-callback.json): both CI attempts saved their failure result, delivered a Codex notice to the originating conversation and were each collected once |\n\nThe first unsafe-archive test attempt reused a ZIP header object and failed in\nthe test writer. A fresh duplicate header corrected the fixture. The first\nmanaged-path assertion also exposed macOS `/var` versus `/private/var` aliases;\npackage-reference matching now resolves existing symlinks before retaining\nassets. The rerun passes. No failed product assertion was simply removed.\n\n[Follow-up CI 39844997609](https://github.com/rengwu/fungi/actions/runs/39844997609)\non `af2dbee1ea02bb0d2fe36f892e7fab985a6663c5` failed overall because the\nWindows driver terminated PowerShell at exactly 180 seconds (`killed: true`,\n`SIGTERM`); it had requested both release files but produced no stage output.\nThe update/sharing assertions therefore did not execute there. Preserve the\n[failed log](../../evidence/2026-10-23-distribution/ci-39844997609.log) and\n[job metadata](../../evidence/2026-10-23-distribution/ci-39844997609.json).\nThe prior Windows run took about 165 seconds for this entire scenario.\n\nThe correction adds bootstrap stage messages, records elapsed time and failure\nsignal metadata, and gives Windows extraction a 300-second fixture bound.\nIt also replaces per-chunk PowerShell progress with the concise stage messages;\n[Microsoft's module issue](https://github.com/microsoft/PowerShellForGitHub/issues/227)\ndocuments this source of download overhead. The original timeout's exact\nphase is unknown, so progress rendering is a plausible contributor, not an\nestablished root cause. All functional assertions remain unchanged. No human\nwait timeout or host security setting changed.\n\nThe [next Windows attempt](https://github.com/rengwu/fungi/actions/runs/39846391476)\non `58edcc6` stopped before the installer in\n`TestDisconnectedWaiterDoesNotCancel`: the test killed the CLI after one\nsecond and expected its ten-second helper's result eleven seconds later.\nThe result was absent; [job log](../../evidence/2026-10-23-distribution/windows-120060671977.log)\npreserves the failure. Those sleeps did not establish that the owner had\nstarted or the helper had completed. Without worker diagnostics from that\nattempt, delayed startup is an inference rather than a proven cause.\n\nThe correction uses the existing bounded helper gate: wait for an acknowledged\ndraft/readiness marker, kill the actual waiting CLI, assert no result exists,\nrelease submission and require the saved submitted result. It adds worker\ndiagnostics on failure. The fixture's observable-condition deadline is thirty\nseconds, matching the product startup bound; there is no fixed startup sleep\nor human polling. The queued Mac job in that superseded run was cancelled;\nboth Linux jobs had already passed; [job metadata](../../evidence/2026-10-23-distribution/ci-39846391476.json)\nrecords that cancellation. The new committed-source rerun will cover\nall four targets.\n\nThe [local race-enabled handshake and managed-update retest](../../evidence/2026-10-23-distribution/fixture-handshake-tests.log)\npassed before this follow-up was committed; it does not establish the Windows\nresult.\n\n[CI 39847366853](https://github.com/rengwu/fungi/actions/runs/39847366853)\non `8bd24a0` passed core and Node tests on Windows and both Linux targets,\nincluding the corrected disconnect assertion. All three then failed the wiki\nfreshness check, before renderer/installer stages. The [Windows log](../../evidence/2026-10-23-distribution/windows-120064065885.log)\nand [metadata](../../evidence/2026-10-23-distribution/ci-39847366853.json)\nrecord it. This was reproduced in a fresh local export of that commit:\nthe saved Windows job log had CRLF in the working tree when the wiki hashed\nattachments, but Git stored LF per repository policy. Normalize the evidence\nbefore rebuilding and verify a fresh staged checkout as well as the working\ntree. No wiki assertion is removed. The superseded queued Mac job was cancelled.\n\nThe corrected Windows run completed the bootstrap in **11,773 ms**, then passed\nthe real Electron session, shared-file, collected PNG and rollback assertions.\nBoth Linux jobs also passed their declared scopes. The final\n[attempt 1 metadata](../../evidence/2026-10-23-distribution/ci-39848109685.json)\nrecords an overall CI failure because Mac was cancelled after fifteen minutes\nwithout an assigned runner or any executed steps. GitHub's\n[annotations](../../evidence/2026-10-23-distribution/mac-capacity-attempt1.json)\nstate that the job was not acquired by a hosted runner and identify macOS arm64\ncapacity constraints. This leaves the latest Mac scope untested; it is not a\nfailed product assertion. The single Mac-only retry on the same source also\nended after fifteen minutes without a runner or any steps. Its\n[final metadata](../../evidence/2026-10-23-distribution/ci-39848109685-attempt2.json),\n[Mac job record](../../evidence/2026-10-23-distribution/mac-job-attempt2.json) and\n[annotations](../../evidence/2026-10-23-distribution/mac-capacity-attempt2.json)\npreserve the same capacity diagnosis. The earlier Windows/Linux successes\nremain valid; they were not rerun in attempt 2. There is no third automatic\nattempt or pending watcher. The latest hosted Mac scope remains externally\nblocked until runner capacity is available.\n\nFungi's separate CI-wait helper saved that failed CI conclusion and sent a\nCodex notice to the originating conversation. The agent received it and\ncollected the exact session once. The helper's `watchError: exit status 1`\nreflects the CI conclusion, not a failed Fungi delivery. The\n[callback evidence](../../evidence/2026-10-23-distribution/ci-callback.json)\nrecords both observed returns. The retry's notice also reached this\nconversation, and its exact session was collected once. Each wait used one\nlocal helper with no model polling. Both helpers have finished; no callback\nis pending. This proves the installed callback path for these fixtures, not\ncallback delivery during an update. The final matrix result is not inferred\nfrom the earlier Mac success.\n\n## Size observations\n\n[Filesystem measurement](../../evidence/2026-10-23-distribution/runtime-storage.json)\nof the two retained Mac versions records 658,133,714 logical bytes and\n335,661,895 bytes in unique regular files: **322,471,819 bytes (307.5 MiB)\nshared**. These figures exclude the small stable launcher and filesystem\noverhead; they are not download sizes. Electron's locales, GPU fallback and\nlicense notices remain intact. File sharing does not reduce full-archive\ndownload traffic or the space needed to stage an update. Unsupported hard\nlinks fall back to independent verified copies.\n\nThe Windows hosted update shares **386,397,410 bytes (368.5 MiB)** of runtime\nfiles; both Linux updates share **297,192,653 bytes (283.4 MiB)**. These are\nretained-storage savings for an unchanged Electron version, not reductions\nto first-download sizes.\n\n## Limits and follow-up\n\nThe local HTTP fixture proves the bootstrap download path; updates use an\nexplicit local archive, not a live GitHub release. HTTP failures are tested\nseparately. A saved receipt was collected through the stable command; actual\nagent queue delivery during an update is not claimed here. UI actions in this\nrun are automated page fixtures, not native human keyboard/mouse input.\n\nPhysical Windows and Linux installation, fresh-shell PATH integration,\ndownloaded/quarantined consumer packages, signing/notarization, release\npublication, interruption during selector replacement and power-loss recovery\nremain unverified. Existing platform and harness limits remain in force.\nVerification was performed by the implementing agent; no independent review\nis claimed.\n","toc":[{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"scenarios","title":"Scenarios","depth":2},{"id":"size-observations","title":"Size observations","depth":2},{"id":"limits-and-follow-up","title":"Limits and follow-up","depth":2}],"titleAnchor":"command-installation-and-update-proof","links":["features/installation","features/sessions"],"attachments":[{"path":"evidence/2026-10-23-distribution/source-hashes.json","sha256":"a9a7e9c88d1cc2d0b1583c784472cb81f5a2ef1e6b05ee07f7f9d34ffe0ed9b7"},{"path":"evidence/2026-10-23-distribution/package-a.json","sha256":"4fb45bd4dc7b2771135af6f9087e37f854355ceb895ad894a7aa009d1f959a9f"},{"path":"evidence/2026-10-23-distribution/package-b.json","sha256":"d5925787c50e98ee5ad0dea1b21c5beebce30b838352b599872fc2cb4b077e67"},{"path":"evidence/2026-10-23-distribution/ci-39843208109.json","sha256":"d3a1209629e36684e0a85c7c857a60273bab5abfc22a8eabc428a317d33e411f"},{"path":"evidence/2026-10-23-distribution/ci-39843208109.log","sha256":"fb71e3f124f17df2b253bbd01008c3494d9cbc9f125e15764f429efdc37a880e"},{"path":"evidence/2026-10-23-distribution/package-c.json","sha256":"b95f8360d031f04f8259e4b1f4806c9da8e0e0a212a2c59b10963d917e4d7eef"},{"path":"evidence/2026-10-23-distribution/package-d.json","sha256":"306430d272ac49eee1c58ae53e12b3fcecc3b57243af98f48fef11ca2b8d7355"},{"path":"evidence/2026-10-23-distribution/runtime-reuse-source.json","sha256":"2740a0f43f6f3b011f4abb2a9367db63501fe9ac38438172bfd9ad26bf50e560"},{"path":"evidence/2026-10-23-distribution/go-tests.log","sha256":"ea223a483ca84ea374020f138abfe4c7dd67e1073c39934f0d6491200bd4db14"},{"path":"evidence/2026-10-23-distribution/mac-install.json","sha256":"1da54201783d621b89a2c1189e8a3bf7af6ada5addc6bd5f007806f9020ae10b"},{"path":"evidence/2026-10-23-distribution/submitted.png","sha256":"229f4824e40ed5d6dbf4ba83b81ec3a4277153481fc5f3e0cb2635d3c048b7c0"},{"path":"evidence/2026-10-23-distribution/mac-renderer.json","sha256":"9a8f27131105cdb4a8e0dc1db97bf371b3264da74d32d47edbf2d9b68952a074"},{"path":"evidence/2026-10-23-distribution/runtime-reuse-tests.log","sha256":"b9dbc02f051ca9decbb0befcf6c9632f363a467602a34e54eefc99b08b0ba122"},{"path":"evidence/2026-10-23-distribution/mac-runtime-reuse.json","sha256":"ee2c9e414726c65e8a7747f49d96451d8dbd3440770fe8b1bc54ffc0903a7f5b"},{"path":"evidence/2026-10-23-distribution/mac-runtime-renderer.json","sha256":"e6649742caccb1f2ff813655f13f03e92caa597e3b11f7afab8724e46ecfd911"},{"path":"evidence/2026-10-23-distribution/windows-runtime-reuse.json","sha256":"d22f2f7addaa1bbc9c0dc7ffb0448b93e0d02a1bf21028f3c2b55038f4f1600b"},{"path":"evidence/2026-10-23-distribution/linux22-runtime-reuse.json","sha256":"53789fce8e5fef1052e7153b8a5e6d6958379bfc4fcbb02be654b25d39e1d6a6"},{"path":"evidence/2026-10-23-distribution/linux24-runtime-reuse.json","sha256":"fb3550de89541196ae6fc76ecb2e2f3b317d69b23aca7281fd39501de3d8f1c1"},{"path":"evidence/2026-10-23-distribution/ci-callback.json","sha256":"7f705290d96921f767d87cc3cdf034b69780c6aeec9c01f388aa881b2948d527"},{"path":"evidence/2026-10-23-distribution/ci-39844997609.log","sha256":"d41505912c9e17457d42c9042483224a543ec577eb7892856edfcccb5cfecebf"},{"path":"evidence/2026-10-23-distribution/ci-39844997609.json","sha256":"1fe2ed0d4253e28665184fc518fe74c42cd27aa87152d4ae77e923f0b3e023bc"},{"path":"evidence/2026-10-23-distribution/windows-120060671977.log","sha256":"ae29cdd1a5af863988c8b1027b528edd5dab5ea1fb95928cfeeecc13bf294d36"},{"path":"evidence/2026-10-23-distribution/ci-39846391476.json","sha256":"c51481ab353fd17b5b6244c837eeec778354d965afc574520a7f71f9ba04e78e"},{"path":"evidence/2026-10-23-distribution/fixture-handshake-tests.log","sha256":"1c14b1a00f656c3c39e198be3c43573b0530f498910ae7b3aa71c83cf3c56c82"},{"path":"evidence/2026-10-23-distribution/windows-120064065885.log","sha256":"9b80770b5d7f7507b546484247b6a42100ff166256fc8132d350cb885ac33175"},{"path":"evidence/2026-10-23-distribution/ci-39847366853.json","sha256":"4f335cddefdad89af384e6c88738ce3983bdc266ffad5212214804a305ebe568"},{"path":"evidence/2026-10-23-distribution/ci-39848109685.json","sha256":"5659e461c38e1e175ce4dd9598a9e4fe7668f0efa063c1c571437bb14be6e654"},{"path":"evidence/2026-10-23-distribution/mac-capacity-attempt1.json","sha256":"6ff3aff5fb183aac9592fe0a4fe138af96f91c3695667c591c7e271ec5034456"},{"path":"evidence/2026-10-23-distribution/ci-39848109685-attempt2.json","sha256":"f41abc6d080cc4c2daa4440b8c0cbd01d5c8b6e4a4e3066ae17072f23e708728"},{"path":"evidence/2026-10-23-distribution/mac-job-attempt2.json","sha256":"709e4d3d8402f37a2e9b4c9f12327938cad72726059c720c75dd3f4fb7b1e637"},{"path":"evidence/2026-10-23-distribution/mac-capacity-attempt2.json","sha256":"6ff3aff5fb183aac9592fe0a4fe138af96f91c3695667c591c7e271ec5034456"},{"path":"evidence/2026-10-23-distribution/runtime-storage.json","sha256":"a7f7403afd3e61171470102f9dd46ec294c619a0b0a27111bc79fc619fee2443"}],"html":"\u003cp>\u003cstrong>Untested overall: the newest Mac job and its single retry never obtained\na hosted runner.\u003c/strong> Automatic retries have stopped; no callback is pending.\nWindows and both Linux jobs now pass on \u003ccode>6d587ac\u003c/code>; the initial four-platform\nrun, Mac runtime-sharing CI and selected local Mac scenarios also passed.\nThis run covers \u003ca href=\"#/features/installation\">installation\u003c/a>\nand preservation of \u003ca href=\"#/features/sessions\">sessions\u003c/a> through updates.\nIt does not establish a public release or clean consumer-machine support.\u003c/p>\n\u003ch2 id=\"build-and-environment\">Build and environment\u003c/h2>\n\u003cp>Local base \u003ccode>c768218\u003c/code>, with implementation edits; \u003ca href=\"evidence/2026-10-23-distribution/source-hashes.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: a9a7e9c88d1cc2d0b1583c784472cb81f5a2ef1e6b05ee07f7f9d34ffe0ed9b7\">source hashes\u003c/a>\nrecord the dirty source checkpoint. macOS 27.0 arm64, Go 1.26.4, Node 22.19.0\nand Electron 44.9.0. \u003ca href=\"evidence/2026-10-23-distribution/package-a.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 4fb45bd4dc7b2771135af6f9087e37f854355ceb895ad894a7aa009d1f959a9f\">Package A\u003c/a>\nand \u003ca href=\"evidence/2026-10-23-distribution/package-b.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: d5925787c50e98ee5ad0dea1b21c5beebce30b838352b599872fc2cb4b077e67\">package B\u003c/a> identify\nthe actual executable hashes and sizes. Their versions are \u003ccode>v0.1.0-install.1\u003c/code>\nand \u003ccode>v0.1.0-install.2\u003c/code>. Later packaging changes increase archive compression\nand substitute a compact portable README; those two archives predate these\npackaging-only changes. \u003ca href=\"https://github.com/rengwu/fungi/actions/runs/39843208109\" rel=\"noreferrer\">Initial CI run 39843208109\u003c/a>\npassed on \u003ccode>8d4f23b6900f736cc7ee9bc4b05d222a87aa1704\u003c/code>; its\n\u003ca href=\"evidence/2026-10-23-distribution/ci-39843208109.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: d3a1209629e36684e0a85c7c857a60273bab5abfc22a8eabc428a317d33e411f\">metadata\u003c/a> and\n\u003ca href=\"evidence/2026-10-23-distribution/ci-39843208109.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: fb71e3f124f17df2b253bbd01008c3494d9cbc9f125e15764f429efdc37a880e\">log\u003c/a> preserve exact job scopes.\u003c/p>\n\u003cp>The file-sharing follow-up uses local packages\n\u003ca href=\"evidence/2026-10-23-distribution/package-c.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: b95f8360d031f04f8259e4b1f4806c9da8e0e0a212a2c59b10963d917e4d7eef\">\u003ccode>v0.1.0-install.3\u003c/code>\u003c/a> and\n\u003ca href=\"evidence/2026-10-23-distribution/package-d.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 306430d272ac49eee1c58ae53e12b3fcecc3b57243af98f48fef11ca2b8d7355\">\u003ccode>v0.1.0-install.4\u003c/code>\u003c/a>.\nTheir \u003ca href=\"evidence/2026-10-23-distribution/runtime-reuse-source.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 2740a0f43f6f3b011f4abb2a9367db63501fe9ac38438172bfd9ad26bf50e560\">source checkpoint\u003c/a>\nidentifies the edits atop \u003ccode>8d4f23b\u003c/code>. These include the final compact README\nand maximum Go archive compression. Package C is 329,066,779 bytes unpacked\nand 137,878,147 bytes compressed (313.8 and 131.5 MiB).\u003c/p>\n\u003cp>Local installation interactions use synthetic fixtures and isolated session/install\ndirectories. These fixtures submit no real questionnaire and queue no agent\ncallback. A separate CI-wait helper exercises an actual callback, recorded\nbelow. No release is published and no shell profile/PATH is changed. Installed\nCLI children use an empty PATH; the shell bootstrap uses standard OS tools.\u003c/p>\n\u003ch2 id=\"scenarios\">Scenarios\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Observation\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Core regression and archive tests\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-23-distribution/go-tests.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: ea223a483ca84ea374020f138abfe4c7dd67e1073c39934f0d6491200bd4db14\">Race-enabled log\u003c/a>: 20 root tests and two archive test groups; Go vet and seven Node tests also passed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Managed A → B → C, recovery and cleanup\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Actual CLI/helper processes; stable receipt path, failed checksum preserves A, concurrent mutation rejected, running/recoverable A retained, draft restored
