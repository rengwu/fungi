 active sessions, package-owned draft assets and artifact preservation through version switches.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/windows-2026-10-22-203907\">2026-10-22/23 Windows desktop handoff\u003c/a> — native draft/close/reopen/submission/cancellation passed on Windows 11 x64; 17 core tests passed, one confinement fixture could not create its symlink. Aggregate Untested.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-22-baselines\">2026-10-22 verified baselines\u003c/a> — saved renderer startup failure and identical collection, plus 18 core tests on four hosted targets.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-22-hosted\">2026-10-22 hosted checks\u003c/a> — Windows/Linux/macOS core execution and target-specific renderer findings.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-22-platform\">2026-10-22 platform verification\u003c/a> — malformed/closed helper output and exact JSON-limit regressions, plus the macOS core race suite.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-20-skill-proof\">2026-10-20 skill proof\u003c/a> — real skill recovery, Linux arm64 core execution, one macOS sleep/wake cycle and a completed two-hour helper/owner/callback run.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-20-no-setup\">2026-10-20 no-setup compatibility\u003c/a> — self-contained collection receipts and real native artifact sessions.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-20-first-proof\">2026-10-20 first proof\u003c/a> — core checks and coverage gaps.\u003c/p>\n\u003c/li>\n\u003c/ul>\n","backlinks":["features/index","features/interfaces","verification/runs/2026-10-20-first-proof","verification/runs/2026-10-20-no-setup","verification/runs/2026-10-20-skill-proof","verification/runs/2026-10-22-baselines","verification/runs/2026-10-22-hosted","verification/runs/2026-10-22-platform","verification/runs/2026-10-23-distribution","verification/runs/windows-2026-10-22-203907"]},{"id":"journal/2026-10-19-grill-186963ab-2f7b-423c-b40b-97b0afacc6fb","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-19\u003c/span>","updated":"2026-10-19","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-19\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `186963ab-2f7b-423c-b40b-97b0afacc6fb`\n\n## Question 7\n\n```text\nRound: Fungi: renderer distribution\nQuestion: May the default bundled renderer contain a proprietary engine?\nDescription (Markdown source):\nSciter is a compact candidate: the current Linux standalone runner inspected here is about 18.9 MB, but the engine has its own license and differs from browser DOM/CSS conventions. Servo and Chromium-based routes provide open-source alternatives. Ultralight's current terms restrict developer platforms unless separately licensed, so it is not a default candidate under ordinary SDK terms.\n\nThis choice concerns what Fungi distributes by default. Optional third-party capabilities can document their own licenses.\n\nSources: [Sciter engine EULA](https://gitlab.com/sciter-engine/sciter-js-sdk/-/blob/main/SCITER-ENGINE-EULA.md), [Ultralight terms, sections 4.2 and 4.9](https://ultralig.ht/terms/2026-08).\nRecommendation: Use an open-source renderer in the default distribution, so rebuilding and extending Fungi does not depend on a proprietary engine agreement. Keep proprietary renderers possible as optional capabilities.\nOptions: Open-source renderer in the default distribution / A proprietary default is acceptable if redistribution is straightforward\nSelected: Open-source renderer in the default distribution\nNotes:\n```\n\n## Question 8\n\n```text\nRound: Fungi: renderer distribution\nQuestion: May Fungi automatically unpack its bundled renderer files when it first runs?\nDescription (Markdown source):\nYou have accepted one core executable with optional skill assets/helpers, plus bundled Chromium/Electron as a fallback. Chromium-based renderers normally need engine libraries, resource files and platform-specific helpers. One launchable download can contain these and unpack them into a private, versioned cache without an installer or internet download.\n\nThe distinction is one file to obtain and run versus literally one file existing at runtime. This question concerns Fungi's own bundled renderer; optional skill helpers are already accepted.\n\nSources: [CEF application layout](https://chromiumembedded.github.io/cef/general_usage#application-layout), [Electron packaging](https://www.electronjs.org/docs/latest/tutorial/application-distribution).\nRecommendation: Allow automatic local extraction. Keep the download self-contained, work offline on first launch, require no setup command or administrator privileges, and reuse the matching cached runtime.\nOptions: Yes: one launchable download may unpack its bundled runtime / No extraction: the bundled renderer must stay inside the executable / Ship a portable folder/archive with the runtime already beside fungi\nSelected: Yes: one launchable download may unpack its bundled runtime\nNotes:\n```\n","toc":[{"id":"question-7","title":"Question 7","depth":2},{"id":"question-8","title":"Question 8","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>186963ab-2f7b-423c-b40b-97b0afacc6fb\u003c/code>\u003c/p>\n\u003ch2 id=\"question-7\">Question 7\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Fungi: renderer distribution\nQuestion: May the default bundled renderer contain a proprietary engine?\nDescription (Markdown source):\nSciter is a compact candidate: the current Linux standalone runner inspected here is about 18.9 MB, but the engine has its own license and differs from browser DOM/CSS conventions. Servo and Chromium-based routes provide open-source alternatives. Ultralight's current terms restrict developer platforms unless separately licensed, so it is not a default candidate under ordinary SDK terms.\n\nThis choice concerns what Fungi distributes by default. Optional third-party capabilities can document their own licenses.\n\nSources: [Sciter engine EULA](https://gitlab.com/sciter-engine/sciter-js-sdk/-/blob/main/SCITER-ENGINE-EULA.md), [Ultralight terms, sections 4.2 and 4.9](https://ultralig.ht/terms/2026-08).\nRecommendation: Use an open-source renderer in the default distribution, so rebuilding and extending Fungi does not depend on a proprietary engine agreement. Keep proprietary renderers possible as optional capabilities.\nOptions: Open-source renderer in the default distribution / A proprietary default is acceptable if redistribution is straightforward\nSelected: Open-source renderer in the default distribution\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-8\">Question 8\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Fungi: renderer distribution\nQuestion: May Fungi automatically unpack its bundled renderer files when it first runs?\nDescription (Markdown source):\nYou have accepted one core executable with optional skill assets/helpers, plus bundled Chromium/Electron as a fallback. Chromium-based renderers normally need engine libraries, resource files and platform-specific helpers. One launchable download can contain these and unpack them into a private, versioned cache without an installer or internet download.\n\nThe distinction is one file to obtain and run versus literally one file existing at runtime. This question concerns Fungi's own bundled renderer; optional skill helpers are already accepted.\n\nSources: [CEF application layout](https://chromiumembedded.github.io/cef/general_usage#application-layout), [Electron packaging](https://www.electronjs.org/docs/latest/tutorial/application-distribution).\nRecommendation: Allow automatic local extraction. Keep the download self-contained, work offline on first launch, require no setup command or administrator privileges, and reuse the matching cached runtime.\nOptions: Yes: one launchable download may unpack its bundled runtime / No extraction: the bundled renderer must stay inside the executable / Ship a portable folder/archive with the runtime already beside fungi\nSelected: Yes: one launchable download may unpack its bundled runtime\nNotes:\n\u003c/code>\u003c/pre>\n","backlinks":["index","planning"]},{"id":"journal/2026-10-19-grill-689a37f9-b8c4-4f2a-9e54-282234bc2551","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-19\u003c/span>","updated":"2026-10-19","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-19\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `689a37f9-b8c4-4f2a-9e54-282234bc2551`\n\n## Question 9\n\n```text\nRound: First implementation milestone\nQuestion: Which desktop platforms must pass before the first implementation milestone is complete?\nDescription (Markdown source):\nElectron + Go and eventual cross-platform delivery are settled. This choice sets the first milestone's verification scope.\n\nStarting on the current Mac gives us one concrete environment for proving launch, submission, recovery and agent return. Windows and Linux would still need actual packaging and runtime checks before we claim support for them.\nRecommendation: Prove the first complete loop on macOS, keeping platform-specific code isolated, then verify Windows and Linux before a cross-platform release.\nOptions: macOS first; Windows and Linux verification follows / Require macOS, Windows and Linux in the first milestone\nSelected: macOS first; Windows and Linux verification follows\nNotes:\n```\n\n## Question 10\n\n```text\nRound: First implementation milestone\nQuestion: Which harnesses need a verified automatic return path in the first milestone?\nDescription (Markdown source):\nThe long-term goal remains broad harness support, with the already accepted manual “done” fallback wherever automatic delivery is unavailable.\n\nThis choice concerns real end-to-end verification of Fungi's initial adapters. A documented API or a simulated callback alone will not count. Additional harnesses require access to a suitable running environment; the existing jstack handoff here is useful evidence for starting with Codex, but is not yet a Fungi test.\nRecommendation: Verify Codex first, keep delivery separate from the session engine, and add other adapters against real harness behavior afterward.\nOptions: Codex first / Codex and Claude Code / Codex, Claude Code and OpenCode\nSelected: Codex, Claude Code and OpenCode\nNotes: Codex, Claude Code, OpenCode, Grok, Kimi, Pi\n\nall installed on this machine\n```\n\n## Question 11\n\n```text\nRound: First implementation milestone\nQuestion: What is the smallest UI demonstration that would make the first milestone useful to you?\nDescription (Markdown source):\nBoth HTML authoring and JSON authoring remain required. Both choices below include a form with text, a slider, submit/cancel, and returned JSON.\n\nA pasted or selected image proves artifact delivery with little UI work. A drawable canvas additionally proves a custom interactive component and image export, but adds drawing behavior to implement and verify.\nRecommendation: Start with a form and a pasted/selected image. Prove the complete saved-result and return path, then add drawing as the next custom component.\nOptions: Form plus pasted/selected image attachment / Form plus a minimal drawable canvas\nSelected: Form plus pasted/selected image attachment\nNotes:\n```\n\n## Question 12\n\n```text\nRound: First implementation milestone\nQuestion: How composable should the JSON authoring path be in this first milestone?\nDescription (Markdown source):\nA flat form schema is quick to demonstrate, but it would only exercise built-in fields. A small component tree can support nested groups and rows, with skill-supplied local JavaScript rendering custom component types.\n\nFor example, a skill could put a custom preview beside a slider without changing Go. This does not require a new expression language, package registry, or universal workflow format. Plain HTML remains available either way.\nRecommendation: Prove a small component tree and one skill-defined component early. Extensibility is central to Fungi, so the first milestone should exercise it directly.\nOptions: Nested composition plus local custom components / Flat built-in fields first; composition and custom JSON components follow\nSelected: Flat built-in fields first; composition and custom JSON components follow\nNotes: keep this simple first for now, i have bigger ideas for JSON authoring.\n```\n\n## Question 13\n\n```text\nRound: First implementation milestone\nQuestion: What should closing the native window mean?\nDescription (Markdown source):\nClosing must never be mistaken for submitting. In both choices, retain the latest saved draft and allow an explicit reopen. Custom pages can only recover draft data they have saved.\n\nReturning a “closed” outcome lets the agent know this interaction ended without an answer. Treating close as a pause leaves the interaction awaiting a later reopen, submission or cancellation, without waking the agent merely because the window closed.\nRecommendation: Return a distinct “closed” outcome and preserve the saved draft. It makes the lifecycle explicit and avoids an invisible pending interaction.\nOptions: End this interaction with a closed outcome; preserve its draft / Pause without notifying the agent; await reopen, submit or cancel\nSelected: End this interaction with a closed outcome; preserve its draft\nNotes:\n```\n\n## Question 14\n\n```text\nRound: First implementation milestone\nQuestion: Should the first milestone exercise a native helper process as an extension?\nDescription (Markdown source):\nNative helper executables are already allowed by the architecture. This choice is about when to prove that boundary.\n\nA tiny bundled helper could accept JSON and return JSON plus an artifact through the same session/result path. It would test the contract independently of Electron, without requiring a full screenshot app or a native widget library. HTML/JSON authors would not need to use this advanced interface.\nRecommendation: Include one tiny helper to prove the engine can support a capability outside Electron. Keep a production screenshot/capture UI for a later workflow.\nOptions: Include a tiny native helper contract test / Prove HTML/JSON first; native helper support follows\nSelected: Include a tiny native helper contract test\nNotes:\n```\n\n## Question 15\n\n```text\nRound: First implementation milestone\nQuestion: Does the first milestone need live updates from another local process after a window opens?\nDescription (Markdown source):\nWith either choice, sliders, animations, drawings and validation can react immediately inside the UI while the model is idle.\n\nThis question concerns external updates: for example, a development tool sending new preview data into the already-open Fungi window. Supporting that now adds an ongoing update interface beyond launch input and final submission. It does not require model polling, but it expands the first contract.\nRecommendation: Start with launch input, local UI interaction and final submission. Add external live updates once a concrete workflow needs them.\nOptions: Launch input and local interaction are enough initially / Include updates from other local processes immediately\nSelected: Launch input and local interaction are enough initially\nNotes:\n```\n","toc":[{"id":"question-9","title":"Question 9","depth":2},{"id":"question-10","title":"Question 10","depth":2},{"id":"question-11","title":"Question 11","depth":2},{"id":"question-12","title":"Question 12","depth":2},{"id":"question-13","title":"Question 13","depth":2},{"id":"question-14","title":"Question 14","depth":2},{"id":"question-15","title":"Question 15","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>689a37f9-b8c4-4f2a-9e54-282234bc2551\u003c/code>\u003c/p>\n\u003ch2 id=\"question-9\">Question 9\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: First implementation milestone\nQuestion: Which desktop platforms must pass before the first implementation milestone is complete?\nDescription (Markdown source):\nElectron + Go and eventual cross-platform delivery are settled. This choice sets the first milestone's verification scope.\n\nStarting on the current Mac gives us one concrete environment for proving launch, submission, recovery and agent return. Windows and Linux would still need actual packaging and runtime checks before we claim support for them.\nRecommendation: Prove the first complete loop on macOS, keeping platform-specific code isolated, then verify Windows and Linux before a cross-platform release.\nOptions: macOS first; Windows and Linux verification follows / Require macOS, Windows and Linux in the first milestone\nSelected: macOS first; Windows and Linux verification follows\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-10\">Question 10\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: First implementation milestone\nQuestion: Which harnesses need a verified automatic return path in the first milestone?\nDescription (Markdown source):\nThe long-term goal remains broad harness support, with the already accepted manual “done” fallback wherever automatic delivery is unavailable.\n\nThis choice concerns real end-to-end verification of Fungi's initial adapters. A documented API or a simulated callback alone will not count. Additional harnesses require access to a suitable running environment; the existing jstack handoff here is useful evidence for starting with Codex, but is not yet a Fungi test.\nRecommendation: Verify Codex first, keep delivery separate from the session engine, and add other adapters against real harness behavior afterward.\nOptions: Codex first / Codex and Claude Code / Codex, Claude Code and OpenCode\nSelected: Codex, Claude Code and OpenCode\nNotes: Codex, Claude Code, OpenCode, Grok, Kimi, Pi\n\nall installed on this machine\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-11\">Question 11\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: First implementation milestone\nQuestion: What is the smallest UI demonstration that would make the first milestone useful to you?\nDescription (Markdown source):\nBoth HTML authoring and JSON authoring remain required. Both choices below include a form with text, a slider, submit/cancel, and returned JSON.\n\nA pasted or selected image proves artifact delivery with little UI work. A drawable canvas additionally proves a custom interactive component and image export, but adds drawing behavior to implement and verify.\nRecommendation: Start with a form and a pasted/selected image. Prove the complete saved-result and return path, then add drawing as the next custom component.\nOptions: Form plus pasted/selected image attachment / Form plus a minimal drawable canvas\nSelected: Form plus pasted/selected image attachment\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-12\">Question 12\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: First implementation milestone\nQuestion: How composable should the JSON authoring path be in this first milestone?\nDescription (Markdown source):\nA flat form schema is quick to demonstrate, but it would only exercise built-in fields. A small component tree can support nested groups and rows, with skill-supplied local JavaScript rendering custom component types.\n\nFor example, a skill could put a custom preview beside a slider without changing Go. This does not require a new expression language, package registry, or universal workflow format. Plain HTML remains available either way.\nRecommendation: Prove a small component tree and one skill-defined component early. Extensibility is central to Fungi, so the first milestone should exercise it directly.\nOptions: Nested composition plus local custom components / Flat built-in fields first; composition and custom JSON components follow\nSelected: Flat built-in fields first; composition and custom JSON components follow\nNotes: keep this simple first for now, i have bigger ideas for JSON authoring.\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-13\">Question 13\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: First implementation milestone\nQuestion: What should closing the native window mean?\nDescription (Markdown source):\nClosing must never be mistaken for submitting. In both choices, retain the latest saved draft and allow an explicit reopen. Custom pages can only recover draft data they have saved.\n\nReturning a “closed” outcome lets the agent know this interaction ended without an answer. Treating close as a pause leaves the interaction awaiting a later reopen, submission or cancellation, without waking the agent merely because the window closed.\nRecommendation: Return a distinct “closed” outcome and preserve the saved draft. It makes the lifecycle explicit and avoids an invisible pending interaction.\nOptions: End this interaction with a closed outcome; preserve its draft / Pause without notifying the agent; await reopen, submit or cancel\nSelected: End this interaction with a closed outcome; preserve its draft\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-14\">Question 14\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: First implementation milestone\nQuestion: Should the first milestone exercise a native helper process as an extension?\nDescription (Markdown source):\nNative helper executables are already allowed by the architecture. This choice is about when to prove that boundary.\n\nA tiny bundled helper could accept JSON and return JSON plus an artifact through the same session/result path. It would test the contract independently of Electron, without requiring a full screenshot app or a native widget library. HTML/JSON authors would not need to use this advanced interface.\nRecommendation: Include one tiny helper to prove the engine can support a capability outside Electron. Keep a production screenshot/capture UI for a later workflow.\nOptions: Include a tiny native helper contract test / Prove HTML/JSON first; native helper support follows\nSelected: Include a tiny native helper contract test\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-15\">Question 15\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: First implementation milestone\nQuestion: Does the first milestone need live updates from another local process after a window opens?\nDescription (Markdown source):\nWith either choice, sliders, animations, drawings and validation can react immediately inside the UI while the model is idle.\n\nThis question concerns external updates: for example, a development tool sending new preview data into the already-open Fungi window. Supporting that now adds an ongoing update interface beyond launch input and final submission. It does not require model polling, but it expands the first contract.\nRecommendation: Start with launch input, local UI interaction and final submission. Add external live updates once a concrete workflow needs them.\nOptions: Launch input and local interaction are enough initially / Include updates from other local processes immediately\nSelected: Launch input and local interaction are enough initially\nNotes:\n\u003c/code>\u003c/pre>\n","backlinks":["index","planning"]},{"id":"journal/2026-10-19-grill-eb02aa23-b51f-42c9-b9c0-8fa331bfb02c","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-19\u003c/span>","updated":"2026-10-19","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-19\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `eb02aa23-b51f-42c9-b9c0-8fa331bfb02c`\n\n## Question 1\n\n```text\nRound: Fungi: foundation decisions\nQuestion: What should “single binary” mean when a skill adds new capabilities?\nDescription (Markdown source):\nThe core can be one executable per OS/architecture. A skill's HTML, CSS, JavaScript, and images are content files. New native functionality must either live in an additional executable, be compiled into fungi, or be bundled and extracted.\n\nThis choice determines how easily someone can publish a new capability without rebuilding fungi.\nRecommendation: One fungi executable plus ordinary skill assets, with optional native helper executables for capabilities that need them. Basic UI authors only write HTML and call the bridge.\nOptions: One core executable; skill assets and optional native helpers / Every workflow must use one executable; rebuild fungi for new native capabilities / One download may extract bundled native helpers at runtime\nSelected: One core executable; skill assets and optional native helpers\nNotes: one core fungi executable \"orchestrates\" the workflow. skills may bring in optional excutables or assets. fungi itselt may also be optionally be extended with capabilities stored in a relatively-adjacent folder.\n```\n\n## Question 2\n\n```text\nRound: Fungi: foundation decisions\nQuestion: What deployment tradeoff is acceptable for the first native webview renderer?\nDescription (Markdown source):\nSystem webviews keep the renderer small. macOS has WebKit; Windows needs WebView2; Linux needs compatible GTK/WebKitGTK libraries. Shipping a full rendering engine changes size and maintenance substantially.\n\nSources: [webview requirements](https://github.com/webview/webview#prerequisites), [WebView2 distribution](https://learn.microsoft.com/en-us/microsoft-edge/webview2/concepts/distribution).\nRecommendation: Use system webviews on an explicit supported desktop baseline and report missing support clearly. Keep automatic installation out of the first release.\nOptions: System webviews on supported desktops; clearly reject missing support / System webviews with an automatic browser fallback / Bundle a rendering engine to avoid external webview prerequisites\nSelected: Bundle a rendering engine to avoid external webview prerequisites\nNotes: bundle the simplest and lightest rendering engine you can find. i don't want to run into webview2, webkitgtk issues on different machines. i want it to run cleanly straight out the box.\n```\n\n## Question 3\n\n````text\nRound: Fungi: foundation decisions\nQuestion: Which authoring interface should we make easiest first?\nDescription (Markdown source):\nA direct path lets a skill supply an HTML file or asset folder and call a tiny bridge such as ready(), submit(), and cancel(). Existing libraries remain usable. A catalog path lets an agent generate JSON from a predefined set of components, but someone must maintain the catalog and renderer mapping.\n\n```mermaid\nflowchart LR\n  Skill[Skill and UI files] --> Engine[Fungi session]\n  Engine --> UI[Renderer]\n  UI --> Result[Saved response]\n  Result --> Agent[Calling agent]\n```\nRecommendation: Ordinary HTML/assets with a tiny bridge. Include a small primitive test UI; add JSON-driven forms or other component catalogs above that interface when useful.\nOptions: HTML/assets plus a tiny bridge first / JSON component catalog first, with HTML as an escape hatch / Both paths equally supported in the first release\nSelected: Both paths equally supported in the first release\nNotes:\n````\n\n## Question 4\n\n```text\nRound: Fungi: foundation decisions\nQuestion: If fungi cannot establish automatic delivery to the current agent, what should launch do?\nDescription (Markdown source):\nA background process ID is not enough to wake an idle agent. Harnesses expose different completion and callback capabilities. Repeated model polling remains prohibited in every option.\nRecommendation: Stop before opening and explain the unavailable delivery route. Offer a separately selected manual mode so automatic-return guarantees are never implied when they are absent.\nOptions: Stop before opening; allow explicitly selected manual mode / Open the UI and ask the user to send “done” after submitting\nSelected: Open the UI and ask the user to send “done” after submitting\nNotes: best effort automatic delivery on every popular harness. fallback to saying \"done\".\n```\n\n## Question 5\n\n```text\nRound: Fungi: foundation decisions\nQuestion: Which agent location must the first release support?\nDescription (Markdown source):\nA local executable can open a window on the same desktop. An agent running on a remote server or in a container needs an explicit connection to the user's desktop and a way to transfer artifacts. That adds connection setup and authentication beyond the local runner.\nRecommendation: Start with agents and UI on the same desktop. Keep the protocol compatible with a future remote transport without building that transport now.\nOptions: Local agents and UI on the same desktop first / Remote/container agents must reach the user's desktop in the first release\nSelected: Local agents and UI on the same desktop first\nNotes:\n```\n\n## Question 6\n\n```text\nRound: Fungi: foundation decisions\nQuestion: What recovery should be automatic after the relevant processes have exited?\nDescription (Markdown source):\nHours of AFK time and ordinary sleep can leave the local session alive without model polling. Once all fungi and harness processes have stopped, delivery needs something to start them again. Saved results can survive independently.\n\nThis choice concerns automatic restart, not whether responses are saved reliably.\nRecommendation: Preserve drafts/results and support explicit reopen or collect after restart. Prove reliable live-session AFK behavior first; add harness-start hooks or login services only if needed.\nOptions: Explicit reopen/collect after restart is acceptable / Recover automatically when the harness next starts / Recover and deliver automatically after login/reboot\nSelected: Explicit reopen/collect after restart is acceptable\nNotes: even though i wanted automatic delivery, on certain extreme cases where it proves difficult, we may fallback to the user manually saying \"done\"\n```\n","toc":[{"id":"question-1","title":"Question 1","depth":2},{"id":"question-2","title":"Question 2","depth":2},{"id":"question-3","title":"Question 3","depth":2},{"id":"question-4","title":"Question 4","depth":2},{"id":"question-5","title":"Question 5","depth":2},{"id":"question-6","title":"Question 6","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>eb02aa23-b51f-42c9-b9c0-8fa331bfb02c\u003c/code>\u003c/p>\n\u003ch2 id=\"question-1\">Question 1\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Fungi: foundation decisions\nQuestion: What should “single binary” mean when a skill adds new capabilities?\nD  / System webviews with an automatic browser fallback / Bundle a rendering engine to avoid external webview prerequisites\nSelected: Bundle a rendering engine to avoid external webview prerequisites\nNotes: bundle the simplest and lightest rendering engine you can find. i don't want to run into webview2, webkitgtk issues on different machines. i want it to run cleanly straight out the box.\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-3\">Question 3\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Fungi: foundation decisions\nQuestion: Which authoring interface should we make easiest first?\nDescription (Markdown source):\nA direct path lets a skill supply an HTML file or asset folder and call a tiny bridge such as ready(), submit(), and cancel(). Existing libraries remain usable. A catalog path lets an agent generate JSON from a predefined set of components, but someone must maintain the catalog and renderer mapping.\n\n```mermaid\nflowchart LR\n  Skill[Skill and UI files] --&gt; Engine[Fungi session]\n  Engine --&gt; UI[Renderer]\n  UI --&gt; Result[Saved response]\n  Result --&gt; Agent[Calling agent]\n```\nRecommendation: Ordinary HTML/assets with a tiny bridge. Include a small primitive test UI; add JSON-driven forms or other component catalogs above that interface when useful.\nOptions: HTML/assets plus a tiny bridge first / JSON component catalog first, with HTML as an escape hatch / Both paths equally supported in the first release\nSelected: Both paths equally supported in the first release\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-4\">Question 4\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Fungi: foundation decisions\nQuestion: If fungi cannot establish automatic delivery to the current agent, what should launch do?\nDescription (Markdown source):\nA background process ID is not enough to wake an idle agent. Harnesses expose different completion and callback capabilities. Repeated model polling remains prohibited in every option.\nRecommendation: Stop before opening and explain the unavailable delivery route. Offer a separately selected manual mode so automatic-return guarantees are never implied when they are absent.\nOptions: Stop before opening; allow explicitly selected manual mode / Open the UI and ask the user to send “done” after submitting\nSelected: Open the UI and ask the user to send “done” after submitting\nNotes: best effort automatic delivery on every popular harness. fallback to saying \"done\".\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-5\">Question 5\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Fungi: foundation decisions\nQuestion: Which agent location must the first release support?\nDescription (Markdown source):\nA local executable can open a window on the same desktop. An agent running on a remote server or in a container needs an explicit connection to the user's desktop and a way to transfer artifacts. That adds connection setup and authentication beyond the local runner.\nRecommendation: Start with agents and UI on the same desktop. Keep the protocol compatible with a future remote transport without building that transport now.\nOptions: Local agents and UI on the same desktop first / Remote/container agents must reach the user's desktop in the first release\nSelected: Local agents and UI on the same desktop first\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-6\">Question 6\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Fungi: foundation decisions\nQuestion: What recovery should be automatic after the relevant processes have exited?\nDescription (Markdown source):\nHours of AFK time and ordinary sleep can leave the local session alive without model polling. Once all fungi and harness processes have stopped, delivery needs something to start them again. Saved results can survive independently.\n\nThis choice concerns automatic restart, not whether responses are saved reliably.\nRecommendation: Preserve drafts/results and support explicit reopen or collect after restart. Prove reliable live-session AFK behavior first; add harness-start hooks or login services only if needed.\nOptions: Explicit reopen/collect after restart is acceptable / Recover automatically when the harness next starts / Recover and deliver automatically after login/reboot\nSelected: Explicit reopen/collect after restart is acceptable\nNotes: even though i wanted automatic delivery, on certain extreme cases where it proves difficult, we may fallback to the user manually saying \"done\"\n\u003c/code>\u003c/pre>\n","backlinks":["index","planning"]},{"id":"journal/2026-10-20-grill-397cc4f4-31e2-4fd5-a08e-30ee197e3297","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-20\u003c/span>","updated":"2026-10-20","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-20\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `397cc4f4-31e2-4fd5-a08e-30ee197e3297`\n\n## Question 16\n\n```text\nRound: Reliable agent return: remaining decisions\nQuestion: May automatic return require an explicitly enabled integration for harnesses whose built-in tools cannot wait long enough?\nDescription (Markdown source):\nThe Go + Electron prototype now supports HTML, flat forms, pasted/selected images, saved drafts, cancellation and crash recovery. Five installed harnesses returned real Fungi helper results without repeated model checks. Claude, Grok and Pi passed three-minute waits; those tests do not establish arbitrary AFK reliability.\n\nThere is a concrete compatibility issue: the tested OpenCode 1.18.34 uses bounded Bash execution. OpenCode's v2 documentation describes a background shell with completion notifications and no default timeout, but that is a different tool contract from the installed v1 configuration. We should prefer native capabilities wherever they work.\n\nAn optional Fungi integration could bind the exact originating conversation and deliver one completion event. Depending on the harness, the user would explicitly load a bundled plugin or startup configuration. That adds a setup step for that harness, though Fungi itself would still be a portable folder with no installer or separately installed runtime. This would not require a general plugin framework for UI authors.\n\nIf setup is forbidden, support must depend on suitable built-in harness capabilities; unsupported versions would use the already accepted manual ‘done’ fallback and would not count as verified automatic return. No harness configuration has been changed.\n\nSources: [OpenCode Bash implementation](https://github.com/anomalyco/opencode/blob/dev/packages/core/src/tool/bash.ts), [OpenCode v2 background shell](https://dev.opencode.ai/v2/docs/tools/), [OpenCode plugins](https://opencode.ai/docs/plugins/).\nRecommendation: Allow a thin, explicitly enabled integration only where native mechanisms are insufficient. Keep skill authoring unchanged, preserve manual fallback, and verify exact-session delivery before claiming support.\nOptions: Allow optional, explicitly enabled harness integrations where needed / Require no harness setup; use manual fallback on unsupported versions\nSelected: Require no harness setup; use manual fallback on unsupported versions\nNotes:\n```\n\n## Question 17\n\n```text\nRound: Reliable agent return: remaining decisions\nQuestion: How should we unblock the required Kimi verification?\nDescription (Markdown source):\nKimi Code 2.0.1 is installed, but the live probe stopped before executing a tool: its selected managed:kimi-code provider has no credential configured. This is an authentication prerequisite, not evidence that Fungi's return mechanism failed. The other five harnesses completed real response tests.\n\nThe CLI's own help provides `kimi login` for its normal device-code sign-in flow. You can run that yourself, finish authentication, and then mark the first choice below. If you prefer another already configured Kimi provider, put only its non-secret name in Notes. Do not put passwords, tokens or API keys in this form.\n\nDeferring Kimi would leave the accepted six-harness milestone incomplete unless you explicitly narrow that milestone. We can retain Kimi as an outstanding target and continue the other approved work.\nRecommendation: Complete Kimi's normal sign-in yourself, then resume verification with all six harnesses still required.\nOptions: I have signed in to Kimi; retry the verification / Keep Kimi required, but defer its test until I can sign in / Use another already configured Kimi provider named in Notes\nSelected: I have signed in to Kimi; retry the verification\nNotes:\n```\n","toc":[{"id":"question-16","title":"Question 16","depth":2},{"id":"question-17","title":"Question 17","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>397cc4f4-31e2-4fd5-a08e-30ee197e3297\u003c/code>\u003c/p>\n\u003ch2 id=\"question-16\">Question 16\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Reliable agent return: remaining decisions\nQuestion: May automatic return require an explicitly enabled integration for harnesses whose built-in tools cannot wait long enough?\nDescription (Markdown source):\nThe Go + Electron prototype now supports HTML, flat forms, pasted/selected images, saved drafts, cancellation and crash recovery. Five installed harnesses returned real Fungi helper results without repeated model checks. Claude, Grok and Pi passed three-minute waits; those tests do not establish arbitrary AFK reliability.\n\nThere is a concrete compatibility issue: the tested OpenCode 1.18.34 uses bounded Bash execution. OpenCode's v2 documentation describes a background shell with completion notifications and no default timeout, but that is a different tool contract from the installed v1 configuration. We should prefer native capabilities wherever they work.\n\nAn optional Fungi integration could bind the exact originating conversation and deliver one completion event. Depending on the harness, the user would explicitly load a bundled plugin or startup configuration. That adds a setup step for that harness, though Fungi itself would still be a portable folder with no installer or separately installed runtime. This would not require a general plugin framework for UI authors.\n\nIf setup is forbidden, support must depend on suitable built-in harness capabilities; unsupported versions would use the already accepted manual ‘done’ fallback and would not count as verified automatic return. No harness configuration has been changed.\n\nSources: [OpenCode Bash implementation](https://github.com/anomalyco/opencode/blob/dev/packages/core/src/tool/bash.ts), [OpenCode v2 background shell](https://dev.opencode.ai/v2/docs/tools/), [OpenCode plugins](https://opencode.ai/docs/plugins/).\nRecommendation: Allow a thin, explicitly enabled integration only where native mechanisms are insufficient. Keep skill authoring unchanged, preserve manual fallback, and verify exact-session delivery before claiming support.\nOptions: Allow optional, explicitly enabled harness integrations where needed / Require no harness setup; use manual fallback on unsupported versions\nSelected: Require no harness setup; use manual fallback on unsupported versions\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-17\">Question 17\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Reliable agent return: remaining decisions\nQuestion: How should we unblock the required Kimi verification?\nDescription (Markdown source):\nKimi Code 2.0.1 is installed, but the live probe stopped before executing a tool: its selected managed:kimi-code provider has no credential configured. This is an authentication prerequisite, not evidence that Fungi's return mechanism failed. The other five harnesses completed real response tests.\n\nThe CLI's own help provides `kimi login` for its normal device-code sign-in flow. You can run that yourself, finish authentication, and then mark the first choice below. If you prefer another already configured Kimi provider, put only its non-secret name in Notes. Do not put passwords, tokens or API keys in this form.\n\nDeferring Kimi would leave the accepted six-harness milestone incomplete unless you explicitly narrow that milestone. We can retain Kimi as an outstanding target and continue the other approved work.\nRecommendation: Complete Kimi's normal sign-in yourself, then resume verification with all six harnesses still required.\nOptions: I have signed in to Kimi; retry the verification / Keep Kimi required, but defer its test until I can sign in / Use another already configured Kimi provider named in Notes\nSelected: I have signed in to Kimi; retry the verification\nNotes:\n\u003c/code>\u003c/pre>\n","backlinks":["index","planning"]},{"id":"journal/2026-10-20-grill-desktop-arrangements","title":"Desktop verification arrangements","section":"Journal","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-20\u003c/span>","updated":"2026-10-20","summary":"","source":"---\ntitle: Desktop verification arrangements\nupdated: 2026-10-20\n---\n# Desktop verification arrangements\n\nCompleted through the Fungi-backed historical grill-form, session `3863d61f14f01136a6d967630a00af91`. The completion notice reached its originating conversation after the previous turn ended. One collection using the supplied executable and state directory returned `submitted`, exit 0.\n\n[Original questions](../evidence/2026-10-20-skill-proof/environment-questions.json) · [Collected result](../evidence/2026-10-20-skill-proof/environment-result.json)\n\n| Question | Selected answer | Notes |\n| --- | --- | --- |\n| 18. Which additional desktop test environments should we use? | Defer additional desktop checks for now | “i do have a windows. but lets leave those verifications for last and defer it for now” |\n| 19. How should we arrange sleep/wake verification on this Mac? | I will sleep and wake this Mac manually during the next test | None |\n\nAccepted consequences: keep additional desktop verification until last; the user has a Windows machine, but no access/setup is requested now. Prepare the current Mac's sleep/wake fixture and let the user perform the sleep/wake cycle. Do not trigger system sleep automatically. The independently running two-hour probe retains its one callback.\n\nThese answers settle test arrangements. They do not establish passing sleep/wake or additional-desktop results.\n","toc":[],"titleAnchor":"desktop-verification-arrangements","links":[],"attachments":[{"path":"evidence/2026-10-20-skill-proof/environment-questions.json","sha256":"48e34927a53f27b5cfa46afc9d29fbfc88ab68d77bb1b92bf5702092a56cfacd"},{"path":"evidence/2026-10-20-skill-proof/environment-result.json","sha256":"7c479e4c97ad5d95c45243e2d89cc2dd0f134fc06f47b6d500b5fbf3bd96fa00"}],"html":"\u003cp>Completed through the Fungi-backed historical grill-form, session \u003ccode>3863d61f14f01136a6d967630a00af91\u003c/code>. The completion notice reached its originating conversation after the previous turn ended. One collection using the supplied executable and state directory returned \u003ccode>submitted\u003c/code>, exit 0.\u003c/p>\n\u003cp>\u003ca href=\"evidence/2026-10-20-skill-proof/environment-questions.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 48e34927a53f27b5cfa46afc9d29fbfc88ab68d77bb1b92bf5702092a56cfacd\">Original questions\u003c/a> · \u003ca href=\"evidence/2026-10-20-skill-proof/environment-result.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 7c479e4c97ad5d95c45243e2d89cc2dd0f134fc06f47b6d500b5fbf3bd96fa00\">Collected result\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Question\u003c/th>\n\u003cth>Selected answer\u003c/th>\n\u003cth>Notes\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>18. Which additional desktop test environments should we use?\u003c/td>\n\u003ctd>Defer additional desktop checks for now\u003c/td>\n\u003ctd>“i do have a windows. but lets leave those verifications for last and defer it for now”\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>19. How should we arrange sleep/wake verification on this Mac?\u003c/td>\n\u003ctd>I will sleep and wake this Mac manually during the next test\u003c/td>\n\u003ctd>None\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Accepted consequences: keep additional desktop verification until last; the user has a Windows machine, but no access/setup is requested now. Prepare the current Mac's sleep/wake fixture and let the user perform the sleep/wake cycle. Do not trigger system sleep automatically. The independently running two-hour probe retains its one callback.\u003c/p>\n\u003cp>These answers settle test arrangements. They do not establish passing sleep/wake or additional-desktop results.\u003c/p>\n","backlinks":["index","planning","verification/runs/2026-10-20-skill-proof"]},{"id":"journal/2026-10-22-grill-0c10be35-a07a-4a8d-8d5d-39fda5b2e1bc","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-22\u003c/span>","updated":"2026-10-22","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-22\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `0c10be35-a07a-4a8d-8d5d-39fda5b2e1bc`\n\n## Question 20\n\n```text\nRound: Linux distribution boundary\nQuestion: How should Fungi handle Linux systems that require installation to run Chromium's sandbox?\nDescription (Markdown source):\nThe foundation now has a small, unchanged four-method authoring API, broader browser rendering, durable drafts/artifacts, and automated platform checks. One distribution conflict remains.\n\n| Tested Linux environment | Observed result |\n| --- | --- |\n| Ubuntu 22.04 hosted desktop | Session workflow and 20 rendering checks pass; WebGL is unavailable on the virtual display |\n| Ubuntu 24.04 hosted desktop | The portable renderer aborts before opening because its sandbox cannot start under the default host policy |\n\nUbuntu 24.04 restricts unprivileged user namespaces. Chromium then requests a root-owned sandbox helper. Supporting this environment through a system package or an application-specific policy adds an installation/setup step. We have not changed machine security settings or disabled the renderer sandbox.\n\nThis is a real choice between the original no-install promise and wider Linux coverage. Cross-platform core tests already pass, but that alone does not establish desktop renderer support.\n\nSources: [observed CI run](https://github.com/rengwu/fungi/actions/runs/39752716551), [Ubuntu AppArmor documentation](https://documentation.ubuntu.com/security/security-features/privilege-restriction/apparmor/).\nRecommendation: Keep the portable, no-install default and claim only Linux environments that pass the desktop checks. Make unsupported launches clear. Add an optional Linux package later if its wider reach is worth maintaining another distribution path.\nOptions: Keep no-install; support explicitly verified Linux environments / Allow an optional Linux installation/package path for wider support / Focus on macOS and Windows first; defer Linux desktop UI support\nSelected: Keep no-install; support explicitly verified Linux environments\nNotes: \nStatus: feedback\nPrototype states: {}\nComments: []\n```\n","toc":[{"id":"question-20","title":"Question 20","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>0c10be35-a07a-4a8d-8d5d-39fda5b2e1bc\u003c/code>\u003c/p>\n\u003ch2 id=\"question-20\">Question 20\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Linux distribution boundary\nQuestion: How should Fungi handle Linux systems that require installation to run Chromium's sandbox?\nDescription (Markdown source):\nThe foundation now has a small, unchanged four-method authoring API, broader browser rendering, durable drafts/artifacts, and automated platform checks. One distribution conflict remains.\n\n| Tested Linux environment | Observed result |\n| --- | --- |\n| Ubuntu 22.04 hosted desktop | Session workflow and 20 rendering checks pass; WebGL is unavailable on the virtual display |\n| Ubuntu 24.04 hosted desktop | The portable renderer aborts before opening because its sandbox cannot start under the default host policy |\n\nUbuntu 24.04 restricts unprivileged user namespaces. Chromium then requests a root-owned sandbox helper. Supporting this environment through a system package or an application-specific policy adds an installation/setup step. We have not changed machine security settings or disabled the renderer sandbox.\n\nThis is a real choice between the original no-install promise and wider Linux coverage. Cross-platform core tests already pass, but that alone does not establish desktop renderer support.\n\nSources: [observed CI run](https://github.com/rengwu/fungi/actions/runs/39752716551), [Ubuntu AppArmor documentation](https://documentation.ubuntu.com/security/security-features/privilege-restriction/apparmor/).\nRecommendation: Keep the portable, no-install default and claim only Linux environments that pass the desktop checks. Make unsupported launches clear. Add an optional Linux package later if its wider reach is worth maintaining another distribution path.\nOptions: Keep no-install; support explicitly verified Linux environments / Allow an optional Linux installation/package path for wider support / Focus on macOS and Windows first; defer Linux desktop UI support\nSelected: Keep no-install; support explicitly verified Linux environments\nNotes: \nStatus: feedback\nPrototype states: {}\nComments: []\n\u003c/code>\u003c/pre>\n","backlinks":["index","planning","verification/runs/2026-10-22-baselines"]},{"id":"journal/2026-10-22-grill-b8ce5a10-7261-48c1-9d80-ee54e103ec5e","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-22\u003c/span>","updated":"2026-10-22","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-22\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `b8ce5a10-7261-48c1-9d80-ee54e103ec5e`\n\n## Question 21\n\n````text\nRound: Final Windows desktop check\nQuestion: What is the result of the portable Windows check?\nDescription (Markdown source):\nThe engine work and hosted checks are complete for the verified baseline. You previously asked to leave your Windows machine until last; this is that remaining check. Hosted Windows Server passes, but it does not prove an extracted archive works on your own desktop.\n\nUse the Windows ZIP linked in this conversation (`fungi-win32-x64-2026-10-22T09-50-20-630Z.zip`, about 157 MiB). Transfer it to Windows and extract the **whole folder**. The included `VERIFY.md` has the full checklist. No Go, Node, npm, separate browser, or installer is needed.\n\n**1. Open PowerShell in the extracted folder and run:**\n\n```powershell\n$env:FUNGI_STATE_DIR = Join-Path $env:TEMP ('fungi-check-' + [guid]::NewGuid().ToString('N'))\nGet-Content .\\BUILD.json\n.\\fungi.exe describe\n.\\fungi.exe open --exec .\\examples\\helper.exe --delivery wait\n$opened = .\\fungi.exe open .\\examples\\compare\\index.html --delivery manual | ConvertFrom-Json\n```\n\nThe helper should return `submitted` with a text artifact. In the comparison window, move the divider, pick a preference, enter a note, wait for **Draft saved**, then close the window.\n\n**2. Collect and reopen:**\n\n```powershell\n.\\fungi.exe collect $opened.session\n$reopened = .\\fungi.exe reopen $opened.session --delivery manual | ConvertFrom-Json\n```\n\nThe first result should be `closed`. The reopened window should restore the divider, preference, and note. Click **Send review**.\n\n**3. Collect the submitted result and verify the PNG:**\n\n```powershell\n$result = .\\fungi.exe collect $reopened.session | ConvertFrom-Json\n$result | ConvertTo-Json -Depth 20\nGet-FileHash -Algorithm SHA256 $result.artifacts[0].path\n```\n\nExpect `submitted` and a PNG whose hash matches the result. Open the PNG and confirm it matches your comparison. Finally launch one more comparison, click **Cancel**, and collect that new session once; expect `cancelled`.\n\nIn **Notes**, include your Windows version, whether restored values and PNG looked correct, and any error or failed step. You can paste screenshots. If startup is blocked, preserve the error and diagnostic log; do not bypass OS protections. Keep the test state directory until we have checked the result.\n\nIf now is inconvenient, choose **Defer** below. That keeps physical Windows acceptance open; it does not discard the completed engine work.\nRecommendation: Complete this on your Windows machine when convenient. Choose the observed result; choose Defer if you have not run it. I will wait without polling.\nOptions: Completed: launch, draft recovery, PNG/hash, and cancellation all worked / Blocked or failed: details are in Notes / Defer physical Windows verification; keep the current development-preview boundary\nSelected: Something else\nNotes: please write your instructions into the wiki. i will git pull on windows, and let it run your instructions from there\nStatus: feedback\nPrototype states: {}\nComments: []\n````\n","toc":[{"id":"question-21","title":"Question 21","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>b8ce5a10-7261-48c1-9d80-ee54e103ec5e\u003c/code>\u003c/p>\n\u003ch2 id=\"question-21\">Question 21\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Final Windows desktop check\nQuestion: What is the result of the portable Windows check?\nDescription (Markdown source):\nThe engine work and hosted checks are complete for the verified baseline. You previously asked to leave your Windows machine until last; this is that remaining check. Hosted Windows Server passes, but it does not prove an extracted archive works on your own desktop.\n\nUse the Windows ZIP linked in this conversation (`fungi-win32-x64-2026-10-22T09-50-20-630Z.zip`, about 157 MiB). Transfer it to Windows and extract the **whole folder**. The included `VERIFY.md` has the full checklist. No Go, Node, npm, separate browser, or installer is needed.\n\n**1. Open PowerShell in the extracted folder and run:**\n\n```powershell\n$env:FUNGI_STATE_DIR = Join-Path $env:TEMP ('fungi-check-' + [guid]::NewGuid().ToString('N'))\nGet-Content .\\BUILD.json\n.\\fungi.exe describe\n.\\fungi.exe open --exec .\\examples\\helper.exe --delivery wait\n$opened = .\\fungi.exe open .\\examples\\compare\\index.html --delivery manual | ConvertFrom-Json\n```\n\nThe helper should return `submitted` with a text artifact. In the comparison window, move the divider, pick a preference, enter a note, wait for **Draft saved**, then close the window.\n\n**2. Collect and reopen:**\n\n```powershell\n.\\fungi.exe collect $opened.session\n$reopened = .\\fungi.exe reopen $opened.session --delivery manual | ConvertFrom-Json\n```\n\nThe first result should be `closed`. The reopened window should restore the divider, preference, and note. Click **Send review**.\n\n**3. Collect the submitted result and verify the PNG:**\n\n```powershell\n$result = .\\fungi.exe collect $reopened.session | ConvertFrom-Json\n$result | ConvertTo-Json -Depth 20\nGet-FileHash -Algorithm SHA256 $result.artifacts[0].path\n```\n\nExpect `submitted` and a PNG whose hash matches the result. Open the PNG and confirm it matches your comparison. Finally launch one more comparison, click **Cancel**, and collect that new session once; expect `cancelled`.\n\nIn **Notes**, include your Windows version, whether restored values and PNG looked correct, and any error or failed step. You can paste screenshots. If startup is blocked, preserve the error and diagnostic log; do not bypass OS protections. Keep the test state directory until we have checked the result.\n\nIf now is inconvenient, choose **Defer** below. That keeps physical Windows acceptance open; it does not discard the completed engine work.\nRecommendation: Complete this on your Windows machine when convenient. Choose the observed result; choose Defer if you have not run it. I will wait without polling.\nOptions: Completed: launch, draft recovery, PNG/hash, and cancellation all worked / Blocked or failed: details are in Notes / Defer physical Windows verification; keep the current development-preview boundary\nSelected: Something else\nNotes: please write your instructions into the wiki. i will git pull on windows, and let it run your instructions from there\nStatus: feedback\nPrototype states: {}\nComments: []\n\u003c/code>\u003c/pre>\n","backlinks":["index","planning","verification/windows"]},{"id":"research/bundled-renderers","title":"Bundled renderer follow-up","section":"Research","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-19\u003c/span>","updated":"2026-10-19","summary":"","source":"---\ntitle: Bundled renderer follow-up\nupdated: 2026-10-19\n---\n# Bundled renderer follow-up\n\n[Research overview](index.md) · [Accepted decisions](../planning.md)\n\nThe user chose bundled rendering to avoid WebView2/WebKitGTK setup, then accepted Chromium/Electron as a worst-case fallback. This page records the investigation that followed. The user has since selected Electron + Go; no renderer has been run as part of fungi.\n\nLater decisions require an open-source default, substantial adoption and recent healthy development, and portable folder/archive packaging. These supersede the proprietary-engine and extraction questions discussed below. See the [current maintenance assessment and recommendation](renderer-health.md).\n\n## Revised assessment\n\n| Candidate | Evidence and fit | Recommendation |\n| --- | --- | --- |\n| Sciter.JS / scapp | Small standalone engine; JavaScript and substantial desktop UI facilities; intentionally different DOM/CSS behavior | Excluded from the default by the later open-source requirement; retain the measurements as research |\n| Servo | Open-source embeddable web engine, current library API and release process | Evaluate if open source and broader web compatibility matter enough to accept a young embedding integration |\n| CEF | Bundled Chromium with native APIs, multiprocess isolation, mature browser compatibility | Strong fallback for a Go/native host; compare integration effort instead of assuming it is simpler than Electron |\n| Electron | Bundled Chromium plus Node and desktop shell APIs | Strong fallback when reducing platform integration and author friction is more valuable than minimum footprint |\n| Ultralight | WebKit-derived engine with official native APIs | Exclude under ordinary SDK terms: developer-platform use requires a separate agreement |\n| Blitz, litehtml, RmlUi | Smaller rendering/UI building blocks with narrower web semantics | Useful specialized extensions; avoid making fungi implement the missing browser platform |\n| Blitsen | Niche Blitz-based HTML/JS runtime; now embeds Bun | Interesting watchlist entry; pre-alpha, partial web APIs, changing architecture and larger current baseline |\n\n## Sciter: inspect the current distribution, not old size claims\n\nThe archived GitHub SDKs point to the current GitLab project. Revision `18d47968a560693b5286fa54995149991a480f6f` identifies release 6.0.5.3. Downloaded its Linux x64 `scapp` and `libsciter.so` into a temporary directory and inspected ELF section/dynamic tables without executing them. [Pinned SDK](https://gitlab.com/sciter-engine/sciter-js-sdk/-/tree/18d47968a560693b5286fa54995149991a480f6f/bin/linux/x64)\n\n| Inspected file | Bytes | Meaning |\n| --- | --- | --- |\n| `scapp` | 18,888,792 | Standalone runner, about 18.9 MB decimal |\n| `libsciter.so` | 25,052,768 | Separate embeddable shared library, about 25.1 MB decimal |\n\nThese are alternative artifacts, not two sizes to add together for every app. Neither is a measured fungi distribution. [Inspection record](../attachments/research/sciter-linux-inspection.json)\n\nBoth list the same direct dependencies: `libuuid.so.1`, `libfontconfig.so.1`, `libfreetype.so.6`, `libGLESv2.so.2`, `libEGL.so.1`, `libstdc++.so.6`, `libm.so.6`, `libgcc_s.so.1`, `libc.so.6`, and `ld-linux-x86-64.so.2`. There is no direct GTK/WebKitGTK entry. This does not prove there are no dynamically loaded or transitive dependencies, nor establish Wayland/X11 compatibility or a clean-machine baseline. Embedded version strings include `GLIBC_2.35`; strings alone do not determine the minimum supported glibc version.\n\nThe official documentation explicitly describes browser differences, simplified DOM APIs, and its own layout alternatives. For example, ordinary inline HTML event attributes are not supported by default. A JavaScript engine is not the same thing as browser API compatibility. [Design differences](https://docs.sciter.com/docs/intro/), [HTML behavior](https://docs.sciter.com/docs/HTML/), [DOM](https://docs.sciter.com/docs/DOM/)\n\nScapp can carry appended UI resources. That does not establish how to combine a Go orchestrator and this renderer into one no-extraction executable. The engine has its own EULA; the SDK repository's BSD license must not be assumed to license the engine binary itself. [Packaging](https://docs.sciter.com/docs/scapp/), [engine EULA](https://gitlab.com/sciter-engine/sciter-js-sdk/-/blob/main/SCITER-ENGINE-EULA.md)\n\n## Servo: a real embedding option, still requiring evidence\n\nServo announced its first crates.io library release and an LTS policy in April 2026. Its own announcement explicitly says it is not a 1.0 release. [Library release](https://servo.org/blog/2026/04/13/servo-0.1.0-release/)\n\nGitHub release metadata for v0.7.0 lists a 49,312,528-byte Linux x64 archive, a 103,179,362-byte Windows x64 ZIP, and a 114,699,280-byte macOS arm64 DMG. These are compressed demo/application distributions, not equivalent to Sciter's individual uncompressed binaries or a minimal embedded renderer. They establish that small-source/API claims do not mean a tiny download. No Servo binary was downloaded or executed. [Release assets](https://github.com/servo/servo/releases/tag/v0.7.0)\n\nA Go core could invoke a Rust renderer executable through the same process contract as any other native capability. Do not make every skill author learn Rust or the Servo embedding API.\n\n## Chromium fallback: choose CEF or Electron on total complexity\n\nCEF exposes C/C++ APIs and supports JavaScript/native messaging. It brings runtime libraries, data/resources and multiple processes; macOS has a prescribed application-bundle layout. Its documentation's single-executable process-entry example does not mean all runtime files disappear. [CEF architecture and packaging](https://chromiumembedded.github.io/cef/general_usage)\n\nElectron provides an application shell around Chromium and Node. Its packaging also contains runtime files; an application archive is not the entire engine. A Go orchestrator can launch a bundled Electron renderer while the page sees only a narrow preload bridge. [Electron packaging](https://www.electronjs.org/docs/latest/tutorial/application-distribution), [context isolation](https://www.electronjs.org/docs/latest/tutorial/context-isolation)\n\nEnergy is an existing Go/CEF route, but its current design also includes LCL and Delphi-based bridges plus a native runtime. That may save platform code, but it is not automatically the smallest maintenance surface. [Energy architecture](https://github.com/energye/energy)\n\nThe initial proposal was automatic extraction into a private cache. The user's subsequent simplicity instruction instead selects a portable folder/archive with renderer files already present. It must work offline and need no runtime download or package-manager installation. Signing, helper layout and Linux system-library compatibility still need actual packaging tests. Do not use disabled Chromium sandboxing as a packaging shortcut.\n\n## Why several smaller alternatives do not win automatically\n\nUltralight's 2026-08 license section 4.9 requires a separate agreement for developer platforms/frameworks/runtimes offered to third parties. Section 4.2 restricts static-linking approaches. This is a direct selection constraint for fungi's stated purpose, not just a question of the listed price. No license was purchased or accepted. [Versioned terms](https://ultralig.ht/terms/2026-08)\n\nBlitz's current README calls it beta, says its HTML wrapper lacks interactivity, and says it has no JavaScript bindings; the interactive route uses Dioxus. Litehtml provides layout with host drawing callbacks and warns against using it as a full HTML engine. RmlUi expects documents authored for its own HTML/CSS subset and host-driven behavior/rendering. None is a drop-in host for arbitrary existing browser widgets. [Blitz](https://github.com/DioxusLabs/blitz), [litehtml](https://github.com/litehtml/litehtml), [RmlUi](https://github.com/mikke89/RmlUi)\n\nBlitsen tries to bridge that gap, but its current Bun migration supersedes earlier QuickJS size claims. Its own Linux x64 reference measurement is now 144.3 MB uncompressed / 54.7 MB gzip, with a pre-alpha warning and partial web compatibility. Those are upstream measurements, not reproduced here. This is a useful example of how reducing a dependency can move complexity into a homegrown browser API implementation. [Current runtime decision](https://blitsen.dev/docs/bun-migration/)\n\n## Small next proof\n\nPrefer one chosen renderer in the first implementation. Supporting every surveyed engine would defeat rule-lean.\n\nUse the same tiny HTML and JSON forms, local slider animation, canvas-to-PNG result, and one representative existing library across the candidate and a Chromium baseline. Check clean launch, keyboard/IME/focus/accessibility, artifacts, close/crash handling and offline execution. Record total shipped files/bytes, cold start and idle memory on named platforms. If a smaller engine requires substantial adapters or a second primary UI language, count that as an authoring cost rather than hiding it behind binary-size savings.\n\nThis proof remains planned. Proprietary-default acceptability and packaging are now settled; current selection depends on the [maintenance evidence](renderer-health.md) and the candidate's actual integration and compatibility results.\n","toc":[{"id":"revised-assessment","title":"Revised assessment","depth":2},{"id":"sciter-inspect-the-current-distribution-not-old-size-claims","title":"Sciter: inspect the current distribution, not old size claims","depth":2},{"id":"servo-a-real-embedding-option-still-requiring-evidence","title":"Servo: a real embedding option, still requiring evidence","depth":2},{"id":"chromium-fallback-choose-cef-or-electron-on-total-complexity","title":"Chromium fallback: choose CEF or Electron on total complexity","depth":2},{"id":"why-several-smaller-alternatives-do-not-win-automatically","title":"Why several smaller alternatives do not win automatically","depth":2},{"id":"small-next-proof","title":"Small next proof","depth":2}],"titleAnchor":"bundled-renderer-follow-up","links":["research/index","planning","research/renderer-health","research/renderer-health"],"attachments":[{"path":"attachments/research/sciter-linux-inspection.json","sha256":"b50efdf95e8c341565b074bb6b5b977319fbab5e239a91ef956580fe97b5c6e1"}],"html":"\u003cp>\u003ca href=\"#/research/index\">Research overview\u003c/a> · \u003ca href=\"#/planning\">Accepted decisions\u003c/a>\u003c/p>\n\u003cp>The user chose bundled rendering to avoid WebView2/WebKitGTK setup, then accepted Chromium/Electron as a worst-case fallback. This page records the investigation that followed. The user has since selected Electron + Go; no renderer has been run as part of fungi.\u003c/p>\n\u003cp>Later decisions require an open-source default, substantial adoption and recent healthy development, and portable folder/archive packaging. These supersede the proprietary-engine and extraction questions discussed below. See the \u003ca href=\"#/research/renderer-health\">current maintenance assessment and recommendation\u003c/a>.\u003c/p>\n\u003ch2 id=\"revised-assessment\">Revised assessment\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Candidate\u003c/th>\n\u003cth>Evidence and fit\u003c/th>\n\u003cth>Recommendation\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Sciter.JS / scapp\u003c/td>\n\u003ctd>Small standalone engine; JavaScript and substantial desktop UI facilities; intentionally different DOM/CSS behavior\u003c/td>\n\u003ctd>Excluded from the default by the later open-source requirement; retain the measurements as research\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Servo\u003c/td>\n\u003ctd>Open-source embeddable web engine, current library API and release process\u003c/td>\n\u003ctd>Evaluate if open source and broader web compatibility matter enough to accept a young embedding integration\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CEF\u003c/td>\n\u003ctd>Bundled Chromium with native APIs, multiprocess isolation, mature browser compatibility\u003c/td>\n\u003ctd>Strong fallback for a Go/native host; compare integration effort instead of assuming it is simpler than Electron\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Electron\u003c/td>\n\u003ctd>Bundled Chromium plus Node and desktop shell APIs\u003c/td>\n\u003ctd>Strong fallback when reducing platform integration and author friction is more valuable than minimum footprint\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ultralight\u003c/td>\n\u003ctd>WebKit-derived engine with official native APIs\u003c/td>\n\u003ctd>Exclude under ordinary SDK terms: developer-platform use requires a separate agreement\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Blitz, litehtml, RmlUi\u003c/td>\n\u003ctd>Smaller rendering/UI building blocks with narrower web semantics\u003c/td>\n\u003ctd>Useful specialized extensions; avoid making fungi implement the missing browser platform\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Blitsen\u003c/td>\n\u003ctd>Niche Blitz-based HTML/JS runtime; now embeds Bun\u003c/td>\n\u003ctd>Interesting watchlist entry; pre-alpha, partial web APIs, changing architecture and larger current baseline\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"sciter-inspect-the-current-distribution-not-old-size-claims\">Sciter: inspect the current distribution, not old size claims\u003c/h2>\n\u003cp>The archived GitHub SDKs point to the current GitLab project. Revision \u003ccode>18d47968a560693b5286fa54995149991a480f6f\u003c/code> identifies release 6.0.5.3. Downloaded its Linux x64 \u003ccode>scapp\u003c/code> and \u003ccode>libsciter.so\u003c/code> into a temporary directory and inspected ELF section/dynamic tables without executing them. \u003ca href=\"https://gitlab.com/sciter-engine/sciter-js-sdk/-/tree/18d47968a560693b5286fa54995149991a480f6f/bin/linux/x64\" rel=\"noreferrer\">Pinned SDK\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Inspected file\u003c/th>\n\u003cth>Bytes\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>scapp\u003c/code>\u003c/td>\n\u003ctd>18,888,792\u003c/td>\n\u003ctd>Standalone runner, about 18.9 MB decimal\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>libsciter.so\u003c/code>\u003c/td>\n\u003ctd>25,052,768\u003c/td>\n\u003ctd>Separate embeddable shared library, about 25.1 MB decimal\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>These are alternative artifacts, not two sizes to add together for every app. Neither is a measured fungi distribution. \u003ca href=\"attachments/research/sciter-linux-inspection.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: b50efdf95e8c341565b074bb6b5b977319fbab5e239a91ef956580fe97b5c6e1\">Inspection record\u003c/a>\u003c/p>\n\u003cp>Both list the same direct dependencies: \u003ccode>libuuid.so.1\u003c/code>, \u003ccode>libfontconfig.so.1\u003c/code>, \u003ccode>libfreetype.so.6\u003c/code>, \u003ccode>libGLESv2.so.2\u003c/code>, \u003ccode>libEGL.so.1\u003c/code>, \u003ccode>libstdc++.so.6\u003c/code>, \u003ccode>libm.so.6\u003c/code>, \u003ccode>libgcc_s.so.1\u003c/code>, \u003ccode>libc.so.6\u003c/code>, and \u003ccode>ld-linux-x86-64.so.2\u003c/code>. There is no direct GTK/WebKitGTK entry. This does not prove there are no dynamically loaded or transitive dependencies, nor establish Wayland/X11 compatibility or a clean-machine baseline. Embedded version strings include \u003ccode>GLIBC_2.35\u003c/code>; strings alone do not determine the minimum supported glibc version.\u003c/p>\n\u003cp>The official documentation explicitly describes browser differences, simplified DOM APIs, and its own layout alternatives. For example, ordinary inline HTML event attributes are not supported by default. A JavaScript engine is not the same thing as browser API compatibility. \u003ca href=\"https://docs.sciter.com/docs/intro/\" rel=\"noreferrer\">Design differences\u003c/a>, \u003ca href=\"https://docs.sciter.com/docs/HTML/\" rel=\"noreferrer\">HTML behavior\u003c/a>, \u003ca href=\"https://docs.sciter.com/docs/DOM/\" rel=\"noreferrer\">DOM\u003c/a>\u003c/p>\n\u003cp>Scapp can carry appended UI resources. That does not establish how to combine a Go orchestrator and this renderer into one no-extraction executable. The engine has its own EULA; the SDK repository's BSD license must not be assumed to license the engine binary itself. \u003ca href=\"https://docs.sciter.com/docs/scapp/\" rel=\"noreferrer\">Packaging\u003c/a>, \u003ca href=\"https://gitlab.com/sciter-engine/sciter-js-sdk/-/blob/main/SCITER-ENGINE-EULA.md\" rel=\"noreferrer\">engine EULA\u003c/a>\u003c/p>\n\u003ch2 id=\"servo-a-real-embedding-option-still-requiring-evidence\">Servo: a real embedding option, still requiring evidence\u003c/h2>\n\u003cp>Servo announced its first crates.io library release and an LTS policy in April 2026. Its own announcement explicitly says it is not a 1.0 release. \u003ca href=\"https://servo.org/blog/2026/04/13/servo-0.1.0-release/\" rel=\"noreferrer\">Library release\u003c/a>\u003c/p>\n\u003cp>GitHub release metadata for v0.7.0 lists a 49,312,528-byte Linux x64 archive, a 103,179,362-byte Windows x64 ZIP, and a 114,699,280-byte macOS arm64 DMG. These are compressed demo/application distributions, not equivalent to Sciter's individual uncompressed binaries or a minimal embedded renderer. They establish that small-source/API claims do not mean a tiny download. No Servo binary was downloaded or executed. \u003ca href=\"https://github.com/servo/servo/releases/tag/v0.7.0\" rel=\"noreferrer\">Release assets\u003c/a>\u003c/p>\n\u003cp>A Go core could invoke a Rust renderer executable through the same process contract as any other native capability. Do not make every skill author learn Rust or the Servo embedding API.\u003c/p>\n\u003ch2 id=\"chromium-fall
