<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Fungi">
  <title>Fungi</title>
  <defs>
    <filter id="mshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect x="100" y="114" width="824" height="824" rx="185" fill="#000" opacity=".3" filter="url(#mshadow)"/>
  <svg x="100" y="100" width="824" height="824" viewBox="0 0 1024 1024">
    <defs>
      <clipPath id="fsq">
        <rect width="1024" height="1024" rx="230"/>
      </clipPath>
      <clipPath id="fback">
        <rect width="1024" height="858"/>
      </clipPath>
      <clipPath id="ffront">
        <rect y="858" width="1024" height="166"/>
      </clipPath>
      <filter id="fb120" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="120"/>
      </filter>
      <filter id="fb44" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="44"/>
      </filter>
      <filter id="fb16" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="16"/>
      </filter>
      <filter id="fb8" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="8"/>
      </filter>
      <radialGradient id="fbg" cx="512" cy="520" r="700" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#3A1470"/>
        <stop offset=".34" stop-color="#1E0A40"/>
        <stop offset=".62" stop-color="#0D0619"/>
        <stop offset="1" stop-color="#06030B"/>
      </radialGradient>
      <linearGradient id="frim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".12"/>
        <stop offset=".25" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="fbody" x1="0" y1="254" x2="0" y2="842" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#FFFFFF"/>
        <stop offset=".4" stop-color="#F4ECFF"/>
        <stop offset=".72" stop-color="#D9C0F8"/>
        <stop offset="1" stop-color="#B18BEA"/>
      </linearGradient>
      <radialGradient id="fshade" cx="470" cy="420" r="430" gradientUnits="userSpaceOnUse">
        <stop offset=".55" stop-color="#9B6BE6" stop-opacity="0"/>
        <stop offset="1" stop-color="#7C48D6" stop-opacity=".5"/>
      </radialGradient>
      <linearGradient id="ffade" x1="0" y1="620" x2="0" y2="842" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#fff"/>
        <stop offset="1" stop-color="#fff" stop-opacity=".58"/>
      </linearGradient>
      <mask id="fmask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
        <rect width="1024" height="1024" fill="url(#ffade)"/>
      </mask>
      <linearGradient id="fneon" x1="270" y1="0" x2="754" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#FF4FA3"/>
        <stop offset=".5" stop-color="#B66BFF"/>
        <stop offset="1" stop-color="#5E86FF"/>
      </linearGradient>
      <path id="fghost" d="M320 540C320 382 406 254 512 254C618 254 704 382 704 540L710 812A49.5 30 0 0 1 611 812A49.5 30 0 0 1 512 812A49.5 30 0 0 1 413 812A49.5 30 0 0 1 314 812Z"/>
      <clipPath id="fgclip">
        <use href="#fghost"/>
      </clipPath>
      <ellipse id="fring" cx="512" cy="858" rx="238" ry="44" fill="none"/>
      <path id="fstar" d="M0-1Q.13-.13 1 0Q.13 .13 0 1Q-.13 .13-1 0Q-.13-.13 0-1Z"/>
    </defs>
    <g clip-path="url(#fsq)">
      <rect width="1024" height="1024" fill="url(#fbg)"/>

      <!-- halo -->
      <use href="#fghost" fill="#7A38E6" opacity=".68" filter="url(#fb120)"/>
      <use href="#fghost" fill="#B98AFF" opacity=".6" filter="url(#fb44)"/>

      <!-- portal floor and back of ring -->
      <ellipse cx="512" cy="858" rx="226" ry="38" fill="#0A0414" opacity=".6" filter="url(#fb16)"/>
      <g clip-path="url(#fback)">
        <use href="#fring" stroke="url(#fneon)" stroke-width="26" opacity=".7" filter="url(#fb16)"/>
        <use href="#fring" stroke="url(#fneon)" stroke-width="8"/>
        <use href="#fring" stroke="#fff" stroke-opacity=".55" stroke-width="2.5"/>
      </g>

      <!-- ghost -->
      <g mask="url(#fmask)">
        <use href="#fghost" fill="#F2E6FF" opacity=".85" filter="url(#fb8)"/>
        <use href="#fghost" fill="url(#fbody)"/>
        <rect width="1024" height="1024" fill="url(#fshade)" clip-path="url(#fgclip)"/>
      </g>

      <!-- eyes -->
      <ellipse cx="456" cy="458" rx="29" ry="39" fill="#1C0B30"/>
      <ellipse cx="568" cy="458" rx="29" ry="39" fill="#1C0B30"/>
      <circle cx="467" cy="440" r="10" fill="#fff"/>
      <circle cx="579" cy="440" r="10" fill="#fff"/>

      <!-- front of ring -->
      <g clip-path="url(#ffront)">
        <use href="#fring" stroke="url(#fneon)" stroke-width="26" opacity=".7" filter="url(#fb16)"/>
        <use href="#fring" stroke="url(#fneon)" stroke-width="8"/>
        <use href="#fring" stroke="#fff" stroke-opacity=".55" stroke-width="2.5"/>
      </g>

      <!-- sparkles -->
      <g fill="#E9D9FF" opacity=".8" filter="url(#fb8)">
        <use href="#fstar" transform="translate(792 306) scale(34)"/>
        <use href="#fstar" transform="translate(244 410) scale(20)"/>
      </g>
      <g fill="#fff">
        <use href="#fstar" transform="translate(792 306) scale(34)"/>
        <use href="#fstar" transform="translate(244 410) scale(20)"/>
        <circle cx="766" cy="694" r="7"/>
      </g>

      <rect x="4" y="4" width="1016" height="1016" rx="226" fill="none" stroke="url(#frim)" stroke-width="8"/>
    </g>
  </svg>
</svg>
